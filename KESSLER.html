  }

  _paintRunSummary() {
    const d=this.game.runRecord && this.game.runRecord.data;
    if (!d) return;
    const secs=Math.floor(d.seconds), mins=Math.floor(secs/60);
    const time=String(mins).padStart(2,'0')+':'+String(secs%60).padStart(2,'0');
    const k=d.kills;
    this.el.overSeed.textContent='RUN SEED '+d.seed;
    this.el.overSummary.textContent='SURVIVAL '+time+' · HIGHEST WAVE '+d.highestWave+
      '\nKILLS  '+k.large+' large · '+k.medium+' medium · '+k.small+' small · '+k.hunter+(k.hunter===1 ? ' hunter' : ' hunters')+
      '\nBEST COMBO x'+d.bestCombo;
    const names={rock:'ROCK CONTACT',hunter:'HUNTER FIRE',volatile:'VOLATILE BLAST',seeker:'SEEKER BLAST',other:'OTHER / DEBUG'};
    this.el.overDamage.textContent=Object.keys(names).map(key=>{
      const row=d.damage[key];
      return names[key]+'  '+row.hits+(row.hits===1 ? ' hit · ' : ' hits · ')+row.shield.toFixed(1)+' shield / '+row.hull.toFixed(1)+' hull';
    }).join('\n');
  }

  readWave() {
    const input = this.el.titleWaveInput, wave = Number(input.value), max = Number(input.max);
    if (!Number.isSafeInteger(wave) || wave < 1 || wave > max) {
      this.el.titleWaveError.textContent = 'Choose a whole wave number from 1 to ' + max + '.';
      return null;
    }
    this.el.titleWaveError.textContent = '';
    return wave;
  }

  /* Screen swap: 'title' | 'play' | 'pause' | 'gameover'. display only (no
     DOM built after the ctor); the early-out keeps idle frames silent. */
  showScreen(name) {
    if (this._screen === name) return;
    if (this.settingsOpen) this.closeSettings();
    if (this.upgradesOpen) this.closeUpgrades();
    this._screen = name;
    const E = this.el, PLAY = name === 'play';
    E.play.style.display = PLAY ? 'block' : 'none';
    E.scrTitle.style.display = name === 'title' ? 'flex' : 'none';
    E.scrPause.style.display = name === 'pause' ? 'flex' : 'none';
    E.scrOver.style.display = name === 'gameover' ? 'flex' : 'none';
    if (name === 'title') {
      E.titleWaveInput.max = String(Math.max(100, __K.highestWave || 1));
      E.titleWaveInput.value = String(__K.highestWave || 1);
      E.titleWaveError.textContent = '';
      this._last.hiscore = -1;                 /* force a fresh hiscore paint */
      E.titleHi.textContent = 'HIGH SCORE ' + (__K.hiscore | 0);
      this.setSeedFields(__K.loadSeed);
    }
    if (name === 'gameover') {
      E.overScore.textContent = 'FINAL SCORE ' + (__K.score | 0);
      E.overNew.style.display = __K.newHighScore ? 'block' : 'none';
      E.overNew.style.opacity = '1';
      this._overBlink = 0;
      this._paintRunSummary();
      this.setSeedFields(this.game.runRecord ? this.game.runRecord.data.seed : __K.loadSeed);
      E.retrySeed.focus();
    }
    if (name!=='gameover' && document.activeElement && /^(INPUT|BUTTON)$/.test(document.activeElement.tagName)) document.activeElement.blur();
    if (!PLAY) {   /* juice never smears across a screen cut */
      this._vig = 0; this._flick = 0; this._edge = 0; this._alarmT = 0;
      this._op.vig = -1; this._op.flick = -1; this._op.edge = -1;
      E.vig.style.opacity = '0';
      E.shieldFx.style.opacity = '0';
      E.edgeWarn.style.opacity = '0';
      this._setAlarm(false);
    }
  }

  /* STAGE 11 lock bracket paint (called by update every frame; cheap no-op
     while nothing is locked). Projects game.aimTarget's world position to
     screen with ONE scratch Vector3 (this._aimV, built lazily — never before
     boot assigns THREE) and rewrites left/top ONLY when the rounded px
     changed. Bracket half-size tracks the target radius in screen space so
     big rocks get a big box. Lead dot: same scratch reused for the intercept
     point p + vel*game.aimLeadT — shown only when a lock exists,
     TUNE.aim.lead, the target actually moves (> ~2 u/s), and the current
     weapon is NOT the seeker (missiles steer themselves: bracket is enough,
     a lead dot would lie). Behind-camera (v.z > 1) hides both. */
  _paintAim() {
    const E = this.el, g = this.game, A = this._aim;
    const t = g.aimTarget;
    const cam = g.camera;
    const lockWant = !!t && !!cam && this._screen === 'play';
    if (!lockWant) {
      if (A.lock !== 0) { A.lock = 0; E.lock.style.display = 'none'; }
      if (A.dot !== 0) { A.dot = 0; E.leadDot.style.display = 'none'; }
      return;
    }
    if (!this._aimV) this._aimV = new THREE.Vector3();
    const v = this._aimV, tp = t.position;
    v.set(tp.x, tp.y, tp.z).project(cam);
    const W = window.innerWidth, H = window.innerHeight;
    const front = v.z <= 1;
    if (A.lock !== (front ? 1 : 0)) {
      A.lock = front ? 1 : 0;
      E.lock.style.display = front ? 'block' : 'none';
    }
    if (front) {
      const sx = Math.round((v.x * 0.5 + 0.5) * W);
      const sy = Math.round((-v.y * 0.5 + 0.5) * H);
      if (A.lx !== sx) { A.lx = sx; E.lock.style.left = sx + 'px'; }
      if (A.ly !== sy) { A.ly = sy; E.lock.style.top = sy + 'px'; }
      /* radius -> px: perspective size = r * (H/2) / (tan(fov/2) * dist) */
      const cp = cam.position;
      const dist = Math.hypot(tp.x - cp.x, tp.y - cp.y, tp.z - cp.z);
      const tanH = Math.tan((cam.fov * Math.PI / 180) * 0.5);
      let half = (t.radius || 6) * (H * 0.5) / Math.max(1e-3, tanH * dist);
      half = clampNum(half, 14, 160);
      const mw = Math.round(half) + 'px';
      if (E.lock.style.marginLeft !== '-' + mw) {
        E.lock.style.marginLeft = '-' + mw; E.lock.style.marginTop = '-' + mw;
        E.lock.style.width = E.lock.style.height = Math.round(half * 2) + 'px';
      }
    }
    /* lead dot */
    const vel = t.vel;
    const speed = vel ? Math.hypot(vel.x, vel.y, vel.z) : 0;
    const dotWant = front && (__K.TUNE.aim && __K.TUNE.aim.lead) &&
      g.aimLeadT > 0 && speed > 2 && __K.weapon !== 'seeker';
    if (A.dot !== (dotWant ? 1 : 0)) {
      A.dot = dotWant ? 1 : 0;
      E.leadDot.style.display = dotWant ? 'block' : 'none';
    }
    if (dotWant) {
      const t2 = g.aimLeadT;
      v.set(tp.x + vel.x * t2, tp.y + vel.y * t2, tp.z + vel.z * t2).project(cam);
      const dx = Math.round((v.x * 0.5 + 0.5) * W);
      const dy = Math.round((-v.y * 0.5 + 0.5) * H);
      if (A.dx !== dx) { A.dx = dx; E.leadDot.style.left = dx + 'px'; }
      if (A.dy !== dy) { A.dy = dy; E.leadDot.style.top = dy + 'px'; }
    }
  }

  _paintSeeker() {
    const w = this.game.weapons, E = this.el, cache = this._seekerPaint;
    const p = w && w.preview;
    const t = w && w.previewTarget;
    const cam = this.game.camera;
    let shown = false;
    if (this._screen === 'play' && t && t.hp > 0 && cam) {
      if (!this._aimV) this._aimV = new THREE.Vector3();
      const v = this._aimV;
      v.set(t.position.x, t.position.y, t.position.z).project(cam);
      shown = Number.isFinite(v.x) && Number.isFinite(v.y) && v.z >= -1 && v.z <= 1 && Math.abs(v.x) <= 1 && Math.abs(v.y) <= 1;
      if (shown) {
        const x = Math.round((v.x * 0.5 + 0.5) * window.innerWidth);
        const y = Math.round((-v.y * 0.5 + 0.5) * window.innerHeight);
        if (cache.x !== x) { cache.x = x; E.seekerLock.style.left = x + 'px'; }
        if (cache.y !== y) { cache.y = y; E.seekerLock.style.top = y + 'px'; }
      }
    }
    if (cache.shown !== shown) { cache.shown = shown; E.seekerLock.style.display = shown ? 'block' : 'none'; }
    const color = p && p.ammo > 0 ? this.C.seekerLoaded : this.C.seekerEmpty;
    if (cache.color !== color) {
      cache.color = color;
      E.seekerLock.style.borderColor = color;
      E.seekerStatus.style.color = color;
    }
    const ready = !!p && p.ready;
    if (cache.ready !== ready) { cache.ready = ready; E.seekerLock.style.opacity = ready ? '1' : '0.45'; }
    const text = !p ? '' : p.ammo <= 0 ? 'SEEKER EMPTY' :
      'SEEKER ' + p.ammo + ' · ' + (p.hasLock ? 'LOCK' : 'NO LOCK — STRAIGHT') + ' · ' +
      (p.cooldown > 0 ? p.cooldown.toFixed(2) + 's' : 'READY');
    if (cache.text !== text) { cache.text = text; E.seekerStatus.textContent = text; }
  }

  // Direction at infinity: rotate velocity into the rendered camera frame,
  // then perspective-project it. Translation and chase distance cannot distort
  // the cue. Pure scalar math also handles rolled cameras and rearward drift.
  static flightCue(velocity, camera, width, height, out) {
    out.visible = false; out.edge = false; out.behind = false;
    if (!velocity || !camera || !camera.quaternion || width <= 0 || height <= 0) return out;
    const {x, y, z} = velocity;
    if (!Number.isFinite(x) || !Number.isFinite(y) || !Number.isFinite(z)) return out;
    const T = __K.TUNE.navigation;
    if (Math.hypot(x, y, z) < T.minSpeed) return out;
    const q = camera.quaternion, qx = -q.x, qy = -q.y, qz = -q.z, qw = q.w;
    const ix = qw*x + qy*z - qz*y, iy = qw*y + qz*x - qx*z;
    const iz = qw*z + qx*y - qy*x, iw = -qx*x - qy*y - qz*z;
    const vx = ix*qw + iw*-qx + iy*-qz - iz*-qy;
    const vy = iy*qw + iw*-qy + iz*-qx - ix*-qz;
    const vz = iz*qw + iw*-qz + ix*-qy - iy*-qx;
    const forward = -vz, tan = Math.tan(camera.fov * Math.PI / 360);
    if (!(tan > 0) || !Number.isFinite(tan)) return out;
    const behind = forward <= 0;
    let dx = vx, dy = -vy;
    const halfW = width/2, halfH = height/2;
    // Reserve bottom-center space for radar and top/right space for status.
    const boundX = Math.max(10, halfW - T.edgeInset);
    const boundY = Math.max(10, Math.min(halfH - T.edgeInset, height * 0.28));
    if (!behind) {
      dx = vx / Math.max(1e-9, tan * forward) * halfH;
      dy = -vy / Math.max(1e-9, tan * forward) * halfH;
    }
    const edge = behind || Math.abs(dx) > boundX || Math.abs(dy) > boundY;
    if (edge) {
      if (Math.abs(dx) + Math.abs(dy) < 1e-9) { dx = 0; dy = 1; }
      const scale = Math.min(boundX / Math.max(1e-9, Math.abs(dx)), boundY / Math.max(1e-9, Math.abs(dy)));
      dx *= scale; dy *= scale;
    }
    if (!Number.isFinite(dx) || !Number.isFinite(dy)) return out;
    out.visible = true; out.edge = edge; out.behind = behind;
    out.x = Math.round(halfW + dx); out.y = Math.round(halfH + dy);
    out.angle = Math.round(Math.atan2(dy, dx) * 180 / Math.PI + 90);
    return out;
  }

  _paintFlight() {
    const g = this.game, E = this.el, out = this._flightCue, c = this._flightPaint;
    HUD.flightCue(g.ship && g.ship.velocity, g.camera, window.innerWidth, window.innerHeight, out);
    if (this._screen !== 'play' || (g.ship && g.ship.group && !g.ship.group.visible)) out.visible = false;
    const debug = __K.navigation;
    debug.visible = out.visible; debug.edge = out.edge; debug.behind = out.behind;
    debug.x = out.x; debug.y = out.y;
    const kind = !out.visible ? 'hidden' : out.edge ? 'edge' : 'marker';
    if (c.kind !== kind) {
      c.kind = kind;
      E.flightMarker.style.display = kind === 'marker' ? 'block' : 'none';
      E.flightArrow.style.display = kind === 'edge' ? 'block' : 'none';
      E.flightLabel.style.display = kind === 'hidden' ? 'none' : 'block';
    }
    if (!out.visible) return;
    if (c.x !== out.x) {
      c.x = out.x;
      E.flightMarker.style.left = E.flightArrow.style.left = E.flightLabel.style.left = out.x + 'px';
    }
    if (c.y !== out.y) {
      c.y = out.y;
      E.flightMarker.style.top = E.flightArrow.style.top = out.y + 'px';
      E.flightLabel.style.top = out.y + 18 + 'px';
    }
    if (c.angle !== out.angle) { c.angle = out.angle; E.flightArrow.style.transform = 'rotate(' + out.angle + 'deg)'; }
    const text = out.behind ? 'TRAVEL BEHIND' : 'TRAVEL';
    if (c.text !== text) { c.text = text; E.flightLabel.textContent = text; }
  }

  _paintThreat(cue, source, active, label, radius) {
      const g = this.game;
      const b = cue.bearing, c = cue.cache;
      if (active && this._screen === 'play') ThreatFeedback.bearing(source, g.ship.position, g.camera, b);
      else b.visible = false;
      if (c.visible !== b.visible) {
        c.visible = b.visible;
        cue.arrow.style.display = cue.text.style.display = b.visible ? 'block' : 'none';
      }
      if (!b.visible) return;
      const r = Math.min(radius, window.innerHeight*0.23, window.innerWidth*0.23);
      const x = Math.round(window.innerWidth/2 + b.x*r), y = Math.round(window.innerHeight/2 + b.y*r);
      if (c.x !== x) { c.x=x; cue.arrow.style.left = cue.text.style.left = x+'px'; }
      if (c.y !== y) { c.y=y; cue.arrow.style.top = y+'px'; cue.text.style.top = y+16+'px'; }
      if (c.angle !== b.angle) { c.angle=b.angle; cue.arrow.style.transform = 'rotate('+b.angle+'deg)'; }
      const text = label + (b.behind ? ' BEHIND' : '');
      if (c.text !== text) { c.text=text; cue.text.textContent=text; }
  }

  _paintThreats() {
    const t = this.game.threats;
    this._paintThreat(this.el.hitDirection, t && t.hitPoint, t && t.hitTime>0, 'HIT', 125);
    this._paintThreat(this.el.incomingDirection, t && t.incomingPoint, !!(t && t.incomingPoint), 'INCOMING', 175);
  }

  _paintPractice() {
    const p = this.game.practice, E = this.el, c = this._practicePaint;
    const active = !!(p && p.active);
    if (c.active !== active) {
      c.active=active; E.practiceCard.style.display = E.practicePause.style.display = active ? 'block' : 'none';
      if (active) { this._bannerT=0; E.banner.style.display='none'; }
    }
    if (!active) return;
    const lesson = PRACTICE_LESSONS[p.lesson];
    const title = 'PRACTICE ' + (p.lesson+1) + '/5 · ' + lesson.name;
    const progress = (p.complete ? 'COMPLETE · ' : 'TARGETS ' + p.snapshot.targets + ' · ') + 'N NEXT · R RESET · NO DAMAGE · FREE AMMO';
    if (c.title !== title) { c.title=title; E.practiceTitle.textContent=title; }
    if (c.text !== lesson.text) { c.text=lesson.text; E.practiceText.textContent=lesson.text; }
    if (c.progress !== progress) { c.progress=progress; E.practiceProgress.textContent=progress; }
  }

  /* --- per-frame update (called by Game): textContent/style ONLY ---------- */
  update(dt) {
    this._clock += dt;
    const E = this.el, g = this.game;
    const playing = __K.state === 'PLAYING';
    const hull = __K.hull, shield = __K.shield, lives = __K.lives;

    if (this._last.score !== __K.score) {
      this._last.score = __K.score;
      E.score.textContent = String(__K.score | 0);
    }
    if (this._last.wave !== __K.wave || this._last.runMode !== g.runMode || this._last.waveTheme !== __K.waveTheme) {
      this._last.waveTheme = __K.waveTheme;
      this._last.runMode = g.runMode;
      this._last.wave = __K.wave;
      E.waveLabel.textContent = g.runMode === 'practice' ? 'PRACTICE' : 'WAVE ' + __K.wave + (__K.waveTheme ? ' · ' + __K.waveTheme : '');
    }
    if (this._screen === 'title' && this._last.hiscore !== __K.hiscore) {
      this._last.hiscore = __K.hiscore;
      E.titleHi.textContent = 'HIGH SCORE ' + (__K.hiscore | 0);
    }

    /* lives icons (re-shown only when the count changes) */
    if (this._last.lives !== lives) {
      this._last.lives = lives;
      for (let i = 0; i < E.livesIcons.length; i++) {
        E.livesIcons[i].style.display = i < lives ? 'inline' : 'none';
      }
      const more = lives > E.livesIcons.length;
      if (this._op.more !== (more ? 1 : 0)) {
        this._op.more = more ? 1 : 0;
        E.livesMore.textContent = '\u25B4\u00D7' + lives;
        E.livesMore.style.display = more ? 'block' : 'none';
      }
    }

    /* bars: width written as whole percent, change-gated */
    const hw = Math.round(clampNum(hull, 0, 100));
    if (this._op.hullW !== hw) { this._op.hullW = hw; E.hullBar.fill.style.width = hw + '%'; }
    const smax = g.shieldMax ? g.shieldMax() : ((__K.TUNE.defense && __K.TUNE.defense.shieldMax) || 100);
    const shieldValue=Math.ceil(shield);
    if (this._last.shieldValue!==shieldValue || this._last.shieldMax!==smax) {
      this._last.shieldValue=shieldValue;this._last.shieldMax=smax;
      E.shieldLabel.textContent=smax>100 ? 'SHIELD '+shieldValue+'/'+smax : 'SHIELD';
    }
    const L=g.upgrades && g.upgrades.levels;
    const buildCode=L ? L.shield+L.flak*10+L.magnet*100 : 0;
    if (this._upgradeBuild!==buildCode) {
      this._upgradeBuild=buildCode;
      E.upgradeChip.textContent=buildCode ? 'SHIELD '+L.shield+' · FLAK '+L.flak+' · MAGNET '+L.magnet : '';
      E.upgradeChip.style.display=buildCode ? 'block' : 'none';
    }
    const sw = Math.round(clampNum(shield / Math.max(1, smax), 0, 1) * 100);
    if (this._op.shldW !== sw) { this._op.shldW = sw; E.shieldBar.fill.style.width = sw + '%'; }

    /* boost meter: fraction of the CURRENT cap (Shift raises the cap, so a
       boosted ship reads ~full — stage 6 can swap in heat). STAGE-12: the
       cap follows the ACTIVE flight mode via game._speedCap (space reads
       flightSpace 70/90, assist reads TUNE.ship 38/55) so the bar never
       lies about headroom after a T-flip. */
    const boosting = !!(g.input && g.input.boost);
    const cap = (typeof g._speedCap === 'function')
      ? g._speedCap(boosting)
      : (boosting ? __K.TUNE.ship.boostSpeed : __K.TUNE.ship.maxSpeed);
    const bw = Math.round(clampNum((g.ship ? g.ship.speed : 0) / Math.max(1, cap), 0, 1) * 100);
    if (this._op.boost !== bw) { this._op.boost = bw; E.boostBar.fill.style.width = bw + '%'; }

    /* STAGE-12 mode chip: cheap per-frame check, textContent rewritten
       ONLY when the mode string changed (mirror of the _op diff idiom). */
    const modeTxt = (__K.TUNE.flightMode === 'assist') ? 'MODE ASSIST' : 'MODE SPACE';
    if (this._op.mode !== modeTxt) { this._op.mode = modeTxt; E.modeChip.textContent = modeTxt; }

    /* muted chip + (stage-6 seam) weapon slot read their surfaces */
    if (this._last.muted !== __K.muted) {
      this._last.muted = __K.muted;
      E.muted.style.display = __K.muted ? 'block' : 'none';
    }

    /* STAGE 6 weapon line: read the controller's model every frame; the DOM
       is touched ONLY when the string changed (weapon switch OR ammo burn).
       Low-ammo colour shift: flak <= 10 or seeker <= 1 goes warm. */
    if (g.weapons) {
      const wt = g.weapons.hudText();
      if (this._last.weapon !== wt) {
        this._last.weapon = wt;
        E.weapon.textContent = wt;
      }
      const a = __K.ammo;
      const low = (__K.weapon === 'flak' && a.flak <= 10) ||
                  (__K.weapon === 'seeker' && a.seeker <= 1);
      const wcol = low ? '#ff9a3e' : this.C.norm;
      if (this._last.wcol !== wcol) {
        this._last.wcol = wcol;
        E.weapon.style.color = wcol;
      }
    }

    /* STAGE 6 chips: buff timer (amber, "clear timer on HUD") + combo x-chip */
    if (__K.buffT > 0) {
      const bt = (__K.buff === 'rapid' ? 'RAPID FIRE ' : 'DMG x2 ') + Math.ceil(__K.buffT) + 's';
      if (this._op.buffTxt !== bt) { this._op.buffTxt = bt; E.buffChip.textContent = bt; }
      if (this._op.buff !== 1) { this._op.buff = 1; E.buffChip.style.display = 'block'; }
    } else if (this._op.buff !== 0) {
      this._op.buff = 0;
      E.buffChip.style.display = 'none';
    }
    const comboOn = playing && __K.comboT > 0 && __K.combo > 1;
    if (comboOn) {
      const ct = 'x' + __K.combo;
      if (this._op.comboTxt !== ct) { this._op.comboTxt = ct; E.comboChip.textContent = ct; }
      if (this._op.combo !== 1) { this._op.combo = 1; E.comboChip.style.display = 'block'; }
    } else if (this._op.combo !== 0) {
      this._op.combo = 0;
      E.comboChip.style.display = 'none';
    }

    /* STAGE 6 pickup flash chip (calls pickupFlash(type) on collect) */
    if (this._pickT > 0) {
      this._pickT = Math.max(0, this._pickT - dt);
      if (this._pickT <= 0 && E.pickupChip.style.display !== 'none') E.pickupChip.style.display = 'none';
    }

    /* low-hull shift + alarm tick (cadence here; stage 7's Audio owns the
       __kAlarm sound; thresholds come from TUNE.audio.alarm so the HUD shift
       and the audio ping retune from ONE table — SPEC "alarm tone and HUD
       color shift" stay in lockstep at ~1 Hz) */
    const AL = (__K.TUNE.audio && __K.TUNE.audio.alarm) || { threshold: 25, fastHull: 15, period: 0.95, fastPeriod: 0.5 };
    const alarm = playing && hull <= AL.threshold;
    this._setAlarm(alarm);
    if (alarm) {
      this._alarmT -= dt;
      if (this._alarmT <= 0) { window.__kAlarm(); this._alarmT = hull <= AL.fastHull ? AL.fastPeriod : AL.period; }
    }

    /* damage juice: vignette from damage recency, shield hex flicker pulse,
       edge wash lerped toward the game's boundary ratio (spring-margin reuse) */
    this._vig = Math.max(0, this._vig - dt * 0.85);
    let vig = this._vig;
    if (playing && hull <= AL.threshold && vig < 0.16) vig = 0.16;
    this._opTo('vig', E.vig, vig);

    this._flick = Math.max(0, this._flick - dt * 2.6);
    const fl = this._flick > 0 ? this._flick * (0.55 + 0.45 * Math.sin(this._clock * 38)) : 0;
    this._opTo('flick', E.shieldFx, fl);

    const edgeWant = playing ? clampNum(g.edgeWarn || 0, 0, 1) : 0;
    this._edge += (edgeWant - this._edge) * Math.min(1, 6 * dt);
    if (this._edge < 0.02) this._edge = 0;
    this._opTo('edge', E.edgeWarn, this._edge);

    /* wave banner toast (SPEC #4): fade in fast, hold, fade out */
    if (this._bannerT > 0) {
      this._bannerT = Math.max(0, this._bannerT - dt);
      const t = this._bannerT;
      const op = t > 1.5 ? (1.9 - t) * 2.5 : t / 1.1;
      E.banner.style.display = 'block';
      E.banner.style.opacity = clampNum(op, 0, 1).toFixed(3);
    } else if (E.banner.style.display !== 'none') {
      E.banner.style.display = 'none';
    }

    /* NEW HIGH SCORE blink */
    if (this._screen === 'gameover' && __K.newHighScore) {
      this._overBlink += dt;
      E.overNew.style.opacity = Math.sin(this._overBlink * 6.5) > -0.25 ? '1' : '0.15';
    }

    /* STAGE 11 lock bracket + lead dot (display/position writes are all
       change-gated inside; costs one property read when idle) */
    this._paintAim();
    this._paintSeeker();
    this._paintFlight();
    this._paintThreats();
    this._paintPractice();
  }
}

/* ==== 82-upgrades.js ==== */
/* Run-local rewards: no preference/TUNE writes and no RNG consumption.
   The director offers once per eligible calm beat; choosing is transactional. */
class RunUpgrades {
  constructor(game) {
    this.game = game;
    this.levels = { shield:0, flak:0, magnet:0 };
    this.snapshot = __K.upgrades = { levels:this.levels, pendingWave:0, offeredWave:0,
      shieldMax:100, flakSpreadDeg:18, magnetRange:28 };
    this.reset();
  }

  get shieldMax() { return (__K.TUNE.defense?.shieldMax || 100) + this.levels.shield*__K.TUNE.upgrades.shieldPerLevel; }
  get flakSpreadDeg() { return __K.TUNE.weapons.flak.spreadDeg*Math.pow(__K.TUNE.upgrades.flakFactor,this.levels.flak); }
  get magnetRange() { return __K.TUNE.pickups.magnetRange*(1+this.levels.magnet*__K.TUNE.upgrades.magnetPerLevel); }

  reset() {
    this.levels.shield=this.levels.flak=this.levels.magnet=0;
    this.pendingWave=this.offeredWave=0;
    this._publish();
  }

  offer(wave) {
    const U=__K.TUNE.upgrades, L=this.levels;
    if (this.game.runMode!=='arcade' || this.pendingWave || !Number.isInteger(wave) || wave<=this.offeredWave || wave%U.everyWaves!==0) return false;
    if (L.shield>=U.cap && L.flak>=U.cap && L.magnet>=U.cap) return false;
    this.pendingWave=this.offeredWave=wave;
    this._publish();
    return true;
  }

  choose(key) {
    if (!this.pendingWave || this.game.runMode!=='arcade' || !['shield','flak','magnet'].includes(key) || this.levels[key]>=__K.TUNE.upgrades.cap) return false;
    this.levels[key]++;
    if (key==='shield') __K.shield=Math.min(this.shieldMax,__K.shield+__K.TUNE.upgrades.shieldPerLevel);
    this.pendingWave=0;
    this._publish();
    return true;
  }

  skip() {
    if (!this.pendingWave) return false;
    this.pendingWave=0;
    this._publish();
    return true;
  }

  _publish() {
    const s=this.snapshot;
    s.pendingWave=this.pendingWave; s.offeredWave=this.offeredWave;
    s.shieldMax=this.shieldMax; s.flakSpreadDeg=this.flakSpreadDeg; s.magnetRange=this.magnetRange;
  }
}

/* ==== 83-practice.js ==== */
/* Safe exercises use the real ship, targets and weapons. Progression is
   optional: N skips/repeats exercises and R resets the current exercise. */
const PRACTICE_LESSONS = [
  { name: 'THRUST & DRIFT', text: 'Hold W to reach 10 u/s, then release and coast. S applies reverse thrust along the nose.' },
  { name: 'STATIONARY AIM', text: 'Destroy the three stationary targets with mouse/arrows and left mouse or Space.' },
  { name: 'ROLL', text: 'Use SPACE mode (T toggles), then hold Q or E to roll at least 45°. Watch the camera and radar turn.' },
  { name: 'MOVING TARGETS', text: 'Destroy three moving targets. Aim ahead using the gold lead dot.' },
  { name: 'SEEKER MISSILES', text: 'Find the dashed target circle, fire F or right mouse, and destroy the target with a missile.' }
];

class PracticeSector {
  constructor(game) {
    this.game = game;
    this.active = false;
    this.lesson = 0;
    this.complete = false;
    this.snapshot = __K.practice = { active: false, lesson: 0, name: '', complete: false, targets: 0 };
  }

  start(index = 0) {
    this.active = true;
    this.lesson = Math.max(0, Math.min(PRACTICE_LESSONS.length-1, index|0));
    this.complete = false;
    /* velocity-vectors spec §5 (review F7): practice reset invalidates
       retention instantly — this route covers title entry, N-next wraps,
       and the R-reset beat alike (the field below drains; stale ghosts must
       die with it, not via the next paint's liveness scan). */
    if (this.game.vectors) this.game.vectors.reset();
    this._reachedSpeed = this._seekerKill = false;
    this._coast = this._roll = 0;
    const g = this.game;
    g.input._releaseAll();
    g.ship.resetRun(0,0,0);
    g.ship.group.visible = true;
    g.rocks.clearField();
    g.enemies.clearAll();
    g.projectiles.clearAll();
    if (g.weapons) g.weapons.resetRun();
    g.pickups.clearAll();
    if (g.fx) g.fx.clear();
    if (g.threats) g.threats.clear();
    g._merged.length = 0;
    g.aimTarget = null;
    const count = this.lesson === 4 ? 1 : 3;
    const zero = g.ship.velocity; // resetRun zeroed it; spawnRock copies velocity.
    for (let i=0; i<count; i++) {
      const point = g.ship.position.clone().set(i===0 ? 0 : (i===1 ? -35 : 35), i===0 ? 0 : (i===1 ? 12 : -12), 120+i*25);
      const r = g.rocks.spawnRock('small',point,zero);
      if (r && this.lesson === 3) r.vel.set(i===1 ? -6 : 6,0,0);
    }
    this._refill();
    this._publish();
  }

  recordKill(weapon) { if (this.active && this.lesson === 4 && weapon === 'seeker') this._seekerKill = true; }

  next() { if (this.active) this.start((this.lesson+1)%PRACTICE_LESSONS.length); }

  stop() {
    this.active = false;
    this.complete = false;
    this._publish();
  }

  _refill() {
    __K.ammo.flak = __K.TUNE.weapons.flak.ammoMax;
    __K.ammo.seeker = __K.TUNE.weapons.seeker.ammoMax;
    __K.hull = __K.TUNE.defense.hullMax;
    __K.shield = __K.TUNE.defense.shieldMax;
  }

  _publish() {
    const s = this.snapshot;
    s.active = this.active; s.lesson = this.lesson;
    s.name = PRACTICE_LESSONS[this.lesson].name;
    s.complete = this.complete;
    s.targets = this.active ? this.game.rocks.aliveCount : 0;
  }

  update(dt) {
    if (!this.active || __K.state !== 'PLAYING') return;
    const g = this.game;
    this._refill();
    if (this.lesson === 0) {
      if (g.ship.speed >= 10) this._reachedSpeed = true;
      if (this._reachedSpeed && !g.input.thrust && g.ship.speed >= 5) this._coast += dt;
      else this._coast = 0;
      if (this._coast >= 0.6) this.complete = true;
    } else if (this.lesson === 2) {
      if (g.ship.mode === 'space' && g.input.rollKey) this._roll += Math.abs(g.ship.rollRate)*dt;
      if (this._roll >= 45) this.complete = true;
    } else if (g.rocks.aliveCount === 0 && (this.lesson !== 4 || this._seekerKill)) this.complete = true;
    this._publish();
  }
}

/* ==== 84-run-record.js ==== */
/* Arcade run accounting. Stable counters, no RNG draws or per-frame objects.
   Seeds reproduce starting conditions, not recorded input/frame timing. */
class RunRecord {
  constructor(game) {
    this.game=game;
    this.data=__K.runSummary={seed:0,seconds:0,highestWave:0,score:0,bestCombo:0,
      kills:{large:0,medium:0,small:0,hunter:0},
      damage:{rock:{hits:0,shield:0,hull:0},hunter:{hits:0,shield:0,hull:0},
        volatile:{hits:0,shield:0,hull:0},seeker:{hits:0,shield:0,hull:0},other:{hits:0,shield:0,hull:0}}};
    this.active=false;
  }

  static parseSeed(value) {
    const text=String(value).trim();
    if (!/^\d{1,10}$/.test(text)) return null;
    const seed=Number(text);
    return Number.isInteger(seed) && seed<=0xffffffff ? seed : null;
  }

  static newSeed(current) {
    let seed;
    if (globalThis.crypto && typeof globalThis.crypto.getRandomValues==='function') {
      seed=globalThis.crypto.getRandomValues(new Uint32Array(1))[0];
    } else seed=(Date.now()+0x9e3779b9)>>>0;
    return seed===(current>>>0) ? (seed+1)>>>0 : seed;
  }

  begin(seed, startWave = 1) {
    const d=this.data;
    d.seed=seed>>>0;d.seconds=0;d.highestWave=startWave;d.score=0;d.bestCombo=0;
    for (const key in d.kills) d.kills[key]=0;
    for (const key in d.damage) {
      const row=d.damage[key];row.hits=row.shield=row.hull=0;
    }
    this.active=this.game.runMode==='arcade';
  }

  update(dt) {
    if (!this.active || __K.state!=='PLAYING') return;
    const finalDeath=this.game.defense && this.game.defense.gameOverT>=0;
    if (__K.lives>0 && !finalDeath && dt>0 && Number.isFinite(dt)) this.data.seconds+=dt;
    this.data.highestWave=Math.max(this.data.highestWave,__K.wave);
  }

  kill(type) {
    if (this.active && Object.hasOwn(this.data.kills,type)) this.data.kills[type]++;
  }

  combo(mult) {
    if (this.active) this.data.bestCombo=Math.max(this.data.bestCombo,mult);
  }

  damage(type,shield,hull) {
    if (!this.active || !(shield+hull>0)) return;
    const row=Object.hasOwn(this.data.damage,type) ? this.data.damage[type] : this.data.damage.other;
    row.hits++;row.shield+=shield;row.hull+=hull;
  }

  finish() {
    if (!this.active) return;
    this.data.score=__K.score;
    this.data.highestWave=Math.max(this.data.highestWave,__K.wave);
    this.active=false;
  }
}

/* ==== 85-wave-director.js ==== */
/* ===== SECTION: Wave Director — encounter compositions, difficulty, calm ===== */
/* Wave number selects a repeatable encounter plan. Waves 1/2 preserve the
   onboarding field; later waves alternate hunter patrol, fragment field and
   volatile cluster. Clear every rock AND hunter before the three-second calm
   reward. Rock-only node worlds retain AsteroidSystem's fallback progression. */
class WaveDirector {
  constructor(game) {
    this.game = game;
    this.W = __K.TUNE.waves;
    this.phase = 'fight';       /* harness-readable | 'calm' */
    this._wave = __K.wave;      /* bookkeeping mirror of THE wave number */
    this._fieldLife = 0;
    this._calmT = 0;
    this._calmPaid = true;      /* calm rewards fired once per calm entry */
  }

  composition(w) {
    const W=this.W;
    if (w < W.hunter.firstWave) return { key:'standard', label:'', countScale:1,
      smallShare:0, mediumShare:w>=2 ? W.mediumShare : 0, speedScale:1,
      clusterCount:0, hunters:0, volatileChance:0 };
    const key=['hunters','fragments','volatile'][(w-W.hunter.firstWave)%3];
    return Object.assign({ key, hunters:key==='hunters' ? Math.min(W.hunter.cap,2+Math.floor(w/W.hunter.perWave)) : 0,
      volatileChance:key==='volatile' ? Math.min(W.volatile.cap,W.volatile.start+Math.floor((w-W.volatile.firstWave)/3)*W.volatile.perCycle) : 0 }, W.encounters[key]);
  }

  hunterCount(w) { return this.composition(w).hunters; }
  volatileChance(w) { return this.composition(w).volatileChance; }
  rollVolatile() { return rng() < this.volatileChance(__K.wave); }

  /* --- bookkeeping seams -------------------------------------------------- */
  startWave(w) {
    /* Wave 1's original path skips the size RNG draw; preserve its seed layout. */
    this.game.rocks.resetField(w, w === 1 ? undefined : this.composition(w));
    this.onFieldReset();
    this._spawnHunters(w);
  }

  /* rocks.resetField() just rebuilt the selected encounter for a fresh run */
  onFieldReset() {
    this._wave = __K.wave;
    this.profile = this.composition(__K.wave);
    __K.waveTheme = this.profile.label;
    this.phase = 'fight';
    this._fieldLife = 0;
    this._calmT = 0;
    this._calmPaid = true;
  }

  /* title / quit */
  reset() {
    this.phase = 'idle';
    __K.waveTheme = '';
    this.profile = null;
    this._fieldLife = 0;
    this._calmT = 0;
    this._calmPaid = true;
  }

  _spawnHunters(w) {
    const n = this.hunterCount(w);
    if (n > 0 && this.game.enemies) {
      this.game.enemies.spawnWave(n);
      __K.log('wave ' + w + ': ' + n + ' hunter' + (n > 1 ? 's' : ''));
    }
  }

  advance() {
    __K.wave += 1;
    this._wave = __K.wave;
    this.profile = this.composition(__K.wave);
    __K.waveTheme = this.profile.label;
    this.phase = 'fight';
    this._fieldLife = 0;
    this.game.rocks.spawnWave(__K.wave,this.profile);
    this._spawnHunters(__K.wave);
    if (this.game.recordHighestWave) this.game.recordHighestWave();
  }

  /* HARNESS HOOK __kSkipWave: clear the field and jump straight to the next
     wave (no calm beat), retiring old hunters and bolts for an isolated encounter. */
  skipWave() {
    const rocks = this.game.rocks;
    if (rocks && rocks.aliveCount > 0) rocks.clearField();
    if (this.game.enemies) this.game.enemies.clearAll();
    if (this.game.projectiles) this.game.projectiles.clearAll();
    this.advance();
  }

  /* --- per-frame (Game, PLAYING only) ------------------------------------- */
  update(dt) {
    const rocks = this.game.rocks;
    if (!rocks) return;

    /* track external wave writes (rocks.resetField -> wave 1) */
    if (__K.wave !== this._wave) { this.onFieldReset(); return; }

    if (this.phase === 'fight') {
      this._fieldLife += dt;
      if (rocks.aliveCount === 0 && (!this.game.enemies || this.game.enemies.aliveCount === 0) && this._fieldLife >= this.W.minFieldLife) {
        this.phase = 'calm';
        this._calmT = 0;
        this._calmPaid = false;
      }
    } else if (this.phase === 'calm') {
      if (!this._calmPaid) {
        this._calmPaid = true;
        const C = this.W.calm;
        const D = __K.TUNE.defense;
        const smax = this.game.shieldMax ? this.game.shieldMax() : ((D && D.shieldMax) || 100);
        __K.shield = Math.min(smax, __K.shield + C.shieldBonus);
        __K.log('wave ' + this._wave + ' clear: calm ' + C.calmSec +
                's, shield +' + C.shieldBonus);
        if (this.game.pickups && rng() < C.freePickupChance) this.game.pickups.freePickup();
      }
      if (this.game.offerUpgrade && this.game.offerUpgrade(this._wave)) return;
      this._calmT += dt;
      if (this._calmT >= this.W.calm.calmSec) this.advance();
    }
  }
}

/* ==== 90-game.js ==== */
/* ===== SECTION: Game — state machine, defense model, HUD wiring, game loop ===== */
/* Stage 5 rework of the SPEC "Game" class. Owns:

   STATE MACHINE (exact strings — tests/smoke.md reads __K.state):
     'TITLE' -> 'PLAYING' -> 'PAUSED' -> 'PLAYING' -> ... -> 'GAMEOVER' -> 'TITLE'
   (legacy 'BOOT'/'PLAY' are gone; stage-0/1 smoke lines tolerate 'TITLE', and
   the stage-1 speed test drives the unlocked keyboard path from PLAYING.)

   POINTER LOCK IS NOT AUTHORITATIVE. The browser owns Esc: pressing it exits
   pointer lock natively and fires 'pointerlockchange' on document — that
   listener is the SOURCE OF TRUTH for pausing. Esc-keydown (input.onEscape)
   is the fallback when no lock exists (file:// quirks, synthetic harness
   dispatch) and double-pauses are idempotent, so both paths coexist.
   requestPointerLock() is ONLY ever called inside a user gesture (click /
   keydown handler chain) and its promise rejections are caught -> a lock
   failure is NON-FATAL: play continues unlocked and the mouse-look gate in
   10-input.js simply never opens.

   DEFENSE MODEL (documented mini-class below — lives in this file per the
   stage-5 brief; stage 6 may lift it to its own section):
     shield absorbs first, hull second; i-frames; regen after quiet;
     hull 0 -> death -> lives-1 -> respawn w/ invuln + rock nudge -> or
     GAMEOVER. All damage (rock contact, __kForceDamage, future hunter
     bolts) routes through game.damageShip(amount) — the ONLY damage door.

   Registry seam for stage 6: hit-registry reads stay thin-dispatch through
   game.targets / game.onTargetDestroyed. Hunters MUST supply a MERGED
   registry array (never push onto game.targets — it IS rocks.live);
   onTargetDestroyed already discriminates on target.kind.

   HARNESS HOOKS (public, documented; live here because they are game-model
   probes): window.__kForceDamage(n) -> damageShip(n) honouring invuln and
   i-frames; window.__kKillShip() -> hull 0 -> death path (bypasses shield;
   rocks aren't needed to test death). Both no-op outside PLAYING.
   __K.harness = { forceDamage, killShip } mirrors them for the stage-6 rig.

   THREE RULES STILL HOLD: nothing touches a THREE constructor before boot()
   assigns THREE (start() only ever runs after; the HUD and hiscore live in
   plain DOM/localStorage and load-time-safe fields). No per-frame
   allocation. No Math.random. */
class Defense {
  /* Hull/shield/lives model. Pure numbers + event callbacks — no THREE, so
     it constructs safely at module scope inside start().
     TUNE.defense seeds (stage 8 balance edits this table ONLY):
       shieldMax 100, regen 6/s after 4 s without damage, i-frames 0.6 s,
       respawn delay 1.2 s, invuln reuses TUNE.ship.invulnSec (2.0),
       extra lives at 10 000 / 25 000, gameover overlay delay 1.5 s. */
  constructor(game) {
    const T = __K.TUNE;
    const D = (T.defense = T.defense || {});
    D.shieldMax = D.shieldMax ?? 100;
    D.hullMax = D.hullMax ?? 100;
    D.regenRate = D.regenRate ?? 6;
    D.regenDelay = D.regenDelay ?? 4.0;
    D.iFrames = D.iFrames ?? 0.6;
    D.respawnDelay = D.respawnDelay ?? 1.2;
    D.gameOverDelay = D.gameOverDelay ?? 1.5;
    D.extraLives = D.extraLives ?? [10000, 25000];
    D.nudgeRadius = D.nudgeRadius ?? 60;
    D.nudgeSpeed = D.nudgeSpeed ?? 34;
    D.invuln = D.invuln ?? (T.ship ? T.ship.invulnSec : 2.0);
    this.D = D;
    this.game = game;

    /* additive __K surface (05-core fixes types; these fields are new) */
    if (typeof __K.shield !== 'number') __K.shield = D.shieldMax;
    if (typeof __K.lives !== 'number') __K.lives = 3;
    if (typeof __K.invulnT !== 'number') __K.invulnT = 0;
    if (typeof __K.muted !== 'boolean') __K.muted = false;

    this.reset();
  }

  reset() {
    const D = this.D;
    __K.hull = 100;
    __K.shield = D.shieldMax;
    __K.lives = 3;
    __K.invulnT = 0;
    this.quiet = D.regenDelay;      /* damage-recency clock (regen gate) */
    this.iFrameT = 0;
    this.respawnT = -1;             /* >= 0: waiting to respawn          */
    this.gameOverT = -1;            /* >= 0: waiting on the delay overlay */
    this.pendingHudHit = null;      /* one-shot juice event, drained by HUD */
    this._lifeFlag = false;         /* edge detector for lives 1 -> 0     */
    this._extraIdx = 0;             /* next un-granted extra-life index   */
  }

  /* THE single damage door. amount is raw incoming damage; the shield eats
     it first, the hull takes the spill. Skipped entirely while invulnerable
     or inside post-hit i-frames (readability, SPEC "i-frames or shield
     flash on hit"). Fires HUD juice + cam shake + death transition.
     force = harness probes (__kForceDamage/__kKillShip): skips the
     iframe/invuln/dying-beat gates so a probe sequence reads deterministic
     numbers without waiting out respawn choreography. REAL damage (rock
     contact, stage-6 hunter bolts) never forces. */
  damage(amount, force, source, sourceKind) {
    const g = this.game, D = this.D;
    if (!(amount > 0)) return;
    if (__K.state !== 'PLAYING') return;   /* title/pause/gameover: no damage */
    if (!force && (__K.hull <= 0 || __K.invulnT > 0 || this.iFrameT > 0)) return;
    this.iFrameT = D.iFrames;
    this.quiet = 0;
    if (g.threats) g.threats.recordHit(source);

    const absorbed = Math.min(__K.shield, amount);
    const spill = amount - absorbed;
    if (g.runRecord) g.runRecord.damage(sourceKind, absorbed, Math.min(__K.hull, spill));
    __K.shield = Math.max(0, __K.shield - absorbed);
    __K.hull = Math.max(0, __K.hull - spill);

    if (spill > 0) {
      g.shakeFor('hull');                              /* hull hit: bigger shake */
      g.sfx('hullHit');
      this.pendingHudHit = { kind: 'hull', strength: Math.min(1, 0.35 + spill / 12) };
      __K.log('hull hit: -' + spill.toFixed(1) + ' (hull ' + Math.round(__K.hull) + ')');
    } else if (absorbed > 0) {
      g.shakeFor('shield');                            /* shield absorb: small  */
      g.sfx('shieldHit');
      this.pendingHudHit = { kind: 'shield', strength: Math.min(1, absorbed / 40) };
    }

    if (__K.hull <= 0 && (!this._lifeFlag || force)) {
      /* force = harness probe mid-death-anim: each forced kill consumes one
         more life, so __kKillShip x3 back-to-back drains the bank exactly 3
         (a live rock can never reach this line while hull is already 0 —
         the gate above turned it away). */
      this._lifeFlag = true;                            /* one edge per life      */
      this._die();
    }
  }

  /* hull reached 0: ship destroyed. Explosion stub = big shake + pebble
     burst via the rock system's (documented, one-shot-safe) pebble seam +
     an impact flash reuse from the projectile flash pool. lives-1 here;
     respawn OR the delayed game-over overlay resolve in update(). */
  _die() {
    const g = this.game, D = this.D;
    __K.lives = Math.max(0, __K.lives - 1);
    __K.shield = 0;
    g.ship.group.visible = false;                       /* ship is gone */
    /* velocity-vectors spec §5 (review F7): death invalidates retention
       instantly. The ship-hide alone gates paint (F2's one-clear latch),
       but a ghost could otherwise survive the death-fade window through
       the row-ownership scan and wear the respawn's face. reset() is
       idempotent with the gate-close clear. */
    if (g.vectors) g.vectors.reset();
    if (__K.lives <= 0) {
      this.respawnT = -1;                               /* no respawn pending   */
      this.gameOverT = D.gameOverDelay;                 /* SPEC: delayed overlay */
      __K.log('ship destroyed: no lives left (game over in ' + D.gameOverDelay + 's)');
    } else {
      this.respawnT = D.respawnDelay;
      __K.log('ship destroyed: ' + __K.lives + ' lives left (respawn in ' + D.respawnDelay + 's)');
    }
    g.shakeFor('death');                              /* explosion: seeded rig, table amount */
    g.sfx('shipDeath');
    if (g.fx) g.fx.death(g.ship.position, g.ship.velocity);  /* debris burst + light */
    if (g.rocks && typeof g.rocks._spawnPebbles === 'function') {
      g.rocks._spawnPebbles(g.ship.position, g.ship.velocity, 8); /* debris spray */
    }
    const pr = g.projectiles;
    if (pr && typeof pr._spawnFlash === 'function') {
      pr._spawnFlash(g.ship.position, 0.35, 3.0);
    }
    g.hud.hitVignette(1.1);        /* death reads like a big hull hit */
    g.hud.hitShieldFlicker(0.9);
  }

  /* per-frame decay + regen + delayed transitions + extra-life thresholds.
     Called by Game ONLY while PLAYING (death anim + overlay delay therefore
     freeze while paused — intentional; nothing allocates). */
  update(dt) {
    const g = this.game, D = this.D;

    if (__K.invulnT > 0) __K.invulnT = Math.max(0, __K.invulnT - dt);
    if (this.iFrameT > 0) this.iFrameT = Math.max(0, this.iFrameT - dt);

    /* shield regen: 6/s after 4 s of no damage (SPEC "Defenses") */
    this.quiet += dt;
    const shieldMax = g.shieldMax ? g.shieldMax() : D.shieldMax;
    if (this.quiet >= D.regenDelay && __K.hull > 0 && __K.shield < shieldMax) {
      __K.shield = Math.min(shieldMax, __K.shield + D.regenRate * dt);
    }

    /* extra lives at fixed score thresholds (SPEC "Lives"); each threshold
       pays exactly once per life. Pickups/gems granting lives (stage 6)
       just raise __K.lives directly. */
    const th = D.extraLives;
    while (this._extraIdx < th.length && __K.score >= th[this._extraIdx]) {
      this._extraIdx++;
      __K.lives++;
      this.game.sfx('extraLife');           /* jingle (stage 7): threshold life */
      __K.log('extra life at ' + th[this._extraIdx - 1] + ' points (' + __K.lives + ' lives)');
    }

    if (this.respawnT >= 0) {
      this.respawnT -= dt;
      if (this.respawnT <= 0) { this.respawnT = -1; g.respawnShip(); }
    } else if (this.gameOverT >= 0) {
      this.gameOverT -= dt;
      if (this.gameOverT <= 0) {
        this.gameOverT = -1;
        g.saveHighScore();          /* final value persisted BEFORE the restart */
        g.setState('GAMEOVER');     /* setState releases the pointer lock       */
      }
    }

    this._lifeFlag = __K.lives <= 0;
  }
}

class Game {
  constructor() {
    this.renderer = null;
    this.scene = null;
    this.camera = null;
    this.world = null;
    this.input = null;
    this.ship = null;
    this.cam = null;           /* CameraRig, built in start() */
    this.projectiles = null;   /* ProjectileSystem (stage 3), built in start() */
    this.rocks = null;         /* AsteroidSystem (stage 4), built in start()   */
    this.hud = null;           /* HUD (stage 5), built in start()              */
    this.vectors = null;       /* VelocityVectors (contact motion indicators), built in _beginRun() */
    this.settings = null;
    this.upgrades = null;
    this.runRecord = null;
    if (typeof RunRecord!=='undefined' && window.location) {
      const seed=RunRecord.parseSeed(new URLSearchParams(window.location.search).get('seed'));
      if (seed!==null) __K.loadSeed=seed;
    }
    this.threats = null;
    this.runMode = 'arcade';
    this.practice = null;
    __K.runMode = this.runMode;
    this.defense = null;       /* Defense model (stage 5), built in start()    */
    /* stage 6 (SPEC "Enemies and expanded loop"): hunters, pickups, weapons
       controller, wave director; _merged is the hit registry the live game
       assigns to this.targets (rocks first, then enemies — rebuilt in place
       every PLAYING frame; rocks.live itself is never touched from here) */
    this.enemies = null;
    this.pickups = null;
    this.weapons = null;
    this.director = null;
    /* stage 7 (SPEC "Particles" + "Audio" + "Post-processing and look"):
       pooled sprites/point lights and the procedural Audio — presentation
       only, built in start(); every call site goes through the sfx() and
       shakeFor() guards below so a node world without them stays green.
       _composer is assigned by 95-boot.js ONLY when the bloom imports win. */
    this.fx = null;
    this.audio = null;
    this._composer = null;
    this._merged = [];
    this.comboLive = false;    /* combo credit is a live-run feature (_beginRun) */
    this.rapidMul = 1;         /* rapid-fire buff (PickupSystem keeps current) */
    this.dmgMul = 1;           /* double-damage buff multiplier at impact     */
    this._blastDepth = 0;      /* volatile chain-react re-entrancy guard      */
    this.targets = [];         /* hit registry — AsteroidSystem re-points this
                                  at its rock pool's live list in its ctor      */
    this._destroyed = 0;
    this._lastT = 0;
    this._raf = 0;
    this._clock = 0;
    this.edgeWarn = 0;         /* HUD boundary-warning ratio (see _edgeRatio) */
    /* STAGE 11 aim assist (see _aimScan): the locked target's registry entry
       (or null) + its lock angle (deg) + closed-form lead time (s, 0 = none).
       Plain references/numbers — zero allocation for the whole seam. */
    this.aimTarget = null;
    this.aimDeg = 0;
    this.aimLeadT = 0;
    /* additive __K surface (new fields: lock KIND string + angle; never the
       entry object itself — every harness probe reads scalars) */
    __K.aimTarget = null;
    __K.aimDeg = 0;
    this._lockJustLostAt = -1e9; /* ms stamp of a REAL lock-loss pause (Esc double-fire guard) */
    this._heldLock = false;    /* our last known pointer-lock ownership (optimistic) */
    this._hullZeroLogged = false; /* rock_harness P6: defense-less fallback logs once */
    /* scratch reused every frame (allocated in start(), never in the loop) */
    this._snap = { pos: [0, 0, 0], speed: 0, pitchDeg: 0, yawDeg: 0 };
    this._stats = { shots: 0, hits: 0, bolts: 0, destroyed: 0, rocks: 0, hunters: 0, pickups: 0 };
    this._waveShown = 0;         /* wave banner edge detector */
    this.startWave = 1;          /* retained for retrying the selected encounter */
    if (!Number.isSafeInteger(__K.highestWave) || __K.highestWave < 1) __K.highestWave = 1;

    /* ---- high score: localStorage, wrapped for file:// (FF/Safari THROW
       on access) with an in-memory fallback. __K.hiscore / __K.newHighScore
       are additive surfaces read by the HUD title + gameover screens. ---- */
    if (typeof __K.hiscore !== 'number') __K.hiscore = 0;
    if (typeof __K.newHighScore !== 'boolean') __K.newHighScore = false;
    this._registerHarnessHooks();
  }

  /* --- persistence (all storage access try/catch: file:// origins may throw) */
  _store() {
    try {
      const s = window.localStorage;
      if (!s) return null;
      s.setItem('__k_t', '1'); s.removeItem('__k_t');   /* Safari private mode */
      return s;
    } catch (e) { __K.log('localStorage unavailable: in-memory records only'); return null; }
  }

  /* STAGE-12 cluster C: ACTIVE speed cap for the current flight mode.
     HUD/camera-facing reader of the SAME mode sub-table split the Ship
     integrates with (20-ship.js: space -> TUNE.flightSpace, assist ->
     TUNE.ship). Keys off ship.mode (the per-run latch) with a
     TUNE.flightMode fallback for pre-ship worlds. Pure scalars. */
  _speedCap(boosting) {
    const T = __K.TUNE;
    const space = this.ship ? this.ship.mode === 'space' : T.flightMode !== 'assist';
    const M = (space ? T.flightSpace : T.ship) || T.ship;
    return boosting ? M.boostSpeed : M.maxSpeed;
  }

  /* Legacy flight-mode persistence seam, retained for callers/harnesses.
     PlayerSettings.load now reads the same key before Ship construction.
     Values: 'space' | 'assist'; anything else (or storage
     throw on file://) keeps the 05-core default ('space'). */
  loadFlightMode() {
    const s = this._store();
    if (!s) return __K.TUNE.flightMode;
    let v = null;
    try { v = s.getItem('kessler.flightmode'); } catch (e) { v = null; }
    if (v === 'space' || v === 'assist') __K.TUNE.flightMode = v;
    return __K.TUNE.flightMode;
  }

  /* STAGE-12 cluster C: the T-toggle mid-run flip. PLAYING or PAUSED only.
     Swaps __K.TUNE.flightMode (camera + any TUNE consumer), persists it,
     and RE-LATCHES the live ship WITHOUT resetRun — position, velocity,
     attitude and rates all survive (resetRun would reposition/zero the
     run, the wrong thing for a mid-flight mode swap).
     RESEEDING (both directions are natural, zero extra writes):
     - assist -> space: space integrates the attitude IN group.quaternion
       (20-ship.js), and assist keeps that object equal to the euler pose
       every frame — leaving it in place IS the seed, so the nose
       direction is continuous across the flip.
     - space -> assist: assist rebuilds the pose from yawDeg/pitchDeg, and
       space keeps those alive as decomposed player-sign reads of the
       nose, so the nose direction is continuous (body roll is dropped —
       assist has no roll by design). */
  _flipFlightMode() {
    const next = (__K.TUNE.flightMode === 'space') ? 'assist' : 'space';
    __K.TUNE.flightMode = next;
    const s = this._store();
    if (s) { try { s.setItem('kessler.flightmode', next); } catch (e) { /* file://: in-memory only */ } }
    if (this.ship) this.ship.mode = next;   /* relatch NOW: HUD/camera and
                                               the ship's knob sub-table M
                                               follow this frame */
    if (this.settings) {
      this.settings.values.flightMode = next;
      this.settings.save();
      if (this.hud) this.hud.syncSettings();
    }
    /* velocity-vectors spec §5 (review F7): flight-mode flip invalidates
       retention instantly — the velocity basis and camera path change with
       the mode, so stale arrows must not survive the flip. */
    if (this.vectors) this.vectors.reset();
    __K.log('flight mode: ' + next);
  }

  loadHighScore() {
    const s = this._store();
    let v = 0;
    if (s) { const n = parseFloat(s.getItem('kessler.hiscore')); v = Number.isFinite(n) ? n : 0; }
    __K.hiscore = Math.max(0, v);
    return __K.hiscore;
  }

  loadHighestWave() {
    const s = this._store();
    try {
      const n = s ? Number(s.getItem('kessler.highestWave')) : 0;
      if (Number.isSafeInteger(n) && n >= 1) __K.highestWave = Math.max(__K.highestWave, n);
    } catch (e) { /* retain the in-memory record when storage cannot be read */ }
    return __K.highestWave;
  }

  recordHighestWave() {
    if (this.runMode !== 'arcade' || !Number.isSafeInteger(__K.wave) || __K.wave <= __K.highestWave) return;
    __K.highestWave = __K.wave;
    const s = this._store();
    try { if (s) s.setItem('kessler.highestWave', String(__K.highestWave)); }
    catch (e) { /* gameplay and the in-memory record remain available */ }
  }

  /* Commit the high score and persist it. Called when a run ENDS (death ->
     the delayed gameover, or quit-to-title mid-run) so a reload shows it.
     ALL storage access is try/catch wrapped (file:// FF/Safari throw on
     localStorage) — an in-memory __K.hiscore is the silent fallback. */
  saveHighScore() {
    if (this.runMode === 'practice') return false;
    this.recordHighestWave();
    const score = Math.floor(__K.score) || 0;
    __K.newHighScore = score > (__K.hiscore || 0);
    if (__K.newHighScore) __K.hiscore = score;
    const s = this._store();
    if (!s) return false;
    try { s.setItem('kessler.hiscore', String(__K.hiscore)); return true; }
    catch (e) { return false; }
  }

  /* --- HARNESS HOOKS (public; no-op outside PLAYING; the SAME shield-first
     door rocks and bolts knock on, so probes test the real model; `force`
     skips only the timing gates, never the math) -------------------------- */
  _registerHarnessHooks() {
    const self = this;
    window.__kForceDamage = function (n) {
      if (__K.state !== 'PLAYING' || !self.defense) return;
      self.damageShip(Number(n), true);
    };
    window.__kKillShip = function () {
      if (__K.state !== 'PLAYING' || !self.defense) return;
      self.damageShip(Math.max(1, __K.hull + __K.shield + 1), true); /* pierce all despite fractional rounding */
    };
    __K.harness = {
      forceDamage: window.__kForceDamage,
      killShip: window.__kKillShip,
      start: function () { self.requestStart(); },
      pause: function () { self.requestPause(); },
      resume: function () { self.requestResume(); },
      quit: function () { self.requestQuit(); }
    };

    /* ---- STAGE 6 harness hooks (public, documented acceptance surface).
       All no-op outside PLAYING — they drive the LIVE systems, no stubs. ---- */
    window.__kSetWeapon = function (n) {   /* n = 1|2|3 or 'pulse'|'flak'|'seeker' */
      if (__K.state !== 'PLAYING' || !self.weapons) return;
      if (typeof n === 'number') self.weapons.select(['pulse', 'flak', 'seeker'][(n | 0) - 1]);
      else self.weapons.select(n);
    };
    window.__kSpawnHunter = function () {
      if (__K.state !== 'PLAYING' || !self.enemies) return null;
      return self.enemies.spawnNearShip();
    };
    window.__kSpawnPickup = function (type) {
      if (__K.state !== 'PLAYING' || !self.pickups) return null;
      return self.pickups.spawnNearShip(type);
    };
    window.__kSpawnVolatile = function () {
      /* one volatile large rock in front of the ship, ready to be killed */
      if (__K.state !== 'PLAYING' || !self.rocks) return null;
      const g = self.rocks;
      const r = g.spawnRock('large',
        g._spawnPoint(g.R.radius.large[1], g._sPos),
        g._spawnVel(1, g._sVel));
      if (!r) return null;
      r.volatile = true;
      r.mesh.material = g._vMat;
      return r;
    };
    window.__kSkipWave = function () {
      if (__K.state !== 'PLAYING' || !self.director || self.runMode === 'practice') return;
      self.director.skipWave();
    };
  }

  /* --- THE state swap. __K.state carries the exact SPEC string; the HUD
     screen choice keys off it in _syncScreens every frame. */
  setState(s) {
    if (__K.state === s) return;
    if (s==='GAMEOVER' && this.runRecord) this.runRecord.finish();
    __K.state = s;
    __K.log('state -> ' + s);
    if (this.input) this.input._releaseAll();           /* no stuck keys across cuts */
    if (s !== 'PLAYING' && this.threats) this.threats.clear();
    /* velocity-vectors spec §5: pause ENTRY kills retention instantly (all
       entries, no fade) — same invalidation beat as the audio reset below. */
    if (s === 'PAUSED' && this.vectors) this.vectors.reset();
    /* LEAVING PLAYING must silence the engine bed NOW: Audio.update() — which
       idles the bed when thrust drops — only runs while PLAYING, so pausing
       (or a hidden/throttled tab) with thrust held would freeze the bed gain
       at its last value = an endless low drone. resetRun is cheap + idempotent. */
    if (s !== 'PLAYING' && this.audio) this.audio.resetRun();
    if (s === 'PLAYING' && this.cam) this.cam.setMode('chase');
    if ((s === 'TITLE' || s === 'GAMEOVER' || s === 'PAUSED') && document.pointerLockElement) {
      document.exitPointerLock();                       /* pause spec: unlocked buttons */
    }
  }

  /* --- user-gesture entry points (requestPointerLock ONLY happens inside
     these call chains — click/keydown handlers or the pointerlockchange
     listener, which is itself gesture-caused). --------------------------- */
  _focusGameplay() {
    if (__K.state !== 'PLAYING' || (this.hud && (this.hud.settingsOpen || this.hud.upgradesOpen))) return;
    const cv = this.renderer && this.renderer.domElement;
    if (cv && cv.focus) cv.focus({ preventScroll: true });
  }

  _lockPointer() {
    this._focusGameplay();
    const cv = this.renderer ? this.renderer.domElement : null;
    if (!cv) return;
    try {
      if (document.pointerLockElement === cv) return;
      const p = cv.requestPointerLock();  /* options object trips a Chromium
                                             deprecation console warning;
                                             unadjusted-movement not needed */
      /* promise rejections AND synchronous throws are both non-fatal: play
         simply continues unlocked (mouse look stays gated off in 10-input) */
      if (p && typeof p.catch === 'function') {
        p.catch(function (e) {
          __K.log('pointer lock unavailable: ' + ((e && e.message) || e) + ' (playing unlocked)');
        });
      }
    } catch (e) {
      /* file:// / older engines throw synchronously — non-fatal */
      __K.log('pointer lock threw: ' + ((e && e.message) || e) + ' (playing unlocked)');
    }
  }

  requestStart() {
    if (__K.state !== 'TITLE') return;
    if (this.hud && this.hud.readSeed) return this.requestSeededRun(this.hud.readSeed('title'));
    if (this.hud && this.hud.readWave) {
      const wave = this.hud.readWave();
      if (wave === null) return false;
      this.startWave = wave;
    }
    this.runMode = 'arcade';
    this._beginRun();
    this._lockPointer();                                /* still inside the gesture */
  }

  requestSeededRun(value) {
    if (__K.state!=='TITLE' && __K.state!=='GAMEOVER') return false;
    const seed=RunRecord.parseSeed(value);
    if (seed===null) {
      if (this.hud.seedError) this.hud.seedError(__K.state==='TITLE' ? 'title' : 'over');
      return false;
    }
    if (__K.state === 'TITLE' && this.hud.readWave) {
      const wave = this.hud.readWave();
      if (wave === null) return false;
      this.startWave = wave;
    }
    __K.loadSeed=seed;
    if (this.hud.setSeedFields) this.hud.setSeedFields(seed);
    this.runMode='arcade';
    this._beginRun();
    this._lockPointer();
    return true;
  }

  requestNewSeed() {
    if (__K.state!=='TITLE' && __K.state!=='GAMEOVER') return;
    return this.requestSeededRun(RunRecord.newSeed(__K.loadSeed));
  }

  requestPractice() {
    if (__K.state !== 'TITLE' || !this.practice) return;
    this.runMode = 'practice';
    this.practice.lesson = 0;
    this._beginRun();
    this._lockPointer();
  }

  requestPause() {
    if (__K.state !== 'PLAYING') return;                /* idempotent: Esc-keydown
                                             and pointerlockchange may both arrive */
    this.setState('PAUSED');
  }

  shieldMax() { return this.upgrades && this.runMode==='arcade' ? this.upgrades.shieldMax : (__K.TUNE.defense?.shieldMax || 100); }
  flakSpreadDeg() { return this.upgrades && this.runMode==='arcade' ? this.upgrades.flakSpreadDeg : __K.TUNE.weapons.flak.spreadDeg; }
  magnetRange() { return this.upgrades && this.runMode==='arcade' ? this.upgrades.magnetRange : __K.TUNE.pickups.magnetRange; }

  offerUpgrade(wave) {
    if (__K.state!=='PLAYING' || __K.hull<=0 || !this.ship.group.visible || !this.upgrades || !this.upgrades.offer(wave)) return false;
    this.requestPause();
    this._syncScreens();
    if (this.hud.openUpgrades) this.hud.openUpgrades();
    return true;
  }

  chooseUpgrade(key) {
    if (__K.state!=='PAUSED' || !this.upgrades || !this.upgrades.pendingWave) return false;
    if (!(key===null ? this.upgrades.skip() : this.upgrades.choose(key))) return false;
    if (this.hud.closeUpgrades) this.hud.closeUpgrades();
    this.requestResume();
    return true;
  }

  requestResume() {
    if (__K.state !== 'PAUSED' || (this.upgrades && this.upgrades.pendingWave)) return;
    this._lastT = performance.now();                    /* kill the pause-frame dt */
    this.setState('PLAYING');
    this._lockPointer();
  }

  requestRestart() {
    if (__K.state === 'TITLE') return this.requestStart();
    if (__K.state === 'GAMEOVER') {
      if (this.runRecord) __K.loadSeed=this.runRecord.data.seed;
      if (this.hud.setSeedFields) this.hud.setSeedFields(__K.loadSeed);
      this._beginRun();                   /* selected starting wave, score 0, fresh timers.
        The SPEC 1.5 s delay already elapsed in Defense.update before the
        overlay ever displayed, so the killing click cannot skip it. */
      this._lockPointer();
      return;
    }
    if (__K.state !== 'PAUSED') return;
    this._beginRun();
    this._lockPointer();
  }

  requestQuit() {
    if (__K.state !== 'PAUSED' && __K.state !== 'PLAYING' && __K.state !== 'GAMEOVER') return;
    /* leaving a live run (paused or playing) banks the score: saveHighScore
       is idempotent (re-save of an already-committed score re-flags nothing) */
    this.saveHighScore();
    this._toTitle();
  }

  /* --- run lifecycle ----------------------------------------------------- */
  /* Fresh PLAYING from TITLE / PAUSED-restart / GAMEOVER-restart. Every
     number the run owns is re-seeded here; the selected encounter respawns
     deterministically (same shared seed per page load; rocks.resetField).
     The camera snaps behind the ship because cam.setMode('chase') inside
     setState arms the follow-spring snap. */
  _beginRun() {
    if (this.hud && this.hud.upgradesOpen) this.hud.closeUpgrades();
    /* velocity-vectors spec (§7): DOM-only construction (canvas + 2D ctx,
       never THREE), same never-fatal try/catch family as the stage-10
       radar seam in 95-boot.js — a failed build leaves game.vectors null
       and the paint call sites no-op. reset() here also covers the
       §5 invalidation events routed through _beginRun (new run / restart
       / practice reset). */
    if (!this.vectors) {
      try { this.vectors = new VelocityVectors(this); }
      catch (e) {
        this.vectors = null;
        __K.vectors = { alive: false };        /* inert stub surface (spec §7) */
        __K.log('vectors disabled (construction failed): ' + ((e && e.message) || e));
      }
    }
    if (this.vectors) this.vectors.reset();    /* retention dies on every new run */
    if (this.upgrades) this.upgrades.reset();
    if (this.threats) this.threats.clear();
    const g = __K;
    g.runMode = this.runMode;
    g.score = 0;
    g.newHighScore = false;
    g.glitchT = 0;
    this._destroyed = 0;
    this._clock = 0;
    this.edgeWarn = 0;
    this._lastT = performance.now();
    this.defense.reset();
    if (this.runRecord) this.runRecord.begin(__K.loadSeed, this.startWave);
    this.ship.resetRun(0, 0, 0);
    this.ship.group.visible = true;
    if (this.projectiles) this.projectiles.clearAll();   /* no stale bolts across a restart */
    /* stage 6: fresh weapon/ammo/hunter/pickup/combo state, then the field */
    if (this.weapons) this.weapons.resetRun();
    if (this.enemies) this.enemies.clearAll();
    if (this.pickups) this.pickups.resetRun();
    this.secondaryFire = false;
    this._pulseGate = true;
    this._merged.length = 0;            /* stale registry entries die with the run */
    g.combo = 0; g.comboT = 0;
    this.comboLive = true;      /* kills chain the x-multiplier from frame 1 */
    this._blastDepth = 0;
    if (this.fx) this.fx.clear();                 /* stage 7: no stale sprites
       across a restart — cheap (pool cap once) and keeps R-restarts clean */
    if (this.audio) this.audio.resetRun();
    if (this.runMode === 'practice' && this.practice) {
      __K.rngSeed(__K.loadSeed);
      g.wave = 0;
      if (this.director) this.director.reset();
      this.practice.start(this.practice.lesson);
    } else {
      if (this.practice) this.practice.stop();
      if (this.director && this.director.startWave) this.director.startWave(this.startWave);
      else {
        this.rocks.resetField(this.startWave); // spawns after centering the ship
        if (this.director) this.director.onFieldReset();
      }
    }
    const st = this._stats;
    st.shots = st.hits = st.destroyed = 0;
    this.setState('PLAYING');
    this.recordHighestWave();
    this._syncScreens();                                /* screens off, juice wiped */
    this._waveShown = __K.wave;
    if (this.runMode !== 'practice') this.hud.showWave(__K.wave);
    __K.log(this.runMode === 'practice' ? 'practice sector start' : 'run start: wave ' + __K.wave + ', 3 lives');
  }

  _toTitle() {
    if (this.runRecord) this.runRecord.finish();
    /* velocity-vectors spec §5 (review F7): quit-to-title invalidates
       retention instantly (the pools drain below; the explicit reset
       matches the §5 invalidation list without leaning on the next paint's
       liveness scan). */
    if (this.vectors) this.vectors.reset();
    if (this.hud && this.hud.upgradesOpen) this.hud.closeUpgrades();
    if (this.upgrades) this.upgrades.reset();
    if (this.practice) this.practice.stop();
    this.runMode = __K.runMode = 'arcade';
    if (this.rocks) this.rocks.clearField();
    if (this.projectiles) this.projectiles.clearAll();
    if (this.enemies) this.enemies.clearAll();          /* stage 6 pools drain */
    if (this.pickups) this.pickups.clearAll();
    if (this._merged) this._merged.length = 0;          /* stale entries die with the run */
    if (this.director) this.director.reset();
    this.comboLive = false;
    __K.combo = 0; __K.comboT = 0;
    this.defense.reset();
    if (this.fx) this.fx.clear();           /* stale sprites die with the run */
    if (this.audio) this.audio.resetRun();  /* engine bed off, mute watch rearmed */
    this.edgeWarn = 0;
    this.ship.resetRun(0, 0, 0);
    this.ship.group.visible = false;
    this.setState('TITLE');
    this._syncScreens();
    this.cam.setMode('title');
  }

  /* --- death / respawn (called by Defense after its 1.2 s beat) -----------
     Ship resets to sector center at zero velocity, gets the 2 s invulnera-
     bility window (__K.invulnT — rock damage checks it at the source), and
     every collidable rock inside nudgeRadius has its velocity nudged
     OUTWARD once (additive kick, one-shot — rocks.nudgeNear, documented). */
  respawnShip() {
    const D = this.defense.D;
    this.ship.resetRun(0, 0, 0);
    this.ship.group.visible = true;
    __K.invulnT = D.invuln;                             /* SPEC: ~2 s invulnerable */
    __K.hull = Math.max(__K.hull, 1);                   /* never respawn at 0 hull */
    this.rocks.nudgeNear(this.ship.position, D.nudgeRadius, D.nudgeSpeed);
    __K.log('respawn at sector center: ' + D.invuln.toFixed(1) + 's invulnerable');
  }

  /* THE damage door — rock contact (50-asteroid), harness probes, and stage 6
     hunter bolts all come through here; nothing else mutates hull/shield.
     Defense-less fallback (the node rock_harness builds a Game without the
     stage-5 model): keeps the stage-4 hull-only arithmetic so those probes
     stay green. `force` is only ever set by the harness hooks. */
  damageShip(amount, force, source, sourceKind) {
    if (this.runMode === 'practice') return;
    if (this.defense) { this.defense.damage(amount, force, source, sourceKind); return; }
    if (!(amount > 0)) return;
    __K.hull = Math.max(0, __K.hull - amount);
    this.shakeFor('fallback');                          /* impact punch */
    this.sfx('hullHit');
    if (__K.hull <= 0 && !this._hullZeroLogged) {
      this._hullZeroLogged = true;
      __K.log('hull depleted by rock impact (no defense model)');
    }
  }

  /* --- STAGE 7 juice doors (both no-op in a juice-less node world, so the
     rock/wave harness stubs never grew fx/audio). shakeFor centralises the
     impact ladder into TUNE.particles.shake; the rig's seeded spring does
     the motion. sfx books + synthesises through Audio (mute-safe). --------- */
  shakeFor(event, size) {
    const S = __K.TUNE.particles && __K.TUNE.particles.shake;
    if (!this.cam || !this.cam.shake || !S) return;
    let amt = S.fallback;
    if (event === 'rock') amt = (S.rock && S.rock[size]) || (S.rock && S.rock.default) || S.fallback;
    else if (S[event] !== undefined) amt = S[event];
    this.cam.shake(amt);
  }

  sfx(name) {
    if (this.audio && this.audio.play) this.audio.play(name);
  }

  /* Stage-7 visual upgrade (SPEC: pool the flash — the Particles class
     owns the point-light pool; the stage-3 stub mesh stays as the drop
     when the pool is saturated, so this is strictly additive). */
  explosion(at) {
    if (this.projectiles) this.projectiles._spawnFlash(at, 0.35, 4.0);
    if (this.fx) this.fx.light('explosion', at);
    this.shakeFor('explosion');
  }

  /* --- STAGE 6: score funnel + combo (SPEC "Scoring") ----------------------
     ALL kill/gem points go through creditScore(base) ONCE per kill event.
     Kills within TUNE.combo.windowSec chain a x1..x5 multiplier: the first
     kill pays x1 (combo=1), a kill inside the open window pays x2, x3... up
     to the cap, and refreshes the window. Exact integer math — a boosted
     second kill jumps by EXACTLY 2x base (__K.combo chip on the HUD).
     comboLive is set by _beginRun: director-less node worlds (rock_harness)
     credit at plain x1, so the stage-4 score probes stay exact. */
  creditScore(base) {
    if (this.runMode === 'practice') return 0;
    let mult = 1;
    if (this.comboLive) {
      mult = __K.comboT > 0 ? Math.min(__K.TUNE.combo.cap, __K.combo + 1) : 1;
      __K.combo = mult;
      __K.comboT = __K.TUNE.combo.windowSec;
    }
    if (this.runRecord) this.runRecord.combo(mult);
    const pay = base * mult;
    __K.score += pay;
    return pay;
  }

  /* --- STAGE 6: volatile blast (SPEC "rare volatile asteroids") -----------
     Fires from rocks.destroyRock AFTER release+split. Two passes so the
     damage sweep never races the pool's swap-remove:
       1. every live rock within blastRadius (+its own radius) loses
          TUNE.volatiles.rockDamage hp; the ship takes shipDamage scaled by
          distance THROUGH game.damageShip (shield-first funnel).
       2. rocks whose hp crossed 0 die through rocks.destroyRock — which
          re-enters this method for their own volatile flag = CHAIN REACT.
     Re-entrancy: _blastDepth caps the chain at 3 generations (a depth-cap
     guard, not a damage cap). */
  volatileBlast(at, source) {
    const V = __K.TUNE.volatiles, ship = this.ship;
    this.explosion(at);
    this.shakeFor('volatile');                    /* medium: chain reads louder */
    this.sfx('volatile');
    if (this.fx) this.fx.volatileBurst(at, null); /* orange burst + big light  */
    if (this._blastDepth >= 3) { __K.log('volatile chain capped at depth 3'); return; }

    const live = this.rocks.rocks.live;
    this._blastDepth++;
    for (let i = 0; i < live.length; i++) {          /* pass 1: damage only */
      const r = live[i];
      if (r === source || r.hp <= 0) continue;
      const d = Math.hypot(r.position.x - at.x, r.position.y - at.y, r.position.z - at.z);
      if (d >= V.blastRadius + r.radius) continue;
      r.hp -= V.rockDamage;
    }
    if (ship) {                                       /* ship: scaled by distance */
      const sd = Math.hypot(ship.position.x - at.x, ship.position.y - at.y, ship.position.z - at.z);
      if (sd < V.blastRadius + ship.radius) {
        this.damageShip(V.shipDamage * (1 - sd / (V.blastRadius + ship.radius)), false, at, 'volatile');
      }
    }
    for (let i = live.length - 1; i >= 0; i--) {      /* pass 2: kill the dead */
      const r = live[i];
      if (r && r.hp <= 0) this.rocks.destroyRock(r);
    }
    this._blastDepth--;
  }

  /* Stage-6 volatile roll for 50-asteroid's spawnRock. The director owns the
     encounter plan (volatile clusters from wave 5); a director-less world
     draws NO rng — the stage-4 determinism probes stay byte-identical. */
  rollVolatile() {
    return this.director ? this.director.rollVolatile() : false;
  }

  /* --- keyboard/mouse extension points (10-input.js left these unassigned) */
  _wireInput() {
    const self = this;
    this.input.onMouseMove = this.input.onMouseMove.bind(this.input); /* unchanged seam */

    /* Esc keydown fallback: unlock-only sessions never fire pointerlockchange,
       so pause/resume must also work from the key. Idempotent both ways.
       `_lockJustLostAt` guard: a browser that DOESN'T suppress the Esc keydown
       when it exits the lock would otherwise pause (lockchange) and instantly
       resume (keydown) inside one keypress — untouchable pause. The guard
       swallows a resume arriving <120 ms after a lock-loss pause; a synthetic
       unlocked double-Esc (no lock ever lost) is never gated. */
    this.input.onEscape = function () {
      if (self.hud && self.hud.upgradesOpen) { self.chooseUpgrade(null); return; }
      if (self.hud && self.hud.settingsOpen) { self.hud.closeSettings(); return; }
      if (__K.state === 'PLAYING') self.requestPause();
      else if (__K.state === 'PAUSED') {
        if (performance.now() - self._lockJustLostAt < 120) return;
        self.requestResume();                         /* re-lock: this handler
                                                   IS a user gesture */
      }
    };

    /* M — mute flag flip (stage 7 audio consumes __K.muted; HUD shows a chip) */
    this.input.onMute = function () {
      __K.muted = !__K.muted;
      __K.log('mute: ' + (__K.muted ? 'ON' : 'OFF'));
    };

    /* Enter/Space start from TITLE (Space doubles as fire — a fire keydown
       is a user gesture, so locking here is legal). The fire flag is dropped
       for the initial press so the start press never shoots; holding the key
       auto-repeats and fires once PLAYING. KeyR restarts from GAMEOVER. All
       run INSIDE the keydown handler chain (legal for requestPointerLock).
       Stage-10 A2 (same listener, additive branches): KeyV toggles the rig's
       free-look/zoom mode; +/- (Equal/Minus, NumpadAdd/NumpadSubtract) zoom
       regardless of mode — "+" magnifies (fov target DOWN), "-" trails back
       (fov target UP). Harmless in any state (the springs just settle). */
    document.addEventListener('keydown', function (e) {
      const c = normalizeKeyCode(e);
      if (self.hud && (self.hud.settingsOpen || self.hud.upgradesOpen)) return;
      if (keyboardUI(e.target) &&
          !(__K.state==='GAMEOVER' && e.target.tagName==='BUTTON' && c==='KeyR')) return;
      if (c === 'Enter' || c === 'NumpadEnter' || c === 'Space') {
        if (__K.state === 'TITLE') { e.preventDefault(); self.requestStart(); self.input.fire = false; }
      } else if (c === 'KeyP') {
        if (__K.state === 'TITLE' && !e.repeat) self.requestPractice();
      } else if (c === 'KeyN') {
        if (self.runMode === 'practice' && (__K.state === 'PLAYING' || __K.state === 'PAUSED') && !e.repeat) self.practice.next();
      } else if (c === 'KeyR') {
        if (self.runMode === 'practice' && __K.state === 'PLAYING' && !e.repeat) { self._beginRun(); return; }
        if (!e.repeat && (__K.state === 'GAMEOVER' || (self.runMode === 'practice' && __K.state === 'PAUSED'))) self.requestRestart();
      } else if (c === 'KeyV') {
        if (!e.repeat && self.cam) self.cam.toggleZoomMode();
      } else if (c === 'Period') {
        if (!e.repeat && self.vectors && (__K.state === 'PLAYING' || __K.state === 'PAUSED')) {
          e.preventDefault();
          self.vectors.toggle();
        }
      } else if (c === 'KeyT') {
        /* STAGE-12 cluster C: flight-mode toggle (space <-> assist). Mid-run
           flip keeps position/velocity/attitude (see _flipFlightMode);
           persists to localStorage 'kessler.flightmode'. KeyT was
           unclaimed in 10-input.js and here. */
        if (!e.repeat && (__K.state === 'PLAYING' || __K.state === 'PAUSED')) self._flipFlightMode();
      } else if (c === 'Equal' || c === 'NumpadAdd') {
        if (self.cam) self.cam.setZoom(-1);
      } else if (c === 'Minus' || c === 'NumpadSubtract') {
        if (self.cam) self.cam.setZoom(1);
      }
    });

       browser fires pointerlockchange and we pause there, so pause works
       even when the Esc KEYDOWN is eaten by the browser's lock UI. Loss of
       lock while PLAYING (and not mid-death-animation) => PAUSED. */

      const locked = document.pointerLockElement === (self.renderer && self.renderer.domElement);
      // A start/resume lock promise can settle after a calm offer pauses us.
      // Keep upgrade buttons usable even when that grant arrives late.
      if (locked && self.hud && self.hud.upgradesOpen) {
        self._heldLock = false;
        document.exitPointerLock();
        return;
      }
      if (__K.state === 'PLAYING' && !locked) {
        const d = self.defense;
        const dying = d && (d.respawnT >= 0 || d.gameOverT >= 0);
        if (!dying) {
          /* stamp ONLY when WE held the lock — that is the one case where the
             browser may also deliver the Esc keydown and instantly un-pause.
             A synthetic/never-locked change stays unguarded so unlocked
             harness flows can pause+resume at any speed. */
          if (self._heldLock) self._lockJustLostAt = performance.now();
          self._heldLock = false;
          self.requestPause();

        /* dying: the death/gameover path manages the lock itself */
      } else if (locked) {

      }
    });
