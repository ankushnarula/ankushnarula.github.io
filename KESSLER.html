/* ===== SECTION: Radar — omnidirectional bearing + IFF scope overlay ===== */
/* Stage-10 add-on: a 2D canvas sensor overlay over the WebGL scene.
   CONVENTIONS:
   - Pure 2D canvas. Touches NO THREE object at all (node-testable).
   - Scope frame: UP = ship nose bearing (nose-up scope). For a world-space
     horizontal delta d = (dx, dy, dz) (y is the vertical axis):
       fwd   = dx*sin(yaw) + dz*cos(yaw)   (+ = ahead of the nose -> scope up)
       right = dx*cos(yaw) - dz*sin(yaw)   (+ = to the nose's right -> scope right)
     with yaw = ship.yawDeg in radians (20-ship.js: "+ = nose right", nose at
     local +Z). Screen mapping: sx = cx + right*s, sy = cy - fwd*s.
   - S = rim pixels per world unit = rim / range; anything beyond
     __K.TUNE.radar.range clamps to the rim (still counted as a blip).
   - dy cue: |d.y| > 15% of horizontal distance -> up/down chevron in a
     shifted colour (above = warm, below = cool).
   - NO per-frame allocation: blips land in a preallocated Float64Array
     (stride 4: x, y, colorIndex, cue); DOM nodes built exactly ONCE in the
     constructor; per-frame writes are canvas draw calls only.
   - Self-installs its own requestAnimationFrame loop (canvas-only, mutates
     no game state), so 90-game.js stays untouched; while __K.state is not
     'PLAYING' it paints the idle scope (chrome only, zero blips).
   - Reads TUNE defensively: (__K.TUNE.radar && .range) || fallback — the
     values are pre-seeded in 05-core.js but are never written here. */
class Radar {
  constructor(game) {
    this.game = game;
    const T = __K.TUNE.radar || {};
    this.range = (T.range) || 420;                 /* world units */
    const size = (T.size) || 150;                  /* CSS px      */
    this.size = size;
    this.cx = size / 2;
    this.cy = size / 2;
    this.rim = size / 2 - 4;                       /* rim radius, CSS px */

    const root = document.getElementById('hud');
    if (!root) throw new Error('radar: #hud root missing');
    const dprRaw = (typeof devicePixelRatio === 'number' && devicePixelRatio) || 1;
    const dpr = dprRaw > 2 ? 2 : dprRaw;
    const cv = document.createElement('canvas');
    cv.width = Math.round(size * dpr);
    cv.height = cv.width;
    const st = cv.style;
    /* shell.html has a GLOBAL `canvas { position:fixed; inset:0 }` rule —
       inline styles below deliberately beat it so the scope sits
       bottom-centre inside #hud instead of covering the viewport. */
    st.position = 'absolute'; st.inset = 'auto'; st.left = '50%';
    st.transform = 'translateX(-50%)'; st.bottom = '14px';
    st.width = size + 'px'; st.height = size + 'px';
    st.pointerEvents = 'none';                     /* inherit #hud's no-clip */
    st.zIndex = '6'; st.opacity = '0.92';
    const ctx = cv.getContext('2d');
    if (!ctx) throw new Error('radar: 2d context unavailable');
    ctx.scale(dpr, dpr);                           /* once — all drawing in CSS px */
    this.canvas = cv;
    this.ctx = ctx;
    root.appendChild(cv);

    /* colour language (strings built ONCE; per-frame fillStyle writes are
       references into these arrays, never concatenation) */
    this._colors = [Radar.C_ROCK, Radar.C_VOL, Radar.C_HUNTER];
    this._pkColor = {
      shield: '#59d7ff', repair: '#6fe08a', ammoFlak: '#ff9a3e',
      ammoMissile: '#ff5a3e', buff: '#ffc24a', score: '#ffd76a',
      extraLife: '#ff7ae0'
    };

    /* blip buffer: stride 4 (x, y, colorIndex, cue); cue: 0 none,
       +1 above, -1 below. colorIndex >= 0 = fixed palette slot,
       < 0 = pickup, code = -colorIndex (pickup kind code below). */
    this.CAP = 512;
    this._buf = new Float64Array(this.CAP * 4);
    this._rot = new Float64Array(2);               /* _bearing scratch out */
    this._rotQ = new Float64Array(3);              /* _bearingQ scratch: right, fwd, local-y */
    this._q = { x: 0, y: 0, z: 0, w: 1 };          /* attitude snapshot (plain shape, no THREE) */
    this._pos = new Float64Array(2);               /* _scopePos scratch out */
    this.n = 0;
    this._pkNote = false;
    this._attQ = false;                            /* per-frame attitude latch (see update) */

    /* additive debug surface: __K.radar = { alive, blips } */
    __K.radar = { alive: true, blips: 0 };

    /* self-install: own rAF loop. Canvas-only repaint; skips nothing
       timing-wise that 90-game.js needs — the game loop is untouched. */
    this._raf = 0;
    this._last = (typeof performance !== 'undefined' && performance.now)
      ? performance.now() : 0;
    if (typeof requestAnimationFrame === 'function') {
      const self = this;
      this._frame = function () {
        self._raf = requestAnimationFrame(self._frame);
        const now = (typeof performance !== 'undefined' && performance.now)
          ? performance.now() : 0;
        let dt = (now - self._last) / 1000;
        self._last = now;
        if (!(dt > 0)) dt = 0; else if (dt > 0.1) dt = 0.1;
        self.update(dt);
      };
      this._raf = requestAnimationFrame(this._frame);
    }
  }

  /* Pure bearing rotation (documented convention; the update() loop runs
     the IDENTICAL math through the `out` scratch so it allocates nothing).
     dx, dz = world horizontal deltas; yawDeg = ship.yawDeg.
     STAGE-11b SIGN: the ship pose is euler.y = -yawDeg ('YXZ'), so the
     nose's horizontal heading is (sin(-yaw), cos(-yaw)) and the player-right
     axis is -X at yaw 0 (world +X projects SCREEN-LEFT behind the ship):
       fwd   = -dx*sin(yaw) + dz*cos(yaw)
       right = -(dx*cos(yaw) + dz*sin(yaw))
     out[0] = scope-right component, out[1] = scope-up (forward) component. */
  static _bearing(dx, dz, yawDeg, out) {
    const y = yawDeg * Math.PI / 180;              /* yaw wraps +-180: sin/cos need no special-casing */
    const s = Math.sin(y), c = Math.cos(y);
    const right = -(dx * c + dz * s);
    const fwd = -dx * s + dz * c;
    if (out) { out[0] = right; out[1] = fwd; return out; }
    return [right, fwd];
  }

  /* STAGE-12 cluster C: ATTITUDE-TRUE bearing for SPACE mode. In space the
     ship rolls/loops, so a yaw-only rotation lies: project the world delta
     onto the SHIP FRAME instead:
       d_local = d rotated by inverse(q)   (q = ship.attitude())
     The ship frame is nose = local +Z, right = local +X, up = local +Y.
     SCOPE LANGUAGE (identical to _bearing's, so a mid-run T-flip never
     jumps a blip): the scope mirrors the SCREEN, and behind the chase cam
     world +X projects SCREEN-LEFT (stage-11b ground truth; radar_harness
     T2 pins it) — that is exactly scope-right = -local.x. Scope-up
     (ahead) = local.z (= d . nose, true in pitch AND yaw — strictly more
     faithful than _bearing's yaw-only fwd). When out has room, out[2] =
     local.y: the ship-frame elevation feeding the space-mode chevron cue
     (rolled loops make world dy meaningless there). Pure component math,
     zero allocation; update() drives it through the _rotQ scratch.
     q is THREE.Quaternion-shaped {x,y,z,w} (normalized). Assist stays on
     _bearing (bit-identical bar). */
  static _bearingQ(dx, dy, dz, q, out) {
    /* conjugate = inverse for a unit quaternion */
    const qx = -q.x, qy = -q.y, qz = -q.z, qw = q.w;
    /* v' = (v * qconj) * q: three.js's applyQuaternion component form fed
       the CONJUGATE, i.e. the inverse rotation. (The implicit scalar part
       of a pure-vector sandwich is 0 — dropping it is exact.) */
    const vx = dx, vy = dy, vz = dz;
    const ix = qw * vx + qy * vz - qz * vy;
    const iy = qw * vy + qz * vx - qx * vz;
    const iz = qw * vz + qx * vy - qy * vx;
    const iw = -qx * vx - qy * vy - qz * vz;
    const lx = ix * qw + iw * -qx + iy * -qz - iz * -qy;
    const ly = iy * qw + iw * -qy + iz * -qx - ix * -qz;
    const lz = iz * qw + iw * -qz + ix * -qy - iy * -qx;
    const right = -lx;                              /* screen-truth: scope mirrors the view */
    const fwd = lz;                                 /* d . nose -> scope up */
    if (out) {
      out[0] = right; out[1] = fwd;
      if (out.length > 2) out[2] = ly;              /* ship-frame elevation for the cue */
      return out;
    }
    return [right, fwd];
  }

  /* Pure radial clamp. dx, dy = pre-scaled scope-plane offsets (already
     rotated by _bearing and multiplied by rim/range); rng = rim radius in
     px. Maps y to screen space (y negative = up) and clamps |r| <= rng. */
  static _scopePos(dx, dy, rng, out) {
    let x = dx, y = -dy;
    const m = Math.sqrt(x * x + y * y);
    if (m > rng && m > 0) { const k = rng / m; x *= k; y *= k; }
    if (out) { out[0] = x; out[1] = y; return out; }
    return [x, y];
  }

  /* one blip record (preallocated buffer; no allocation) */
  _blip(dx, dy, dz, colorIdx) {
    if (this.n >= this.CAP) return;
    /* STAGE-12 attitude-true scope: in SPACE mode the ship rolls/loops, so
       blips rotate with the FULL attitude (this._attQ is latched once per
       update() from ship.attitude(), defensively — a ship without
       attitude() (pre-merge stub, radar_harness game literal) falls back
       to the yaw path even if the mode says space; same safety idiom as
       30-camera.js). Assist stays on the untouched _bearing math. */
    let horiz, cueEl;
    if (this._attQ) {
      Radar._bearingQ(dx, dy, dz, this._q, this._rotQ);
      /* scope-plane horizontal = the rotated (right, fwd) magnitude; the
         vertical cue reads the SHIP FRAME local y (out slot 2) — a rolled
         90deg loop swaps world up/side, so world dy would lie there */
      horiz = Math.hypot(this._rotQ[0], this._rotQ[1]);
      cueEl = this._rotQ[2];
    } else {
      Radar._bearing(dx, dz, this.game.ship.yawDeg, this._rot);
      horiz = Math.sqrt(dx * dx + dz * dz);
      cueEl = dy;
    }
    const s = this.rim / this.range;               /* px per world unit */
    const rx = this._attQ ? this._rotQ[0] : this._rot[0];
    const ry = this._attQ ? this._rotQ[1] : this._rot[1];
    Radar._scopePos(rx * s, ry * s, this.rim, this._pos);
    const i4 = this.n * 4;
    this._buf[i4] = this._pos[0];
    this._buf[i4 + 1] = this._pos[1];
    this._buf[i4 + 2] = colorIdx;
    /* vertical cue: |elev| > 15% of horizontal distance (horizontal 0 with
       any |elev| is a straight-up/down target -> cue wins) */
    this._buf[i4 + 3] = (horiz < 1e-9 || Math.abs(cueEl) > horiz * 0.15)
      ? (cueEl > 0 ? 1 : -1) : 0;
    this.n++;
  }

  update(dt) {
    const ctx = this.ctx, cx = this.cx, cy = this.cy, rim = this.rim;
    ctx.clearRect(0, 0, this.size, this.size);

    /* --- scope chrome: ring + range ring + cross, repainted every frame -- */
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = Radar.C_CHROME;
    ctx.beginPath(); ctx.arc(cx, cy, rim, 0, Radar.TAU); ctx.stroke();
    ctx.lineWidth = 1;
    ctx.strokeStyle = Radar.C_RING2;
    ctx.beginPath(); ctx.arc(cx, cy, rim * 0.5, 0, Radar.TAU); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx - rim, cy); ctx.lineTo(cx + rim, cy);
    ctx.moveTo(cx, cy - rim); ctx.lineTo(cx, cy + rim);
    ctx.stroke();

    const playing = __K.state === 'PLAYING';
    this.n = 0;                                    /* in-place refill; no alloc */

    if (playing) {
      const game = this.game, ship = game.ship;

      /* STAGE-12 attitude latch (once per frame, NOT per blip): space mode
         draws the scope from the FULL ship attitude; assist (or a ship
         without attitude() — the pre-merge safety idiom from 30-camera.js)
         uses the yaw path. The snapshot lands in the plain-shape scratch
         _q so _blip never reaches into THREE mid-loop. */
      this._attQ = false;
      if (__K.TUNE.flightMode === 'space' && typeof ship.attitude === 'function') {
        const aq = ship.attitude();
        if (aq && Number.isFinite(aq.x) && Number.isFinite(aq.y) &&
            Number.isFinite(aq.z) && Number.isFinite(aq.w)) {
          const q = this._q;
          q.x = aq.x; q.y = aq.y; q.z = aq.z; q.w = aq.w;
          this._attQ = true;
        }
      }

      /* merged live registry: rebuilt IN PLACE each frame — iterate by
         index with bounds checks so identity churn can't run us off the
         end of a shrinking array */
      const targets = game.targets;
      if (targets) {
        const len = targets.length;
        for (let i = 0; i < len && this.n < this.CAP; i++) {
          const t = targets[i];
          if (!t || !t.position) continue;
          let code = 0;                            /* pale grey rock */
          if (t.kind === 'enemy') code = 2;        /* hunter red    */
          else if (t.volatile) code = 1;           /* volatile orange */
          this._blip(t.position.x - ship.position.x,
                     t.position.y - ship.position.y,
                     t.position.z - ship.position.z, code);
        }
      }

      /* pickups: own pool (never in game.targets). Defensive reach:
         game.pickups.pickups.live = Pool of {kind:'pickup', type, position}.
         If the shape isn't there, note ONCE and carry on without them. */
      if (game.pickups && game.pickups.pickups && game.pickups.pickups.live) {
        const pk = game.pickups.pickups.live;
        for (let i = 0; i < pk.length && this.n < this.CAP; i++) {
          const p = pk[i];
          if (!p || !p.alive || !p.position) continue;
          let neg = -Radar.PK_OTHER;               /* unknown type: white */
          for (let k = 0; k < Radar.PK_TYPES.length; k++) {
            if (p.type === Radar.PK_TYPES[k]) { neg = -(Radar.PK_BASE + k); break; }
          }
          this._blip(p.position.x - ship.position.x,
                     p.position.y - ship.position.y,
                     p.position.z - ship.position.z, neg);
        }
      } else if (game.pickups && !this._pkNote) {
        this._pkNote = true;
        __K.log('radar: pickups pool unreachable; drawing targets only');
      }

      /* ship pip at centre (scope is nose-up, so the ship is always here) */
      ctx.fillStyle = Radar.C_SHIP;
      ctx.beginPath(); ctx.arc(cx, cy, 2.5, 0, Radar.TAU); ctx.fill();
    }

    /* --- one reused ctx path loop over the blip buffer ------------------- */
    let drawn = 0;
    for (let i = 0; i < this.n; i++) {
      const i4 = i * 4;
      const sx = cx + this._buf[i4];
      const sy = cy + this._buf[i4 + 1];
      const code = this._buf[i4 + 2];
      const cue = this._buf[i4 + 3];
      const color = code >= 0 ? this._colors[code] : Radar.PK_COLORS[-code];
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(sx, sy, 2.2, 0, Radar.TAU); ctx.fill();
      if (cue !== 0) {                             /* elevation chevron */
        ctx.strokeStyle = cue > 0 ? Radar.C_UP : Radar.C_DOWN;
        ctx.lineWidth = 1.25;
        const dir = cue > 0 ? -1 : 1;              /* apex points away from centre-ish: up cue = ^ */
        ctx.beginPath();
        ctx.moveTo(sx - 3, sy + dir * 3.5);
        ctx.lineTo(sx, sy + dir * 7.5);
        ctx.lineTo(sx + 3, sy + dir * 3.5);
        ctx.stroke();
      }
      drawn++;
    }
    this.n = drawn;
    __K.radar.blips = drawn;
  }
}

/* palette + pickup colour language (built once at script load — matches
   65-pickup.js COLORS, its own file never edited) */
Radar.TAU = Math.PI * 2;
Radar.C_CHROME = 'rgba(143,163,184,0.65)';
Radar.C_RING2 = 'rgba(143,163,184,0.30)';
Radar.C_ROCK = '#8fa3b8';                          /* SPEC pale grey   */
Radar.C_VOL = '#ff7a2a';                           /* SPEC volatile    */
Radar.C_HUNTER = '#ff4b3e';                        /* SPEC hunter      */
Radar.C_SHIP = '#cfe3ff';
Radar.C_UP = '#ffd23e';                            /* above: warm      */
Radar.C_DOWN = '#5a86c9';                          /* below: cool      */
Radar.PK_TYPES = ['shield', 'repair', 'ammoFlak', 'ammoMissile', 'buff', 'score', 'extraLife'];
Radar.PK_BASE = 3;                                 /* negative code = -(3 + type index) */
/* indexed so PK_COLORS[PK_BASE + typeIndex] is the type's colour (slots 0..2
   stay empty — positive codes go through this._colors instead) */
Radar.PK_COLORS = ['', '', '', '#59d7ff', '#6fe08a', '#ff9a3e', '#ff5a3e', '#ffc24a', '#ffd76a', '#ff7ae0'];
Radar.PK_OTHER = 10;                               /* unknown type -> white slot */
Radar.PK_COLORS[Radar.PK_OTHER] = '#ffffff';

/* ==== 78-threats.js ==== */
/* Directional combat read-model. Hit sources are copied at accepted impact;
   approaching hostile bolts use relative velocity, never camera position. */
class ThreatFeedback {
  constructor(game) {
    this.game = game;
    this.hitPoint = { x: 0, y: 0, z: 0 };
    this.hitTime = 0;
    this.incomingPoint = null;
    this.snapshot = __K.threat = { hit: false, incoming: false, impactIn: 0 };
  }

  recordHit(source) {
    if (!source || !Number.isFinite(source.x) || !Number.isFinite(source.y) || !Number.isFinite(source.z)) return;
    this.hitPoint.x = source.x; this.hitPoint.y = source.y; this.hitPoint.z = source.z;
    this.hitTime = __K.TUNE.threats.hitSec;
  }

  clear() {
    this.hitTime = 0;
    this.incomingPoint = null;
    this.snapshot.hit = this.snapshot.incoming = false;
    this.snapshot.impactIn = 0;
  }

  static impactTime(bolt, ship) {
    if (!bolt || !bolt.pos || !bolt.vel || !ship || !ship.velocity) return Infinity;
    const px = bolt.pos.x - ship.position.x, py = bolt.pos.y - ship.position.y, pz = bolt.pos.z - ship.position.z;
    const vx = bolt.vel.x - ship.velocity.x, vy = bolt.vel.y - ship.velocity.y, vz = bolt.vel.z - ship.velocity.z;
    const vv = vx*vx + vy*vy + vz*vz;
    if (!(vv > 1e-9)) return Infinity;
    const t = -(px*vx + py*vy + pz*vz) / vv;
    if (!(t > 0) || t > __K.TUNE.threats.lookAheadSec || t > bolt.ttl) return Infinity;
    const x = px + vx*t, y = py + vy*t, z = pz + vz*t;
    const r = ship.radius + (bolt.hitR || 0) + __K.TUNE.threats.nearMargin;
    return x*x + y*y + z*z <= r*r ? t : Infinity;
  }

  static bearing(source, origin, camera, out) {
    out.visible = false;
    if (!source || !origin || !camera || !camera.quaternion) return out;
    const x = source.x-origin.x, y = source.y-origin.y, z = source.z-origin.z;
    const dist = Math.hypot(x,y,z);
    if (!(dist > 1e-6) || !Number.isFinite(dist)) return out;
    const q = camera.quaternion, qx = -q.x, qy = -q.y, qz = -q.z, qw = q.w;
    const ix = qw*x + qy*z - qz*y, iy = qw*y + qz*x - qx*z;
    const iz = qw*z + qx*y - qy*x, iw = -qx*x - qy*y - qz*z;
    let dx = ix*qw + iw*-qx + iy*-qz - iz*-qy;
    let dy = -(iy*qw + iw*-qy + iz*-qx - ix*-qz);
    const dz = iz*qw + iw*-qz + ix*-qy - iy*-qx;
    const behind = dz >= 0;
    if (Math.hypot(dx,dy) < dist*0.01) { dx = 0; dy = behind ? 1 : -1; }
    const len = Math.hypot(dx,dy);
    out.visible = true; out.x = dx/len; out.y = dy/len; out.behind = behind;
    out.angle = Math.round(Math.atan2(dy,dx)*180/Math.PI + 90);
    return out;
  }

  update(dt) {
    const g = this.game, ship = g.ship;
    if (__K.state !== 'PLAYING' || !ship || !ship.group.visible) { this.clear(); return; }
    this.hitTime = Math.max(0, this.hitTime-dt);
    this.incomingPoint = null;
    let soonest = Infinity;
    const bolts = g.projectiles ? g.projectiles.bolts.live : [];
    for (let i=0; i<bolts.length; i++) {
      const b = bolts[i];
      if (!b.owner || b.owner === ship || b.kind !== 'bolt') continue;
      const t = ThreatFeedback.impactTime(b,ship);
      if (t < soonest) { soonest = t; this.incomingPoint = b.pos; }
    }
    this.snapshot.hit = this.hitTime > 0;
    this.snapshot.incoming = !!this.incomingPoint;
    this.snapshot.impactIn = Number.isFinite(soonest) ? soonest : 0;
  }
}

/* ==== 79-vectors.js ==== */
/* ===== SECTION: VelocityVectors — contact relative-motion indicators ===== */
/* Contract: docs/VELOCITY_VECTORS.md (shipped projection, display-slot
   retention and lifecycle rules).
   A full-viewport 2D canvas (own #vectors-canvas element, appended to the
   HUD ROOT as a sibling of E.play — never a child of the display-swapped
   screens) drawing one stroke per qualifying contact: anchored at the
   contact's RENDERED projection, pointing where that image moves under the
   contact's SHIP-RELATIVE velocity (v_contact − v_ship) with the camera held
   fixed. Plus the locked contact's `REL <n>` numeric readout (a canvas
   fillText near the locked anchor / bracket edge).
   CONVENTIONS:
   - Touches NO THREE object at all (node-testable; the camera math runs on
     plain scalar quaternion components — three.js's applyQuaternion
     component form, exactly how 77-radar.js _bearingQ does it).
   - Camera frame: x right, y up, forward = −z (three.js convention).
       P = invCamQuat·(t.position − camera.position)   (anchor, camera frame)
       V = invCamQuat·(t.vel − ship.velocity)          (ship-relative velocity)
       D = −P.z,  f = halfH/tan(fov/2),  Ddot = −V.z
       sx = halfW + f·P.x/D,   sy = halfH − f·P.y/D    (screen y DOWN, CSS px)
       svx =  f·(V.x·D − P.x·Ddot)/D²                  (CSS px/s)
       svy = −f·(V.y·D − P.y·Ddot)/D²                  (+ = screen down)
     paint passes the viewport HALF-HEIGHT under the name `f` (the harness
     load guard pins that call shape); the static derives the true focal
     internally — a pre-divided focal would divide by tan(fov/2) TWICE,
     invisible at the fixtures' fov 90 (tan 45° = 1), wrong across the game's
     34–84° zoom range. Inside the paint body the true focal lives as `focal`.
   - Visibility is decided by POSITION only (D ≤ minForward, or the anchor's
     projection leaves the finite viewport bounds — the _paintSeeker test).
     No velocity-sign test exists.
   - NO per-frame allocation: scratch temporaries + preallocated per-frame
     record array (_rec) + a fixed-capacity display-slot ledger (exactly
     maxArrows rows; seats and ghosts share them, no growth, no eviction —
     spec rev. 5 table cap ≤ 2×maxArrows is satisfied by maxArrows rows).
     Nothing inside the paint / screenVelocity / arrow bodies is a `new`, an
     arrow fn, a spread, or a copy method (test 14 greps for it, comments
     included; comments here never open a line with one of those names).
     Arrow geometry is inlined in the stroke loop (paint reads only
     record/scratch scalars); the pinned pure static arrow below is its
     exact geometric contract.
   - Repainted from the game loop (90-game.js calls the paint right after
     hud.update(dt)); NO own rAF loop (unlike the radar).
   - Screen gating lives INSIDE paint: __K.state === 'PLAYING',
     game.hud._screen === 'play', ship.group.visible — the same gates
     _paintFlight honors. Pause/title/upgrades/death-fade draw nothing
     BEFORE the clear (T13: those screens see zero canvas ops); pause entry
     / resetRun hard-clear the ledger via reset (90-game.js).
   - ?vectors=0 disables the whole layer (spec §8 A/B switch on the SAME
     build: with OFF no canvas element is even created).
   - Reads TUNE.vectors defensively (seeded in 05-core.js; never written
     here). Publishes __K.vectors = POD scalars ONLY — never live objects
     (the "Object reference chain is too long" probe lesson). */
class VelocityVectors {
  constructor(game) {
    this.game = game;
    const T = __K.TUNE.vectors || {};
    this.minForward = (typeof T.minForward === 'number') ? T.minForward : 1.0;
    this.pxPerSec = (typeof T.pxPerSec === 'number') ? T.pxPerSec : 0.5;
    this.minLen = (typeof T.minLen === 'number') ? T.minLen : 8;
    this.maxLen = (typeof T.maxLen === 'number') ? T.maxLen : 48;
    this.minScreenPx = (typeof T.minScreenPx === 'number') ? T.minScreenPx : 8;
    this.fadeDist = (typeof T.fadeDist === 'number') ? T.fadeDist : 280;
    this.fadeTail = (typeof T.fadeTail === 'number') ? T.fadeTail : 0.7;
    this.maxArrows = (typeof T.maxArrows === 'number') ? T.maxArrows : 8;
    this.holdSec = (typeof T.holdSec === 'number') ? T.holdSec : 0.5;
    this.preemptFactor = (typeof T.preemptFactor === 'number') ? T.preemptFactor : 1.25;
    this.headDeg = (typeof T.headDeg === 'number') ? T.headDeg : 55;
    this.headMin = (typeof T.headMin === 'number') ? T.headMin : 4;
    this.alphaOpen = (typeof T.alphaOpen === 'number') ? T.alphaOpen : 0.35;
    this.alphaClosing = (typeof T.alphaClosing === 'number') ? T.alphaClosing : 0.95;
    this.readout = T.readout !== false;
    this.lockedColor = T.lockedColor || '#ffd27a';
    this.closingColor = T.closingColor || '#ffb45e';
    this.openingColor = T.openingColor || '#7f9cb8';
    this.readoutClosingColor = T.readoutClosingColor || '#59d7ff';
    this.readoutOpeningColor = T.readoutOpeningColor || '#ff7ae0';

    /* A/B query switch (spec §8): ?vectors=0 leaves the layer fully dark —
       ON vs OFF differ by nothing but this branch, so the WebKit A/B
       measures the same build. Anything else (or a throwing location) = ON. */
    this.enabled = true;
    try {
      if (typeof window !== 'undefined' && window.location && window.location.search) {
        if (new URLSearchParams(window.location.search).get('vectors') === '0') this.enabled = false;
      }
    } catch (e) { this.enabled = true; }

    /* ---- display-slot ledger (spec rev. 5 §5): exactly maxArrows ROWS,
       preallocated ONCE. Seats and ghosts share the same rows — demotion
       converts a row in place (state 1 → 2), never additive, so the ledger
       can never exceed maxArrows (the round-5 churn blowup "16 protected
       claims / 8 slots" is unrepresentable by construction). The spec's
       table cap ≤ 2×maxArrows is satisfied with room to spare; expired
       ghosts release immediately at the top of every frame (expiry is
       total), so a separate evict step is unnecessary.
       Rows are keyed (obj, _gen) — object identity alone is UNSAFE: Pool
       recycles the same reference (release → obtain returns the identical
       object), so a destroyed contact's retained rank could wear a
       newborn's face. A row is invalid the instant obj.alive !== true,
       obj._gen drifted from the stored generation, or obj left
       game.targets — covering release, same-frame re-obtain and swap-remove
       alike; Pool.clear() never rewinds generations, so a drained/refilled
       pool can never alias an old key.
       Row states (one clock per row, _rHold — never per record):
         0 empty
         1 SEAT  — inside the top-maxArrows ranked selection (clock parked)
         2 GHOST — a contact pushed out of the ranked selection keeps the
                   row it owned, flipped 1 → 2 with the grace stamped dt on
                   the demote paint (the leave paint IS the first held
                   frame); ages every paint — drawn through retention or
                   not, NEVER renewed — releases strictly past holdSec, and
                   converts BACK to a seat (clock cleared) if the contact
                   re-enters the ranked selection before expiry (rev. 5
                   re-entry rule: a later demotion stamps a fresh grace).
       The locked contact is rank 0 OUTSIDE both ledgers: it never ranks,
       never fills, and any row it happened to own is released instantly —
       its own arrow draws by the §5 locked regime, up to maxArrows+1 total
       strokes. (Held interpretation of "outside both ledgers": the locked
       contact may not hold a ledger hostage — its stale seat would
       otherwise starve a fillable row.) */
    this.CAP = this.maxArrows;                 /* display rows; spec cap ≤ 2×maxArrows */
    this._rObj = new Array(this.CAP).fill(null);
    this._rGen = new Float64Array(this.CAP);
    this._rClose = new Float64Array(this.CAP); /* live SIGNED closing (bar + ghost sign) */
    this._rHold = new Float64Array(this.CAP);  /* s since leaving ranked selection */
    this._rState = new Uint8Array(this.CAP);

    /* ---- per-frame records (display-only copies of the scalars paint
       needs; rebuilt in place every frame — obj pointers are refreshed,
       never trusted across frames). Cap covers every contact the sim can
       show at once + slack (SPEC "no per-frame allocation": reused like
       HUD._aimV); never grows. ---- */
    this.RCAP = (__K.TUNE.rocks.cap || 70) + (__K.TUNE.enemies.cap || 8) + 16;
    this._rec = new Array(this.RCAP);
    for (let i = 0; i < this.RCAP; i++) {
      this._rec[i] = {
        obj: null, gen: 0,        /* identity this frame (gen-stamped)    */
        closing: 0, dist: 0,      /* ship-frame gap math (§4)             */
        vis: false, moving: false,/* gate 1 / gate 2                      */
        svx: 0, svy: 0, svMag: 0, /* screen velocity, screen px/s (svy += up) */
        x: 0, y: 0,               /* anchor px (canvas y DOWN); arrow reads {x,y} */
        dx: 0, dy: 0,             /* arrow dir, canvas px (= svx, svy)   */
        D: 0,                     /* camera depth (tail-offset basis, §4) */
        radius: 6, relSpeed: 0,
        draw: false,
        slot: -1,                 /* ledger row re-bound every paint: pass 2
                                     re-binds valid rows' records; demotion
                                     keeps the same row, a preempt/expiry/
                                     lock-release unbinds it — the grace
                                     clock is ROW-level (_rHold)          */
      };
    }
    this._ordA = new Int32Array(this.RCAP);    /* rank-order draw scan A   */
    this._ordB = new Int32Array(this.RCAP);    /* rank-order draw scan B   */
    /* scratch views are PER-INSTANCE arrays (a module shared across two
       instances — game + inert-stub probe — must never clobber the other's
       selection state; paint allocates NOTHING, so fixed arrays only) */
    this._drawAll = new Int32Array(this.RCAP + 1); /* locked-first stroke order (the
        locked arrow sits OUTSIDE maxArrows — spec §5: up to 9 strokes)    */
    this._painted = false;                     /* canvas holds pixels from a painted frame — gates closing after painting clear ONCE, then draw nothing until repaint (death-fade / quit-to-title leave no stale arrows over the report/title art) */

    /* scratch — allocated exactly ONCE here, reused forever (this._aimV idiom) */
    this._dP = new Float64Array(6);            /* P.xyz, V.xyz (camera frame) */
    this._pObj = { x: 0, y: 0, z: 0 };         /* screenVelocity P/V wrappers: plain-object scratch bound to the pinned math's shape; written every frame, never constructed per frame */
    this._vObj = { x: 0, y: 0, z: 0 };
    this._sv = { svx: 0, svy: 0, D: 0, Ddot: 0 };
    this._ar = { tx: 0, ty: 0, hx: 0, hy: 0, len: 0, ux: 0, uy: 0, k1x: 0, k1y: 0, k2x: 0, k2y: 0, heads: false, drawn: false };
    this._q = { x: 0, y: 0, z: 0, w: 1 };      /* camera quaternion snapshot */
    /* rgba() strings (Phase E): the stroke alphas all ride the fixed
       0.05-quantised ladder (alphaOpen/alphaClosing plus the fade taper —
       worst-case 21 levels), so every string on that ladder for every
       configured color is built ONCE here at construction. _alphaStr is
       then reference-only on the hot path: two string compares, one array
       index, zero concat. An off-config color or a non-ladder alpha (a
       console poke) still works through a one-off fallback — never hit by
       paint's own math. */
    this._ladder = {};
    for (const hex of [this.openingColor, this.closingColor, this.lockedColor]) {
      const h = String(hex).replace('#', '');
      const r = parseInt(h.substring(0, 2), 16) || 0;
      const g = parseInt(h.substring(2, 4), 16) || 0;
      const b = parseInt(h.substring(4, 6), 16) || 0;
      const arr = new Array(21);
      for (let i = 0; i <= 20; i++) {
        // boundaries spell '0'/'1' exactly like _alphaStr's quantiser —
        // strokeStyle strings stay byte-identical to the pre-E cache
        const k = i === 0 ? '0' : (i === 20 ? '1' : (i / 20).toFixed(2));
        arr[i] = 'rgba(' + r + ',' + g + ',' + b + ',' + k + ')';
      }
      this._ladder[hex] = arr;
    }
    this._aKey = ['', ''];                     /* last (hex, alphaKey) fast path */
    this._aStr = '';
    this._rgbCache = {};                       /* off-ladder colors only (fallback path) */
    this._readoutFont = '11px ui-monospace, SFMono-Regular, Menlo, monospace';
    this._lockedDebug = { relSpeed: 0, closing: 0, svx: 0, svy: 0, shown: false };

    /* additive debug surface: POD scalars ONLY (never live objects) */
    __K.vectors = { alive: true, count: 0, retained: 0, locked: null };

    if (!this.enabled) return;                 /* A/B OFF: dark layer; paint takes the clear-only fast path */

    const root = document.getElementById('hud');
    if (!root) throw new Error('vectors: #hud root missing');
    const dprRaw = (typeof devicePixelRatio === 'number' && devicePixelRatio) || 1;
    const dpr = dprRaw > 2 ? 2 : dprRaw;       /* spec §3: DPR clamped ≤ 2 */
    /* viewport metrics = the #hud element box (the canvas fills it 100%),
       with a window fallback for harnesses (no layout there — the screen
       projection itself is pure math, so the fallback is sound). Harness
       fixtures are pinned at halfH = 450 (viewport 900, fov 90 → focal 450;
       clampNum floor 450 is INACTIVE at 900 — 450 is only a small-window floor). */
    const W0 = (typeof window !== 'undefined' && window.innerWidth > 0) ? window.innerWidth : 1;
    const H0 = (typeof window !== 'undefined' && window.innerHeight > 0) ? window.innerHeight : 1;
    const cv = document.createElement('canvas');
    cv.id = 'vectors-canvas';                  /* own element, never a #hud/E.play child */
    cv.width = Math.round(W0 * dpr);
    cv.height = Math.round(H0 * dpr);
    const st = cv.style;
    /* shell.html's GLOBAL `canvas { position:fixed; inset:0 }` rule already
       frames the viewport; the inline set below restates the spec's §3
       framing explicitly: absolute inside #hud (itself inset:0), full-size,
       click-through. */
    st.position = 'absolute'; st.inset = '0';
    st.left = '0'; st.top = '0'; st.transform = '';
    st.width = '100%'; st.height = '100%';
    st.pointerEvents = 'none';
    st.zIndex = '4';                           /* above #play content, below the radar scope (6) */
    const ctx = cv.getContext('2d');
    if (!ctx) throw new Error('vectors: 2d context unavailable');
    ctx.scale(dpr, dpr);                       /* once — every draw is in CSS px */
    this.canvas = cv;
    this.ctx = ctx;
    this._dpr = dpr;
    this._cssW = W0; this._cssH = H0;          /* integer-compare resize check — no resize listener (§3) */
    root.appendChild(cv);                      /* HUD ROOT sibling of E.play */
  }

  /* ---- THE pinned math (spec §4). Pure static — harnesses pin it against
     finite differences with camera-frame inputs; project() is NEVER
     stubbed. P/V are {x,y,z} camera-frame vectors (forward = −z, so
     D = −P.z). out (caller scratch) is {svx, svy, D, Ddot}; svx/svy are
     CSS px/s in SCREEN axes (x right, y UP-on-world — the minus sign on
     svy is what makes positive P.y project ABOVE center). The 4th arg is
     the VIEWPORT HALF-HEIGHT in CSS px; the focal f is derived here
     (harness load guard pins paint's call as 'cam.fov, f, svOut' with the
     caller's f = halfH). Degenerate inputs (anchor behind the camera
     plane, bad fov) leave svx/svy 0 with D/Ddot still reported. A fresh
     out object is created ONLY when the caller passed none (the harness
     convenience path); paint always passes scratch. ---- */
  static screenVelocity(P, V, fovDeg, halfH, out) {
    const D = -P.z;
    const Ddot = -V.z;
    if (!out) out = { svx: 0, svy: 0, D: D, Ddot: Ddot };
    else { out.svx = 0; out.svy = 0; out.D = D; out.Ddot = Ddot; }
    if (!(D > 0) || !(halfH > 0) || !(fovDeg > 0) || !Number.isFinite(fovDeg)) return out;
    const f = halfH / Math.tan((fovDeg * Math.PI / 180) * 0.5);
    if (!Number.isFinite(f)) return out;
    const D2 = D * D;
    out.svx = f * (V.x * D - P.x * Ddot) / D2;
    out.svy = -f * (V.y * D - P.y * Ddot) / D2;
    return out;
  }

  /* ---- arrow geometry (spec §2/§7): one stroke's pure px geometry.
     anchor/dir are {x,y} in CANVAS space (y down); dir need not be unit.
     lenPx clamped [minLen, maxLen]. Tail starts radiusPx + 2 outside the
     anchor along dir and lands exactly on the silhouette circle — the
     tail is NEVER inside radiusPx. Head: two ticks at ±headDeg off the
     shaft, present only when len ≥ 2·headMin (§2). out (built ONCE by the
     caller): tx,ty tail · hx,hy tip · len · ux,uy unit dir · k1x,k1y /
     k2x,k2y tick unit directions (tip→barb) · heads latch. A fresh out
     object only on the harness convenience path where out is omitted.
     ZERO allocation on the scratch path. paint inlines this identical
     math (keeping allocation out of its body entirely, test 14); this
     static is the geometric contract the harness pins directly. ---- */
  static arrow(anchor, dir, lenPx, radiusPx, out, headDeg, headMin, minLen, maxLen) {
    headDeg = (typeof headDeg === 'number') ? headDeg : 55;
    headMin = (typeof headMin === 'number') ? headMin : 4;
    minLen = (typeof minLen === 'number') ? minLen : 8;
    maxLen = (typeof maxLen === 'number') ? maxLen : 48;
    const rad = (typeof radiusPx === 'number') ? radiusPx : 0;
    let ux = dir.x, uy = dir.y;
    const m = Math.hypot(ux, uy);
    if (!(m > 0) || !Number.isFinite(m)) { ux = 0; uy = 0; }
    else { ux /= m; uy /= m; }
    if (!out) out = { tx: 0, ty: 0, hx: 0, hy: 0, len: 0, ux: 0, uy: 0, k1x: 0, k1y: 0, k2x: 0, k2y: 0, heads: false };
    out.len = clampNum(lenPx, minLen, maxLen);
    out.ux = ux; out.uy = uy;
    out.tx = anchor.x + ux * (rad + 2);
    out.ty = anchor.y + uy * (rad + 2);
    out.hx = out.tx + ux * out.len;
    out.hy = out.ty + uy * out.len;
    /* head ticks need room on the SHAFT: len ≥ 2·headMin (spec §2/§9.7).
       Parity note (rev. 6 review): the paint loop gates barbs on the same
       lenPx ≥ 2·headMin — the tail's radius offset shifts where the shaft
       STARTS but never shortens it, so the static must not subtract the
       offset here (an old −(rad+2) made radius-24 fixtures diverge: static
       silent, paint drew barbs). */
    out.heads = out.len >= 2 * headMin;
    /* barbs point back from the tip: incoming shaft direction (−u) rotated
       by ±headDeg (u=(0,1) "up", 55° → (∓sin55, −cos55)) */
    const a = headDeg * Math.PI / 180, c = Math.cos(a), s = Math.sin(a);
    out.k1x = -ux * c + uy * s; out.k1y = -ux * s - uy * c;
    out.k2x = -ux * c - uy * s; out.k2y =  ux * s - uy * c;
    return out;
  }

  /* world delta → camera frame with the CONJUGATE quaternion (three.js
     applyQuaternion component form — the identical math 77-radar.js
     _bearingQ uses). Writes o[off..off+2]; zero allocation. */
  _toCam(wx, wy, wz, o, off) {
    const q = this._q;
    const qx = -q.x, qy = -q.y, qz = -q.z, qw = q.w;
    const ix = qw * wx + qy * wz - qz * wy;
    const iy = qw * wy + qz * wx - qx * wz;
    const iz = qw * wz + qx * wy - qy * wx;
    const iw = -qx * wx - qy * wy - qz * wz;
    o[off] = ix * qw + iw * -qx + iy * -qz - iz * -qy;
    o[off + 1] = iy * qw + iw * -qy + iz * -qx - ix * -qz;
    o[off + 2] = iz * qw + iw * -qz + ix * -qy - iy * -qx;
  }

  /* rgba() string, lookup-only on the hot path (Phase E): ladder[i] holds
     every quantised alpha string for every configured color, built once at
     construction. Ladder membership is decided by the SAME quantisation
     the old cache used (≤0.025 → 0, ≥0.975 → 1, else round(α·20)/20), so
     strokeStyle assignments are byte-identical to the pre-E behaviour.
     Anything off-ladder (a console poke with an off-config color) builds a
     one-off string through the last-key cache — correctness without ever
     touching the hot path. */
  _alphaStr(hex, alpha) {
    const ladder = this._ladder[hex];
    if (ladder) {
      const s = ladder[alpha <= 0.025 ? 0 : (alpha >= 0.975 ? 20 : Math.round(alpha * 20))];
      if (s !== undefined) return s;
    }
    const key = alpha <= 0.025 ? '0' : (alpha >= 0.975 ? '1'
      : (Math.round(alpha * 20) / 20).toFixed(2));
    if (this._aKey[0] === hex && this._aKey[1] === key) return this._aStr;
    let rgb = this._ladder[hex + '#rgb'];
    if (!rgb) {
      const h = String(hex).replace('#', '');
      rgb = this._ladder[hex + '#rgb'] = [parseInt(h.substring(0, 2), 16) || 0,
        parseInt(h.substring(2, 4), 16) || 0,
        parseInt(h.substring(4, 6), 16) || 0];
    }
    this._aKey[0] = hex; this._aKey[1] = key;
    this._aStr = 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',' + key + ')';
    return this._aStr;
  }

  /* ledger row keyed exactly to (obj, gen) — any state — or -1 */
  _slotFor(obj, gen) {
    const ro = this._rObj, rg = this._rGen, rs = this._rState;
    for (let k = 0; k < this.CAP; k++)
      if (rs[k] !== 0 && ro[k] === obj && rg[k] === gen) return k;
    return -1;
  }

  /* first empty row (CAP = maxArrows ≤ 8, trivial scan), or -1 */
  _freeSlot() {
    const rs = this._rState;
    for (let k = 0; k < this.CAP; k++) if (rs[k] === 0) return k;
    return -1;
  }

  /* record index keyed to (obj, gen) among this paint's built records,
     or -1. Built records are ONLY the visible, in-range, alive contacts
     (pass 1), so a record hit IS the liveness proof the ledger checks
     each frame. n-wide scan ≤ RCAP, allocation-free. */
  _recordOf(obj, gen, rec, n) {
    for (let i = 0; i < n; i++)
      if (rec[i].obj === obj && rec[i].gen === gen) return i;
    return -1;
  }

  /* release one row (seat or ghost): empties it and unbinds the holder's
     record so a stale .slot can never wear another state at draw time. */
  _releaseSlot(k, rec, n) {
    const v = this._recordOf(this._rObj[k], this._rGen[k], rec, n);
    if (v >= 0) rec[v].slot = -1;
    this._rState[k] = 0; this._rObj[k] = null; this._rHold[k] = 0;
  }

  /* --- the one entry point (90-game.js calls this every frame right after
     hud.update(dt); spec rev. 5 §5). Normative frame order:
     invalidate/expire → rank → demote current display-slot owners →
     preempt ghosts → fill free slots → draw. Fully allocation-free. --- */
  paint(dt) {
    const dbg = __K.vectors;
    const g = this.game;
    const hud = g.hud, ship = g.ship;

    /* gate 5 (+ the construction kill switches): __K.state, HUD screen,
       ship visibility — the EXACT _paintFlight gates. A/B OFF or an inert
       layer draws nothing at all; a non-play screen sees not even the
       clear (T13 pins zero canvas ops on pause/title screens). */
    if (!this.enabled || !this.ctx ||
        __K.state !== 'PLAYING' || !hud || hud._screen !== 'play' ||
        !ship || !ship.group || !ship.group.visible) {
      /* F2: a screen that NEVER painted sees not even the clear (T13);
         a screen LEAVING painted frames gets exactly ONE clearRect on the
         transition frame, then zero canvas ops until a repaint re-arms
         the latch. */
      if (this._painted) {
        if (this._cssW > 0) this.ctx.clearRect(0, 0, this._cssW, this._cssH);
        this._painted = false;
      }
      dbg.count = 0; dbg.retained = 0; dbg.locked = null;
      return;
    }

    /* resize: cheap integer compare, backing store resized ONLY on change
       (§3 — no resize listener). */
    const W = window.innerWidth, Hraw = window.innerHeight;
    const H = (Hraw > 0) ? Hraw : 1;
    if ((W | 0) !== (this._cssW | 0) || (H | 0) !== (this._cssH | 0)) {
      this._cssW = W; this._cssH = H;
      this.canvas.width = Math.round(W * this._dpr);
      this.canvas.height = Math.round(H * this._dpr);
      this.ctx.scale(this._dpr, this._dpr);    /* CSS-px drawing space survives the store resize */
    }
    const ctx = this.ctx;
    ctx.clearRect(0, 0, W, H);                 /* viewport clear every painted frame */
    this._painted = true;                      /* re-arm the stale-pixel latch */

    const cam = g.camera;
    if (!cam || !cam.quaternion || !cam.position ||
        !Number.isFinite(cam.fov) || cam.fov <= 0) {
      dbg.count = 0; dbg.retained = 0; dbg.locked = null;
      return;
    }
    const cq = cam.quaternion;
    this._q.x = cq.x; this._q.y = cq.y; this._q.z = cq.z; this._q.w = cq.w;

    const halfW = W * 0.5, halfH = H * 0.5;
    /* f = viewport half-height in CSS px — the screenVelocity arg the
       harness guards pin by NAME ('cam.fov, f, svOut'); the static derives
       the focal internally. focal = world→px focal at unit depth, used for
       every projection / tail-offset pixel here. */
    const f = halfH;
    const focal = halfH / Math.tan((cam.fov * Math.PI / 180) * 0.5);
    const cp = cam.position, sp = ship.position, svel = ship.velocity;
    const spx = sp.x, spy = sp.y, spz = sp.z;
    const wsvx = svel ? svel.x : 0, wsvy = svel ? svel.y : 0, wsvz = svel ? svel.z : 0;
    const lock = g.aimTarget || null;
    const dP = this._dP, pO = this._pObj, vO = this._vObj, svOut = this._sv;
    const rec = this._rec, RCAP = this.RCAP;
    const targets = g.targets;
    const len = targets ? targets.length : 0;

    /* ---- pass 1: gates 1-4 per contact → display-only record (spec §5).
       NOTHING is drawn yet; visibility reads POSITION only. ---- */
    let n = 0;
    for (let i = 0; i < len && n < RCAP; i++) {
      const t = targets[i];
      /* gate 4: alive + complete — hp > 0, .vel and .position present
         (_aimPick's defensive skip; rocks AND hunters both carry .vel) */
      if (!t || !t.position || !t.vel || !(t.hp > 0)) continue;
      const tp = t.position, tv = t.vel;
      /* ship-frame gap math (§4): closing is NOT camera-derived — a
         property of ship-vs-contact geometry, not of where the chase
         camera happens to be. On-axis at the origin this is closing = +vz
         (the harness convention); at g=(50,0,z) fixtures it is −vz·z/gap. */
      const gpx = tp.x - spx, gpy = tp.y - spy, gpz = tp.z - spz;
      const dvx = tv.x - wsvx, dvy = tv.y - wsvy, dvz = tv.z - wsvz;
      const gap = Math.sqrt(gpx * gpx + gpy * gpy + gpz * gpz);
      const closing = -(dvx * gpx + dvy * gpy + dvz * gpz) / Math.max(1e-9, gap);
      /* anchor P + ship-relative velocity V into the camera frame */
      this._toCam(tp.x - cp.x, tp.y - cp.y, tp.z - cp.z, dP, 0);
      this._toCam(dvx, dvy, dvz, dP, 3);
      const Px = dP[0], Py = dP[1], Pz = dP[2];
      const D = -Pz;
      /* gate 1: depth plane (POSITION only — the velocity's camera-space
         sign carries NO visibility information: a visible contact closing
         dead-ahead has V.z > 0 and an invisible one behind the camera
         receding has V.z < 0) + gate 3 distance */
      if (!(D > this.minForward && focal > 0)) continue;
      /* F4 (review C1, spec §5.6): gate 3 (fadeDist) bars NON-locked
         arrows. The locked readout obeys the liveness/state gates but NO
         display thresholds — so the locked contact's record is built at ANY
         distance passing gates 1/4/5 and the NUMBER survives past fadeDist;
         its SHAFT stays gate-3-barred (decided at draw time). A locked
         contact never enters the ledger (rank 0, outside both ledgers), so
         a beyond-fadeDist record can only ever render the readout. */
      if (gap > this.fadeDist && t !== lock) continue;
      const sx = halfW + focal * Px / D;
      const sy = halfH - focal * Py / D;
      /* screen velocity = the perspective derivative of the anchor
         projection (§4). Computed whenever the anchor sits in front so the
         record's magnitude is always honest. */
      let svx = 0, svy = 0;
      if (D > 0) {
        pO.x = Px; pO.y = Py; pO.z = Pz;
        vO.x = dP[3]; vO.y = dP[4]; vO.z = dP[5];
        VelocityVectors.screenVelocity(pO, vO, cam.fov, f, svOut);
        svx = svOut.svx; svy = svOut.svy;
      }
      const svMag = Math.sqrt(svx * svx + svy * svy);
      const r = rec[n];
      r.obj = t; r.gen = t._gen || 0;
      r.closing = closing; r.dist = gap;
      r.vis = Number.isFinite(sx) && Number.isFinite(sy) &&
        sx >= 0 && sx <= W && sy >= 0 && sy <= H;
      /* gate 2: moving on screen (DECIDED, not hysteresis — §5: a contact
         BELOW the threshold keeps whatever rank it already owns and draws
         nothing (I3); a NEW entrant must pass it to rank at all (I2). The
         zero-direction regime NEVER produces an arrow. */
      r.moving = svMag >= this.minScreenPx;
      r.svx = svx; r.svy = svy; r.svMag = svMag;
      /* gate 1b: a contact behind the camera projects to a FINITE point
         (the finite-bounds test passes) but its arrow would point away
         from any real motion — the geometry would misclamp it. Cull at
         record time, like gates 1/3; the ledger never sees it either. */
      if (!r.vis) continue;
      r.x = sx; r.y = sy;
      /* §4: svy IS d(canvas sy)/dt — canvas y runs DOWN, so the arrow
         direction in canvas space is (svx, svy) verbatim. Negating svy
         (an earlier revision did) mirrors every vertical arrow: a contact
         climbing on screen would draw pointing down. The static's own
         §4 worked example pins the sign: P=(10,20,−100), V=(0,0,10),
         f=100 → sy shrinks 20→−27.78 px upward → svy = −2.2 < 0 = up. */
      r.dx = svx; r.dy = svy;
      r.D = D; r.radius = (typeof t.radius === "number") ? t.radius : 6;
      r.relSpeed = Math.sqrt(dvx * dvx + dvy * dvy + dvz * dvz);
      r.draw = false; r.slot = -1;             /* per-frame reset — .slot is
                                     re-handed below: pass 2 re-binds rows
                                     still keyed to a live record         */
      n++;
    }

    /* ---- FRAME ORDER step 1: invalidate/expire (spec rev. 5).
       A row is invalid the INSTANT obj.alive !== true OR obj._gen drifted
       OR obj left game.targets. Generation drift against a still-live
       same-object row means the pool slot was RECYCLED (destroyRock
       releases BEFORE _split spawns; release + re-obtain between two
       paints returns the identical reference alive again): the old life's
       retained rank must NOT transfer to the newborn — the (obj,_gen) key
       plus Pool.obtain's monotonic _gen stamp makes that structurally
       impossible, and Pool.clear() never rewinds generations.
       Record presence = gates 1/3/4 (records exist only for visible,
       in-range, alive contacts): a holder whose contact left the records
       releases with NO grace — leaving the viewport leaves the selection
       entirely; retention holds RANK, never visibility. A locked contact
       that happened to own a row releases it instantly (rank 0, outside
       both ledgers). Present ghosts then AGE: rh += dt every paint —
       drawn through retention or not, the grace is NEVER renewed — and
       release STRICTLY past holdSec, so a ghost lives its full grace at
       exactly holdSec (the demote paint stamped dt: leave@0.1,
       +0.1→0.2, +0.3→0.5 — T9 pins every number). Expiry frees the row
       for THIS frame's fill step (expiry is total). ---- */
    const ro = this._rObj, rg = this._rGen, rc = this._rClose,
          rh = this._rHold, rs = this._rState;
    for (let k = 0; k < this.CAP; k++) {
      if (rs[k] === 0) continue;
      const o = ro[k];
      if (!o || o.alive !== true || o._gen !== rg[k] ||
          !targets || targets.indexOf(o) < 0 || o === lock) {
        this._releaseSlot(k, rec, n);
        continue;
      }
      const h = this._recordOf(o, rg[k], rec, n);
      if (h < 0) {                                /* left the visible set */
        this._releaseSlot(k, rec, n);
        continue;
      }
      rec[h].slot = k;                            /* re-bind holder record */
      rc[k] = rec[h].closing;                     /* live SIGNED closing */
      if (rs[k] === 2) {                          /* grace clock — never
                                                     renewed; strictly
                                                     past holdSec releases */
        rh[k] += dt;
        if (rh[k] > this.holdSec) this._releaseSlot(k, rec, n);
      }
    }

    /* ---- FRAME ORDER step 2: rank (spec rev. 5). rank A: approaching
       (closing > 0) by descending closing; rank B: receding by descending
       |closing|, sorted after rank A — receders never displace an
       approaching contact that currently qualifies.
       NEW-ENTRANT ELIGIBILITY (I2): a contact NEWLY entering ranked
       selection must pass gate 2 — a zero-screen-motion newcomer never
       takes a slot; drawing exists to show arrows. An INCUMBENT — a
       contact that owns a live ledger row (seat or ghost) — keeps rank
       even below threshold (I3, spec-explicit: "it keeps its rank; it
       just has no visible arrow"). A ghost ranks because it owns a row;
       if it climbs back INTO the top-maxArrows it re-enters the ranked
       selection → step 3 converts it back to a seat (rev. 5 re-entry
       rule). The locked contact sits outside this system entirely
       (always rank 0 — maxArrows caps the NON-locked rows, so up to
       maxArrows+1 arrows total; the gold aim lock has no dwell of its
       own, so the locked arrow may swap contacts instantly, which tracks
       the bracket and is intended). ---- */
    let nA = 0, nB = 0;
    const ordA = this._ordA, ordB = this._ordB;
    for (let i = 0; i < n; i++) {
      const r = rec[i];
      if (r.obj === lock) continue;               /* rank 0, outside both ledgers */
      if (!r.moving && this._slotFor(r.obj, r.gen) < 0) continue;  /* I2 */
      if (r.closing > 0) { ordA[nA++] = i; }
      else { ordB[nB++] = i; }
    }
    for (let a = 1; a < nA; a++) {                /* insertion sort, zero alloc, stable */
      const v = ordA[a], cv2 = rec[v].closing;
      let b = a - 1;
      while (b >= 0 && rec[ordA[b]].closing < cv2) { ordA[b + 1] = ordA[b]; b--; }
      ordA[b + 1] = v;
    }
    for (let a = 1; a < nB; a++) {
      const v = ordB[a], cv2 = Math.abs(rec[v].closing);
      let b = a - 1;
      while (b >= 0 && Math.abs(rec[ordB[b]].closing) < cv2) { ordB[b + 1] = ordB[b]; b--; }
      ordB[b + 1] = v;
    }

    /* ---- FRAME ORDER step 3: demote current display-slot owners, IN
       PLACE, processed in rank order (spec rev. 5: demotion tests slot
       OWNERSHIP, not visibility). A contact pushed out of the
       top-maxArrows ranked selection that OWNS a row converts that row to
       a GHOST in the same row, same frame — whether it was drawing OR
       sitting silent in-row via I3's gate-2 drop. Slot-for-slot, never
       additive: the ledger can never exceed maxArrows. A demoted contact
       that never owned a row creates NO ghost and NO clock (churn wave B
       demotes silently). Mirror: a ghost that climbed back INTO the
       top-maxArrows RE-ENTERS the ranked selection → converts back to a
       SEAT with the clock cleared (a later demotion stamps a fresh full
       grace — never a resumed residue). ---- */
    for (let j = 0; j < nA + nB; j++) {
      const i = j < nA ? ordA[j] : ordB[j - nA];
      const r = rec[i];
      const s = this._slotFor(r.obj, r.gen);
      if (s < 0) continue;                        /* never owned a row: silent */
      if (j < this.maxArrows) {                   /* inside the ranked selection */
        if (rs[s] === 2) { rs[s] = 1; rh[s] = 0; }  /* ghost → seat, episode ends */
      } else if (rs[s] === 1) {                   /* seat pushed out */
        rs[s] = 2; rh[s] = dt;                    /* ghost in place, grace frame #1 = dt */
      }
    }

    /* ---- FRAME ORDER step 4: preempt ghosts (bar semantics). An
       APPROACHING ghost's row is untouchable for the grace (mirror of
       "never displaces"). An unseated rank-A claimant may take a held
       RECEDING ghost's row — trail gone, row becomes the entrant's seat —
       ONLY when its closing exceeds preemptFactor × the ghost's
       |closing|; the weakest bar goes first, so the strongest qualifying
       claimant wins a contested row. At or below the bar the entrant
       cannot claim THAT ghost's row: it keeps ranked selection and takes
       part in the fill step normally (the bar blocks one slot claim,
       never general display). This includes a ghost the entrant's own
       arrival just created above (same frame) — exactly probe #4's
       silence and T9's 12 ≤ 1.25×10 pin. ---- */
    for (let a = 0; a < nA; a++) {
      const e = rec[ordA[a]];
      if (e.slot >= 0) continue;                  /* already holds a row */
      let best = -1;
      for (let k = 0; k < this.CAP; k++) {
        if (rs[k] !== 2) continue;                /* only live ghosts are contestable */
        if (rc[k] >= 0) continue;                 /* approaching ghost: untouchable */
        if (e.closing > this.preemptFactor * Math.max(1e-9, -rc[k]))
          if (best < 0 || -rc[k] < -rc[best]) best = k;   /* weakest bar first */
      }
      if (best >= 0) {
        const v = this._recordOf(ro[best], rg[best], rec, n);
        if (v >= 0) rec[v].slot = -1;             /* trail gone from the ledger */
        ro[best] = e.obj; rg[best] = e.gen; rc[best] = e.closing;
        rh[best] = 0; rs[best] = 1;
        e.slot = best;
      }
    }

    /* ---- FRAME ORDER step 5: fill free rows (spec rev. 5): rows that
       were never occupied, or were freed by expiry or instant
       invalidation THIS frame, are assigned to the ranked set in rank
       order — rank A descending closing, then rank B descending
       |closing| — each candidate a gate-2 newcomer (I2) or an incumbent
       holding rank (I3). Rows are never stolen from holders: sticky seats
       hold while they remain in the ranked selection (a selection
       demotion flips their own row to a ghost above, never a steal). A
       rank-B contact never displaces a qualifying rank-A one (rank order
       decides; leftover rows go to receders in descending |closing|).
       A contact that never owned a row never gets one after expiry —
       silence must not consume display, and a demoted contact re-wins a
       row only by RANKING back into the top-maxArrows (which converts it
       back to a seat, not a restore). ---- */
    for (let j = 0; j < nA + nB; j++) {
      const i = j < nA ? ordA[j] : ordB[j - nA];
      const r = rec[i];
      if (r.slot >= 0) continue;                  /* already holds a row */
      const k = this._freeSlot();
      if (k < 0) break;                           /* ledger full: hysteresis wins */
      ro[k] = r.obj; rg[k] = r.gen; rc[k] = r.closing;
      rh[k] = 0; rs[k] = 1;
      r.slot = k;
    }

    /* ghosts = every live ghost row; holders re-bound their records in
       step 1, seats/claims were bound by steps 3-5 above. */
    let retained = 0;
    for (let k = 0; k < this.CAP; k++) if (rs[k] === 2) retained++;

    /* ---- FRAME ORDER step 6: draw (spec rev. 5 DRAW RULE): a contact
       draws iff it HOLDS A ROW (seat or ghost) AND passes gate 2 — motion
       restored during grace returns the arrow with the clock NOT renewed,
       and a below-threshold holder keeps its row silently. The locked
       arrow draws whenever it passes gates 1/4/5, OUTSIDE the cap (up to
       maxArrows+1 strokes); the zero-direction regime never draws. Color
       language (§2): locked gold full strength; approaching amber;
       receding at reduced alpha, alphaOpen → alphaClosing by |closing|;
       distance fades the last 30% (fadeTail·fadeDist → fadeDist). ---- */
    const drawAll = this._drawAll;
    const ar = this._ar;
    let nAll = 0;
    for (let j = 0; j < nA + nB; j++) {           /* seats, rank order */
      const i = j < nA ? ordA[j] : ordB[j - nA];
      const r = rec[i];
      if (r.slot < 0 || rs[r.slot] !== 1) continue;
      if (!r.moving) continue;                    /* visually static: draws nothing (gate 2) */
      r.draw = true; drawAll[nAll++] = i;
    }
    for (let k = 0; k < this.CAP; k++) {          /* ghosts draw beside the seats */
      if (rs[k] !== 2) continue;
      const h = this._recordOf(ro[k], rg[k], rec, n);
      if (h < 0) continue;                        /* step 1 guarantees one */
      const r = rec[h];
      if (!r.moving) continue;
      r.draw = true; drawAll[nAll++] = h;
    }
    let lockedRec = null, lockIdx = -1;
    if (lock) for (let i = 0; i < n; i++) if (rec[i].obj === lock) { lockedRec = rec[i]; lockIdx = i; break; }

    let count = 0;
    /* F8 (C3): styling lands AFTER the draw list is assembled — the locked
       arrow is part of the list (shifted in below), so a locked-only frame
       still gets width 2 + round caps. Harness pins fresh locked-only
       instance → width 2 + round; locked-only frame right after resize. */
    if (lockedRec && lockedRec.vis && lockedRec.moving && lockedRec.dist <= this.fadeDist) {
      /* §5.6 + review F6: the locked READOUT obeys no display thresholds,
         but the locked SHAFT is still a shaft — it requires gate 2
         (lockedRec.moving: a near-matched lock at ~0.3 px/s would draw a
         full 8 px minLen arrow pointing at noise) and gate 3 (a lock beyond
         fadeDist keeps its NUMBER — F4/C1 — with 0 shafts). A stationary
         lock (sv = 0) draws no shaft, only the REL readout at the anchor
         (T5/T10 pin this). */
      lockedRec.draw = true;
      for (let d = nAll; d > 0; d--) drawAll[d] = drawAll[d - 1];   /* shift right, ≤ n+1 elems */
      drawAll[0] = lockIdx; nAll++;
    }
    if (nAll > 0) { ctx.lineCap = 'round'; ctx.lineWidth = 2; }
    ar.drawn = false;
    for (let d = 0; d < nAll; d++) {
      const r = rec[drawAll[d]];
      let col = this.openingColor, al = this.alphaOpen;
      if (r.obj === lock) { col = this.lockedColor; al = 1; }
      else if (r.closing > 0) { col = this.closingColor; al = this.alphaClosing; }
      else {
        al = this.alphaOpen + (this.alphaClosing - this.alphaOpen) *
          Math.min(1, Math.abs(r.closing) / 24);
      }
      if (r.dist >= this.fadeDist * this.fadeTail && r.obj !== lock) {
        al *= 1 - (r.dist - this.fadeDist * this.fadeTail) /
          Math.max(1e-9, this.fadeDist * (1 - this.fadeTail));
      }
      ctx.strokeStyle = this._alphaStr(col, al);
      /* inlined arrow geometry (identical math to the pinned static,
         zero locals): tail = anchor + u·(screenRadius + 2), screen radius
         via the §4 basis — radius·focal/D with camera DEPTH D (the spec
         text wins over the HUD's slant-range × clamp-14..160 idiom here);
         tip = tail + u·len (len clamped [minLen,maxLen]); two ±headDeg
         barbs only when len ≥ 2·headMin */
      let ux = r.dx, uy = r.dy;
      const m = Math.hypot(ux, uy);
      const hasDir = (m > 0 && Number.isFinite(m));
      if (hasDir) { ux /= m; uy /= m; }
      /* zero direction NEVER produces an arrow (gate 2, §5): a stationary
         lock still gets its readout below but draws no shaft — an arrow
         with no direction would be an arbitrary (undefined) shaft. */
      let lenPx = 0, hx = 0, hy = 0;
      if (hasDir) {
        lenPx = clampNum(this.pxPerSec * r.svMag, this.minLen, this.maxLen);
        const rpx = r.radius * focal / Math.max(1e-9, r.D);
        const tx = r.x + ux * (rpx + 2), ty = r.y + uy * (rpx + 2);
        hx = tx + ux * lenPx; hy = ty + uy * lenPx;
        ctx.beginPath();
        ctx.moveTo(tx, ty);
        ctx.lineTo(hx, hy);
        if (lenPx >= 2 * this.headMin) {
          const a = this.headDeg * Math.PI / 180, c = Math.cos(a), s = Math.sin(a);
          const hl = Math.max(this.headMin, lenPx * 0.28);
          ctx.moveTo(hx, hy); ctx.lineTo(hx + (-ux * c + uy * s) * hl, hy + (-ux * s - uy * c) * hl);
          ctx.moveTo(hx, hy); ctx.lineTo(hx + (-ux * c - uy * s) * hl, hy + ( ux * s - uy * c) * hl);
        }
        ctx.stroke();
        count++;                               /* every painted shaft (locked draws OUTSIDE the non-locked cap → up to maxArrows+1) */
      }
      /* remember the locked arrow's tip for the readout anchor */
      if (r.obj === lock) {
        ar.hx = hx; ar.hy = hy; ar.len = lenPx; ar.drawn = hasDir;
      }
    }

    /* ---- locked REL readout (spec §5.6): obeys the liveness/state gates
       but NO display thresholds — REL 0.0 renders exactly when the
       velocity matches (velocity matching is when the confirmation
       matters most; the old 5 u/s cutoff hid the one number the pilot
       wanted) — including the zero-direction case, where no arrow exists
       and the text lands at the anchor (bracket position) instead. Canvas
       fillText near the locked anchor. Primary 'REL 12.4' — one decimal,
       u/s, a MEASURED relative speed (deliberately NOT 'Δv': that reads
       as a burn budget, not a measurement) + signed closing rate '+3.2' /
       '−3.2' (positive = closing) when readout is true. ---- */
    const showReadout = !!(lockedRec && lockedRec.vis && this.readout && lock);
    if (showReadout) {
      const rx = ar.drawn ? ar.hx : lockedRec.x;   /* §2: readout rides the arrow tip when a shaft exists, else the bracket edge (the lock holds no ledger row, so .slot is never the signal) */
      const ry = ar.drawn ? ar.hy : lockedRec.y;
      /* Doppler-style numeric cue uses ship-relative closing, not REL magnitude. */
      ctx.fillStyle = lockedRec.closing > 0 ? this.readoutClosingColor :
        lockedRec.closing < 0 ? this.readoutOpeningColor : this.lockedColor;
      ctx.font = this._readoutFont;
      ctx.fillText('REL ' + lockedRec.relSpeed.toFixed(1), rx + 8, ry - 6);
      ctx.fillText((lockedRec.closing >= 0 ? '+' : '-') +
        Math.abs(lockedRec.closing).toFixed(1), rx + 8, ry + 8);
    }

    dbg.count = count;
    dbg.retained = retained;
    if (showReadout && lockedRec) {
      dbg.locked = this._lockedDebug;
      dbg.locked.relSpeed = lockedRec.relSpeed;
      dbg.locked.closing = lockedRec.closing;
      dbg.locked.svx = lockedRec.svx;
      dbg.locked.svy = lockedRec.svy;
      dbg.locked.shown = true;
    } else {
      dbg.locked = null;
    }
  }

  /* Period toggles the existing layer; query-disabled or failed layers
     stay inert. Clear immediately so no arrows or held slots linger. */
  toggle() {
    if (!this.ctx) return;
    this.enabled = !this.enabled;
    this.reset();
  }

  /* hard-clear: display-slot ledger + scratch state — all rows, no fade
     (spec §5 invalidation: resetRun / run start / restart / quit / pause
     ENTRY / flight-mode flip / death / practice reset all land here via
     90-game.js). */
  reset() {
    for (let k = 0; k < this.CAP; k++) {
      this._rObj[k] = null; this._rGen[k] = 0; this._rClose[k] = 0;
      this._rHold[k] = 0; this._rState[k] = 0;
    }
    for (let i = 0; i < this.RCAP; i++) {
      const r = this._rec[i];
      r.obj = null; r.vis = false; r.moving = false;
      r.draw = false; r.slot = -1;
    }
    if (this.ctx && this._cssW > 0) this.ctx.clearRect(0, 0, this._cssW, this._cssH);
    this._painted = false;                     /* canvas is clean from this clear */
    __K.vectors.count = 0;
    __K.vectors.retained = 0;
    __K.vectors.locked = null;
  }
}

    /* STAGE 6 chips (built ONCE; display/textContent rewrites only):

    const panel = mk(E.settings, 'div', { width: 'min(440px, 90vw)', maxHeight: '88vh',
      overflowY: 'auto', padding: '22px', boxSizing: 'border-box',
      background: '#0b1422', border: '1px solid #7f9cb8', textAlign: 'left' });
    mk(panel, 'h2', { margin: '0 0 20px', letterSpacing: '0.2em' }, 'SETTINGS');
    const control = (name, key, type, min, max, step) => {
      const row = mk(panel, 'label', { display: 'flex', flexWrap: 'wrap',
        alignItems: 'center', justifyContent: 'space-between', gap: '12px',
        margin: '18px 0', fontSize: '13px' });
      mk(row, 'span', {}, name);
      const c = mk(row, type === 'select' ? 'select' : 'input', {
        font: 'inherit', color: '#cfe3ff', background: '#18283b', maxWidth: '180px' });
      c.setAttribute('data-setting', key);
      c.setAttribute('aria-label', name);
      if (type === 'select') {
        for (const mode of ['space', 'assist']) {
          const option = mk(c, 'option', {}, mode.toUpperCase());
          option.value = mode;
        }
      } else {
        c.type = type;
        if (type === 'range') { c.min = min; c.max = max; c.step = step; }
      }
      c.addEventListener(type === 'range' ? 'input' : 'change', () => {
        if (!self.game.settings) return;
        const value = type === 'checkbox' ? c.checked : type === 'range' ? Number(c.value) : c.value;
        self.game.settings.set({ [key]: value });
      });
      return c;
    };
    E.settingsControls = {
      invertPitch: control('Invert pitch (mouse and arrows)', 'invertPitch', 'checkbox'),
      sensitivity: control('Mouse sensitivity', 'sensitivity', 'range', 0.25, 3, 0.05),
      flightMode: control('Flight mode', 'flightMode', 'select'),
      volume: control('Master volume', 'volume', 'range', 0, 1, 0.01),
      cameraShake: control('Camera shake', 'cameraShake', 'checkbox')
    };
    E.settingsValues = mk(panel, 'div', { fontSize: '12px', color: '#7f9cb8', margin: '16px 0' });
    mk(panel, 'p', { fontSize: '12px', lineHeight: '1.6', color: '#7f9cb8' },
      'Changes apply immediately and are saved. Flight mode keeps your position and speed.');
    const action = (name, fn) => {
      const b = mk(panel, 'button', { padding: '10px 16px', margin: '6px', font: 'inherit',
        color: '#cfe3ff', background: '#18283b', border: '1px solid #7f9cb8' }, name);
      b.addEventListener('click', fn);
      return b;
    };
    action('RESTORE DEFAULTS', () => { if (self.game.settings) self.game.settings.reset(); });
    E.settingsBack = action('BACK', () => self.closeSettings());
    this.settingsOpen = false;
    E.settings.addEventListener('keydown', (e) => {
      // Trap Tab within the modal; Escape is handled by Input/Game.
      if (e.key !== 'Tab' || !E.settings.querySelectorAll) return;
      const controls = E.settings.querySelectorAll('input, select, button');
      const first = controls[0], last = controls[controls.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    });
    E.upgrades = screen(true);
    E.upgrades.setAttribute('role','dialog');
    E.upgrades.setAttribute('aria-modal','true');
    E.upgrades.setAttribute('aria-label','Between-wave upgrades');
    E.upgrades.style.zIndex='11';
    E.upgrades.style.background='rgba(4,7,14,0.94)';
    const upgradePanel = mk(E.upgrades,'div',{ width:'min(600px,90vw)', maxHeight:'88vh',
      overflowY:'auto', padding:'24px', boxSizing:'border-box', background:'#0b1422',
      border:'1px solid #ffd76a', textAlign:'left' });
    E.upgradeTitle=mk(upgradePanel,'h2',{ margin:'0 0 18px', fontSize:'20px', letterSpacing:'0.12em', color:'#ffd76a' });
    E.upgradeButtons={};
    for (const [key,name] of [['shield','SHIELD RESERVE'],['flak','FLAK GROUPING'],['magnet','PICKUP ATTRACTION']]) {
      const b=mk(upgradePanel,'button',{ display:'block', width:'100%', margin:'12px 0', padding:'14px',
        font:'inherit', fontSize:'13px', lineHeight:'1.7', whiteSpace:'pre-line', textAlign:'left',
        color:'#cfe3ff', background:'#18283b', border:'1px solid #7f9cb8', cursor:'pointer' });
      b.setAttribute('aria-label',name);
      b.setAttribute('data-clickable','');
      b.addEventListener('click',()=>self.game.chooseUpgrade(key));
      E.upgradeButtons[key]=b;
    }
    mk(upgradePanel,'p',{ fontSize:'12px', lineHeight:'1.6', color:'#7f9cb8' },
      'Upgrades last for this arcade run. Each has three levels. Choose one, or skip. Esc skips; Tab and Enter select.');
    E.upgradeSkip=mk(upgradePanel,'button',{ padding:'10px 16px', font:'inherit', color:'#cfe3ff',
      background:'#18283b', border:'1px solid #7f9cb8' },'SKIP UPGRADE');
    E.upgradeSkip.setAttribute('data-clickable','');
    E.upgradeSkip.addEventListener('click',()=>self.game.chooseUpgrade(null));
    this.upgradesOpen=false;
    E.upgrades.addEventListener('keydown',(e)=>{
      if (e.key!=='Tab' || !E.upgrades.querySelectorAll) return;
      const controls=E.upgrades.querySelectorAll('button:not([disabled])');
      const first=controls[0],last=controls[controls.length-1];
      if (e.shiftKey && document.activeElement===first) { e.preventDefault();last.focus(); }
      else if (!e.shiftKey && document.activeElement===last) { e.preventDefault();first.focus(); }
    });
    this.syncSettings();

    /* ---- write caches (previous written values; zero DOM writes when the
       numbers are unchanged) ---- */
    this._screen = '';
    this._last = { score: -1, wave: -1, lives: -1, hiscore: -1, muted: null, alarm: null, weapon: null, wcol: null };
    this._op = { vig: -1, flick: -1, edge: -1, boost: -1, hullW: -1, shldW: -1, more: -1,
                 buff: -1, buffTxt: null, combo: -1, comboTxt: null, mode: null };
    /* STAGE 11 lock-bracket caches: 0 matches the ctor's display:'none' so
       idle frames write zero styles; positions null = never written; a value
       is only rewritten when it actually changed (integer px / flag) */
    this._aim = { lock: 0, dot: 0, lx: null, ly: null, dx: null, dy: null };
    this._pickT = 0;
    this._vig = 0; this._flick = 0; this._edge = 0; this._bannerT = 0;
    this._alarmT = 0; this._clock = 0; this._overBlink = 0;
  }

  /* --- event hooks (Game/Defense call these) ------------------------------ */
  hitShieldFlicker(strength) { this._flick = Math.max(this._flick, 0.25 + 0.35 * (strength || 0)); }
  hitVignette(strength) { this._vig = Math.min(1.15, this._vig + (strength || 0.6)); }
  showWave(n) {
    this.el.bannerWave.textContent = 'WAVE ' + n;
    this.el.bannerTheme.textContent = __K.waveTheme || '';
    this._bannerT = 1.9;
  }

  /* STAGE 6: PickupSystem calls this on collect — a brief centre flash.
     Colour language per SPEC (blue/green/orange/amber/gold/violet). */
  pickupFlash(type) {
    const NAMES = { shield: 'SHIELD +40', repair: 'HULL +25', ammoFlak: 'FLAK +16',
                    ammoMissile: 'MISSILES +3', buff: 'BUFF!', score: 'SCORE GEM',
                    extraLife: 'EXTRA LIFE' };
    const COLORS = { shield: '#59d7ff', repair: '#6fe08a', ammoFlak: '#ff9a3e',
                     ammoMissile: '#ff5a3e', buff: '#ffc24a', score: '#ffd76a',
                     extraLife: '#ff7ae0' };
    const E = this.el;
    E.pickupChip.textContent = NAMES[type] || type;
    E.pickupChip.style.color = COLORS[type] || this.C.norm;
    E.pickupChip.style.display = 'block';
    this._pickT = 1.4;
  }

  /* --- low-hull HUD shift: bars/labels go alarm red (transition-gated) ---- */
  _setAlarm(on) {
    if (this._last.alarm === on) return;
    this._last.alarm = on;
    const C = this.C, E = this.el;
    const lab = on ? C.alarmSoft : C.dim;
    E.hullLabel.style.color = lab;
    E.shieldLabel.style.color = lab;
    E.score.style.color = on ? C.alarm : C.norm;
    E.hullBar.fill.style.background = on ? C.hullAlarm : C.hullFill;
    E.vig.style.boxShadow = on
      ? 'inset 0 0 160px 56px rgba(255,45,35,0.95)'
      : 'inset 0 0 160px 46px rgba(255,45,35,0.85)';
  }

  /* opacity write only when it moved past a visible step (toFixed garbage is
     confined to actually-fading frames). NOTE: distinct name from the this._op
     cache OBJECT — an instance property shadows a same-named prototype method. */
  _opTo(key, el, v) {
    const old = this._op[key];
    if (old >= 0 && Math.abs(old - v) <= 0.02) return;
    this._op[key] = v;
    el.style.opacity = v <= 0.005 ? '0' : (v >= 0.995 ? '1' : v.toFixed(3));
  }

  openUpgrades() {
    const u=this.game.upgrades, E=this.el, U=__K.TUNE.upgrades;
    if (!u || !u.pendingWave || __K.state!=='PAUSED') return;
    this.upgradesOpen=true;
    if (this.game.input) { this.game.input._releaseAll(); this.game.input.uiActive=true; }
    E.upgrades.style.display='flex';
    E.scrPause.setAttribute('inert','');
    E.upgradeTitle.textContent='WAVE '+u.pendingWave+' CLEAR · CHOOSE AN UPGRADE';
    const details={ shield:'+'+U.shieldPerLevel+' maximum shield and immediate recharge',
      flak:Math.round((1-U.flakFactor)*100)+'% tighter pellet spread per level; same damage and ammo cost',
      magnet:'+'+Math.round(U.magnetPerLevel*100)+'% of base pickup attraction range per level' };
    const names={ shield:'SHIELD RESERVE', flak:'FLAK GROUPING', magnet:'PICKUP ATTRACTION' };
    for (const key of ['shield','flak','magnet']) {
      const b=E.upgradeButtons[key],level=u.levels[key];
      b.disabled=level>=U.cap;
      b.style.opacity=b.disabled ? '0.45' : '1';
      b.textContent=names[key]+' · '+(b.disabled ? 'MAXED' : 'LEVEL '+(level+1)+'/'+U.cap)+'\n'+details[key];
    }
    const first=Object.values(E.upgradeButtons).find(b=>!b.disabled);
    if (first && first.focus) first.focus();
  }

  closeUpgrades() {
    this.upgradesOpen=false;
    this.el.upgrades.style.display='none';
    if (this.el.scrPause.removeAttribute) this.el.scrPause.removeAttribute('inert');
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    if (this.game.input) { this.game.input.uiActive=false; this.game.input._releaseAll(); }
  }

  openSettings(opener) {
    if (this.upgradesOpen || (__K.state !== 'TITLE' && __K.state !== 'PAUSED')) return;
    this.settingsOpen = true;
    this._settingsOpener = opener;
    if (this.game.input) { this.game.input._releaseAll(); this.game.input.uiActive = true; }
    this.el.settings.style.display = 'flex';
    for (const e of [this.el.scrTitle, this.el.scrPause, this.el.scrOver]) e.setAttribute('inert', '');
    this.syncSettings();
    const first = this.el.settingsControls.invertPitch;
    if (first.focus) first.focus();
  }

  closeSettings() {
    this.settingsOpen = false;
    this.el.settings.style.display = 'none';
    if (this.game.input) { this.game.input.uiActive = false; this.game.input._releaseAll(); }
    for (const e of [this.el.scrTitle, this.el.scrPause, this.el.scrOver]) {
      if (e.removeAttribute) e.removeAttribute('inert');
    }
    if (__K.state === 'PLAYING' && this.game._focusGameplay) this.game._focusGameplay();
    else if (this._settingsOpener && this._settingsOpener.focus) this._settingsOpener.focus();
  }

  syncSettings() {
    const E = this.el;
    const v = this.game.settings && this.game.settings.values;
    const invert = v ? v.invertPitch : true;
    for (const guide of E.controlGuides) {
      guide.actions.up.textContent = invert ? 'Point your nose down' : 'Point your nose up';
      guide.actions.down.textContent = invert ? 'Point your nose up' : 'Point your nose down';
      guide.pitchNote.textContent = 'Mouse and arrow keys steer the same way. Change up / down in Settings.';
    }
    if (!v) return;
    for (const key of Object.keys(E.settingsControls)) {
      const c = E.settingsControls[key];
      if (typeof v[key] === 'boolean') c.checked = v[key];
      else c.value = String(v[key]);
    }
    E.settingsValues.textContent = 'Sensitivity ' + v.sensitivity.toFixed(2) + '× · Volume ' + Math.round(v.volume * 100) + '%';
  }

  readSeed(screen) { return this.el[screen+'SeedInput'].value; }

  setSeedFields(seed) {
    for (const key of ['title','over']) {
      this.el[key+'SeedInput'].value=String(seed);
      this.el[key+'SeedInput'].removeAttribute('aria-invalid');
      this.el[key+'SeedError'].textContent='';
    }
  }

  seedError(screen) {
    const input=this.el[screen+'SeedInput'];
    input.setAttribute('aria-invalid','true');
    this.el[screen+'SeedError'].textContent='Enter a whole-number seed from 0 to 4294967295.';
    input.focus();
