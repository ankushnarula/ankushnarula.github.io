    for (let i = live.length - 1; i >= 0; i--) {
      const p = live[i];
      p.ttl -= dt;
      if (p.ttl <= 0) { p.mesh.visible = false; this.pickups.release(p); continue; }

      if (ship) {
        const dx = ship.position.x - p.position.x,
              dy = ship.position.y - p.position.y,
              dz = ship.position.z - p.position.z;
        const d2 = dx * dx + dy * dy + dz * dz;
        /* magnet: SMOOTH accel toward the ship when close (SPEC), then the
           ship's own overlap radius collects it */
        if (d2 < mag2 && d2 > 1e-6) {
          const d = Math.sqrt(d2);
          p.vel.addScaledVector(this._dir.set(dx / d, dy / d, dz / d), P.magnetAccel * dt);
          const sp = p.vel.length();
          if (sp > P.magnetMaxSpeed) p.vel.multiplyScalar(P.magnetMaxSpeed / sp);
        }
        p.position.addScaledVector(p.vel, dt);
        if (d2 <= grab * grab) { this.apply(p); p.mesh.visible = false; this.pickups.release(p); continue; }
      } else {
        p.position.addScaledVector(p.vel, dt);
      }

      /* slow bob + spin; last second shrinks out (per-mesh scale, never the
         shared material's opacity — one material serves every token) */
      const bob = Math.sin((this.P.bobRate * (p.ttl + p.bob))) * 0.5;
      p.mesh.position.y = p.position.y + bob;
      p.mesh.rotation.y += dt * 1.7;
      p.mesh.scale.setScalar(p.ttl < 1 ? Math.max(0.05, p.ttl) : 1);
    }

    /* buff timers + the multipliers the fire/damage passes read */
    if (__K.buffT > 0) {
      __K.buffT = Math.max(0, __K.buffT - dt);
      if (__K.buffT <= 0) { __K.buff = ''; __K.log('buff expired'); }
    }
    game.rapidMul = (__K.buffT > 0 && __K.buff === 'rapid') ? 2 : 1;
    game.dmgMul = (__K.buffT > 0 && __K.buff === 'double') ? 2 : 1;
  }

  clearAll() { this.pickups.clear(); }

  resetRun() {
    this.pickups.clear();
    __K.buff = ''; __K.buffT = 0;
    this.game.rapidMul = 1;
    this.game.dmgMul = 1;
  }

  get aliveCount() { return this.pickups.aliveCount; }
}

/* ==== 70-particles.js ==== */
/* ===== SECTION: Particles — pooled glow sprites, explosion lights, shake table ===== */
/* SPEC "Particles" stage 7 (implementation priority 7): explosion bursts per
   rock size + volatile chain, engine exhaust puffs, impact sparks, pickup
   collect sparkle, pebble spray, ship-death debris — plus the SPEC's
   "short-lived point lights on muzzle flashes and explosions" and the
   shake-scaling table the whole game shakes through.

   RENDERING: ONE THREE.Points draw call for the whole system. Geometry is
   three fixed vertex attributes built ONCE at construction (aPosition /
   aColor / aSize with per-particle aAlpha — size and fade ramps ride the
   attributes, zero per-frame uploads beyond needsUpdate=true), hand-written
   additive ShaderMaterial (no addon imports; a point-sprite circle with a
   soft quadratic falloff, alpha-culled so dead particles cost nothing).
   Nothing after the constructor builds a geometry, material, light or mesh.

   POOLING (SPEC "use object pooling for ... particles"): the pool is a FIXED
   array of TUNE.particles.cap records allocated at construction — update()
   is one forward loop over that fixed pool (the brief's mandate), and spawn
   during saturation simply DROPS the request (cosmetic back-pressure, the
   same rule as the pebble pool). __K.particles.alive mirrors the count.

   DETERMINISM: every roll goes through the shared seeded `rng` — never
   Math.random — so __K.rngSeed replays a burst just like the rock field.

   SHAKE TABLE: the CameraRig's seeded spring (30-camera.js) does the motion;
   this stage only centralises the AMOUNTS into TUNE.particles.shake, read
   through Game.shakeFor(event, size) so the whole game's impact ladder lives
   in one table (stage 8 tunes blind; tests/audio_harness.mjs asserts it). */
class Particles {
  constructor(game) {
    this.game = game;
    const P = this.P = __K.TUNE.particles;

    /* ---- additive surface (05-core fixes the placeholder; identity swaps
       to this instance, harness reads .alive) ---- */
    this.alive = 0;
    this.cap = P.cap;
    __K.particles = this;

    /* ---- vertex storage: built ONCE, never resized ---- */
    const cap = P.cap;
    this._posArr = new Float32Array(cap * 3);
    this._colArr = new Float32Array(cap * 3);
    this._sizeArr = new Float32Array(cap);
    this._alphaArr = new Float32Array(cap);

    const geo = new THREE.BufferGeometry();
    this._aPos = new THREE.BufferAttribute(this._posArr, 3);
    this._aCol = new THREE.BufferAttribute(this._colArr, 3);
    this._aSize = new THREE.BufferAttribute(this._sizeArr, 1);
    this._aAlpha = new THREE.BufferAttribute(this._alphaArr, 1);
    geo.setAttribute('position', this._aPos);
    geo.setAttribute('aColor', this._aCol);
    geo.setAttribute('aSize', this._aSize);
    geo.setAttribute('aAlpha', this._aAlpha);

    const mat = new THREE.ShaderMaterial({
      uniforms: {},
      vertexShader: [
        'attribute vec3 aColor;',
        'attribute float aSize;',
        'attribute float aAlpha;',
        'varying float vAlpha;',
        'varying vec3 vColor;',
        'void main() {',
        '  vAlpha = aAlpha;',
        '  vColor = aColor;',
        '  vec4 mv = modelViewMatrix * vec4( position, 1.0 );',
        '  gl_PointSize = aSize * ( 320.0 / max( 0.001, -mv.z ) );',
        /* dead particles collapse offscreen instead of rasterising */
        '  if ( aAlpha <= 0.0 ) { gl_PointSize = 0.0; gl_Position = vec4( 2.0, 2.0, 2.0, 1.0 ); }',
        '  else { gl_Position = projectionMatrix * mv; }',
        '}'
      ].join('\n'),
      fragmentShader: [
        'varying float vAlpha;',
        'varying vec3 vColor;',
        'void main() {',
        '  vec2 d = gl_PointCoord - vec2( 0.5 );',
        '  float r2 = dot( d, d );',
        '  if ( r2 > 0.25 ) discard;',
        '  float glow = 1.0 - r2 * 4.0;',   /* 1 centre -> 0 rim, quadratic */
        '  glow *= glow;',
        '  float a = vAlpha * glow;',
        '  if ( a <= 0.002 ) discard;',
        '  gl_FragColor = vec4( vColor * a, a );',   /* additive: premultiplied */
        '}'
      ].join('\n'),
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      depthTest: true,
      fog: false
    });

    const points = new THREE.Points(geo, mat);
    points.frustumCulled = false;      /* world-space sprites; no bound recompute */
    points.visible = true;
    this.points = points;
    game.scene.add(points);

    /* ---- the fixed particle pool: every record exists from day one.
       A free-index stack makes obtain O(1) and release O(1) (the update
       sweep pushes dying indices back), so nothing ever rescans. ---------- */
    this.items = new Array(cap);
    this._free = new Int32Array(cap);
    this._freeN = cap;
    for (let i = 0; i < cap; i++) {
      this._free[i] = cap - 1 - i;                 /* pop order: 0,1,2,... */
      this.items[i] = {
        i: i, alive: false,
        x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0,
        age: 0, life: 1, drag: 1,
        s0: 1, grow: 1, peak: 1,
        cr: 1, cg: 1, cb: 1,      /* colour at spawn (already mixed) */
        fr: 1, fg: 1, fb: 1       /* colour it fades toward */
      };
    }
    this._dirty = false;
    this._puffT = 0;               /* exhaust cadence accumulator */

    /* ---- palette (code-level look constants; TUNE owns the numbers) ---- */
    const fire = [1.0, 0.50, 0.15], ember = [0.50, 0.13, 0.03];
    const smoke = [0.32, 0.29, 0.26], dim = [0.10, 0.09, 0.09];
    const hot = [1.0, 0.92, 0.70];
    const blue = [0.50, 0.80, 1.00], deep = [0.08, 0.18, 0.40];
    const gold = [1.00, 0.82, 0.35], green = [0.45, 1.00, 0.60];
    const volc = [1.00, 0.35, 0.10];

    /* preset = spawn count + ramps + one or more (start,end) colour pairs.
       Counts/speeds/lives/sizes come from TUNE.particles.bursts so stage 8
       retunes blind; colours are the fixed game's look. */
    const defs = P.bursts;
    const mk = (name, pal, drag, grow) => {
      const d = defs[name];
      return { n: d.n, spd: d.spd, jit: d.jit || 0, life: d.life,
               s0: d.s0, peak: d.peak, drag: drag, grow: grow, pal: pal };
    };
    this._pre = {
      small:    mk('small',    [[hot, ember], [fire, ember], [smoke, dim]], 1.8, 1.5),
      medium:   mk('medium',   [[hot, fire], [fire, ember], [smoke, dim]], 1.5, 1.6),
      large:    mk('large',    [[hot, fire], [fire, ember], [fire, ember], [smoke, dim]], 1.3, 1.7),
      volatile: mk('volatile', [[hot, volc], [volc, ember], [volc, ember], [hot, gold]], 1.1, 1.8),
      spark:    mk('spark',    [[hot, fire], [hot, fire], [blue, deep]], 4.0, 0.5),
      muzzle:   mk('muzzle',   [[hot, blue], [hot, fire]], 6.0, 0.6),
      debris:   mk('debris',   [[hot, fire], [fire, ember], [smoke, dim], [blue, deep]], 0.5, 1.4),
      collect:  mk('collect',  [[gold, gold], [green, green], [blue, blue], [hot, hot]], 2.6, 0.25),
      spray:    mk('spray',    [[smoke, dim], [smoke, dim], [fire, ember]], 1.2, 1.8),
      /* STAGE 11: small-kill glow cloud — warm palette, longer + softer than
         'small' (TUNE bursts.cloud numbers). Sprites ONLY: no mesh pebbles,
         no light (the 4-light pool stays free for mediums/largers/muzzles). */
      cloud:    mk('cloud',    [[hot, ember], [gold, ember], [fire, dim]], 2.0, 1.2),
      exhaust:  { n: P.exhaust.puffs, spd: 14, jit: 3, life: 0.38, s0: 1.0,
                  peak: 0.55, drag: 2.4, grow: 2.4,
                  pal: [[blue, deep], [hot, deep]] }
    };

    /* ---- scalar harness counters (rock_harness P12 reads these): one total
       + one per preset. Increment only on a burst that actually spawned
       sprites; reads are plain numbers, never live objects. ---- */
    this.burstCount = 0;
    this.presetFired = {};
    for (const k in this._pre) this.presetFired[k] = 0;

    /* ---- short-lived point lights: POOL BUILT ONCE (SPEC max ~4 live).
       The muzzle light doubles as the pulse-flash fill; explosion lights are
       warm; the volatile blast is the big orange one. update() writes
       intensity only (a fading quadratic); no light is ever added later. ---- */
    const L = this._L = P.lights;
    this.lights = [];
    for (let i = 0; i < L.pool; i++) {
      const lt = new THREE.PointLight(0xffa050, 0, 170, 2);
      lt.castShadow = false;
      game.scene.add(lt);
      this.lights.push({ light: lt, ttl: 0, life: 1, peak: 0 });
    }

    /* scratch — allocated once; spawn/update construct nothing */
    this._v = new THREE.Vector3();
    this._nose = new THREE.Vector3();
  }

  /* --- pool back-pressure is DROP, never queue: the free-index stack pops
     O(1); an empty stack means the cap is saturated, request discarded. -- */
  _obtain() {
    if (this._freeN === 0) return null;
    const p = this.items[this._free[--this._freeN]];
    p.alive = true;
    return p;
  }

  /* --- the ONE generic spawn: preset + world point + optional base vel ----
     Deterministic in the shared rng. Zero allocation. ---------------------- */
  burst(presetName, at, baseVel) {
    const pre = this._pre[presetName];
    if (!pre || !at) return 0;
    const inherit = baseVel ? (presetName === 'spray' || presetName === 'debris' ? 0.55 : 0.35) : 0;
    let spawned = 0;
    for (let k = 0; k < pre.n; k++) {
      const p = this._obtain();
      if (!p) break;                              /* pool saturated: drop */
      /* uniform direction, preset speed * seeded spread */
      const u = rng() * 2 - 1, th = rng() * Math.PI * 2, r = Math.sqrt(Math.max(0, 1 - u * u));
      const spd = pre.spd * (0.35 + rng() * 0.9);
      p.vx = r * Math.cos(th) * spd + (rng() - 0.5) * pre.jit;
      p.vy = u * spd + (rng() - 0.5) * pre.jit;
      p.vz = r * Math.sin(th) * spd + (rng() - 0.5) * pre.jit;
      if (baseVel) { p.vx += baseVel.x * inherit; p.vy += baseVel.y * inherit; p.vz += baseVel.z * inherit; }
      /* sit just off the surface so the burst reads around the silhouette */
      const off = presetName === 'spark' ? 0.5 : 1.2;
      p.x = at.x + p.vx * 0.02 * off; p.y = at.y + p.vy * 0.02 * off; p.z = at.z + p.vz * 0.02 * off;
      p.age = 0;
      p.life = pre.life * (0.7 + rng() * 0.6);
      p.drag = pre.drag;
      p.s0 = pre.s0 * (0.7 + rng() * 0.6);
      p.grow = pre.grow;
      p.peak = pre.peak * (0.8 + rng() * 0.4);
      const pair = pre.pal[(rng() * pre.pal.length) | 0];
      const m = rng() * 0.5;                       /* start mixed toward end */
      p.cr = pair[0][0] + (pair[1][0] - pair[0][0]) * m;
      p.cg = pair[0][1] + (pair[1][1] - pair[0][1]) * m;
      p.cb = pair[0][2] + (pair[1][2] - pair[0][2]) * m;
      p.fr = pair[1][0]; p.fg = pair[1][1]; p.fb = pair[1][2];
      spawned++;
    }
    this.alive = this.items.length - this._freeN;
    if (spawned > 0) {                        /* scalar counters (harness) */
      this.burstCount++;
      this.presetFired[presetName] = (this.presetFired[presetName] || 0) + 1;
    }
    return spawned;
  }

  /* --- point lights: take a dead slot or steal the oldest live one ------- */
  light(kind, at) {
    const cfg = this._L[kind];
    if (!cfg || !at) return;
    let slot = null, oldest = Infinity;
    const live = this.lights;
    for (let i = 0; i < live.length; i++) {
      const s = live[i];
      if (s.ttl <= 0) { slot = s; break; }
      if (s.ttl < oldest) { oldest = s.ttl; slot = s; }
    }
    if (!slot) return;
    slot.ttl = slot.life = cfg.life;
    slot.peak = cfg.i;
    slot.light.color.setHex(kind === 'muzzle' ? 0xbfe8ff : (kind === 'volatile' ? 0xff5a1e : 0xffa050));
    slot.light.distance = cfg.dist;
    slot.light.position.copy(at);
    slot.light.intensity = cfg.i;
  }

  /* convenience: burst + light together for the rock-explosion ladder */
  explosion(at, size, vel) {
    this.burst(size === 'large' ? 'large' : (size === 'medium' ? 'medium' : 'small'), at, vel);
    if (size !== 'small') this.light('explosion', at);   /* smalls keep slots free for muzzles */
  }
  volatileBurst(at, vel) { this.burst('volatile', at, vel); this.light('volatile', at); }
  sparks(at) { this.burst('spark', at, null); }
  muzzleFlash(at) { this.burst('muzzle', at, null); this.light('muzzle', at); }
  collect(at) { this.burst('collect', at, null); }
  spray(at, vel) { this.burst('spray', at, vel); }
  death(at, vel) { this.burst('debris', at, vel); this.light('explosion', at); }

  /* --- engine exhaust: cadence accumulator, two tail bells, while thrust
     is on. Called by Game every PLAYING frame with the live ship. ---------- */
  exhaust(dt, ship) {
    const lvl = ship && ship.thrustLevel ? ship.thrustLevel : 0;
    if (lvl <= 0.08 || !ship.group.visible) { this._puffT = 0; return; }
    this._puffT += dt;
    const every = this.P.exhaust.every;
    let guard = 4;                                  /* never chase long frames */
    while (this._puffT >= every && guard-- > 0) {
      this._puffT -= every;
      this._nose.set(0, 0, -1).applyQuaternion(ship.group.quaternion);
      for (let s = 1; s >= -1; s -= 2) {
        this._v.set(ship.position.x + this._nose.x * 9.6 + s * 1.3,
                    ship.position.y + this._nose.y * 9.6,
                    ship.position.z + this._nose.z * 9.6);
        const p = this._obtain();
        if (!p) return;
        const pre = this._pre.exhaust;
        const spd = pre.spd * (0.5 + lvl) * (0.5 + rng() * 0.8);
        p.vx = this._nose.x * spd + ship.velocity.x * 0.2 + (rng() - 0.5) * pre.jit;
        p.vy = this._nose.y * spd + ship.velocity.y * 0.2 + (rng() - 0.5) * pre.jit;
        p.vz = this._nose.z * spd + ship.velocity.z * 0.2 + (rng() - 0.5) * pre.jit;
        p.x = this._v.x; p.y = this._v.y; p.z = this._v.z;
        p.age = 0;
        p.life = pre.life * (0.7 + rng() * 0.6);
        p.drag = pre.drag;
        p.s0 = pre.s0 * (0.7 + rng() * 0.6) * (0.6 + lvl * 0.8);
        p.grow = pre.grow;
        p.peak = pre.peak * (0.5 + lvl * 0.7);
        const pair = pre.pal[(rng() * pre.pal.length) | 0];
        p.cr = pair[0][0]; p.cg = pair[0][1]; p.cb = pair[0][2];
        p.fr = pair[1][0]; p.fg = pair[1][1]; p.fb = pair[1][2];
      }
      this.alive = this.items.length - this._freeN;
    }
  }

  /* --- one forward loop over the FIXED pool: integrate + write attributes.
     Steady state allocates nothing; a dying sprite releases its index back
     onto the free stack (O(1)), and the attribute upload happens once per
     frame only while anything is alive (or one final flush as it empties). */
  update(dt) {
    const items = this.items, cap = items.length;
    const pa = this._posArr, ca = this._colArr, sa = this._sizeArr, aa = this._alphaArr;
    let n = 0;
    for (let i = 0; i < cap; i++) {
      const p = items[i];
      if (!p.alive) continue;
      p.age += dt;
      const t = p.age / p.life;
      if (t >= 1) {
        p.alive = false;
        aa[i] = 0; sa[i] = 0;
        this._free[this._freeN++] = i;             /* recycle the slot O(1) */
        continue;
      }
      const damp = 1 / (1 + p.drag * dt);           /* stable at any dt */
      p.vx *= damp; p.vy *= damp; p.vz *= damp;
      p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
      const k = i * 3;
      pa[k] = p.x; pa[k + 1] = p.y; pa[k + 2] = p.z;
      /* fade ramp: quick attack, pow decay. Size ramp: s0 -> s0*grow eased. */
      const a = t < 0.08 ? t / 0.08 : Math.pow(1 - (t - 0.08) / 0.92, 1.5);
      aa[i] = a * p.peak;
      const g = 1 + (p.grow - 1) * (1 - (1 - t) * (1 - t));
      sa[i] = p.s0 * g;
      ca[k] = p.cr + (p.fr - p.cr) * t;
      ca[k + 1] = p.cg + (p.fg - p.cg) * t;
      ca[k + 2] = p.cb + (p.fb - p.cb) * t;
      n++;
    }
    this.alive = n;                                /* exact: cap - freeN */
    if (n > 0 || this._dirty) {
      this._dirty = (n > 0);
      this._aPos.needsUpdate = true;
      this._aCol.needsUpdate = true;
      this._aSize.needsUpdate = true;
      this._aAlpha.needsUpdate = true;
    }

    /* light fades: quadratic intensity decay so they read as flashes */
    const live = this.lights;
    for (let i = 0; i < live.length; i++) {
      const s = live[i];
      if (s.ttl <= 0) continue;
      s.ttl -= dt;
      const u = Math.max(0, s.ttl / s.life);
      s.light.intensity = s.peak * u * u;
      if (s.ttl <= 0) { s.ttl = 0; s.light.intensity = 0; }
    }
  }

  /* state-machine seam: title / restart wipes every sprite + light and
     rebuilds the free stack in its original order (determinism-friendly). */
  clear() {
    const items = this.items, cap = items.length;
    for (let i = 0; i < cap; i++) { items[i].alive = false; this._alphaArr[i] = 0; this._sizeArr[i] = 0; }
    for (let i = 0; i < cap; i++) this._free[i] = cap - 1 - i;
    this._freeN = cap;
    this.alive = 0;
    this._dirty = true;
    this._puffT = 0;
    this._aPos.needsUpdate = this._aCol.needsUpdate = this._aSize.needsUpdate = this._aAlpha.needsUpdate = true;
    const live = this.lights;
    for (let i = 0; i < live.length; i++) { live[i].ttl = 0; live[i].light.intensity = 0; }
  }
}

/* ==== 75-audio.js ==== */
/* ===== SECTION: Audio — 100% procedural Web Audio (no samples, no data URIs) ===== */
/* SPEC "Audio (Web Audio API, procedural)" stage 7: engine rumble pitched by
   thrust, pulse / flak / missile whoosh, rock crack per size + explosion
   layers (noise + bass), volatile blast, rising pickup chime, wave stinger,
   hunter bolt + hunter destroyed, low-frequency passing-whoosh when a large
   rock sweeps close, low-hull alarm ping (~1 Hz while hull < 25%), extra-life
   jingle. Every sound is oscillators + one generated white-noise buffer +
   biquad filters + gain envelopes — zero sample data in the file.

   AUTOPLAY POLICY: the AudioContext is created LAZILY at the first user
   gesture (trusted key/mouse press or completed touch) and
   resume()d there — never constructed at load, so a muted-safe page start
   is the default. EVERY init/resume/voice call is try/catch wrapped: if a
   browser has no Web Audio the game goes silent, not broken (zero console
   errors is a hard requirement; internal failures go to __K.log).

   MUTE: M flips __K.muted (stage 5). update(dt) watches the edge and
   ramps the master gain to 0 / TUNE.audio.master; a sound fired while muted
   still books lastSound (the harness reads it) but synthesises nothing.

   PURE LOGIC (tests/audio_harness.mjs, no AudioContext needed):
     enginePitch(level)      fMin + (fMax-fMin) * level^curve
     alarmPeriod(hull)       fast beat <= fastHull, else period (~1 Hz)
     whooshStep(dPrev, dNow, armed)
                             hysteresis trigger: ARMED beyond armRange,
                             FIRES crossing inside trigRange, re-arms only
                             by leaving armRange again (one whoosh per pass)
     (shake-scaling table + particle pool caps are asserted against
      Particles.shakeFor / Particles in the same harness.)                    */
class Audio {
  constructor(game) {
    this.game = game;
    this.A = __K.TUNE.audio;
    this.ctx = null;
    this.master = null;
    this.lastSound = '';
    this._dead = false;        /* no Web Audio at all: permanently silent */
    this._initTried = false;
    this._noiseBuf = null;
    this._irBuf = null;
    this._recoveryRng = __K.rng(0xa77f01);
    this._graphNodes = [];
    this._resumeAttempt = null;
    this._lastRecoveryAt = -Infinity;
    this.recoveryOutcome = 'uninitialized';
    this.lastRecoveryError = '';
    this._sessionAttempted = false;
    this.sessionType = 'uninitialized';
    this.sessionOutcome = 'uninitialized';
    this.sessionError = '';
    this._wasMuted = !!__K.muted;

    /* __K.audio surface: __K.audio.state / .lastSound (instance identity) */
    const self = this;
    __K.audio = this;
    if (typeof __K.bloom !== 'string') __K.bloom = 'off';

    /* low-hull alarm cadence lives in the HUD (stage 5); this is its sound
       seam (80-hud.js calls window.__kAlarm() at alarmPeriod(hull) beats) */
    window.__kAlarm = function () { self.play('alarm'); };

    /* Keep recovery available after rejection, interruption or backgrounding.
       Only browser-delivered activation gestures may enter this path. */
    const gesture = function (e) {
      if (self._qualifies(e)) self._recover();
    };
    for (const type of ['keydown', 'pointerdown', 'pointerup', 'touchend', 'click'])
      document.addEventListener(type, gesture, true);
  }

  _qualifies(e) {
    if (!e || e.isTrusted !== true) return false;
    if (e.type === 'keydown')
      return !e.repeat && !e.metaKey && !e.ctrlKey &&
        e.key !== 'Escape' && e.code !== 'Escape' &&
        e.key !== 'Meta' && e.key !== 'Control';
    if (e.type === 'pointerdown') return e.pointerType === 'mouse';
    if (e.type === 'pointerup') return e.pointerType === 'touch' || e.pointerType === 'pen';
    return e.type === 'touchend' || e.type === 'click';
  }

  /* iOS maps Web Audio to ambient sound by default, which obeys Silent
     Mode. Request media-style output only inside a qualifying user gesture.
     This policy can interrupt other playback; game mute/volume still apply.
     Unsupported/throwing browsers retain their ordinary Web Audio behavior. */
  _configureSession() {
    if (this._sessionAttempted) return;
    this._sessionAttempted = true;
    try {
      const session = (typeof navigator !== 'undefined') && navigator.audioSession;
      if (!session) {
        this.sessionType = 'unavailable';
        this.sessionOutcome = 'unsupported';
        return;
      }
      this.sessionType = session.type || 'unknown';
      const already = this.sessionType === 'playback';
      if (!already) session.type = 'playback';
      this.sessionType = session.type || 'unknown';
      this.sessionOutcome = this.sessionType === 'playback' ?
        (already ? 'already-playback' : 'requested') : 'unapplied';
      if (this.sessionOutcome === 'unapplied')
        __K.log('audio: playback session unavailable; keeping browser audio policy');
    } catch (e) {
      if (this.sessionType === 'uninitialized') this.sessionType = 'unknown';
      this.sessionOutcome = 'failed';
      this.sessionError = String((e && e.message) || e).slice(0, 200);
      __K.log('audio: playback session failed; keeping browser audio policy');
    }
  }

  /* One attempt per gesture burst. Safari can leave resume() pending until a
     later activation; after 1.5s a new gesture may retry, never a frame/timer.
     The attempt token prevents old promises overwriting newer diagnostics. */
  _recover() {
    if (this._dead) return;
    this._configureSession();
    const now = performance.now();
    if (this.ctx && this.ctx.state === 'running') {
      this.recoveryOutcome = 'running';
      return;
    }
    if (now - this._lastRecoveryAt < 250) return;
    if (this._resumeAttempt && now - this._resumeAttempt.at < 1500) return;
    this._lastRecoveryAt = now;
    if (this.ctx && this.ctx.state === 'closed') this._disposeGraph();
    this._ensure();
    const ctx = this.ctx;
    if (!ctx || ctx.state === 'running') return;
    const attempt = this._resumeAttempt = { ctx: ctx, at: now };
    this.recoveryOutcome = 'pending';
    this.lastRecoveryError = '';
    const settled = (error) => {
      if (this._resumeAttempt !== attempt || this.ctx !== ctx) return;
      this._resumeAttempt = null;
      this.recoveryOutcome = error ? 'rejected' : (ctx.state === 'running' ? 'running' : 'needs-gesture');
      if (error) {
        this.lastRecoveryError = 'resume() rejected';
        __K.log('audio: resume rejected; next gesture can retry');
      }
    };
    try {
      const p = ctx.resume();
      if (p && typeof p.then === 'function') p.then(() => settled(false), () => settled(true));
      else settled(false);
    } catch (e) { settled(true); }
  }

  /* Preserve SPEC-facing strings; diagnostics can inspect the real lifecycle. */
  get contextState() { return this.ctx ? this.ctx.state : (this._dead ? 'unavailable' : 'uninitialized'); }

  _node(node) { this._graphNodes.push(node); return node; }

  _clearFx() {
    for (const key of ['_drive', '_crush', '_crushTone', '_crushW', '_crushD',
                      '_verb', '_wet', '_delay', '_delayFb', '_delayMix']) this[key] = null;
  }

  _disposeGraph() {
    const ctx = this.ctx;
    this._resumeAttempt = null;
    for (const node of [this._engOsc, this._engSub, this._engNoise]) {
      if (node) { try { node.stop(); } catch (e) { /* already stopped */ } }
    }
    for (const node of this._graphNodes) {
      try { node.disconnect(); } catch (e) { /* unsupported stub/node */ }
    }
    this._graphNodes.length = 0;
    this._clearFx();
    for (const key of ['master', '_bus', '_engGain', '_engLp', '_engOsc', '_engSub', '_engNoise']) this[key] = null;
    this.ctx = null;
    if (ctx) {
      ctx.onstatechange = null;
      try {
        if (ctx.state !== 'closed') {
          const p = ctx.close();
          if (p && p.catch) p.catch(function () {});
        }
      } catch (e) { /* failed graph must never break gameplay */ }
    }
  }

  /* harness-readable context state (SPEC-safe strings) */
  get state() {
    if (this._wasMuted) return 'muted';
    return (this.ctx && this.ctx.state === 'running') ? 'running' : 'suspended';
  }

  /* --- pure pitch curve: thrustLevel 0..1 -> engine Hz (monotone, bounded) */
  enginePitch(level) {
    const E = this.A.engine;
    const l = clampNum(level, 0, 1);
    return E.fMin + (E.fMax - E.fMin) * Math.pow(l, E.curve);
  }

  /* --- pure alarm beat: ~1 Hz below the threshold, urgent under fastHull */
  alarmPeriod(hull) {
    const AL = this.A.alarm;
    return hull <= AL.fastHull ? AL.fastPeriod : AL.period;
  }

  /* --- pure passing-whoosh hysteresis (per large rock, per frame) ---------
     armed=true + moved closer + inside trigRange  -> fire, disarm.
     beyond armRange                              -> re-arm.
     otherwise holds its state. No rng, no time — a test feeds distances. */
  whooshStep(dPrev, dNow, armed) {
    const W = this.A.whoosh;
    let fire = false;
    if (dPrev >= W.armRange) armed = true;
    else if (dPrev <= W.trigRange) armed = false;
    if (armed && dNow <= W.trigRange && dNow < dPrev) { fire = true; armed = false; }
    return { fire: fire, armed: armed };
  }

  /* --- lazy AudioContext + the shared voice chain (try/catch, never fatal) */
  _ensure() {
    if (this.ctx || this._dead) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { this._dead = true; this.recoveryOutcome = 'unavailable'; this.lastRecoveryError = 'Web Audio unavailable'; __K.log('audio: no AudioContext (silent)'); return; }
      const ctx = this.ctx = new AC();
      this._wasMuted = !!__K.muted;
      this._lastMaster = this.A.master;
      ctx.onstatechange = () => {
        if (this.ctx !== ctx) return;
        this.recoveryOutcome = ctx.state === 'running' ? 'running' : 'needs-gesture';
        if (ctx.state === 'running' || ctx.state === 'closed') this._resumeAttempt = null;
      };
      const comp = this._node(ctx.createDynamicsCompressor());
      comp.connect(ctx.destination);
      const master = this.master = this._node(ctx.createGain());
      master.gain.value = this._wasMuted ? 0 : this.A.master;
      master.connect(comp);

      /* --- FX chain (Sound Lab schema kessler-soundlab@1): one-shot voices
         and the engine bed feed an sfx bus instead of master directly:
           bus -> drive(WaveShaper soft-clip) -> crush(WaveShaper, wet/dry)
              -> master ; bus -> convolver(reverb) -> wet -> master ;
              bus -> delay(+feedback) -> delayMix -> master.
         All mixes default-dry-safe and every node creation is inside the
         same try/catch as the context: an unsupported node sinks the whole
         graph to the old straight bus->master wiring, never the game. --- */
      const FX = this.A.fx || {};
      const bus = this._bus = this._node(ctx.createGain());
      const fxStart = this._graphNodes.length;
      try {
        const drive = this._drive = this._node(ctx.createWaveShaper());
        drive.oversample = '4x';
        drive.curve = this._driveCurve(FX.drive || 0);
        const crush = this._crush = this._node(ctx.createWaveShaper());
        crush.oversample = '4x';
        const bits = FX.crushBits | 0;
        if (bits >= 1 && bits <= 16) crush.curve = this._crushCurve(bits);
        const crushTone = this._crushTone = this._node(ctx.createBiquadFilter());
        crushTone.type = 'lowpass'; crushTone.frequency.value = 6800;
        const crushW = this._crushW = this._node(ctx.createGain());
        const crushD = this._crushD = this._node(ctx.createGain());
        const cm = (bits >= 1) ? (FX.crushMix || 0) : 0;
        crushW.gain.value = cm; crushD.gain.value = 1 - cm;
        const verb = this._verb = this._node(ctx.createConvolver());
        verb.buffer = this._ir();
        const wet = this._wet = this._node(ctx.createGain()); wet.gain.value = FX.reverbMix || 0;
        const dly = this._delay = this._node(ctx.createDelay(1.0));
        dly.delayTime.value = FX.delayTime || 0.19;
        const dfb = this._delayFb = this._node(ctx.createGain()); dfb.gain.value = 0.36;
        const dmix = this._delayMix = this._node(ctx.createGain()); dmix.gain.value = FX.delayMix || 0;
        bus.connect(drive);
        drive.connect(crush); crush.connect(crushTone);
        crushTone.connect(crushW); crushW.connect(master);
        crush.connect(crushD); crushD.connect(master);   /* dry = post-crush, pre-tone, like the lab */
        bus.connect(verb); verb.connect(wet); wet.connect(master);
        bus.connect(dly); dly.connect(dfb); dfb.connect(dly);
        dly.connect(dmix); dmix.connect(master);
      } catch (e) {
        /* FX nodes unsupported: plain wiring, game stays audible */
        for (const node of this._graphNodes.splice(fxStart)) {
          try { node.disconnect(); } catch (ignored) { /* partial FX */ }
        }
        try { bus.disconnect(); } catch (ignored) { /* no wiring yet */ }
        this._clearFx();
        bus.connect(master);
        __K.log('audio: FX chain unavailable, dry wiring');
      }

      /* one shared white-noise buffer (generated — SPEC bans samples) */
      if (!this._noiseBuf) {
        const len = (ctx.sampleRate * 1.2) | 0;
        const buf = ctx.createBuffer(1, len, ctx.sampleRate);
        const ch = buf.getChannelData(0);
        for (let i = 0; i < len; i++) ch[i] = this._bufferRandom() * 2 - 1;
        this._noiseBuf = buf;
      }
      const buf = this._noiseBuf;   /* AudioBuffers are reusable across contexts */

      /* engine voices: two oscillators + looping noise through a lowpass,
         summed into ONE gain that update(dt) rides with thrust. Created
         once, started once, and simply gain-0 when idle (safe stop). */
      const eg = this._engGain = this._node(ctx.createGain());
      eg.gain.value = 0;
      eg.connect(this._bus || master);
      const lp = this._engLp = this._node(ctx.createBiquadFilter());
      lp.type = 'lowpass'; lp.frequency.value = 220; lp.Q.value = 0.7;
      lp.connect(eg);
      const o1 = this._engOsc = this._node(ctx.createOscillator());
      o1.type = 'sawtooth'; o1.frequency.value = this.A.engine.fMin;
      o1.connect(lp);
      const o2 = this._engSub = this._node(ctx.createOscillator());
      o2.type = 'sine'; o2.frequency.value = this.A.engine.fMin * 0.5;
      const o2g = this._node(ctx.createGain()); o2g.gain.value = this.A.engine.subGain;
      o2.connect(o2g); o2g.connect(lp);
      const ns = this._engNoise = this._node(ctx.createBufferSource());
      ns.buffer = buf; ns.loop = true;
      const nsg = this._node(ctx.createGain()); nsg.gain.value = this.A.engine.noiseGain;
      ns.connect(nsg); nsg.connect(lp);
      o1.start(); o2.start(); ns.start();
      this.recoveryOutcome = ctx.state === 'running' ? 'running' : 'needs-gesture';
      this.lastRecoveryError = '';
    } catch (e) {
      this._disposeGraph();
      this.recoveryOutcome = 'init-failed';
      this.lastRecoveryError = String((e && e.message) || e).slice(0, 200);
      __K.log('audio init failed (silent): ' + ((e && e.message) || e));
    }
    this._initTried = true;
  }

  /* --- FX curve builders (deterministic; the IR uses the game's seeded rng,
     never Math.random — project invariant) */
  _driveCurve(amt){
    const k = Math.tanh(amt || 0), c = new Float32Array(2048);
    for (let i = 0; i < 2048; i++) {
      const x = i / 2047 * 2 - 1;
      c[i] = (1 + k) * x / (1 + k * Math.abs(x));
    }
    return c;
  }
  _crushCurve(bits){
    const n = Math.pow(2, bits), c = new Float32Array(1024);
    for (let i = 0; i < 1024; i++) {
      const x = i / 1023 * 2 - 1;
      c[i] = Math.round(x * n / 2) / (n / 2);
    }
    return c;
  }
  /* Keep initial seeded output unchanged. An uncached buffer first needed
     after a failed initialization uses a private stream: recovery must not
     move gameplay's RNG. Same-rate replacements reuse both AudioBuffers. */
  _bufferRandom() { return this._initTried ? this._recoveryRng() : rng(); }

  _ir(){                              /* generated exponentially-decaying noise */
    const ctx = this.ctx, FX = this.A.fx || {};
    /* Unlike BufferSource noise, a convolver requires its IR sample rate to
       match the context. Regenerate on rate changes using recovery RNG. */
    if (this._irBuf && this._irBuf.sampleRate === ctx.sampleRate) return this._irBuf;
    const len = Math.max(1, (ctx.sampleRate * (FX.reverbSize || 2.2)) | 0);
    const buf = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) {
      const ch = buf.getChannelData(c);
      for (let i = 0; i < len; i++)
        ch[i] = (this._bufferRandom() * 2 - 1) * Math.pow(1 - i / len, 2.5);
    }
    this._irBuf = buf;
    return buf;
  }

  /* --- one-shot builders (allocation is per SOUND, never per frame).
     `when` delays a note's start (arpeggios); envelopes are
     attack-ramp up then exponential decay to silence. -------------------- */
  _tone(type, f0, f1, dur, peak, attack, when) {
    const ctx = this.ctx;
    const o = ctx.createOscillator();
    o.type = type;
    const g = ctx.createGain();
    const t = ctx.currentTime + (when || 0);
    o.frequency.setValueAtTime(Math.max(1, f0), t);
    o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(peak, t + Math.min(attack, dur * 0.5));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this._bus || this.master);
    o.start(t); o.stop(t + dur + 0.02);
    return o;
  }

  _noise(dur, filter, f0, f1, peak, attack, when) {
    const ctx = this.ctx;
    const s = ctx.createBufferSource();
    s.buffer = this._noiseBuf;
    const bf = ctx.createBiquadFilter();
    bf.type = filter;
    const t = ctx.currentTime + (when || 0);
    bf.frequency.setValueAtTime(Math.max(1, f0), t);
    bf.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(peak, t + Math.min(attack, dur * 0.5));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(bf); bf.connect(g); g.connect(this._bus || this.master);
    s.start(t); s.stop(t + dur + 0.02);
    return s;
  }

  /* --- the sound bank: every SPEC event has one entry here --------------- */
  _synth(name) {
    const c = this.ctx;
    switch (name) {
      case 'seekerLock':
        this._tone('sine', 660, 880, 0.10, 0.08, 0.005);
        this._tone('sine', 880, 880, 0.08, 0.06, 0.005, 0.10);
        break;
      case 'pulse':
        this._tone('square', 539, 170, 0.32, 0.205, 0.06);
        this._noise(0.56, 'highpass', 2097, 1200, 0.06, 0.002);
        break;
      case 'flak':
        this._noise(0.94, 'bandpass', 1047, 300, 0.19, 0.004);
        this._tone('sawtooth', 222, 48, 1.13, 0.145, 0.282);
        break;
      case 'missile':
        this._noise(1.295, 'bandpass', 162, 2445, 0.375, 0.06);   /* launch whoosh */
        this._tone('sine', 2911, 1819, 1.84, 0.36, 0.05);
        break;
      case 'crackSmall':
        this._noise(1.205, 'bandpass', 950, 600, 0.2, 0.002);
        this._tone('triangle', 300, 140, 0.08, 0.06, 0.002);
        break;
      case 'crackMedium':
        this._noise(1.59, 'bandpass', 329, 79, 0.485, 0.042);
        this._tone('sawtooth', 220, 90, 0.21, 0.475, 0.003);
        break;
      case 'crackLarge':
        this._noise(1.28, 'bandpass', 331, 20, 0.445, 0.004);
        this._tone('sawtooth', 160, 40, 0.22, 0.435, 0.004);
        break;
      case 'explosion':
        this._noise(1.7, 'lowpass', 900, 90, 0.5, 0.005);         /* body  */
        this._tone('sine', 85, 26, 0.55, 0.5, 0.006);             /* bass  */
        this._noise(0.09, 'highpass', 3000, 1500, 0.18, 0.001);   /* crack */
        break;
      case 'volatile':
        this._tone('sawtooth', 90, 800, 0.16, 0.16, 0.02);     /* rising snap */
        this._noise(1.1, 'lowpass', 1400, 60, 0.55, 0.02);
        this._tone('sine', 60, 18, 0.9, 0.55, 0.02);
        break;
      case 'pickup':
        this._tone('sine', 523, 523, 0.16, 0.16, 0.004, 0);       /* C5 -> E5 rising */
        this._tone('sine', 659, 659, 0.22, 0.14, 0.004, 0.07);
        break;
      case 'extraLife':
        this._tone('sine', 523, 523, 0.14, 0.15, 0.004, 0);       /* C-E-G arpeggio */
        this._tone('sine', 659, 659, 0.14, 0.15, 0.004, 0.11);
        this._tone('sine', 784, 784, 0.5, 0.16, 0.004, 0.22);
        break;
      case 'stinger':
        this._tone('sawtooth', 55, 110, 0.85, 0.2, 0.25);      /* wave drone */
        this._tone('sawtooth', 82.5, 165, 0.85, 0.1, 0.3);     /* +fifth     */
        this._noise(0.5, 'lowpass', 300, 120, 0.1, 0.2);
        break;
      case 'hunterBolt':
        this._tone('square', 330, 110, 0.18, 0.12, 0.004);
        this._noise(0.08, 'bandpass', 1800, 700, 0.05, 0.002);
        break;
      case 'hunterDeath':
        this._noise(1.95, 'lowpass', 1800, 120, 0.35, 0.003);
        this._tone('square', 1194, 423, 0.6, 0.05, 0.092);
        break;
      case 'whoosh':
        this._noise(1.04, 'lowpass', 300, 70, 0.71, 0.126);    /* low pass-by sweep */
        break;
      case 'alarm':
        this._tone('sine', 880, 880, 0.09, 0.14, 0.005, 0);      /* double ping */
        this._tone('sine', 880, 880, 0.09, 0.12, 0.005, 0.13);
        break;
      case 'shieldHit':
        this._tone('sawtooth', 659, 20, 0.495, 0.12, 0.002);
        this._noise(1.18, 'lowpass', 3500, 2000, 0.29, 0.076);
        break;
      case 'hullHit':
        this._tone('sawtooth', 1200, 60, 0.355, 0.24, 0.036);
        this._noise(1.96, 'lowpass', 5318, 2615, 0.315, 0.122);
        break;
      case 'shipDeath':
        this._noise(2.77, 'lowpass', 2496, 50, 0.6, 0.004);
        this._tone('sine', 298, 20, 1.28, 0.55, 0.006);
        this._tone('sawtooth', 300, 40, 0.7, 0.18, 0.01);
        break;
      default:
        __K.log('audio: unknown sound ' + name);
        break;
    }
  }

  /* --- the door: books lastSound ALWAYS (even muted/dead), synthetises ----
     only when audible. Nothing here can throw into the game loop. --------- */
  play(name, arg) {
    if (!name) return;
    this.lastSound = name;
    if (this._dead || !this.ctx || __K.muted) return;
    if (this.ctx.state !== 'running') return;   /* pre-gesture: silently drop */
    try { this._synth(name); }
    catch (e) { __K.log('audio synth failed: ' + name); }
  }

  /* --- per-frame (Game, every PLAYING frame): engine pitch + mute edge ----
     dt is unused by design (all motion is setTargetAtTime automation); the
     signature matches every other system's update(dt). */
  update(dt) {
    if (this._wasMuted !== !!__K.muted || this._lastMaster !== this.A.master) {
      this._wasMuted = !!__K.muted;
      this._lastMaster = this.A.master;
      if (this.master && this.ctx) {
        try {
          this.master.gain.setTargetAtTime(this._wasMuted ? 0 : this.A.master,
                                           this.ctx.currentTime, 0.05);
        } catch (e) { /* silent */ }
      }
    }
    if (this._dead || !this.ctx || this.ctx.state !== 'running') return;
    const g = this.game, E = this.A.engine;
    const playing = __K.state === 'PLAYING';
    const lvl = (playing && g.ship && g.ship.group.visible) ? (g.ship.thrustLevel || 0) : 0;
    try {
      const t = this.ctx.currentTime;
      const idle = lvl < E.floor;
      this._engGain.gain.setTargetAtTime(idle ? 0 : E.gainLo + (E.gainHi - E.gainLo) * lvl, t, 0.12);
      if (!idle) {
        const f = this.enginePitch(lvl);
        this._engOsc.frequency.setTargetAtTime(f, t, 0.06);
        this._engSub.frequency.setTargetAtTime(f * 0.5, t, 0.06);
        this._engLp.frequency.setTargetAtTime(E.lpOpen + E.lpSpan * lvl, t, 0.1);
      }
    } catch (e) { /* silent */ }
  }

  /* --- passing-whoosh sweep: called by Game with the live rock list.
     Per-rock state (armed / prev distance) lives ON the rock record —
     undefined reads as "far" so a recycled slot is always armed. ---------- */
  whooshTick(ship, live) {
    if (this._dead || !this.ctx || __K.muted || !ship) return;
    for (let i = 0; i < live.length; i++) {
      const r = live[i];
      if (r.size !== 'large') continue;         /* SPEC: big rock passes close */
      const dx = r.position.x - ship.position.x, dy = r.position.y - ship.position.y,
            dz = r.position.z - ship.position.z;
      const d = Math.sqrt(dx * dx + dy * dy + dz * dz);
      const st = this.whooshStep(r._wPrev === undefined ? 1e9 : r._wPrev, d, r._wArmed !== false);
      r._wPrev = d;
      r._wArmed = st.armed;
      if (st.fire) this.play('whoosh');
    }
  }

  /* state-machine seam: kill the engine bed + rearm the mute watch */
  resetRun() {
    this._wasMuted = !!__K.muted;
    if (this._dead || !this.ctx) return;
    try { this._engGain.gain.setTargetAtTime(0, this.ctx.currentTime, 0.05); }
    catch (e) { /* silent */ }
  }
}
