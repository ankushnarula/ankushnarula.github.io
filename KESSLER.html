    document.addEventListener('pointerlockerror', function () {
      __K.log('pointer lock request rejected by browser (playing unlocked)');
    });

    /* Mouse inside the gesture so the FIRST click can also lock. Left =
       primary fire (suppressed outside PLAYING by Input._mouseDown — the
       start click must not shoot; stage 6 reads the same flag). Also
       re-requests the lock mid-play when a gamepad/harness unlocked the
       mouse. Right = secondary fire — stage 6 (missiles) assigns that
       flag; until then the button only stops the context menu. Wheel =
       weapon slot request, routed to the stage-6 seam when one exists. */
    document.addEventListener('mousedown', function (e) {

      if (keyboardUI(e.target)) return;
      if (e.button === 0) {

        self.input._mouseDown(e, play);

        else if (play) {
          self._focusGameplay();

        }

    });
    document.addEventListener('mouseup', function (e) { self.input._mouseUp(e); });
    document.addEventListener('contextmenu', function (e) { e.preventDefault(); });

    /* Secondary fire combines held F/RMB; WeaponController reads the flag.
       Input._releaseAll clears both sources on blur and state transitions. */
    self.secondaryFire = false;

    /* Stage 6 weapon keys: F = secondary fire (seeker launch, whatever the
       slot — SPEC keeps missiles as their own binding too); 1/2/3 = weapon
       slots. PLAYING gate here so a pause-screen keypress never swaps. */
    this.input.onSecondary = function (down) {
      /* Releases must land even outside PLAYING. A still-held RMB keeps
         firing when F is released; both sources share the seeker cooldown. */
      if (!down) { self.secondaryFire = !!self.input.secondaryMouse; return; }
      if (__K.state !== 'PLAYING' || !self.weapons) return;
      self.secondaryFire = true;
      if (self.weapons._seekCool <= 0) self.weapons._launchSeeker();
    };
    this.input.onWeaponKey = function (n) {
      if (__K.state !== 'PLAYING' || !self.weapons) return;
      self.weapons.select(['pulse', 'flak', 'seeker'][(n | 0) - 1]);
    };

    /* Wheel routing (stage-10 A2): while the rig's zoom/free-look mode is
       ON (V toggles it — see the keydown listener above), the wheel zooms
       the chase camera (scroll down = trail back + widen, scroll up =
       magnify) in any state — harmless springs. With zoom mode OFF the
       wheel keeps cycling weapon slots exactly as before, PLAYING-gated;
       the wheel is NOT hijacked for zoom outside the mode. */
    window.addEventListener('wheel', function (e) {
      if (self.hud && (self.hud.settingsOpen || self.hud.upgradesOpen)) return;
      if (self.cam && self.cam.zoomMode) { self.cam.setZoom(e.deltaY > 0 ? 1 : -1); return; }
      if (__K.state !== 'PLAYING') return;
      if (typeof self.requestWeapon === 'function') self.requestWeapon(e.deltaY > 0 ? 1 : -1);
    }, { passive: true });

    /* Tab/alt-tab out while playing: pause (pointerlockchange already covers
       locked play; this catches unlocked play). */
    window.addEventListener('blur', function () { self.requestPause(); });
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) self.requestPause();
    });
  }

  /* --- screen sync: the HUD screen is a pure function of __K.state --------- */
  _syncScreens() {
    if (!this.hud) return;
    const s = __K.state;
    const want = s === 'TITLE' ? 'title'
      : s === 'PAUSED' ? 'pause'
      : s === 'GAMEOVER' ? 'gameover'
      : 'play';
    this.hud.showScreen(want);
  }

  /* Boundary-warning ratio for the HUD (game sets it every frame; HUD only
     paints). Reuses TUNE.flight.springMargin — full strength AT the margin
     where the inward spring starts, so the wash explains the push. */
  _edgeRatio(p) {
    const S = __K.TUNE.sector, halfX = S.x / 2, halfZ = S.z / 2;
    const ax = Math.abs(p.x), az = Math.abs(p.z);
    if (ax > halfX - 12 || az > halfZ - 12) return 1;             /* past margin: max */
    if (ax <= halfX * this._springMargin && az <= halfZ * this._springMargin) return 0;
    /* closing rate toward the nearer edge (outward = positive) */
    const outward = (ax > az ? this.ship.velocity.x * Math.sign(p.x) / 12 : 0)
      + (az >= ax ? this.ship.velocity.z * Math.sign(p.z) / 12 : 0);
    return clampNum(0.35 + Math.max(0, outward) * 0.65, 0.35, 1);
  }

  /* ---- STAGE 11 AIM ASSIST (lock bracket) ---------------------------------
     The chase camera's forward vector converges EXACTLY on ship.nose (0.000 deg
     steady state, reticle_harness P1), so a rock sitting under the static CSS
     reticle IS on the gun ray — but the player has no readout of WHICH merged
     registry entry that is, and moving rocks need lead. _aimScan picks the
     entry closest in ANGLE to ship.nose inside TUNE.aim.lockConeDeg (an assist
     cone, wider than the 34px ring — a lock, not a precision test), ties won
     by the SHIP-nearest entry; dead entries (hp <= 0) are skipped.
     Zero allocation: pure component math, results stored as references/
     numbers, __K surface publishes only scalars (kind string + degrees).

     Game._aimLockScore / _aimPick / _leadTime are PURE statics (plain
     {x,y,z} shapes — THREE.Vector3 satisfies them, node harness calls them
     directly with literals, no THREE needed), mirroring the Radar._bearing /
     Radar._scopePos testing pattern. */

  /* Lock score: cosine of the angle between unit `nose` and the offset
     (dx,dy,dz) from the ship to a candidate. >= cos(coneRad) = inside the
     assist cone. Returns 2 for a zero-length offset (target AT the ship:
     any direction is a perfect lock, never a NaN). */
  static _aimLockScore(nx, ny, nz, dx, dy, dz) {
    const l = Math.sqrt(dx * dx + dy * dy + dz * dz);
    if (!(l > 1e-9)) return 2;
    return (dx * nx + dy * ny + dz * nz) / l;
  }

  /* Pure lock pick over the merged registry. `targets` = [{position,vel,
     hp,kind}], `nose` = unit Vector3-shape, `shipPos` = ship position shape,
     coneDeg = TUNE.aim.lockConeDeg. Returns the entry with the SMALLEST
     angle to the nose inside the cone (largest dot; equal dots won by the
     shorter ship distance), or null. Skips hp <= 0 and position-less
     entries (defensive: death-frame churn). Pure: no allocation, no state. */
  static _aimPick(targets, nose, shipPos, coneDeg) {
    if (!targets || !nose || !shipPos) return null;
    const coneCos = Math.cos(coneDeg * Math.PI / 180);
    let best = null, bestDot = -Infinity, bestD2 = Infinity;
    for (let i = 0; i < targets.length; i++) {
      const t = targets[i];
      if (!t || !t.position) continue;
      if (!(t.hp > 0)) continue;                     /* dead entries: no lock */
      const dx = t.position.x - shipPos.x;
      const dy = t.position.y - shipPos.y;
      const dz = t.position.z - shipPos.z;
      const dot = Game._aimLockScore(nose.x, nose.y, nose.z, dx, dy, dz);
      if (dot < coneCos) continue;                   /* outside the assist cone */
      const d2 = dx * dx + dy * dy + dz * dz;
      if (dot > bestDot || (dot === bestDot && d2 < bestD2)) {
        best = t; bestDot = dot; bestD2 = d2;
      }
    }
    return best;
  }

  /* Closed-form firing lead: smallest positive t with |p + v t| = boltSpeed t,
     i.e. where a bolt of speed `boltSpeed` launched NOW from the ship meets a
     target at relative position p moving with constant velocity v. Expands to
     (v.v - s^2) t^2 + 2 (p.v) t + p.p = 0. Returns the intercept time in
     seconds, or 0 for NO LEAD (disc < 0, or no positive root — a target
     fleeing faster than the bolt never meets it). Documented honest
     approximation, same convention the radar draws with: ship velocity and
     the bolt's inherit share are IGNORED (p is target.pos - ship.pos; the
     bolt leaves at TUNE.weapons.speed along the nose). Pure scalars. */
  static _leadTime(px, py, pz, vx, vy, vz, boltSpeed) {
    const a = vx * vx + vy * vy + vz * vz - boltSpeed * boltSpeed;
    const b = 2 * (px * vx + py * vy + pz * vz);
    const c = px * px + py * py + pz * pz;
    if (Math.abs(a) < 1e-12) {                       /* |v| == boltSpeed: degenerate */
      if (Math.abs(b) < 1e-12) return 0;
      const tl = -c / b;
      return tl > 0 ? tl : 0;
    }
    const disc = b * b - 4 * a * c;
    if (disc < 0) return 0;
    const sq = Math.sqrt(disc);
    const t1 = (-b - sq) / (2 * a), t2 = (-b + sq) / (2 * a);
    let t = Infinity;
    if (t1 > 1e-9 && t1 < t) t = t1;
    if (t2 > 1e-9 && t2 < t) t = t2;
    return Number.isFinite(t) ? t : 0;
  }

  /* Per-frame lock scan (PLAYING only). Runs AFTER rocks/enemies update so
     positions are final this frame and BEFORE hud.update so the bracket
     paints with zero one-frame lag. Publishes game.aimTarget (entry|null),
     game.aimDeg, game.aimLeadT + the additive scalars __K.aimTarget (kind
     string|null — NEVER the live object) and __K.aimDeg. */
  _aimScan() {
    const A = __K.TUNE.aim || {};
    const best = Game._aimPick(this.targets, this.ship.nose, this.ship.position,
      (typeof A.lockConeDeg === 'number') ? A.lockConeDeg : 6.0);
    this.aimTarget = best;
    if (!best) {
      this.aimDeg = 0;
      this.aimLeadT = 0;
      __K.aimTarget = null;
      __K.aimDeg = 0;
      return;
    }
    const p = this.ship.position, bp = best.position;
    const dot = Game._aimLockScore(this.ship.nose.x, this.ship.nose.y, this.ship.nose.z,
      bp.x - p.x, bp.y - p.y, bp.z - p.z);
    this.aimDeg = Math.acos(clampNum(dot, -1, 1)) * 180 / Math.PI;
    /* lead intercept (radar-style honesty: p = target - ship, v = target.vel;
       ship velocity + bolt inherit ignored — see _leadTime) */
    let t = 0;
    if (A.lead) {
      const v = best.vel;
      t = Game._leadTime(bp.x - p.x, bp.y - p.y, bp.z - p.z,
        v ? v.x : 0, v ? v.y : 0, v ? v.z : 0,
        (__K.TUNE.weapons && __K.TUNE.weapons.speed) || 170);
    }
    this.aimLeadT = t;
    __K.aimTarget = best.kind || '?';
    __K.aimDeg = this.aimDeg;
  }

  start(container) {

    this.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, R.pixelRatioMax));

    this.upgrades = new RunUpgrades(this);

    this.rocks = new AsteroidSystem(this);

    this.enemies = new EnemySystem(this);
    this.pickups = new PickupSystem(this);
    this.weapons = new WeaponController(this);

    this.fx = new Particles(this);

       can never appear twice; rocks.live / rocks.destroyRock / the pool cap
       stay untouched and keep their stage-4 semantics. */
    this.targets = this._merged;

    this.practice = new PracticeSector(this);

      self.camera.updateProjectionMatrix();

       __K.state string is EXACT (tests read it). ---- */
    this.rocks.clearField();

  _tick(now) {
    this._raf = requestAnimationFrame(this._tick);
    let dt = (now - this._lastT) / 1000;
    this._lastT = now;
    if (dt > 0.05) dt = 0.05; /* clamp long frames (tab switches) */
    if (dt <= 0) dt = 1 / 60;

    const playing = __K.state === 'PLAYING';

    this.input.update(dt);
    if (playing) {
      if (this.runRecord) this.runRecord.update(dt);
      this.ship.update(dt, this.input);

      /* STAGE 6: merged hit registry refill — rocks pool live first, then
         hunter pool live, pushed IN PLACE into this.targets (identity stable;
         it IS _merged from start()). Each pool list enters exactly once:
         no rock can double-enter, the rock cap stays structural. */
      const mg = this.targets;
      mg.length = 0;
      const rl = this.rocks.rocks.live, el = this.enemies.enemies.live;
      for (let i = 0; i < rl.length; i++) mg.push(rl[i]);
      for (let i = 0; i < el.length; i++) mg.push(el[i]);

         the flag; the ProjectileSystem is the first consumer). Stage 6: the
         weapons controller reads the SAME fire flag and adds flak volleys /
         slot-3 seekers on top; pulse is gated to slot 1 (_pulseGate). */
      this.projectiles.update(dt);
      this.weapons.update(dt);

      /* stage 4: rock drift + tumble + soft bounds + ship damage
         refreshes __K.score/hull/wave/debugRocks and the camera's occluder
         list (must run BEFORE cam.update so it pulls in this frame)
         — hull damage now routes through game.damageShip (Defense model) */
      this.rocks.update(dt);

         buff timers), wave progression (calm -> __K.wave++ -> spawnWave ->

      this.pickups.update(dt);

      if (__K.comboT > 0) {
        __K.comboT = Math.max(0, __K.comboT - dt);
        if (__K.comboT <= 0) { __K.combo = 0; __K.log('combo chain broken'); }
      }

      /* stage 5: defense decay/regen/respawn/gameover timers + extra lives;
         then drain the one-shot HUD juice event it queued (vignette on hull
         spill, shield hex flicker on absorb) */
      this.defense.update(dt);
      const hit = this.defense.pendingHudHit;
      if (hit) {
        this.defense.pendingHudHit = null;
        if (hit.kind === 'shield') this.hud.hitShieldFlicker(hit.strength);
        else this.hud.hitVignette(hit.strength);
      }

      /* wave banner toast on every wave change (SPEC "Wave toast") + the
         matching wave stinger (stage 7: banner is visual, stinger is audio) */
      if (__K.wave !== this._waveShown) {
        this._waveShown = __K.wave;
        this.hud.showWave(__K.wave);
        this.sfx('stinger');
      }

      /* boundary warning for the HUD: cross the TUNE spring margin and the
         wash ramps in (ratio recomputed from the live position + outward
         speed; 0 deep inside the field — see _edgeRatio) */
      this.edgeWarn = this._edgeRatio(this.ship.position);

      /* decay the sector-teleport glitch flag (its renderer is the rig) */
      if (__K.glitchT > 0) __K.glitchT = Math.max(0, __K.glitchT - dt);

      /* STAGE 7: passing-whoosh sweep over the live rocks (per-rock
         hysteresis state rides on the rock records; pure trigger math
         lives in Audio.whooshStep and the harness asserts it) */
      if (this.audio) this.audio.whooshTick(this.ship, this.rocks.rocks.live);

      /* STAGE 11: aim-assist lock scan — AFTER rocks/enemies so registry
         positions are final this frame, BEFORE hud.update so the lock bracket
         paints the same frame (zero lag). See _aimScan for the pick math. */
      if (this.practice && this.practice.active) this.practice.update(dt);
      this._aimScan();

      this._clock += dt;

      /* smoke surface refresh (tests/smoke.md) — __K.ship fields each frame */
      const s = this._snap, p = this.ship.position;
      s.pos[0] = p.x; s.pos[1] = p.y; s.pos[2] = p.z;
      s.speed = this.ship.speed;
      s.pitchDeg = this.ship.pitchDeg;
      s.yawDeg = this.ship.yawDeg;
      __K.ship = s;
    }

    /* cinematic chase rig: spring follow + look-ahead + boost trail/FOV
       punch + seeded shake + occlusion pull-in + title orbit (30-camera.js
       owns the camera entirely; __K.glitchT drives its mild impact jitter).
       Runs EVERY state so the camera keeps painting on title/pause/gameover. */
    this.cam.update(dt, this.ship, this.input);

    /* STAGE 7: particle pool + point-light fades run EVERY state (explosion
     glows out across pause/gameover); audio update rides the same beat so
     the engine bed follows thrustLevel and M-mute lands this frame.
     __K.particles is the Particles instance itself (ctor sets it once);
     harnesses read __K.particles.alive, kept fresh inside fx.update(). */
    if (this.fx) {
      this.fx.update(dt);
      if (playing) this.fx.exhaust(dt, this.ship);
    }
    if (this.audio) this.audio.update(dt);

    /* __K.state stays the exact state-machine string (never overwritten) */
    __K.camDist = this.cam.dist;
    __K.camFov = this.cam.fov;
    __K.camMode = this.cam.mode;
    __K.camRollDeg = this.cam.rollDeg;
    /* STAGE-12 cluster C: additive scalar publication of the flight mode
       ('space' | 'assist') next to the other per-frame __K scalars; the
       HUD mode chip and the harnesses read this string. */
    __K.flightMode = __K.TUNE.flightMode;

    /* stage-3 weapon counters (tests/smoke.md stage-3 line) — same object
       identity every frame; only numbers are rewritten (zero allocation) */
    const st = this._stats;
    st.shots = this.projectiles.shots;
    st.hits = this.projectiles.hits;
    st.bolts = this.projectiles.bolts.aliveCount;
    st.destroyed = this._destroyed;
    st.rocks = this.rocks ? this.rocks.aliveCount : 0;
    st.hunters = this.enemies ? this.enemies.aliveCount : 0;
    st.pickups = this.pickups ? this.pickups.aliveCount : 0;
    __K.stats = st;

    /* HUD: display swap keyed off __K.state, then textContent/style update
       (the HUD instance already holds its game back-reference) */
    this._syncScreens();
    if (this.weapons && this.weapons.updatePreview) this.weapons.updatePreview(dt);
    if (this.threats) this.threats.update(dt);
    this.hud.update(dt);
    /* velocity-vectors spec §7: the layer repainted from the game loop
       right after the HUD paints (all screen gates live INSIDE paint;
       unlike the radar there is no second rAF loop). */
    if (this.vectors) this.vectors.paint(dt);

    /* STAGE 7 render: the bloom composer is ONLY ever assigned by
       95-boot.js after its dynamic-import chain fully succeeds; a missing
       composer is the tested fallback path (emissive-only look), never an
       error. The composer renders the same scene + camera. */
    if (this._composer) this._composer.render();
    else this.renderer.render(this.scene, this.camera);
  }

  /* Target-death hook (projectiles call it when a bolt drops hp to 0).

  onTargetDestroyed(target, weapon) {
    if (this.practice && target && target.hp <= 0) this.practice.recordKill(weapon);
    if (target && target.kind === 'rock' && this.rocks) {
      if (this.rocks.destroyRock(target)) this._destroyed++;
      return;
    }
    if (target && target.kind === 'enemy' && this.enemies) {
      /* hunter kill: score (combo funnel) + pickup drop + pool release all
         live in EnemySystem.kill (double-destroy is a no-op there — same rule
         as destroyRock, so it must NOT fall through to the generic retire */
      if (this.enemies.kill(target)) this._destroyed++;
      return;
    }
    /* other non-rock registry entries (stage 6 pickups are never registered):
       generic retire */
    this._destroyed++;
    __K.log('target destroyed: ' + (target && target.kind ? target.kind : '?'));
    if (target && target.mesh) target.mesh.visible = false;
    const ti = this.targets.indexOf(target);
    if (ti >= 0) this.targets.splice(ti, 1);
    if (this.cam && this.cam.shake) this.cam.shake(0.25);
  }

  /* HARNESS HOOK (public, stage-3 acceptance): snap ship yaw/pitch so the
     nose points at a world point. Direct state write (no rate dynamics), then
     pose + nose are refreshed immediately — call it and fire in the same tick
     and the bolt still leaves down the aimed nose. Deterministic replacement
     for pointer lock, which cannot be granted synthetically. */
  debugAimAt(x, y, z) {
    const dx = x - this.ship.position.x;
    const dy = y - this.ship.position.y;
    const dz = z - this.ship.position.z;
    if (dx * dx + dy * dy + dz * dz < 1e-12) return;
    const D = THREE.MathUtils.DEG2RAD;
    /* stage-11b: pose yaw is euler.y = -yawDeg (screen-right contract), so
       the matching inverse is yaw = atan2(-dx, dz) — nose still lands on the
      _nose ray, bolts still leave down the aimed line. */
    this.ship.yawDeg = Math.atan2(-dx, dz) / D;   /* + = nose right (contract) */
    this.ship.pitchDeg = Math.asin(clampNum(dy / Math.hypot(dx, dy, dz), -1, 1)) / D;
    this.ship.yawRate = 0;
    this.ship.pitchRate = 0;
    this.ship._euler.set(-this.ship.pitchDeg * D, -this.ship.yawDeg * D, 0, 'YXZ');
    this.ship.group.quaternion.setFromEuler(this.ship._euler);
    this.ship._nose.set(0, 0, 1).applyEuler(this.ship._euler);
    /* STAGE-12 cluster C (verified against 20-ship.js): in SPACE mode the
       attitude integrates IN group.quaternion, so the setFromEuler write
       above IS a reseed — the next space update() right-multiplies small
       body increments onto the written pose and recomposes the decomposed
       yawDeg/pitchDeg/_nose reads from it. The written _nose equals the
       written quaternion's z-axis, so bolts fired in the same tick leave
       down the aimed line in BOTH modes. No extra writes needed. */
  }
}

/* ==== 95-boot.js ==== */
/* ===== SECTION: Boot — game bootstrap + bloom post-processing ===== */
/* Stage 1 body, stage-7 bloom addendum. Keeps the same dynamic
   import('three') (the ONLY legal static-module entry) and the try/catch so
   a CDN failure surfaces in __K.fail instead of an uncaught rejection.
   Three.js lands in the module-scope `THREE` (05-core.js) here —
   no class constructs THREE objects before this assignment completes.
   __K.ready flips true only after the FIRST SUCCESSFUL rendered frame.

   BLOOM (SPEC "Post-processing and look"): the addons (EffectComposer,
   RenderPass, UnrealBloomPass, OutputPass) load via dynamic import() from
   the import-map's three/addons/ prefix — SAME three@0.186.1, so versions
   cannot skew. The chain runs AFTER the first frame and every step is
   caught: any failure leaves game._composer null and __K.bloom='fallback'
   (emissive-only look — the SPEC's sanctioned lighter path). A working
   composer swaps ONLY the final render call inside Game._tick. High
   threshold + modest strength (TUNE.bloom) keep the scene haze-free.
   __K.bloom is 'on' | 'off' (TUNE says no post) | 'fallback' (imports or
   composer construction failed) — never undefined once boot has finished. */
async function boot() {
  THREE = await import('three');
  __K.threeRevision = THREE.REVISION;

  const game = new Game();
  __K.game = game; /* extension point: stage 5 HUD/pause reach the game here */
  game.start(document.getElementById('app'));

  /* first-frame gate: __K.ready only once the loop has actually drawn */
  await new Promise(function (res) { requestAnimationFrame(res); });
  await new Promise(function (res) { requestAnimationFrame(res); });
  __K.ready = true;

  /* --- stage-10 add-on: radar scope overlay (never fatal — same pattern
     as bloom). Radar self-installs its own rAF repaint loop (canvas-only,
     no game mutation), so 90-game.js stays untouched. --------------------- */
  try {
    game.radar = new Radar(game);
  } catch (e) {
    __K.log('radar disabled (construction failed): ' + ((e && e.message) || e));
  }

  /* --- stage 7: bloom post-process (never fatal, never late-allocation
     of meshes — only passes + one render target) -------------------------- */
  const B = __K.TUNE.bloom;
  if (typeof __K.bloom !== 'string') __K.bloom = 'off';
  if (B && B.enabled && __K.bloom !== 'on') {
    try {
      const ec = await import('three/addons/postprocessing/EffectComposer.js');
      const rp = await import('three/addons/postprocessing/RenderPass.js');
      const ub = await import('three/addons/postprocessing/UnrealBloomPass.js');
      const op = await import('three/addons/postprocessing/OutputPass.js');
      const size = new THREE.Vector2();
      game.renderer.getSize(size);
      const composer = new ec.EffectComposer(game.renderer);
      composer.addPass(new rp.RenderPass(game.scene, game.camera));
      const bloom = new ub.UnrealBloomPass(size.clone(), B.strength, B.radius, B.threshold);
      composer.addPass(bloom);
      composer.addPass(new op.OutputPass());     /* tone-map + sRGB at the end */
      composer.setSize(size.x, size.y);
      game.renderer.toneMappingExposure = B.exposure;   /* modest ACES push */
      /* resize: the composer (and every bloom mip) must track the canvas —
         added AFTER Game's own resize listener so both run. */
      window.addEventListener('resize', function () {
        const w = window.innerWidth, h = Math.max(1, window.innerHeight);
        composer.setSize(w, h);
      });
      game._composer = composer;
      __K.bloom = 'on';
      __K.log('bloom: composer on (threshold ' + B.threshold + ', strength ' + B.strength + ')');
    } catch (e) {
      game._composer = null;
      __K.bloom = 'fallback';                    /* emissive-only look stands */
      __K.log('bloom fallback (no composer): ' + ((e && e.message) || e));
    }
  }
}

boot().catch(function (e) {
  __K.fail = String((e && e.stack) || e);
});
