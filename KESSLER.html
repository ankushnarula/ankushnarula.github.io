      pierce: 0,                     /* extra targets this bolt may damage after
                                        its first hit (0 = first-contact-dies);
                                        seeker ignores it — it detonates.
                                        -1 = unassigned (derived from kind in
                                        _updateBolts; see PENETRATION BUDGET) */
      lastHit: null,                 /* the entry this bolt already bit this life
                                        (defensive: registry may churn mid-scan) */
      lock: null,                    /* seeker only (WeaponController owns) */
      reset: function () {
        this.ttl = 0; this.owner = null;
        this.kind = 'pulse'; this.dmg = 0; this.hitR = 0; this.lock = null;
        this.pierce = -1; this.lastHit = null;
        this.pos.set(0, 0, 0); this.prev.set(0, 0, 0); this.vel.set(0, 0, 0);
        this.mesh.visible = false;
      }
    };
  }

  _makeFlash() {
    const mesh = new THREE.Mesh(this.flashGeo, this.flashMat);
    mesh.visible = false;
    mesh.frustumCulled = false;
    this.game.scene.add(mesh);
    return {
      alive: false,
      mesh: mesh,
      ttl: 0,
      reset: function () { this.ttl = 0; this.mesh.visible = false; }
    };
  }

  /* --- fire: called every frame; input.fire is the held flag (Space/LMB).
     Rate-limited to TUNE.weapons.fireRate while held (the stage-6 rapid-fire
     buff scales it via game.rapidMul), barrels alternate. GATED by
     game._pulseGate: flak/seeker slots suppress the pulse cannon (one
     primary weapon per trigger — 45-weapons owns the gate). --- */
  update(dt) {
    const T = this.T, ship = this.game.ship;

    this._cool -= dt;
    if (this.game.input && this.game.input.fire && this.game._pulseGate !== false && this._cool <= 0) {
      this._fireOne(ship);
      const rate = T.fireRate * (this.game.rapidMul || 1);
      this._cool = Math.max(this._cool + 1 / rate, 1 / rate - 1e-9);
      /* the max() kills any long-frame "debt": one shot per tick, never a burst */
    }

    this._updateBolts(dt, ship);
    this._updateFlashes(dt);
  }

  _fireOne(ship) {
    const T = this.T;
    const b = this.bolts.obtain();
    if (!b) { __K.log('bolt pool saturated'); return; } /* 512 cap is hard */

    /* world-space muzzle = ship pose * local barrel offset (pure math; the
       cosmetic bank lives on ship.visual and never reaches aim, per contract) */
    ship.group.updateMatrixWorld();
    this._barrelW[this._barrelSide].copy(this._barrel[this._barrelSide])
      .applyMatrix4(ship.group.matrixWorld);

    this._nose.set(0, 0, 1).applyQuaternion(ship.group.quaternion);
    b.pos.copy(this._barrelW[this._barrelSide]);
    b.prev.copy(b.pos);
    /* bolt velocity = nose*speed + fraction of ship velocity (TUNE.inherit —
       small so bolts always fly ~170 downrange even while reversing; see table) */
    b.vel.copy(this._nose).multiplyScalar(T.speed).addScaledVector(ship.velocity, T.inherit);
    b.owner = ship;                       /* own bolts skip the player */
    b.kind = 'pulse';
    b.dmg = T.damage;
    b.hitR = T.boltRadius;
    b.pierce = T.piercePulse || 0;        /* stage-10: pulse budget (0 = dies on
                                             its one target, the stage-3 rule) */
    b.lastHit = null;
    b.lock = null;
    b.ttl = T.ttl;
    /* a recycled slot may wear the missile/hunter look — restore the pulse */
    b.mesh.geometry = this.geo;
    b.mesh.material = this.mat;
    b.mesh.visible = true;
    b.mesh.position.copy(b.pos);
    this._aimMesh(b.mesh, b.vel);
    b.mesh.updateMatrix();
    this.shots++;

    /* juice: tiny recoil punch + pooled muzzle flash mesh (stage-3 stub)
       + STAGE 7: muzzle sprites and a short-lived point light at the barrel
       + the pulse shot itself through the funnel (sfx no-ops sans audio). */
    this.game.shakeFor('recoil');
    this._spawnFlash(b.pos, T.flashLife, 1.0);
    if (this.game.fx) this.game.fx.muzzleFlash(b.pos);
    this.game.sfx('pulse');

    this._barrelSide = 1 - this._barrelSide;
  }

  _spawnFlash(at, life, scale) {
    const f = this.flashes.obtain();
    if (!f) return;                        /* flash pool is cosmetic — drop it */
    f.ttl = life;
    f.mesh.visible = true;
    f.mesh.position.copy(at);
    f.mesh.scale.setScalar(scale);
  }

  _updateBolts(dt, ship) {
    const T = this.T;
    const half = __K.TUNE.sector;
    const hx = half.x / 2 + T.despawnMargin;
    const hy = half.y / 2 + T.despawnMargin;
    const hz = half.z / 2 + T.despawnMargin;
    const targets = this.game.targets;
    const live = this.bolts.live;

    /* BACKWARD iteration: Pool.release swap-removes (moves the array's last
       live item into the hole); walking down from the end means that item was
       already visited this frame, so nothing is skipped and no copy is made. */
    for (let i = live.length - 1; i >= 0; i--) {
      const b = live[i];

      /* --- integrate (guided bolts delegate: steer + move + ttl + fuse) --- */
      let dead = false;
      const gw = (b.kind === 'seeker' && this.game.weapons) ? this.game.weapons : null;
      if (gw) {
        dead = gw.guideBolt(b, dt);        /* true => detonated this frame */
      } else {
        b.prev.copy(b.pos);
        b.pos.addScaledVector(b.vel, dt);
        b.ttl -= dt;
      }

      if (!dead && (b.ttl <= 0 ||
          Math.abs(b.pos.x) > hx || Math.abs(b.pos.y) > hy || Math.abs(b.pos.z) > hz)) {
        dead = true;                       /* expired, or outside sector + margin */
      }

      /* --- swept hit vs target registry: SHIP-owned bolts only -------------
         (rock/hunter/pickup entries; a hostile bolt can never clear rocks).
         Seekers detonate ON CONTACT (impact AoE in 45-weapons); pulse/flak
         apply per-bolt damage x the player's buff multiplier at impact. */
      if (!dead && b.owner === ship && targets && targets.length) {
        const dmgMul = this.game.dmgMul || 1;
        const rA = b.hitR || T.boltRadius;
        /* PENETRATION BUDGET (stage-10 fix, defects A+B): pierce counts
           EXTRA targets this bolt may damage in its scan before it dies.
           pulse default 0 == the old first-contact-dies rule; flak pellets
           get pierceFlak so one pellet rakes a cluster instead of being
           eaten whole by the first rock it kisses. -1 == unassigned at the
           firing site (flak/seeker are spawned by WeaponController, outside
           this file) — derive from kind once, here, at first touch. */
        if (b.pierce < 0) {
          b.pierce = (b.kind === 'flak') ? (T.pierceFlak || 0)
                   : (b.kind === 'pulse') ? (T.piercePulse || 0) : 0;
        }
        for (let j = 0; j < targets.length; j++) {
          const tg = targets[j];
          if (!tg || tg.hp <= 0 || !tg.position) continue;
          if (tg === b.lastHit) continue;   /* one bolt never hits a target twice */
          const t = K.Hit.sweptSphere(b.prev, b.pos, rA, tg.position, tg.radius);
          if (t < 0) continue;
          this.hits++;
          /* contact point = prev + t*(pos-prev): the spark sits on the skin */
          this._hitPt.copy(b.prev).lerp(b.pos, t);
          this._spawnFlash(this._hitPt, T.sparkLife, 0.7);
          if (this.game.fx) this.game.fx.sparks(this._hitPt);   /* stage-7 sprites */
          if (b.kind === 'seeker' && gw) {
            gw.explode(this._hitPt, tg);          /* direct dmg + AoE + friendly fire */
            dead = true;                          /* seekers ALWAYS detonate on
                                                     contact — pierce never applies */
            break;
          }
          b.lastHit = tg;
          tg.hp -= (b.dmg || T.damage) * dmgMul;
          let killed = false;
          if (tg.hp <= 0 && typeof this.game.onTargetDestroyed === 'function') {
            this.game.onTargetDestroyed(tg);
            killed = true;
          }
          if (b.pierce > 0) {
            b.pierce--;
            /* A kill swap-removes the entry from game.targets mid-scan (Pool
               release moves the LAST live entry into its hole). Step j back
               one so the loop's j++ revisits this slot and the displaced
               entry is not skipped. If the dispatcher did not remove
               anything, tg is still here with hp<=0 and the guard above
               skips it — re-testing the slot is always safe. */
            if (killed) j--;
            continue;
          }
          dead = true;
          break;
        }
      }

      /* --- hostile-bolt vs player path: routed into the damage funnel.
         owner is a hunter object (never null), so ship bolts skip this.
         damageShip honours invuln/i-frames (may legally ignore the hit). */
      if (!dead && b.owner !== ship && b.owner !== null) {
        const rA = b.hitR || T.boltRadius;
        const t = K.Hit.sweptSphere(b.prev, b.pos, rA, ship.position, ship.radius);
        if (t >= 0) {
          this.hits++;
          this._hitPt.copy(b.prev).lerp(b.pos, t);
          this._spawnFlash(this._hitPt, T.sparkLife, 0.9);
          if (this.game.fx) this.game.fx.sparks(this._hitPt);   /* stage-7 sprites */
          if (typeof this.game.damageShip === 'function') {
            this.game.damageShip(b.dmg || T.damage, false, b.prev, 'hunter');
          }
          dead = true;
        }
      }

      if (dead) {
        b.mesh.visible = false;
        this.bolts.release(b);
        continue;
      }

      b.mesh.position.copy(b.pos);
      this._aimMesh(b.mesh, b.vel);
      b.mesh.updateMatrix();
    }
  }

  _updateFlashes(dt) {
    const live = this.flashes.live;
    for (let i = live.length - 1; i >= 0; i--) {   /* release-safe, see above */
      const f = live[i];
      f.ttl -= dt;
      if (f.ttl <= 0) {
        f.mesh.visible = false;
        this.flashes.release(f);
      }
    }
  }

  /* Stage-5 seam (Game._toTitle): retire every bolt + flash at once. Run
     counters (shots/hits) are NOT touched — Game zeroes those in _beginRun. */
  clearAll() {
    this.bolts.clear();
    this.flashes.clear();
  }

  /* orient the stretched cylinder along the velocity direction (quat taking
     local +Z to vel; pure scratch math, no allocation) */
  _aimMesh(mesh, vel) {
    this._dir.copy(vel);
    const len = this._dir.length();
    if (len < 1e-6) return;
    this._dir.multiplyScalar(1 / len);
    /* rotation from +Z to dir: axis = Z x dir = (-dir.y, dir.x, 0) */
    const ax = -this._dir.y, ay = this._dir.x;
    const axl = Math.hypot(ax, ay);
    if (axl < 1e-6) {                                  /* dir ~ +-Z */
      if (this._dir.z < 0) mesh.quaternion.set(0, 1, 0, 0);  /* 180 deg about Y */
      else mesh.quaternion.set(0, 0, 0, 1);
      return;
    }
    const ang = Math.acos(clampNum(this._dir.z, -1, 1));
    const s = Math.sin(ang / 2) / axl;
    mesh.quaternion.set(ax * s, ay * s, 0, Math.cos(ang / 2));
  }
}

/* ==== 45-weapons.js ==== */
/* ===== SECTION: Weapons — slot switching, flak cones, seeker missiles ===== */
/* SPEC "Weapons" stage 6: three fire modes switched with 1/2/3 or the mouse
   wheel; __K.weapon = 'pulse' | 'flak' | 'seeker', __K.ammo = {flak, seeker}.

   Routing (the seams 90-game.js documented and left unassigned):
     - game.requestWeapon(delta) is assigned here from the wheel listener
       (delta +1 / -1 -> cyclic slot step; Game already gates PLAYING).
     - game.secondaryFire drives the seeker launch alongside slot 3 + Space/LMB
       (SPEC: "Right mouse or F fires missiles ... otherwise missiles are
       weapon slot 3" — BOTH bindings live: RMB via document listeners here,
       slot-3 primary via the fire flag, F via Input.onSecondary(down)).
     - pulse stays exactly the stage-3 loop inside ProjectileSystem.update
       (input.fire + TUNE.weapons); this class only gates pulse while a
       non-pulse slot is selected (game._pulseGate) and adds flak/seeker.

   Flak: one "shot" = TUNE.weapons.flak.pellets pooled pellets fanned out of
   the nose in a cone, short ttl, small damage each, 1 ammo per shot. Pellets
   are ordinary bolts (owner = ship) so the swept-hit path is untouched —
   a volley adds 7 registry-touching bolts (acceptance: shots jump ~7 per
   flak shot).

   Seeker: a guided bolt with a locked target ref. Steering rotates the
   velocity toward the lock by seeker.turnRateDeg * dt (quaternion slerp of
   the unit direction, scratch-only math). Detonation on proximity/fuse:
   direct damage to the lock + AoE over seeker.aoeRadius — rocks lose
   aoeDamage*(1-falloff) hp (dead ones routed through game.onTargetDestroyed),
   the SHIP takes shipDamage*(1-falloff) through game.damageShip — friendly
   fire included (SPEC tradeoff).

   Ammo: flak cap 40 / seeker cap 4 (TUNE); ammo pickups top up in 65-pickup.
   Dry-fire: the shot simply does not happen (no crash, ammo never negative).
   No per-frame allocation: every vector/quaternion below is scratch built
   in the constructor. */
class WeaponController {
  constructor(game) {
    this.game = game;
    this.W = __K.TUNE.weapons;

    /* additive __K surface (types fixed once, fields new for stage 6) */
    if (typeof __K.weapon !== 'string') __K.weapon = 'pulse';
    if (!__K.ammo) __K.ammo = { flak: this.W.flak.ammoStart, seeker: this.W.seeker.ammoStart };
    this.slots = ['pulse', 'flak', 'seeker'];

    /* one shared missile geometry + material, allocated exactly once */
    this.mGeo = new THREE.CylinderGeometry(0.42, 0.42, 4.2, 6);
    this.mGeo.rotateX(Math.PI / 2);            /* cylinder axis Y -> +Z */
    this.mMat = new THREE.MeshBasicMaterial({
      color: 0xffb066, transparent: true, blending: THREE.AdditiveBlending,
      depthWrite: false, fog: false, toneMapped: false
    });

    this._flakCool = 0;
    this._seekCool = 0;
    this.previewTarget = null;
    this._previewStable = 0;
    this._previewNotified = false;
    this._lockCueCool = 0;
    this.preview = __K.seeker = { hasLock: false, kind: null, ready: false, cooldown: 0, ammo: 0 };

    /* scratch — allocated once; fire/update construct nothing */
    this._nose = new THREE.Vector3();
    this._dir = new THREE.Vector3();
    this._tmp = new THREE.Vector3();
    this._perp = new THREE.Vector3();
    this._perpB = new THREE.Vector3();
    this._from = new THREE.Vector3();
    this._axis = new THREE.Vector3();
    this._vdir = new THREE.Vector3();
    this._q = new THREE.Quaternion();

    /* fresh ammo bookkeeping at construction (05-core pre-created __K.ammo
       with zero placeholders; _beginRun re-runs this on every restart) */
    this.resetRun();

    this._wire();
  }

  /* --- input seams (documented extension points owned by Game/Input) ----- */
  _wire() {
    const self = this;

    /* Wheel routing point 90-game.js left unassigned: requestWeapon(+1|-1),
       already PLAYING-gated there. Cyclic slot step. */
    this.game.requestWeapon = function (delta) { self.setSlot(delta > 0 ? 1 : -1); };

    /* Secondary fire: right mouse button. Listeners live on document like
       every other listener in this codebase. RMB only ever launches a
       seeker — never overrides a flak/pulse slot (SPEC keeps missiles as
       their own binding AND as slot 3). */
    document.addEventListener('mousedown', function (e) {
      if (e.button === 2 && __K.state === 'PLAYING') {
        self.game.input.secondaryMouse = true;
        self.game.secondaryFire = true;
        if (self._seekCool <= 0) self._launchSeeker();
      }
    });
    document.addEventListener('mouseup', function (e) {
      if (e.button === 2) {
        self.game.input.secondaryMouse = false;
        self.game.secondaryFire = !!self.game.input.secondaryKey;
      }
    });
  }

  /* Slot keys 1/2/3 are routed through Input._key -> game.input.onWeaponKey
     (assigned in 90-game._wireInput — one keydown owner per codebase). */

  select(name) {
    if (this.slots.indexOf(name) < 0) return;
    if (__K.weapon === name) return;
    __K.weapon = name;
    __K.log('weapon -> ' + name);
  }

  setSlot(step) {
    const n = this.slots.length;
    const i = this.slots.indexOf(__K.weapon);
    this.select(this.slots[((i + step) % n + n) % n]);
  }

  /* HUD read-model (80-hud.js reads exactly this on its weapon line). */
  hudText() {
    const a = __K.ammo;
    if (__K.weapon === 'flak') return 'FLAK ' + a.flak;
    if (__K.weapon === 'seeker') return 'SEEKER ' + a.seeker;
    return 'PULSE CANNON \u221E';
  }

  /* fresh-run state (Game._beginRun zeroes the run's numbers) */
  resetRun() {
    this.previewTarget = null;
    this._previewStable = 0;
    this._previewNotified = false;
    this._lockCueCool = 0;
    Object.assign(this.preview, { hasLock: false, kind: null, ready: false, cooldown: 0, ammo: this.W.seeker.ammoStart });
    const A = __K.ammo;
    A.flak = this.W.flak.ammoStart;
    A.seeker = this.W.seeker.ammoStart;
    this._flakCool = 0;
    this._seekCool = 0;
    __K.weapon = 'pulse';
  }

  /* --- per-frame: read input flags, gate pulse, fire flak / seekers ------- */
  update(dt) {
    const game = this.game;
    this._flakCool = Math.max(0, this._flakCool - dt);
    this._seekCool = Math.max(0, this._seekCool - dt);

    const slot = __K.weapon;
    const fire = game.input && game.input.fire;

    /* pulse runs ONLY on slot 1 — the stage-3 loop keys off _pulseGate */
    game._pulseGate = (slot === 'pulse');

    if (slot === 'flak' && fire && this._flakCool <= 0) {
      this._fireFlak();
      this._flakCool = this.W.flak.cool;      /* dry-fire just burns the beat */
    }
    if (slot === 'seeker' && fire && this._seekCool <= 0) {
      this._launchSeeker();
    }
    /* F or RMB held (secondaryFire seam) launches at the same cadence. */
    if (game.secondaryFire && this._seekCool <= 0) this._launchSeeker();
  }

  /* deterministic fan basis: rotate `dir` (unit, mutated) by `tiltRad` toward
     the azimuth `ang` around it — Rodrigues about an arbitrary perpendicular.
     Scratch-only (perp/perpB), zero allocation. */
  _fanTilt(dir, ang, tiltRad) {
    if (Math.abs(dir.z) < 0.9) this._perp.set(dir.y, -dir.x, 0);
    else this._perp.set(0, dir.z, -dir.y);
    this._perp.normalize();
    /* perpB = dir x perp */
    this._perpB.set(
      dir.y * this._perp.z - dir.z * this._perp.y,
      dir.z * this._perp.x - dir.x * this._perp.z,
      dir.x * this._perp.y - dir.y * this._perp.x);
    const s = Math.sin(tiltRad), c = Math.cos(tiltRad);
    this._from.copy(dir).multiplyScalar(c)
      .addScaledVector(this._perp, s * Math.cos(ang))
      .addScaledVector(this._perpB, s * Math.sin(ang));
    dir.copy(this._from).normalize();
  }

  /* --- flak: one cone of pooled pellets, 1 ammo --------------------------- */
  _fireFlak() {
    const A = __K.ammo;
    if (A.flak <= 0) { __K.log('flak dry'); return; }   /* dry-fire safe */
    A.flak--;

    const F = this.W.flak, ship = this.game.ship, ps = this.game.projectiles;
    ship.group.updateMatrixWorld();
    this._nose.set(0, 0, 1).applyQuaternion(ship.group.quaternion);
    const muzzle = this._tmp.copy(ship.position).addScaledVector(this._nose, ship.radius + 1.2);

    const spread = this.game.flakSpreadDeg ? this.game.flakSpreadDeg() : F.spreadDeg;
    let spawned = 0;
    for (let i = 0; i < F.pellets; i++) {
      const b = ps.bolts.obtain();
      if (!b) { __K.log('bolt pool saturated'); break; }
      /* deterministic golden-angle cone fan; i=0 is dead center */
      this._dir.copy(this._nose);
      this._fanTilt(this._dir, i * 2.39996323,
        spread * (Math.PI / 180) * Math.sqrt(i / F.pellets));
      b.pos.copy(muzzle);
      b.prev.copy(muzzle);
      b.vel.copy(this._dir).multiplyScalar(F.speed).addScaledVector(ship.velocity, this.W.inherit);
      b.owner = ship;
      b.kind = 'flak';
      b.dmg = F.damage;
      b.hitR = F.radius;
      b.ttl = F.ttl;
      /* recycled slots may wear the missile/hunter look — restore the pellet */
      b.mesh.geometry = ps.geo;
      b.mesh.material = ps.mat;
      b.mesh.visible = true;
      b.mesh.position.copy(b.pos);
      ps._aimMesh(b.mesh, b.vel);
      b.mesh.updateMatrix();
      spawned++;
    }
    ps.shots += spawned;                        /* acceptance: +~7/flak shot */
    this.game.shakeFor('flak');                 /* heavier punch than pulse */
    ps._spawnFlash(muzzle, this.W.flashLife, 1.4);
    if (this.game.fx) this.game.fx.muzzleFlash(muzzle);  /* sprites + light   */
    this.game.sfx('flak');
    __K.log('flak: ' + spawned + ' pellets');
  }

  /* --- seeker: lock + guided missile, 1 ammo ------------------------------ */
  /* Lock rule: NEAREST live target whose direction sits inside +-lockConeDeg
     of the nose (acceptance probes the cone math). */
  _lockTarget() {
    const S = this.W.seeker, ship = this.game.ship, targets = this.game.targets;
    this._nose.set(0, 0, 1).applyQuaternion(ship.group.quaternion);
    const cosLimit = Math.cos(S.lockConeDeg * Math.PI / 180);
    let best = null, bestD = Infinity;
    for (let i = 0; i < targets.length; i++) {
      const t = targets[i];
      if (!t || t.hp <= 0 || !t.position) continue;
      this._tmp.set(t.position.x - ship.position.x,
                    t.position.y - ship.position.y,
                    t.position.z - ship.position.z);
      const d2 = this._tmp.lengthSq();
      if (d2 < 1e-6 || d2 >= bestD) continue;
      const d = Math.sqrt(d2);
      if ((this._tmp.x * this._nose.x + this._tmp.y * this._nose.y + this._tmp.z * this._nose.z) / d < cosLimit) continue;
      best = t; bestD = d2;
    }
    return best;
  }

  // Predict with the exact launch selection rule, including F/RMB while
  // another slot is selected. A short dwell and rate limit prevent tone chatter.
  updatePreview(dt) {
    const playing = __K.state === 'PLAYING';
    const ammo = __K.ammo.seeker;
    const target = playing ? this._lockTarget() : null;
    this._lockCueCool = Math.max(0, this._lockCueCool - dt);
    if (target !== this.previewTarget) {
      this.previewTarget = target;
      this._previewStable = 0;
      this._previewNotified = false;
    }
    if (!playing) { this._previewStable = 0; this._previewNotified = false; }
    else this._previewStable += dt;
    const ready = playing && ammo > 0 && this._seekCool <= 0;
    if (target && ready && this._previewStable >= 0.15 && !this._previewNotified && this._lockCueCool <= 0) {
      this.game.sfx('seekerLock');
      this._previewNotified = true;
      this._lockCueCool = 0.75;
    }
    const p = this.preview;
    p.hasLock = !!target;
    p.kind = target ? target.kind : null;
    p.ready = ready;
    p.cooldown = Math.max(0, this._seekCool);
    p.ammo = ammo;
  }

  _launchSeeker() {
    const A = __K.ammo;
    if (A.seeker <= 0) { __K.log('seeker dry'); this._seekCool = 0.2; return; }
    const b = this.game.projectiles.bolts.obtain();
    if (!b) { __K.log('bolt pool saturated'); return; }
    const S = this.W.seeker, ship = this.game.ship;
    A.seeker--;
    this._seekCool = S.cool;

    ship.group.updateMatrixWorld();
    this._nose.set(0, 0, 1).applyQuaternion(ship.group.quaternion);
    b.pos.copy(ship.position).addScaledVector(this._nose, ship.radius + 1.5);
    b.prev.copy(b.pos);
    b.vel.copy(this._nose).multiplyScalar(S.speed).addScaledVector(ship.velocity, this.W.inherit);
    b.owner = ship;
    b.kind = 'seeker';
    b.dmg = S.damage;
    b.hitR = S.boltRadius;
    b.ttl = S.ttl;
    b.lock = this._lockTarget();               /* may be null: flies straight */
    b.mesh.visible = true;
    b.mesh.material = this.mMat;
    b.mesh.geometry = this.mGeo;
    b.mesh.position.copy(b.pos);
    this.game.projectiles._aimMesh(b.mesh, b.vel);
    b.mesh.updateMatrix();
    this.game.projectiles.shots++;
    this.game.shakeFor('seeker');
    if (this.game.fx) this.game.fx.muzzleFlash(b.pos);   /* sprites + muzzle light */
    this.game.sfx('missile');                    /* launch whoosh (stage 7) */
    __K.log('seeker launch' + (b.lock ? ' (locked)' : ' (no lock)'));
  }

  /* --- missile steering. Called by ProjectileSystem per guided bolt INSTEAD
     of plain integration: it integrates prev/pos/ttl itself, then rotates
     the velocity toward b.lock at the limited turn rate. Returns true =>
     proximity fuse fired (caller releases the bolt). ----------------------- */
  guideBolt(b, dt) {
    const S = this.W.seeker;
    b.prev.copy(b.pos);
    b.pos.addScaledVector(b.vel, dt);
    b.ttl -= dt;

    const speed = Math.hypot(b.vel.x, b.vel.y, b.vel.z);
    if (speed < 1e-6) return false;

    /* a lock that died or left the registry is dropped, then re-acquired so
       a chain of targets keeps the missile useful */
    const lk = b.lock;
    if (lk && (lk.hp <= 0 || !lk.position)) b.lock = null;
    if (!b.lock) b.lock = this._nearestInFlightCone(b);

    if (b.lock) {
      this._dir.copy(b.lock.position).sub(b.pos);
      const dist = this._dir.length();
      if (dist > 1e-6) {
        this._dir.multiplyScalar(1 / dist);
        const vx = b.vel.x / speed, vy = b.vel.y / speed, vz = b.vel.z / speed;
        this._vdir.set(vx, vy, vz);
        const dot = clampNum(vx * this._dir.x + vy * this._dir.y + vz * this._dir.z, -1, 1);
        const ang = Math.acos(dot);
        const maxStep = S.turnRateDeg * (Math.PI / 180) * dt;
        if (ang <= maxStep || ang < 1e-6) {
          this._vdir.copy(this._dir);          /* already inside the step */
        } else {
          /* rotate the unit velocity toward the lock by exactly maxStep
             (axis = v x lock, normalised) */
          let ax = vy * this._dir.z - vz * this._dir.y,
              ay = vz * this._dir.x - vx * this._dir.z,
              az = vx * this._dir.y - vy * this._dir.x;
          const al = Math.hypot(ax, ay, az);
          if (al > 1e-9) {
            this._axis.set(ax / al, ay / al, az / al);
            this._q.setFromAxisAngle(this._axis, maxStep);
            this._vdir.applyQuaternion(this._q);
          }
        }
        b.vel.copy(this._vdir).multiplyScalar(speed);
        /* proximity fuse against the lock (SPEC detonation semantics) */
        if (dist <= S.fuseRange + (b.lock.radius || 0)) {
          this.explode(b.pos, b.lock);
          return true;
        }
      }
    }
    return false;
  }

  /* Re-acquire: nearest live target inside a generous 60 deg cone of the
     missile's CURRENT heading (never snaps 180 deg backwards). */
  _nearestInFlightCone(b) {
    const targets = this.game.targets;
    const speed = Math.hypot(b.vel.x, b.vel.y, b.vel.z);
    if (speed < 1e-6) return null;
    this._dir.set(b.vel.x / speed, b.vel.y / speed, b.vel.z / speed);
    let best = null, bestD = Infinity;
    for (let i = 0; i < targets.length; i++) {
      const t = targets[i];
      if (!t || t === b.lock || t.hp <= 0 || !t.position) continue;
      this._tmp.set(t.position.x - b.pos.x, t.position.y - b.pos.y, t.position.z - b.pos.z);
      const d2 = this._tmp.lengthSq();
      if (d2 < 1e-6 || d2 >= bestD) continue;
      const d = Math.sqrt(d2);
      if ((this._tmp.x * this._dir.x + this._tmp.y * this._dir.y + this._tmp.z * this._dir.z) / d < 0.5) continue; /* cos 60 */
      best = t; bestD = d2;
    }
    return best;
  }

  /* --- explosion: direct hit + AoE over rocks AND ship (friendly fire).
     Public: ProjectileSystem calls it when a seeker bolt's swept test lands
     on a registry entry (impact point); guideBolt calls it on the proximity
     fuse. -------------------------------- */
  explode(at, direct) {
    const S = this.W.seeker, game = this.game;
    if (typeof game.explosion === 'function') game.explosion(at);
    if (direct && direct.hp > 0) {
      direct.hp -= S.damage;
      if (direct.hp <= 0 && typeof game.onTargetDestroyed === 'function') {
        game.onTargetDestroyed(direct, 'seeker');
      }
    }
    /* AoE vs every live target, backward (a kill swap-removes the hole we
       already passed — release-safe like the pebble loop in 50-asteroid) */
    const targets = game.targets;
    for (let i = targets.length - 1; i >= 0; i--) {
      const t = targets[i];
      if (!t || t === direct || t.hp <= 0 || !t.position) continue;
      const d = Math.hypot(t.position.x - at.x, t.position.y - at.y, t.position.z - at.z);
      if (d >= S.aoeRadius) continue;
      t.hp -= S.aoeDamage * (1 - d / S.aoeRadius);
      if (t.hp <= 0 && typeof game.onTargetDestroyed === 'function') game.onTargetDestroyed(t, 'seeker');
    }
    /* friendly fire: the ship pays too, scaled by distance (SPEC tradeoff);
       damageShip honours i-frames/invuln — no special case needed here */
    const ship = game.ship;
    const sd = Math.hypot(ship.position.x - at.x, ship.position.y - at.y, ship.position.z - at.z);
    if (sd < S.aoeRadius) {
      game.damageShip(S.shipDamage * (1 - sd / S.aoeRadius), false, at, 'seeker');
    }
  }
}

/* ==== 50-asteroid.js ==== */
/* ===== SECTION: Asteroid — procedural rock field, splits, cap, hull damage ===== */
/* SPEC "Asteroids" + "Balance seeds" (stage 4):

   MESHES: unit-radius IcosahedronGeometry(detail 2) displaced by TWO seeded
   value-noise passes (big lobes + fine bumps) — irregular silhouettes, flat
   shaded. A fixed library of 8 variants is built ONCE in the constructor;
   each rock draws a variant + a material + a scale from the shared seeded
   `rng`, so a rock's shape is deterministic per seed (__K.rngSeed replays
   the field) and NOTHING allocates geometry at spawn/split time.
   The normal map is SPEC-optional and deliberately skipped (stage 7 can add
   a generated canvas map without touching this contract).

   MATERIALS: three shared MeshStandardMaterials (carbonaceous dark,
   nickel-iron grey, icy pale) allocated once, ~50/30/20 draw weights.

   PHYSICS: constant drift + spin about a unique seeded axis (no damping).
   Soft boundary = the ship's own spring rule (TUNE.flight springMargin/
   springK/springMaxAccel past 0.85 half-extent). Rocks NEVER teleport-wrap
   (the ship's 1.6x glitch-teleport is ship-only): past 1.6x a runaway
   guard clamps position to 1.2x and reflects velocity inward, silently.

   SPLITS: large -> 2-3 medium, medium -> 2-3 small, small gone (SPEC).
   Children inherit TUNE.rocks.inherit (0.8) of parent velocity plus a
   6-10 u/s outward impulse along a seeded random axis = ~parent momentum
   conserved. Pebble spray: 5-8 pooled tiny meshes (NOT colliders — they
   live in their own pool and never enter game.targets), plus one impact
   flash reusing the ProjectileSystem spark pool when it exposes it.

   CAP: TUNE.rocks.cap (70) simultaneous collidable rocks. The rock Pool is
   constructed with cap === TUNE.rocks.cap, so game.targets (which IS
   rocks.live, same array identity) can never exceed the cap. A split that
   would exceed it converts those children into score + pebbles (SPEC).

   SHIP DAMAGE: sphereSphere rock-vs-ship (radius 2.2). dmg = sizeFactor *
   clamp(relSpeed/20, 0.5, 2) with sizeFactor large:medium:small = 3:2:1
   (large ~ 3x small, SPEC "scaled by relative speed and size"). Applied as
   __K.hull -= dmg (clamped >= 0; NO death logic yet — stage 5 owns it, the
   depletion is logged once). One hit per rock per TUNE.rocks.hitCooldown
   (1 s): without the cooldown a ship STANDING inside a rock takes one hit
   every frame and melts 100 hull in under a second.

   WAVES: __K.wave starts at 1 on a plain load (the stage-3 ?probes=1 dummy
   field is gone — real rocks from frame one). When the field empties, after
   TUNE.waves.calmSec the wave counter increments and the next wave spawns:
   count = base + floor(wave*perWave) (wave 1 = 5 large, SPEC 4-5), drift
   speed *speedScale^(wave-1), mixed sizes from wave 2.

   __K SURFACE (additive): score, hull, wave, debugRocks=[{r,size,hp}] and
   stats.rocks refreshed every frame. */

/* ---- seeded 3D value noise (module-local helpers) --------------------------
   Lattice hash: pure integer math, no allocation, stable for negative coords
   (Math.imul + >>> normalise every step). Returns [0,1). */
function _rockHashLattice(i, j, k, seed) {
  let n = Math.imul(i | 0, 0x27d4eb2d) ^ Math.imul(j | 0, 0x165667b1) ^
          Math.imul(k | 0, 0x9e3779b1) ^ Math.imul(seed | 0, 0x85ebca6b);
  n = Math.imul(n ^ (n >>> 15), 0x2c1b3c6d);
  n = Math.imul(n ^ (n >>> 12), 0x297a2d39);
  return ((n ^ (n >>> 15)) >>> 0) / 4294967296;
}

/* Trilinear value noise on unit cells; input already in lattice space. */
function _rockNoiseAt(x, y, z, seed) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const xf = x - xi, yf = y - yi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);
  const c000 = _rockHashLattice(xi, yi, zi, seed),         c100 = _rockHashLattice(xi + 1, yi, zi, seed);
  const c010 = _rockHashLattice(xi, yi + 1, zi, seed),     c110 = _rockHashLattice(xi + 1, yi + 1, zi, seed);
  const c001 = _rockHashLattice(xi, yi, zi + 1, seed),     c101 = _rockHashLattice(xi + 1, yi, zi + 1, seed);
  const c011 = _rockHashLattice(xi, yi + 1, zi + 1, seed), c111 = _rockHashLattice(xi + 1, yi + 1, zi + 1, seed);
  const x00 = c000 + (c100 - c000) * u, x10 = c010 + (c110 - c010) * u;
  const x01 = c001 + (c101 - c001) * u, x11 = c011 + (c111 - c011) * u;
  const y0 = x00 + (x10 - x00) * v, y1 = x01 + (x11 - x01) * v;
  return y0 + (y1 - y0) * w;
}

/* TWO-PASS displacement of a flat [x,y,z,...] position array (unit-ish
   directions in, displaced radii out). Pass 1 = low-frequency lobes, pass 2
   = fine bumps on top. Deterministic in (arr, seed); used by the geometry
   library build AND directly by tests/rock_harness.mjs. Allocates nothing. */
function displaceRockPositions(arr, seed) {
  const s2 = (seed ^ 0x9e3779b9) >>> 0;
  for (let p = 0; p < arr.length; p += 3) {
    const x = arr[p], y = arr[p + 1], z = arr[p + 2];
    const len = Math.sqrt(x * x + y * y + z * z);
    if (len < 1e-9) continue;
    const ux = x / len, uy = y / len, uz = z / len;
    const n1 = _rockNoiseAt(ux * 2.3, uy * 2.3, uz * 2.3, seed);
    const n2 = _rockNoiseAt(ux * 6.9 + 7.13, uy * 6.9 - 3.77, uz * 6.9 + 11.3, s2);
    let s = 1 + (n1 - 0.5) * 0.46 + (n2 - 0.5) * 0.2;
    if (s < 0.55) s = 0.55; /* keep the collision sphere honest-ish */
    arr[p] = x * s; arr[p + 1] = y * s; arr[p + 2] = z * s;
  }
  return arr;
}

/* ---- AsteroidSystem: owns the rock pool, waves, splits, hull damage ------- */
class AsteroidSystem {
  constructor(game) {
    const T = this.T = __K.TUNE;
    this.R = T.rocks;
    this.W = T.waves;
    this.game = game;

    /* --- shared materials: allocated EXACTLY ONCE for the page lifetime --- */
    /* MATERIALS (stage 6): the three rock materials above PLUS one shared
       emissive-crack variant for volatiles — allocated exactly once here,
       swapped in on the volatile rocks' meshes (50-volatile blast). */
    this._mats = [
      new THREE.MeshStandardMaterial({ color: 0x2e2a26, roughness: 0.95, metalness: 0.05, flatShading: true }), /* carbonaceous */
      new THREE.MeshStandardMaterial({ color: 0x7a7f85, roughness: 0.55, metalness: 0.35, flatShading: true }), /* nickel-iron  */
      new THREE.MeshStandardMaterial({ color: 0xaebfd0, roughness: 0.40, metalness: 0.08, flatShading: true })  /* icy pale     */
    ];
    this._vMat = new THREE.MeshStandardMaterial({
      color: 0x4a2a20, roughness: 0.9, metalness: 0.1, flatShading: true,
      emissive: 0xff5a1e, emissiveIntensity: 0.85   /* SPEC: telegraph with colour */
    });

    /* --- geometry library: 8 displaced unit icospheres, built once ---------
       detail 2 = 320 faces/rock — 70 rocks is ~22k tris, nothing on a laptop. */
    this._geoLib = [];
    for (let i = 0; i < 8; i++) {
      const geo = new THREE.IcosahedronGeometry(1, 2);
      const pos = geo.attributes.position;
      displaceRockPositions(pos.array, (0x5eed0000 + Math.imul(i, 0x9e3779b1)) >>> 0);
      pos.needsUpdate = true;
      geo.computeVertexNormals();
      this._geoLib.push(geo);
    }

    this.group = new THREE.Group();
    this.group.name = 'rocks';
    game.scene.add(this.group);

    /* --- pools. THE CAP LIVES IN THE POOL: obtain() returns null at
       TUNE.rocks.cap, so the collidable count is structurally <= cap. --- */
    const self = this;
    this.rocks = new Pool(function () { return self._makeRock(); }, this.R.cap);
    this.pebbles = new Pool(function () { return self._makePebble(); }, 96);

    /* REGISTRY CONTRACT: game.targets IS rocks.live (same array identity —
       Pool keeps it exactly the live rocks, and ProjectileSystem's swept
       loop reads it every frame). Stage 6 hunters must build their own
       merged registry, not push onto this one. */
    game.targets = this.rocks.live;

    /* occluder + probe surfaces: persistent arrays refilled IN PLACE every
       frame (zero allocation); __K.debugRocks identity is fixed in 05-core. */
    this._occl = [];
    this._dbg = __K.debugRocks;

    this._calm = 0;             /* empty-field calm timer -> next wave */
    this._hullZeroLogged = false;
    this.lastConverted = 0;     /* children of the LAST kill capped to score */

    /* scratch — allocated once; update()/split() construct nothing */
    this._spinQ = new THREE.Quaternion();
    this._dir = new THREE.Vector3();
    this._sPos = new THREE.Vector3();   /* spawn-point scratch      */
    this._sVel = new THREE.Vector3();   /* spawn-velocity scratch   */
    this._cPos = new THREE.Vector3();   /* captured parent pos      */
    this._cVel = new THREE.Vector3();   /* captured parent vel      */
    this._chPos = new THREE.Vector3();  /* child spawn pos          */
    this._chVel = new THREE.Vector3();  /* child spawn vel          */

    /* wave 1 exists on a plain load — no URL flag needed any more */
    if (!(__K.wave >= 1)) __K.wave = 1;
    if (game.cam && game.cam.setOccluders) game.cam.setOccluders(this._occl);
    this.spawnWave(__K.wave);
  }

  /* --- pooled items (built lazily up to the caps, never per frame) --------- */
  _makeRock() {
    const mesh = new THREE.Mesh(this._geoLib[0], this._mats[0]);
    mesh.visible = false;
    this.group.add(mesh);
    const self = this;
    return {
      alive: false,
      kind: 'rock',                 /* registry discriminator */
      mesh: mesh,
      position: mesh.position,      /* registry alias — stable object identity */
      size: '', sizeRef: '', radius: 0, hp: 0,
      vel: new THREE.Vector3(),
      spinAxis: new THREE.Vector3(0, 1, 0),
      spinRate: 0,
      hitCool: 0,                   /* per-rock ship-damage cooldown (s) */
      volatile: false,              /* stage 6: emissive-crack rock (blasts on death) */
      _wPrev: 1e9,                  /* stage 7: passing-whoosh hysteresis state
                                       (owned by Audio.whooshTick; re-armed = far) */
      _wArmed: true,
      rec: { r: 0, size: '', hp: 0 }, /* __K.debugRocks record, never rebuilt */
      reset: function () {
        this.vel.set(0, 0, 0);
        this.size = ''; this.sizeRef = ''; this.radius = 0; this.hp = 0;
        this.hitCool = 0;
        this.volatile = false;
        this.mesh.visible = false;
      }
    };
  }

  _makePebble() {
    const mesh = new THREE.Mesh(this._geoLib[0], this._mats[0]);
    mesh.visible = false;
    this.group.add(mesh);
    return {
      alive: false, mesh: mesh, vel: new THREE.Vector3(),
      ttl: 0, life: 1, base: 1,
      reset: function () { this.ttl = 0; this.vel.set(0, 0, 0); this.mesh.visible = false; }
    };
  }

  /* uniform random unit vector (seeded — never Math.random) */
  _randUnit(out) {
    const u = rng() * 2 - 1, th = rng() * Math.PI * 2, r = Math.sqrt(Math.max(0, 1 - u * u));
    return out.set(r * Math.cos(th), u, r * Math.sin(th));
  }

  /* --- spawn ---------------------------------------------------------------
     Wave sizes: wave 1 all large (SPEC "Wave 1: 4-5 large"); from wave 2 a
     TUNE.waves.mediumShare fraction arrive as mediums. Positions: rejection-
     sampled inside 0.8 half-extent, >= minOriginDist from origin and
     >= minShipDist from the ship. Drift = wave-1 band * speedScale^(w-1). */
  spawnRock(size, pos, vel) {
    const r = this.rocks.obtain();
    if (!r) return null;                     /* collidable cap hit: back-pressure */
    const band = this.R.radius[size];
    r.size = size; r.sizeRef = size; r.kind = 'rock';
    r.radius = band[0] + rng() * (band[1] - band[0]);
    r.hp = this.R.hp[size];
    r.mesh.geometry = this._geoLib[(rng() * this._geoLib.length) | 0];
    const m = rng();
    r.mesh.material = this._mats[m < 0.5 ? 0 : (m < 0.8 ? 1 : 2)]; /* 50/30/20 */
    /* STAGE 6 volatile roll (SPEC "rare volatile asteroids"): chance comes
       from game.rollVolatile -> WaveDirector's encounter plan (volatile
       waves begin at wave 5, with a guaranteed cluster plus extra rolls). A director-less node world draws NO rng here,
       so the stage-4 seeded field stays byte-identical. Telegraph = the
       shared emissive-crack material (_vMat, allocated once) — same colour
       language the SPEC asks for. */
    const rolledVolatile = !!(this.game.rollVolatile && this.game.rollVolatile());
    r.volatile = size === 'large' && rolledVolatile; // fragments do not recursively seed new volatiles
    if (r.volatile) r.mesh.material = this._vMat;
    r.mesh.position.copy(pos);
    r.mesh.scale.setScalar(r.radius);
    r.mesh.quaternion.set(0, 0, 0, 1);
    r.mesh.visible = true;
    r.vel.copy(vel);
    this._randUnit(this._dir);
    r.spinAxis.copy(this._dir);              /* unique seeded tumble axis */
    /* slow size-scaled tumble: 6/r rad/s clamped, halved..full, seeded sign */
    r.spinRate = (rng() < 0.5 ? -1 : 1) * (0.5 + rng() * 0.5) * clampNum(6 / r.radius, 0.12, 1.1);
    r.hitCool = 0;
    r._wPrev = 1e9; r._wArmed = true;   /* recycled slot: fresh whoosh arm */
    r.rec.r = r.radius; r.rec.size = size; r.rec.hp = r.hp;
    return r;
  }

  _spawnVel(mul, out) {
    this._randUnit(out);
    const sp = (this.W.speedMin + rng() * (this.W.speedMax - this.W.speedMin)) * mul;
    return out.multiplyScalar(sp);
  }

  _spawnPoint(radius, out) {
    const S = this.T.sector;
    const hx = S.x * 0.4, hy = S.y * 0.4, hz = S.z * 0.4; /* 0.8 half-extent: inside the spring */
    const ship = this.game.ship ? this.game.ship.position : null;
    const minO = this.W.minOriginDist + radius, minS = this.W.minShipDist + radius;
    for (let i = 0; i < 60; i++) {
      const x = (rng() * 2 - 1) * hx, y = (rng() * 2 - 1) * hy, z = (rng() * 2 - 1) * hz;
      if (Math.sqrt(x * x + y * y + z * z) < minO) continue;
      if (ship) {
        const dx = x - ship.x, dy = y - ship.y, dz = z - ship.z;
        if (dx * dx + dy * dy + dz * dz < minS * minS) continue;
      }
      return out.set(x, y, z);
    }
    /* fallback (crowded field): ring at minO+30 clamped into the box */
    this._randUnit(this._dir);
    const d = minO + 30;
    return out.set(clampNum(this._dir.x * d, -hx, hx), clampNum(this._dir.y * d, -hy, hy), clampNum(this._dir.z * d, -hz, hz));
  }

  spawnWave(wave, plan) {
    const base = this.W.base + Math.floor(wave * this.W.perWave);
    const count = Math.min(plan ? Math.ceil(base*plan.countScale) : base, this.R.cap);
    const mul = Math.min(6, Math.pow(this.W.speedScale, wave - 1)) * (plan ? plan.speedScale : 1);
    const cluster = plan ? Math.min(count,plan.clusterCount) : 0;
    if (cluster) {
      // Three medium volatiles share drift and remain within blast reach.
      // The larger rejection radius keeps every offset clear of the player.
      const spacing = this.R.radius.medium[1]*2;
      const center = this._spawnPoint(this.R.radius.medium[1]+spacing,this._sPos).clone();
      const velocity = this._spawnVel(mul,this._sVel).clone();
      for (let i=0; i<cluster; i++) {
        this._sPos.copy(center); this._sPos.x += (i-(cluster-1)/2)*spacing;
        const r=this.spawnRock('medium',this._sPos,velocity);
        if (!r) break;
        r.volatile=true; r.mesh.material=this._vMat;
      }
    }
    for (let i = cluster; i < count; i++) {
      let size;
      if (plan) {
        const n=rng();
        size=n<plan.smallShare ? 'small' : (n<plan.smallShare+plan.mediumShare ? 'medium' : 'large');
      } else size=(wave>=2 && rng()<this.W.mediumShare) ? 'medium' : 'large';
      const r = this.spawnRock(size, this._spawnPoint(this.R.radius[size][1], this._sPos), this._spawnVel(mul, this._sVel));
      if (!r) { __K.log('rock pool saturated at wave ' + wave + ' spawn'); break; }
    }
    __K.log('wave ' + wave + ': ' + this.rocks.aliveCount + ' rocks' + (plan && plan.label ? ' · '+plan.label : ''));
  }

  /* --- STAGE 5 seams (Game state machine) ---------------------------------
     clearField: title screen eye-candy lives in the CAMERA rig's own drift
     cluster, so the real field empties (pools recycled in place — the
     game.targets array IDENTITY is the pool's live list and never swaps).
     resetField: a fresh run re-seeds the SHARED rng to __K.loadSeed, so
     the selected wave replays with byte-identical spawns every restart (P1-style
     determinism holds across R-restarts, and stage 8 can tune blind).
     nudgeNear: one-shot respawn safety — every rock within `radius` of p
     gets ONE additive outward velocity kick (stronger up close). Called
     from Game.respawnShip only; rocks keep the kick permanently (real
     momentum, no per-frame push). No allocation, scratch _dir reused. */
  clearField() {
    this.rocks.clear();
    this.pebbles.clear();
    this._calm = 0;
    const dbg = this._dbg; dbg.length = 0;
    const oc = this._occl; oc.length = 0;
    if (this.game.cam && this.game.cam.setOccluders) this.game.cam.setOccluders(oc);
  }

  resetField(wave = 1, plan) {
    __K.rngSeed(__K.loadSeed);
    this.rocks.clear();
    this.pebbles.clear();
    this._calm = 0;
    this._hullZeroLogged = false;
    __K.wave = wave;
    this.spawnWave(wave, plan);
  }

  nudgeNear(p, radius, speed) {
    const live = this.rocks.live;
    const r2 = radius * radius;
    for (let i = 0; i < live.length; i++) {
      const r = live[i];
      const dx = r.position.x - p.x, dy = r.position.y - p.y, dz = r.position.z - p.z;
      const d2 = dx * dx + dy * dy + dz * dz;
      if (d2 > r2) continue;
      const d = Math.sqrt(d2);
      if (d < 1e-6) this._randUnit(this._dir);       /* dead center: any way out */
      else this._dir.set(dx / d, dy / d, dz / d);
      r.vel.addScaledVector(this._dir, speed * (1 - d / radius) + speed * 0.35);
      r.hitCool = 0;   /* a nudged rock must still register later contact fresh */
    }
  }

  /* --- destroy: score + juice + split. Called from game.onTargetDestroyed
     (bolt kill) and directly by tests. Double-destroy is a no-op. ---------- */
  destroyRock(rock) {
    if (!rock || this.rocks.live.indexOf(rock) < 0) return false;
    const size = rock.size;
    const wasVolatile = rock.volatile;
    if (this.game.runRecord) this.game.runRecord.kill(size);
    this.lastConverted = 0;
    /* SPEC scoring: 20/50/100 — stage 6 routes every kill through
       game.creditScore (the combo funnel; a director-less node world credits
       at plain x1 and keeps the stage-4 exact-delta probes). The volatile
       bonus 75 pays FLAT beside the funnel: one kill = one combo credit. */
    if (typeof this.game.creditScore === 'function') {
      this.game.creditScore(this.T.score[size] || 0);
    } else {
      __K.score += this.T.score[size] || 0;
    }
    if (wasVolatile) __K.score += __K.TUNE.volatiles.bonus;

    /* capture parent state BEFORE the slot is recycled */
    this._cPos.copy(rock.position);
    this._cVel.copy(rock.vel);

    /* STAGE-11 GHOST FIX: hide the mesh the instant the kill is accepted.
       Pool.release() does NOT call reset() — rock items wipe/hide lazily on
       the NEXT obtain() — so a killed rock's mesh used to stand exactly where
       it died, solid and lit, until a future spawn happened to reuse the
       slot (mid-fight <= 1 s, during the calm beat forever). Pebbles/bolts/
       hunters/pickups all hide-at-release; rocks now match that contract.
       The kill still reads: spark + cloud burst + sound fire below from the
       captured _cPos. hp=0 so any same-frame registry reader skips it. */
    rock.hp = 0;
    rock.mesh.visible = false;

    /* spark: reuse the ProjectileSystem impact-flash pool when exposed (it
       is — same seam stage 3 used); pebbles cover it if it ever moves. */
    const pr = this.game.projectiles;
    if (pr && typeof pr._spawnFlash === 'function') {
      pr._spawnFlash(this._cPos, 0.3, Math.max(1.2, rock.radius * 0.22));
    }
    /* STAGE 7: glow burst sized to the rock (+ short-lived light on the
       medium/large kills — the point-light pool holds ~4 so smalls keep
       slots free for muzzle flashes). Crack layer pitched per size; the
       big kill stacks the full explosion bed UNDER the crack.
       STAGE 11: small kills are a sprite-only glow CLOUD — the 5-9 mesh
       pebbles they used to throw read as shootable mini-rocks that could
       never die (no colliders, 0.35-0.85 s lifetime); the cloud carries
       the impact instead and NO pebble meshes are spawned. Medium/large
       keep the exact old pebbles+spray+light ladder. No fx (node worlds)
       = skip the burst; the kill itself stays crash-free. */
    if (size === 'small') {
      if (this.game.fx) this.game.fx.burst('cloud', this._cPos, this._cVel);
    } else {
      if (this.game.fx) this.game.fx.explosion(this._cPos, size, this._cVel);
      this._spawnPebbles(this._cPos, this._cVel, rock.radius);
    }
    this.game.sfx(size === 'large' ? 'crackLarge' : (size === 'medium' ? 'crackMedium' : 'crackSmall'));
    if (size !== 'small') this.game.sfx('explosion');
    this.game.shakeFor('rock', size);

    // Recursive kills reuse _cPos and may obtain this pool slot for a child.
    // Give each volatile blast its own immutable origin; no released source
    // remains in the live list to exclude from the damage sweep.
    const blastAt = wasVolatile ? this._cPos.clone() : null;
    this.rocks.release(rock);               /* swap-removes from game.targets */
    this._split(size, this._cPos, this._cVel);
    /* STAGE 6: volatile rocks detonate AFTER release+split — game.volatileBlast
       damages nearby rocks + the ship (through damageShip) and chain-reacts
       other volatiles (re-entrancy depth-capped inside Game). */
    if (wasVolatile && typeof this.game.volatileBlast === 'function') {
      this.game.volatileBlast(blastAt, null);
    }
    return true;
  }

  /* large -> 2-3 medium, medium -> 2-3 small, small -> nothing.
     Momentum: child vel = parent vel * inherit (0.8) + outward 6-10 u/s
     along a seeded axis => ~parent momentum conserved, fragments fan out.
     CAP: parent slot is already free; any child past TUNE.rocks.cap converts
     to score + pebbles instead of a mesh (SPEC). */
  _split(parentSize, pos, vel) {
    if (parentSize === 'small') return;
    const childSize = parentSize === 'large' ? 'medium' : 'small';
    const sb = this.R.split[parentSize];
    const want = sb[0] + ((rng() * (sb[1] - sb[0] + 1)) | 0); /* inclusive band */
    const cb = this.R.radius[childSize];
    const spread = parentSize === 'large' ? 16 : 8;           /* child stand-off */
    for (let i = 0; i < want; i++) {
      const cr = cb[0] + rng() * (cb[1] - cb[0]);             /* draw shape rolls even when capped */
      if (this.rocks.aliveCount >= this.R.cap) {              /* cap -> score + spark, no mesh */
        this.lastConverted++;
        __K.score += this.T.score[childSize];
        this._spawnPebbles(pos, vel, cr);
        continue;
      }
      this._randUnit(this._dir);
      const imp = this.R.impulse[0] + rng() * (this.R.impulse[1] - this.R.impulse[0]);
      this._chVel.copy(vel).multiplyScalar(this.R.inherit).addScaledVector(this._dir, imp);
      this._chPos.copy(pos).addScaledVector(this._dir, spread);
      if (!this.spawnRock(childSize, this._chPos, this._chVel)) {
        this.lastConverted++;                                 /* pool back-pressure = same rule */
        __K.score += this.T.score[childSize];                 /* */
      }
    }
  }

  /* pebble spray: tiny pooled meshes, parent-momentum-flavoured, NO colliders
     (own pool; game.targets only ever contains rocks). STAGE 7 upgrade: every
     spray now also throws additive glow sprites through the shared particle
     pool (fx.spray) — the meshes read as solid fragments, the sprites as the
     dust catching the explosion light. Both are cosmetic back-pressure:
     saturated pools DROP the request, never queue. */
  _spawnPebbles(at, vel, parentR) {
    if (this.game.fx) this.game.fx.spray(at, vel);
    const n = 5 + ((rng() * 4) | 0);
    for (let i = 0; i < n; i++) {
      const p = this.pebbles.obtain();
      if (!p) return;                        /* cosmetic: drop, never queue */
      this._randUnit(this._dir);
      p.ttl = p.life = 0.35 + rng() * 0.5;
      p.base = Math.min(2.2, parentR * 0.1) + rng() * 0.6;
      p.mesh.geometry = this._geoLib[(rng() * this._geoLib.length) | 0];
      p.mesh.material = this._mats[(rng() * 3) | 0];
      p.mesh.position.copy(at).addScaledVector(this._dir, parentR * 0.55);
      p.vel.copy(this._dir).multiplyScalar(10 + rng() * 16).addScaledVector(vel, 0.55);
      p.mesh.scale.setScalar(p.base);
      p.mesh.visible = true;
    }
  }

  /* --- per-frame: drift + tumble + soft bounds + ship damage + waves -------
     Iterates rocks.live forward; rocks only leave the pool through
     destroyRock (bolt path, outside this loop), so no swap-remove hazard. */
  update(dt) {
    const T = this.T, f = T.flight, S = T.sector, ship = this.game.ship;
    const live = this.rocks.live;

    for (let i = 0; i < live.length; i++) {
      const r = live[i];
      /* constant drift (no damping — SPEC "constant drift velocity + spin") */
      r.position.addScaledVector(r.vel, dt);

      /* tumble about the unique seeded axis (scratch quat: zero allocation;
         rotateOnAxis would allocate an internal Quaternion per call) */
      if (r.spinRate) {
        this._spinQ.setFromAxisAngle(r.spinAxis, r.spinRate * dt);
        r.mesh.quaternion.premultiply(this._spinQ);
      }

      /* soft boundary: the ship's spring rule past 0.85 half-extent. Rocks
         are steered + clamped, NEVER glitch-teleported (rock rule, unlike
         the ship's 1.6x wrap). */
      const p = r.position, v = r.vel;
      for (let a = 0; a < 3; a++) {
        const lim = (a === 0 ? S.x : (a === 1 ? S.y : S.z)) / 2;
        const cur = a === 0 ? p.x : (a === 1 ? p.y : p.z);
        const aa = cur < 0 ? -cur : cur;
        const margin = lim * f.springMargin;
        if (aa <= margin) continue;
        const sign = cur < 0 ? -1 : 1;
        if (aa > lim * f.teleportMul) {                    /* runaway guard only */
          const clamped = sign * lim * 1.2;
          if (a === 0) { p.x = clamped; if (v.x * sign > 0) v.x = -v.x * 0.3; }
          else if (a === 1) { p.y = clamped; if (v.y * sign > 0) v.y = -v.y * 0.3; }
          else { p.z = clamped; if (v.z * sign > 0) v.z = -v.z * 0.3; }
        } else {
          const acc = Math.min(f.springK * (aa - margin), f.springMaxAccel);
          if (a === 0) v.x -= sign * acc * dt;
          else if (a === 1) v.y -= sign * acc * dt;
          else v.z -= sign * acc * dt;
        }
      }

      /* rock-vs-ship impact (one hit per rock per hitCooldown — else a ship
         standing in a rock melts 100 hull in <1 s). STAGE 5: the number is
         handed to game.damageShip — THE single damage door (shield eats it
         first, hull takes the spill; Game's defense-less fallback keeps the
         old hull-only behaviour for the node harness). Damage may be
         ignored (invuln / i-frames) but the cooldown still gates re-contact. */
      if (r.hitCool > 0) r.hitCool -= dt;
      if (r.hitCool <= 0 && ship && K.Hit.sphereSphere(r.position, r.radius, ship.position, ship.radius)) {
        const dx = r.vel.x - ship.velocity.x, dy = r.vel.y - ship.velocity.y, dz = r.vel.z - ship.velocity.z;
        const rel = Math.sqrt(dx * dx + dy * dy + dz * dz);
        const D = this.R.dmg;
        const dmg = D[r.size] * clampNum(rel / D.speedRef, D.min, D.max);
        r.hitCool = this.R.hitCooldown;
        this.game.damageShip(dmg, false, r.position, 'rock');
      }

      /* probe record refresh (identity-stable {r,size,hp}) */
      r.rec.r = r.radius; r.rec.hp = r.hp;
    }

    /* wave director (rock half) — STAGE 4 FALLBACK ONLY: when no WaveDirector
       exists (the node rock_harness world), keep the stage-4 0.8 s empty ->
       calm -> wave++ loop so those probes stay green. The LIVE game assigns
       game.director (85-wave-director.js) and progression — including the
       3 s calm, shield bonus, free pickup, hunter cadence and volatile ramp
       — lives there; this loop must not double-advance. */
    if (!this.game.director) {
      if (live.length === 0) {
        this._calm += dt;
        if (this._calm >= this.W.calmSec) {
          this._calm = 0;
          __K.wave += 1;
          this.spawnWave(__K.wave);
        }
      } else {
        this._calm = 0;
      }
    }

    /* pebbles: pure cosmetics — backward iteration (release-safe swap-remove) */
    const pl = this.pebbles.live;
    for (let i = pl.length - 1; i >= 0; i--) {
      const p = pl[i];
      p.ttl -= dt;
      if (p.ttl <= 0) { p.mesh.visible = false; this.pebbles.release(p); continue; }
      p.mesh.position.addScaledVector(p.vel, dt);
      p.mesh.scale.setScalar(p.base * (p.ttl / p.life));
    }

    /* probe + occluder surfaces refilled IN PLACE (zero allocation) */
    const dbg = this._dbg; dbg.length = 0;
    const oc = this._occl; oc.length = 0;
    for (let i = 0; i < live.length; i++) {
      dbg.push(live[i].rec);
      if (live[i].size === 'large') oc.push(live[i]);
    }
    if (this.game.cam && this.game.cam.setOccluders) this.game.cam.setOccluders(oc);
  }

  get aliveCount() { return this.rocks.aliveCount; }
}

/* ==== 60-enemy.js ==== */
/* ===== SECTION: Enemy — hunter drones (seek-and-strafe AI, telegraphed bolts) ===== */
/* SPEC "Hunter craft" (stage 6): small hostile drones, seek-and-strafe AI,
   slow red telegraphed bolts, worth more score than rocks, drop pickups.

   POOLING / REGISTRY: hunters live in their OWN Pool (cap TUNE.enemies.cap)
   — game.targets is a MERGED array Game refills in place every frame
   (rocks first, then enemies; a rock never enters twice because each pool's
   live list enters exactly once). Kills route through game.onTargetDestroyed
   -> EnemySystem.kill (score + drop + pool release); the generic retire in
   90-game splices the merged array and hides the mesh. The rock pool and
   rocks.destroyRock are never touched from this file.

   AI: cruise at TUNE.enemies.speed with a LIMITED turn rate (unit velocity
   rotated toward the desired heading by turnRateDeg*dt, Rodrigues via a
   scratch quaternion — allocation-free). Desired point:
     dist > standMax        -> chase (aim at the ship)
     dist < standMin*0.55   -> back off (aim away)
     in band                -> orbit: a seeded strafe point revolving around
                               the ship at orbitRad — pursuit of a moving
                               point reads as strafing without singularities.
   FIRE: telegraph = chargeT seconds of eye-glow (material swap to the shared
   emissive charge mat) then a slow red bolt with owner = THIS enemy, so the
   hostile-bolt path in 40-projectile routes it into game.damageShip.

   No per-frame allocation: shared geometries/materials built once in the
   constructor, all scratch objects cached, seeded rng only (never Math.random). */
class EnemySystem {
  constructor(game) {
    this.game = game;
    this.E = __K.TUNE.enemies;

    /* shared visuals: allocated EXACTLY ONCE (mesh stubs reused per pool slot) */
    this.bodyGeo = new THREE.OctahedronGeometry(1, 0);
    this.eyeGeo = new THREE.IcosahedronGeometry(0.55, 0);
    this.bodyMat = new THREE.MeshStandardMaterial({
      color: 0x5a2430, roughness: 0.5, metalness: 0.6, flatShading: true
    });
    this.eyeMat = new THREE.MeshBasicMaterial({
      color: 0xff3b2f, transparent: true, blending: THREE.AdditiveBlending,
      depthWrite: false, fog: false, toneMapped: false, opacity: 0.85
    });
    this.chargeMat = new THREE.MeshBasicMaterial({
      color: 0xffd050, transparent: true, blending: THREE.AdditiveBlending,
      depthWrite: false, fog: false, toneMapped: false
    });
    this.boltMat = new THREE.MeshBasicMaterial({
      color: 0xff2f2f, transparent: true, blending: THREE.AdditiveBlending,
      depthWrite: false, fog: false, toneMapped: false
    });

    this.container = new THREE.Group();
    this.container.name = 'enemies';
    game.scene.add(this.container);

    const self = this;
    this.enemies = new Pool(function () { return self._makeEnemy(); }, this.E.cap);

    /* scratch — allocated once; update() constructs nothing */
    this._dir = new THREE.Vector3();
    this._u = new THREE.Vector3();
    this._axis = new THREE.Vector3();
    this._q = new THREE.Quaternion();
    this._pt = new THREE.Vector3();
  }

  _makeEnemy() {
    const group = new THREE.Group();
    const disc = new THREE.Mesh(this.bodyGeo, this.bodyMat);
    disc.scale.set(1.6, 0.6, 1.6);
    const eye = new THREE.Mesh(this.eyeGeo, this.eyeMat);
    eye.position.y = 1.1;
    group.add(disc);
    group.add(eye);
    group.visible = false;
    this.container.add(group);
    const self = this;
    return {
      alive: false,
      kind: 'enemy',                    /* registry discriminator */
      mesh: group,
      position: group.position,         /* registry alias — stable identity */
      eye: eye,
      radius: this.E.radius,
      hp: 0,
      vel: new THREE.Vector3(),
      cool: 0, chargeT: 0, strafeT: 0, strafeRate: 0,
      reset: function () {
        this.hp = 0; this.cool = 0; this.chargeT = 0;
        this.strafeT = 0; this.strafeRate = 0;
        this.vel.set(0, 0, 0);
        this.eye.material = self.eyeMat;  /* un-telegraph a recycled slot */
        this.eye.scale.setScalar(1);
        this.mesh.visible = false;
      }
    };
  }

  /* --- spawn -------------------------------------------------------------- */
  spawn(pos) {
    const e = this.enemies.obtain();
    if (!e) { __K.log('enemy pool saturated'); return null; }
    const E = this.E;
    e.hp = E.hp;
    e.radius = E.radius;
    e.cool = E.boltCool * (0.5 + rng() * 0.9);
    e.chargeT = 0;
    e.strafeT = rng() * Math.PI * 2;
    e.strafeRate = (rng() < 0.5 ? -1 : 1) * (0.35 + rng() * 0.35);
    e.mesh.position.copy(pos);
    /* initial heading: any seeded unit, cruise speed immediately */
    this._dir.set(rng() * 2 - 1, (rng() * 2 - 1) * 0.3, rng() * 2 - 1).normalize();
    e.vel.copy(this._dir).multiplyScalar(E.speed);
    e.mesh.visible = true;
    return e;
  }

  /* harness hook __kSpawnHunter: a hunter at a readable ~150 u from the ship */
  spawnNearShip() {
    const ship = this.game.ship;
    if (!ship) return null;
    this._dir.set(rng() * 2 - 1, (rng() * 2 - 1) * 0.3, rng() * 2 - 1).normalize();
    this._pt.copy(ship.position).addScaledVector(this._dir, 150);
    this._pt.y = clampNum(this._pt.y, -60, 60);
    return this.spawn(this._pt);
  }

  spawnWave(count) {
    const ship = this.game.ship;
    for (let i = 0; i < count; i++) {
      this._dir.set(rng() * 2 - 1, (rng() * 2 - 1) * 0.25, rng() * 2 - 1).normalize();
      this._pt.copy(ship ? ship.position : this._pt.set(0, 0, 0))
        .addScaledVector(this._dir, 160 + rng() * 120);
      this._pt.y = clampNum(this._pt.y, -70, 70);
      if (!this.spawn(this._pt)) break;      /* pool cap reached */
    }
  }

  /* rotate unit `u` toward `want` by at most maxStep rad (Rodrigues about
     u x want, scratch only). */
  _turnToward(u, want, maxStep) {
    const dot = clampNum(u.x * want.x + u.y * want.y + u.z * want.z, -1, 1);
    if (dot > 1 - 1e-9) return;
    const ang = Math.acos(dot);
    let ax = u.y * want.z - u.z * want.y,
        ay = u.z * want.x - u.x * want.z,
        az = u.x * want.y - u.y * want.x;
    const al = Math.hypot(ax, ay, az);
    if (al < 1e-9) {
      /* EXACTLY antiparallel (flying straight away): the cross product has no
         axis — any perpendicular works. Without this the hunter would fly out
         of the sector forever (a real case: chase heading == -velocity). */
      if (Math.abs(u.x) > 0.9) this._axis.set(0, 1, 0);
      else this._axis.set(1, 0, 0);
    } else {
      this._axis.set(ax / al, ay / al, az / al);
    }
    this._q.setFromAxisAngle(this._axis, Math.min(maxStep, ang));
    u.applyQuaternion(this._q).normalize();
  }

  /* --- per-frame: seek-strafe steering + telegraphed fire ------------------
     Forward iteration: hunters only LEAVE the pool through kill() (bolt /
     AoE paths, outside this loop), so no swap-remove hazard — same rule the
     rock loop states. */
  update(dt) {
    const E = this.E, game = this.game, ship = game.ship;
    const live = this.enemies.live;
    const maxStep = E.turnRateDeg * (Math.PI / 180) * dt;
    const S = __K.TUNE.sector;

    for (let i = 0; i < live.length; i++) {
      const e = live[i];
      const dx = ship.position.x - e.position.x,
            dy = ship.position.y - e.position.y,
            dz = ship.position.z - e.position.z;
      const d = Math.hypot(dx, dy, dz);

      /* desired heading */
      this._dir.set(dx, dy, dz);
      if (d > E.standMax) {
        if (d > 1e-6) this._dir.multiplyScalar(1 / d);   /* chase */
      } else if (d < E.standMin * 0.55) {
        this._dir.set(-dx, -dy, -dz);
        if (d > 1e-6) this._dir.multiplyScalar(1 / d);   /* back off */
      } else {
        /* orbit: chase a seeded point revolving round the ship at orbitRad */
        e.strafeT += e.strafeRate * dt;
        this._pt.set(ship.position.x + Math.cos(e.strafeT) * E.orbitRad,
                     ship.position.y + Math.sin(e.strafeT * 0.7) * 12,
                     ship.position.z + Math.sin(e.strafeT) * E.orbitRad);
        this._dir.set(this._pt.x - e.position.x, this._pt.y - e.position.y, this._pt.z - e.position.z);
        const dl = this._dir.length();
        if (dl > 1e-6) this._dir.multiplyScalar(1 / dl);
      }
      /* sector discipline: past 0.9 half-extent, steer back to center */
      const p = e.position;
      if (Math.abs(p.x) > S.x * 0.45 || Math.abs(p.y) > S.y * 0.45 || Math.abs(p.z) > S.z * 0.45) {
        this._dir.set(-p.x, -p.y * 2, -p.z).normalize();
      }

      /* limited-turn steering of the UNIT velocity (cruise speed constant) */
      const sp = e.vel.length();
      if (sp < 1e-6) this._u.copy(this._dir);
      else { this._u.copy(e.vel).multiplyScalar(1 / sp); this._turnToward(this._u, this._dir, maxStep); }
      e.vel.copy(this._u).multiplyScalar(E.speed);
      e.position.addScaledVector(e.vel, dt);

      /* cosmetic facing: nose toward the ship-ish, spin about Y only */
      e.mesh.rotation.y = Math.atan2(dx, dz);

      /* fire: cooldown -> charge telegraph (glow swap) -> slow red bolt */
      if (e.chargeT > 0) {
        e.chargeT -= dt;
        const k = 1 + (1 - Math.max(0, e.chargeT) / E.chargeSec) * 0.9;
        e.eye.material = this.chargeMat;
        e.eye.scale.setScalar(k);
        if (e.chargeT <= 0) {
          e.eye.material = this.eyeMat;
          e.eye.scale.setScalar(1);
          this._fire(e, d);
          e.cool = E.boltCool;
        }
      } else {
        e.cool -= dt;
        if (e.cool <= 0 && d < E.fireRange) e.chargeT = E.chargeSec;
      }
    }
  }

  _fire(e, dist) {
    const E = this.E, ps = this.game.projectiles, ship = this.game.ship;
    const b = ps.bolts.obtain();
    if (!b) { e.cool = 0.5; return; }           /* saturated: try again sooner */
    /* miss the self-collision: bolt starts clear of the hunter's own sphere */
    this._dir.set(ship.position.x - e.position.x, ship.position.y - e.position.y, ship.position.z - e.position.z);
    const d = this._dir.length() || 1;
    this._dir.multiplyScalar(1 / d);
    b.pos.copy(e.position).addScaledVector(this._dir, e.radius + 1.5);
    b.prev.copy(b.pos);
    b.vel.copy(this._dir).multiplyScalar(E.boltSpeed);
    b.owner = e;                                  /* hostile: routes to damageShip */
    b.kind = 'bolt';
    b.dmg = E.boltDmg;
    b.hitR = __K.TUNE.weapons.boltRadius;
    b.lock = null;
    b.ttl = 8;
    b.mesh.visible = true;
    b.mesh.geometry = ps.geo;                     /* recycle hygiene (pool shared) */
    b.mesh.material = this.boltMat;
    b.mesh.position.copy(b.pos);
    ps._aimMesh(b.mesh, b.vel);
    b.mesh.updateMatrix();
    ps.shots++;
    /* STAGE 7: telegraph release reads audibly — red bolt zips out with the
       hunter-bolt sound + muzzle sprites (kill() owns the death sound). */
    this.game.sfx('hunterBolt');
    if (this.game.fx) this.game.fx.muzzleFlash(b.pos);
  }

  /* --- kill: score + drop + pool release. Idempotent (a double-destroy of
     the same registry entry pays once). Game's generic retire then splices
     the merged registry + hides the mesh. Returns true on the paying kill. */
  kill(enemy) {
    if (!enemy || this.enemies.live.indexOf(enemy) < 0) return false;
    if (this.game.runRecord) this.game.runRecord.kill('hunter');
    /* score through the combo funnel (one credit event per kill); ~60% of
       hunters drop a pickup at the kill point (SPEC "drop ammo or shield
       pickups often"). */
    const pay = typeof this.game.creditScore === 'function'
      ? this.game.creditScore(this.E.score)
      : (__K.score += this.E.score);
    __K.log('hunter destroyed: +' + pay);
    /* STAGE 7: death reads like a small explosion (crack + bed layered
       under the hunter-death voice; sprites + one pooled light). */
    this.game.sfx('hunterDeath');
    this.game.sfx('explosion');
    this.game.shakeFor('explosion');
    if (this.game.fx) {
      this.game.fx.explosion(enemy.position, 'medium', null);
      this.game.fx.light('explosion', enemy.position);
    }
    if (this.game.pickups && rng() < this.E.dropChance) {
      this.game.pickups.hunterDrop(enemy.position);
    }
    enemy.eye.material = this.eyeMat;
    this.enemies.release(enemy);
    return true;
  }

  clearAll() { this.enemies.clear(); }

  get aliveCount() { return this.enemies.aliveCount; }
}

/* ==== 65-pickup.js ==== */
/* ===== SECTION: Pickup — pooled tokens: shield/repair/ammo/buff/score/life ===== */
/* SPEC "Pickups" (stage 6): glowing geometric tokens with a readable colour
   language — blue shield, green repair, orange ammo, amber buff, gold score,
   rare extra life. Magnet toward the ship when close, slow bob, collect on
   sphere overlap.

   REGISTRY: pickups are NOT colliders and NEVER enter game.targets — bolts
   can't shoot them (arcade rule, documented): overlap is tested here against
   the ship only. They live in their own Pool; the merged-registry refill in
   90-game pushes rocks + enemies only.

   EFFECTS (all through the stage-5 contracts):
     shield     __K.shield += 40, capped at TUNE.defense.shieldMax (cap 100)
     repair     __K.hull += 25, capped at hullMax (rarer by weight)
     ammoFlak   __K.ammo.flak += 12 capped   / ammoMissile: __K.ammo.seeker += 2 capped
     buff       __K.buff = 'rapid'|'double', __K.buffT = 8 s; this update decays
                the timer and keeps game.rapidMul / game.dmgMul current (the
                fire-rate + damage passes read those multipliers)
     score      __K.score += 250 (a gem is not a kill: no combo credit)
     extraLife  __K.lives++ (rare drop; thresholds still pay via Defense)

   No per-frame allocation: 7 shared materials + 1 shared geometry built once,
   scratch vectors cached, seeded rng only. */
class PickupSystem {
  constructor(game) {
    this.game = game;
    this.P = __K.TUNE.pickups;
    this.V = this.P.values;

    /* additive buff surface (types fixed once; fields new for stage 6) */
    if (typeof __K.buff !== 'string') __K.buff = '';
    if (typeof __K.buffT !== 'number') __K.buffT = 0;

    const COLORS = {
      shield: 0x59d7ff, repair: 0x6fe08a, ammoFlak: 0xff9a3e, ammoMissile: 0xff5a3e,
      buff: 0xffc24a, score: 0xffd76a, extraLife: 0xff7ae0
    };
    this.mats = {};
    for (const k in COLORS) {
      this.mats[k] = new THREE.MeshBasicMaterial({
        color: COLORS[k], transparent: true, blending: THREE.AdditiveBlending,
        depthWrite: false, fog: false, toneMapped: false, opacity: 0.95
      });
    }
    this.geo = new THREE.OctahedronGeometry(1.4, 0);

    this.container = new THREE.Group();
    this.container.name = 'pickups';
    game.scene.add(this.container);

    const self = this;
    this.pickups = new Pool(function () { return self._makePickup(); }, this.P.cap);

    /* weighted draw tables, built ONCE from TUNE (Object.entries at ctor
       only — update()/spawn roll without allocation) */
    this._entries = [];
    let total = 0;
    for (const t in this.P.weights) { total += this.P.weights[t]; this._entries.push([t, total]); }
    this._total = total;
    const HD = { shield: 24, ammoFlak: 24, ammoMissile: 18, score: 14, buff: 10, repair: 8, extraLife: 2 };
    this._hentries = [];
    let htotal = 0;
    for (const t in HD) { htotal += HD[t]; this._hentries.push([t, htotal]); }
    this._htotal = htotal;

    /* STAGE-11 calm-gift table: built ONCE from TUNE.pickups.calmWeights
       (ammo-weighted so a wave clear near-guarantees resupply). Absent or
       empty block => _centries stays null and freePickup falls back to the
       natural spawnRandom roll (logged once, crash-free). */
    this._centries = null;
    this._ctotal = 0;
    const CW = this.P.calmWeights;
    if (CW) {
      const ce = [];
      let ctotal = 0;
      for (const t in CW) if (this.mats[t]) { ctotal += CW[t]; ce.push([t, ctotal]); }
      if (ce.length) { this._centries = ce; this._ctotal = ctotal; }
    }
    this._calmFallbackLogged = false;

    /* scratch */
    this._dir = new THREE.Vector3();
    this._pt = new THREE.Vector3();
  }

  _makePickup() {
    const mesh = new THREE.Mesh(this.geo, this.mats.shield);
    mesh.visible = false;
    this.container.add(mesh);
    return {
      alive: false,
      kind: 'pickup',
      type: 'shield',
      mesh: mesh,
      position: new THREE.Vector3(),    /* OWN vector: the bob writes the mesh
                                          alias only, never the collision pt */
      vel: new THREE.Vector3(),
      ttl: 0, bob: 0,
      reset: function () {
        this.type = 'shield'; this.ttl = 0; this.bob = 0;
        this.vel.set(0, 0, 0);
        this.position.set(0, 0, 0);
        this.mesh.scale.setScalar(1);
        this.mesh.visible = false;
      }
    };
  }

  _roll(entries, total) {
    const r = rng() * total;
    for (let i = 0; i < entries.length; i++) if (r < entries[i][1]) return entries[i][0];
    return entries[entries.length - 1][0];
  }

  /* --- spawn --------------------------------------------------------------- */
  spawn(type, pos) {
    if (!this.mats[type]) { __K.log('unknown pickup type: ' + type); type = 'shield'; }
    const p = this.pickups.obtain();
    if (!p) { __K.log('pickup pool saturated'); return null; }
    p.type = type;
    p.mesh.material = this.mats[type];
    p.ttl = this.P.ttl;
    p.bob = rng() * Math.PI * 2;
    p.position.copy(pos);               /* collision center (own vector) */
    p.mesh.position.copy(pos);
    p.mesh.scale.setScalar(1);
    /* gentle seeded drift so tokens spread out instead of stacking */
    this._dir.set(rng() * 2 - 1, rng() * 2 - 1, rng() * 2 - 1).multiplyScalar(4 + rng() * 8);
    p.vel.copy(this._dir);
    p.mesh.visible = true;
    return p;
  }

  /* harness hook __kSpawnPickup: INSIDE the magnet ring so magnetism is
     exercised immediately (acceptance). */
  spawnNearShip(type) {
    const ship = this.game.ship;
    if (!ship) return null;
    this._dir.set(rng() * 2 - 1, (rng() * 2 - 1) * 0.3, rng() * 2 - 1).normalize();
    this._pt.copy(ship.position).addScaledVector(this._dir, 20);
    this._pt.y = clampNum(this._pt.y, -80, 80);
    return this.spawn(type || this._roll(this._entries, this._total), this._pt);
  }

  hunterDrop(pos) { this.spawn(this._roll(this._hentries, this._htotal), pos); }
  spawnRandom(pos) { this.spawn(this._roll(this._entries, this._total), pos); }

  /* free calm-phase pickup (WaveDirector): a random field point ~120 u off.
     STAGE-11: type rolls from the ammo-weighted calmWeights table (built once
     in the ctor) instead of the natural weights; missing/empty table falls
     back to the old spawnRandom roll and logs that once. */
  freePickup() {
    const ship = this.game.ship;
    this._dir.set(rng() * 2 - 1, (rng() * 2 - 1) * 0.25, rng() * 2 - 1).normalize();
    this._pt.copy(ship ? ship.position : this._pt.set(0, 0, 0)).addScaledVector(this._dir, 110 + rng() * 90);
    this._pt.y = clampNum(this._pt.y, -80, 80);
    if (this._centries) {
      this.spawn(this._roll(this._centries, this._ctotal), this._pt);
    } else {
      if (!this._calmFallbackLogged) {
        this._calmFallbackLogged = true;
        __K.log('calmWeights missing/empty: calm gift falls back to natural weights');
      }
      this.spawnRandom(this._pt);
    }
  }

  /* --- effect application (all writes via the stage-5 model fields) -------- */
  apply(p) {
    const V = this.V, game = this.game;
    const D = (__K.TUNE.defense) || { shieldMax: 100, hullMax: 100 };
    const smax = game.shieldMax ? game.shieldMax() : (D.shieldMax || 100), hmax = D.hullMax || 100;
    switch (p.type) {
      case 'shield':
        __K.shield = Math.min(smax, __K.shield + V.shield);
        __K.log('pickup shield +' + V.shield); break;
      case 'repair':
        __K.hull = Math.min(hmax, __K.hull + V.repair);
        __K.log('pickup repair +' + V.repair); break;
      case 'ammoFlak':
        __K.ammo.flak = Math.min(__K.TUNE.weapons.flak.ammoMax, __K.ammo.flak + V.ammoFlak);
        __K.log('pickup flak +' + V.ammoFlak); break;
      case 'ammoMissile':
        __K.ammo.seeker = Math.min(__K.TUNE.weapons.seeker.ammoMax, __K.ammo.seeker + V.ammoMissile);
        __K.log('pickup missile +' + V.ammoMissile); break;
      case 'buff':
        __K.buff = rng() < 0.5 ? 'rapid' : 'double';
        __K.buffT = V.buffSec;
        __K.log('pickup buff: ' + __K.buff + ' ' + V.buffSec + 's'); break;
      case 'score':
        __K.score += V.score;           /* a gem pays flat: combo is for kills */
        __K.log('pickup score +' + V.score); break;
      case 'extraLife':
        __K.lives++;
        __K.log('pickup EXTRA LIFE (' + __K.lives + ' lives)'); break;
      default: break;
    }
    /* STAGE 7: every collect voices itself — the rising pickup chime, or
       the full extra-life JINGLE for the rare violet one. A colour-matched
       sparkle burst rides the collect point (own vector: safe to read). */
    this.game.sfx(p.type === 'extraLife' ? 'extraLife' : 'pickup');
    if (this.game.fx) this.game.fx.collect(p.position);
    if (game.hud && game.hud.pickupFlash) game.hud.pickupFlash(p.type);
  }

  /* --- per-frame: magnet + bob + ttl + collect + buff timers --------------
     Backward iteration: collection releases mid-loop (swap-remove safe). */
  update(dt) {
    const P = this.P, game = this.game, ship = game.ship;
    const live = this.pickups.live;
    const grab = P.radius + (ship ? ship.radius : 0);
    const magnetRange = game.magnetRange ? game.magnetRange() : P.magnetRange;
    const mag2 = magnetRange * magnetRange;
