<!--
  KESSLER — single-file deliverable shell.
  build.py inlines dev/src/*.js (concat order by filename) at the @@BUNDLE@@ marker.
  Do not add static import/export statements to dev/src/*.js (see docs/CONVENTIONS block in the plan).
  three.js addons are loaded via dynamic import() inside 95-boot.js; the import map below resolves them.
-->
<script>
/* Smoke harness — permanent. tests/smoke.md asserts __err stays empty. */
window.__err = [];
addEventListener('error', function (e) { window.__err.push('error: ' + e.message); });
addEventListener('unhandledrejection', function (e) { window.__err.push('rejection: ' + String(e && e.reason)); });
(function () {
  var ce = console.error;
  console.error = function () {
    window.__err.push('console: ' + Array.prototype.join.call(arguments, ' '));
    ce.apply(console, arguments);
  };
})();
</script>
<script type="importmap">

  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",

  }
}
</script>

    border: 1px solid #233248; border-radius: 6px; padding: 12px;
  }
  .control-guide h2 { margin: 0 0 10px; font-size: 17px; font-weight: 600; }

  }
  .control-input img { flex: 0 0 auto; }

  .control-hint { display: block; margin-top: 2px; font-size: 12px; color: #abc0d8; }
  .control-note { font-size: 12px; color: #abc0d8; margin: 10px 8px; }
  .control-guide summary {
    cursor: pointer; padding: 10px 8px; color: #8cdbef;
    border: 1px solid #34506b; border-radius: 5px; margin: 12px 0 8px;
  }
  .menu-panel button:focus-visible, .control-guide summary:focus-visible {
    outline: 2px solid #59d7ff; outline-offset: 3px;
  }
  @media (max-width: 420px) {

</style>

<script type="module">
/* ==== 05-core.js ==== */
/* ===== SECTION: Core — K namespace, debug hook, tuning table ===== */
/* Stages 1+ extend this file with shared helpers (RNG, Pool, Hit). Keep it first in concat order. */

/* window.__K is the smoke-test surface (tests/smoke.md). Only additive fields allowed;
   never remove or rename existing fields — the automated harness reads them. */
const __K = (window.__K = window.__K || {});
__K.ready = false;
__K.state = 'BOOT';

/* THREE namespace lives at module scope and is assigned exactly once by boot()
   (95-boot.js) via dynamic import('three'). No class below may touch a THREE
   constructor before boot() assigns it — construction only ever happens after. */
let THREE = null;

/* Tuning surface: every balance-relevant constant lives here (stage 8 edits this table only). */
__K.TUNE = {
  sector: { x: 800, y: 200, z: 800 },
  ship: { maxSpeed: 38, boostSpeed: 55, radius: 2.2, pitchLimitDeg: 80, invulnSec: 2.0 },
  /* STAGE-12 flight-mode switch. 'space'  = quaternion attitude (Q/E roll,
     no pitch clamp, RCS carry, vacuum linear) — DEFAULT per user ratification
     2026-10-01. 'assist' = the stage-1..11 aircraft model, bit-identical to
     stage-11b behavior. 90-game persists the player's choice to localStorage
     'kessler.flightmode' and owns the T-toggle; Ship reads this value at
     construction as the fallback. */
  flightMode: 'space',
  navigation: { minSpeed: 1, edgeInset: 48 },
  threats: { hitSec: 0.8, lookAheadSec: 2, nearMargin: 2 },
  /* Stage-4 rock field (SPEC "Asteroids" + "Balance seeds"). Sizes + split
     counts + HP all live here so stage 8 balance touches this table only. */
  rocks: {
    cap: 70,                          /* simultaneous collidable rocks (SPEC 50-70) */
    hp:     { small: 1, medium: 3, large: 6 },   /* pulse dmg 1: small 1, med 2-3, large 5-6 */
    radius: { large: [18, 24], medium: [10, 12], small: [5, 6] },  /* SPEC bands */
    split:  { large: [2, 3], medium: [2, 3] },   /* children per kill; small -> none */
    inherit: 0.8,                     /* fraction of parent velocity children keep */
    impulse: [6, 10],                 /* outward kick on children, u/s (SPEC 6-10) */
    hitCooldown: 1.0,                 /* per-rock ship-damage cooldown, s: without it
                                         the ship STANDING in a rock takes one hit per
                                         frame and melts (~100 dmg/s -> 0 hull < 1 s)  */
    dmg: { small: 1, medium: 2, large: 3, speedRef: 20, min: 0.5, max: 2 }
                                        /* hull dmg = sizeFactor * clamp(relSpeed/20, 0.5, 2)
                                           -> large ~ 3x small (SPEC "scaled by relative
                                           speed and size")                              */
  },

  score: { large: 20, medium: 50, small: 100 },

  /* Stage-4 wave director seeds (SPEC "Wave director", the rock half of it;
     hunters/pickups join stage 6). count = base + floor(wave*perWave):
     wave 1 = 4+1 = 5 large rocks (SPEC "Wave 1: 4-5 large"). Drift scales
     *speedScale^(wave-1) off the wave-1 band. */
  upgrades: { everyWaves:3, cap:3, shieldPerLevel:15, flakFactor:0.9, magnetPerLevel:0.2 },
  waves: {
    base: 4, perWave: 1.5,
    speedMin: 4, speedMax: 8,          /* wave-1 drift band, u/s (SPEC 4-8) */
    speedScale: 1.12,                  /* per-wave drift multiplier          */
    minOriginDist: 120,                /* spawn ring: >= 120u from origin    */
    minShipDist: 60,                   /* never spawn on top of the ship     */
    calmSec: 0.8,                      /* stage-4 fallback empty->respawn beat (no director);
                                          the stage-6 director uses calm.calmSec BELOW — the
                                          live game never runs the 0.8 fallback */
    mediumShare: 0.3,                  /* wave >= 2: fraction of spawns that are mediums */

    /* Live encounters cycle hunter -> fragments -> volatile from wave 3.
       Waves 1/2 retain the original onboarding field and drift. */
    minFieldLife: 0.6,
    hunter: { firstWave: 3, perWave: 6, cap: 4 },
    volatile: { firstWave: 5, start: 0.15, perCycle: 0.05, cap: 0.22 },
    encounters: {
      hunters: { label: 'HUNTER PATROL', countScale: 0.7, smallShare: 0, mediumShare: 0.15, speedScale: 1, clusterCount: 0 },
      fragments: { label: 'FRAGMENT FIELD', countScale: 1.35, smallShare: 0.55, mediumShare: 0.35, speedScale: 0.85, clusterCount: 0 },
      volatile: { label: 'VOLATILE CLUSTER', countScale: 0.9, smallShare: 0, mediumShare: 0.2, speedScale: 0.8, clusterCount: 3 }
    },
    calm: {                            /* SPEC: between waves — brief calm, shield
                                          regen bonus, chance of a free pickup */
      calmSec: 3.0, shieldBonus: 10, freePickupChance: 1.0
    }
  },

  /* Stage-3 weapon seeds (SPEC "Weapons": pulse cannons — twin rapid bolts,
     hitscan-feel but visible, modest damage, infinite ammo). Stage 6 adds the
     flak/seeker sub-tables beside these. */
  weapons: {
    fireRate: 8,          /* shots/s while the fire flag is held               */
    speed: 170,           /* bolt speed along the nose, u/s (~2.8 u per frame) */
    inherit: 0.25,        /* fraction of ship velocity added to the bolt:
                             small on purpose — 1.0 lets bolts crawl backwards
                             when the ship reverses, 0 feels detached          */
    ttl: 3.0,             /* bolt lifetime, s (sector despawn usually wins)    */
    damage: 1,            /* pulse damage per bolt (SPEC: small rock dies in 1)*/
    muzzleX: 1.4,         /* twin barrels: +- local X offset                   */
    muzzleZ: 6.5,         /* local Z: just aft of the 14u nose tip             */
    boltRadius: 0.35,     /* swept-sphere radius A of the bolt                 */
    maxBolts: 512,        /* pool cap — __K.stats.bolts never exceeds this     */
    despawnMargin: 100,   /* bolts die outside sector + this margin            */
    recoilShake: 0.06,    /* cam.shake amount per shot (SPEC: "recoil punch,
                             tiny" — the rig's spring filters it, never pops)   */
    flashLife: 0.07,      /* muzzle flash stub seconds                          */
    sparkLife: 0.28,      /* impact spark stub seconds                          */
    flashPool: 24,        /* pooled flash/spark meshes (stage 7 polishes)       */

    /* ---- stage-6 weapons (SPEC "Weapons" 2+3). __K.weapon = 'pulse' |
       'flak' | 'seeker'; __K.ammo = {flak, seeker}. Pulse stays ∞. ------- */
    flak: {
      pellets: 7,             /* cone of pellets per shot (SPEC: short-range cone) */
      spreadDeg: 18,          /* half-angle-ish jitter radius around the nose.
                                 was 26: the cone was so wide a volley at
                                 100-170u lost most pellets to spread before
                                 anything connected — tightened so volleys
                                 actually connect at that engagement range */
      speed: 160,             /* pellet speed u/s. was 120: with ttl 0.7 pellets
                                 died ~84u out while rocks spawn 120u+ — a volley
                                 at 160u scored ZERO hits in the live playtest    */
      ttl: 1.1,               /* range = speed*ttl ~176u. was 0.7: flak literally
                                 could not reach a wave-1 spawn ring (84u reach)  */
      damage: 1.0,            /* was 0.5: live rig measured TWO pellets per small —
                                 flak lost its anti-cluster identity; now small
                                 dies to 1 pellet (matches SPEC pulse-seed rule),
                                 large takes ~6 hits across ~2 volleys (was 44)   */
      radius: 0.28,           /* swept-sphere radius of one pellet                 */
      ammoMax: 60,            /* STAGE-11 economy: was 40 — dry-fire with no
                                 resupply rhythm read as punishment (+16 per ammo
                                 pickup, cap raised to match)                      */
      ammoStart: 24,          /* was 20                                          */
      cool: 0.55              /* s between flak shots (rate-limited, not per-bolt) */
    },
    seeker: {
      speed: 60,              /* SPEC: slow missiles                               */
      ammoMax: 6,             /* STAGE-11 economy: was 4 (still scarce — each
                                 missile one-shots a large) (+3 per ammo pickup)   */
      ammoStart: 3,           /* was 2                                             */
      cool: 0.35,             /* s between launches                                */
      damage: 6,              /* was 5: a direct missile left a 6-hp large at 1 hp
                                 — the scarce 4-ammo nuke needed TWO per big rock;
                                 6 kills it outright (its whole identity)          */
      ttl: 6.0,
      lockConeDeg: 35,        /* lock = nearest target inside +-35 deg of the nose */
      turnRateDeg: 150,       /* limited turn-rate steering                        */
      aoeRadius: 18,          /* explosion AoE ~18u (SPEC tradeoff: friendly fire) */
      aoeDamage: 5,           /* rocks take this at center, falloff linear to edge */
      shipDamage: 10,         /* ship takes this scaled by distance (friendly fire)*/
      fuseRange: 3.2,         /* detonate within fuseRange + target radius         */
      boltRadius: 0.5         /* swept radius of the missile body                  */
    },

    /* ---- stage-10 penetration budgets (defects A+B). pierce = EXTRA
       targets one bolt may damage during its swept scan before it dies.
       pulse stays 0 (first-contact-dies, the stage-3 feel); flak pellets
       punch through 2 rocks after their first so a volley rakes a cluster
       instead of every pellet dying on the first rock it kisses. ---------- */
    piercePulse: 0,
    pierceFlak: 2
  },

  /* ---- stage-6 hunter drones (SPEC "Hunter craft") ------------------------ */
  enemies: {
    cap: 8,                  /* pool size (brief: pool ~8) */
    hp: 4,                   /* dies to 4 pulses or 1 seeker */
    score: 150,              /* worth more than rocks (SPEC) */
    radius: 3.2,             /* bounding sphere */
    speed: 26,               /* cruise speed u/s */
    turnRateDeg: 95,         /* limited turn-rate facing */
    standMin: 80, standMax: 120,   /* seek-and-strafe: close to this band */
    orbitRad: 95,            /* nominal orbit radius when parked */
    boltSpeed: 45,           /* SPEC: slow red bolts ~45 u/s */
    boltDmg: 8,              /* incoming damage on ship (shield-first via funnel) */
    boltCool: 2.4,           /* s between hunter shots */
    chargeSec: 0.6,          /* SPEC telegraph: 0.6 s charge glow before the shot */
    fireRange: 260,          /* only charge within this range */
    dropChance: 0.6          /* SPEC ~60% pickup drop */
  },

  /* ---- stage-6 pickups (SPEC "Pickups") ---------------------------------- */
  pickups: {
    cap: 12,
    radius: 2.6,             /* collect sphere overlap with ship radius */
    magnetRange: 28,         /* SPEC: magnet toward ship when close */
    magnetAccel: 60,         /* smooth accel toward ship, u/s^2 */
    magnetMaxSpeed: 42,
    ttl: 14,                 /* uncollected pickups fade out */
    bobRate: 2.2,
    /* draw weights for the natural (non-hunter, non-director) roll */
    weights: { shield: 30, repair: 10, ammoFlak: 20, ammoMissile: 12, buff: 10, score: 16, extraLife: 2 },
    /* STAGE-11 calm gift (WaveDirector free pickup): ammo-weighted roll so
       some resupply is near-guaranteed every wave clear — under the natural
       weights only 32% of calm gifts were ammo; this roll is 60% ammo with a
       big flak share and keeps variety. 65-pickup.js calmGift() owns this
       table; absence of the block falls back to spawnRandom. */
    calmWeights: { ammoFlak: 45, ammoMissile: 15, shield: 20, repair: 8, buff: 5, score: 7 },
    values: {                /* effect magnitudes (stage 8 tunes this table) */
      shield: 40, repair: 25, ammoFlak: 16, ammoMissile: 3,
      buffSec: 8, score: 250
    }
  },

  /* ---- stage-6 volatiles (SPEC "volatile asteroids") ---------------------- */
  volatiles: {
    blastRadius: 28,         /* explosion radius, u */
    rockDamage: 3,           /* nearby rocks hp -= 3 (chain-reacts: volatile hp 6 -> 2 dies next) */
    shipDamage: 18,          /* full-strength at epicenter, linear falloff to edge */
    bonus: 75                /* score bonus paid on a volatile kill */
  },

  /* ---- stage-6 combo scoring (SPEC "Combo or clean split bonus") --------- */
  combo: {
    windowSec: 1.2,          /* kills within 1.2 s chain a combo */
    cap: 5,                  /* x1..x5 multiplier cap */
    chipHold: 0.6            /* x-chip lingers this long past the window before hiding */
  },

  /* Stage-1 flight seeds (SPEC "Balance seeds": forward accel > reverse; max 38 /
     boost 55 live in ship above). Angular accel + damping settle the nose;
     linear damping is near-zero so releasing thrust keeps real drift. */
  flight: {
    accelFwd: 40,          /* u/s^2 forward thrust — the strong one. was 26: live
                              playtest took 3.8 s to near-cap — sluggish vs SPEC
                              "fast to learn"; now ~2.0 s, harness P1/P6 still pass */
    accelRev: 15,          /* u/s^2 brake/reverse — deliberately weaker         */
    accelBoost: 65,        /* u/s^2 while Shift boost is held. was 34: boost gain
                              36->52 u/s measured 3.1 s — boost barely read faster;
                              now ~1.1 s kick, P4 asymptote (<=55*1.15) unchanged  */
    softCapK: 2.2,         /* soft asymptote: how fast speed lerps back to cap  */
    linearDamping: 0.06,   /* per-second exp-ish decay; ~0.9x over 2 s: coast   */
    angularAccelDeg: 200,  /* deg/s^2 yaw & pitch authority. was 160: live probe
                              took 1.52 s to reach near-terminal rate — floaty aim
                              vs 45 u/s hunter bolts; terminal kept ~62 deg/s      */
    angularDamping: 3.2,   /* per-second; terminal rate ~ accel/damping ~ 62°/s.
                              was 2.6: 1.58 s nose settle measured; now ~1.3 s,
                              P2 clamp/P5 bank (25° clamp at 62.5*0.42) still pass */
    maxAngularRateDeg: 75, /* hard ceiling on yaw/pitch rate                    */
    bankMaxDeg: 25,        /* cosmetic mesh roll into turns (SPEC ~25°)         */
    bankFollow: 0.42,      /* deg of bank per deg/s of yaw rate                 */
    bankLevelRate: 2.2,    /* how fast cosmetic bank auto-levels                */
    springMargin: 0.85,    /* inside 0.85*half-extent: no boundary force at all */
    springK: 0.4,          /* inward accel per unit past the margin (~0.63 rad/s) */
    springMaxAccel: 30,    /* cap on the gentle inward spring                   */
    teleportMul: 1.6       /* |offset| > 1.6*half-extent -> glitch teleport back */
  },

  /* ---- STAGE-12 SPACEFLIGHT FEEL: space-mode knobs (user-ratified 2026-10-01).
     Only read when TUNE.flightMode === 'space'; assist path must never touch
     these numbers (stage-11b regression bar: assist is bit-identical).
     springMargin/springK/springMaxAccel/teleportMul are SHARED — the sector
     stays the same box in both modes. All values are playtest knobs. ---- */
  flightSpace: {
    maxSpeed: 70,            /* soft cap (user: "~70 u/s") — past assist boost 55 */
    boostSpeed: 90,          /* Shift cap in space mode                           */
    accelFwd: 40,            /* same main engine as assist                        */
    accelRev: 26,            /* retro burn authority — stronger than assist's 15:
                                in space, braking IS the maneuver                 */
    accelBoost: 65,
    softCapK: 1.2,           /* gentler asymptote: near-vacuum feel               */
    linearDamping: 0.015,    /* ~3% over 2 s: coasting is REAL drift (assist 0.06)*/
    angularAccelDeg: 140,    /* RCS authority (assist 200): floatier by design    */
    angularDamping: 0.6,     /* gentle self-level (recommended default; user
                                skipped the question — 0.0 pure-spin is a pure
                                knob change if playtest wants it)                 */
    maxAngularRateDeg: 90,   /* ceiling on yaw/pitch/roll rate                    */
    bankFollow: 0.06,        /* near-flat: no horizon to bank against             */
    bankMaxDeg: 12,
    bankLevelRate: 2.2
  },

  /* ---- stage 7 juice (SPEC \"Particles\", \"Audio\", \"Post-processing and
     look\"). Pure presentation tuning; stage 8 balance edits these too. ---- */
  particles: {
    cap: 1200,                     /* pooled point-sprites (SPEC: pool particles) */
    exhaust: { every: 0.05, puffs: 1 },   /* engine puff cadence while thrusting */
    bursts: {                      /* per-preset spawn counts + ramps */
      small:    { n: 18, spd: 14, life: 0.5,  s0: 1.6, peak: 0.9 },
      medium:   { n: 30, spd: 20, life: 0.7,  s0: 2.4, peak: 0.9 },
      large:    { n: 46, spd: 28, life: 0.9,  s0: 3.4, peak: 0.9 },
      volatile: { n: 70, spd: 34, life: 1.0,  s0: 3.6, peak: 1.0 },
      spark:    { n: 6,  spd: 30, life: 0.22, s0: 0.9, peak: 0.9 },
      muzzle:   { n: 4,  spd: 26, jit: 6,     life: 0.14, s0: 0.8, peak: 0.7 },
      debris:   { n: 26, spd: 16, life: 1.6,  s0: 2.6, peak: 0.8 },
      collect:  { n: 12, spd: 9,  life: 0.7,  s0: 1.1, peak: 0.85 },
      spray:    { n: 5,  spd: 12, life: 0.8,  s0: 1.3, peak: 0.6 }
    },
    lights: {                      /* SPEC \"short-lived point lights on
                                      muzzle flashes and explosions\" — pool ~4 live */
      pool: 4,
      muzzle:    { i: 140,  dist: 28,  life: 0.06 },
      explosion: { i: 1800, dist: 170, life: 0.32 },
      volatile:  { i: 3200, dist: 260, life: 0.5 }
    },
    shake: {                       /* cam.shake amount table (the rig's SEEDED
                                      spring does the motion; these are the
                                      amounts stages 4-6 hard-coded by hand,
                                      now table-driven and harness-tested) */
      fallback: 0.3, recoil: 0.06, flak: 0.12, seeker: 0.18,
      hull: 0.6, shield: 0.22, death: 1.0, volatile: 0.8,
      explosion: 0.5,
      rock: { large: 0.5, medium: 0.35, small: 0.25, default: 0.3 }
    }
  },
  audio: {
    master: 0.5,                   /* master gain, 0 while __K.muted */
    engine: {                      /* continuous rumble pitched by thrustLevel
                                      retuned via dev/tools/sound-lab.html
                                      (preset 2026-10-02 #2): quiet deep bed,
                                      wide sweep, thrust must pass the 0.3
                                      floor before it wakes */
      fMin: 10.5, fMax: 119.5, curve: 0.68,
      floor: 0.3,                  /* thrust below this = silent (safe stop) */
      gainLo: 0.04, gainHi: 0.25,
      lpOpen: 600, lpSpan: 1200,   /* lowpass = lpOpen + lpSpan*thrust */
      noiseGain: 1, subGain: 0.32
    },
    whoosh: { armRange: 80, trigRange: 26 },  /* large rock passes close to ship */
    alarm:  { threshold: 25, fastHull: 15, period: 0.95, fastPeriod: 0.5 },
                                        /* low-hull ping ~1 Hz below 25% hull */
    fx: {                              /* master FX chain (Sound Lab preset
                                        2026-10-02 #2): voices -> drive ->
                                        [bitcrush wet/dry] -> master -> comp,
                                        plus parallel reverb + feedback delay.
                                        drive 0..1 soft clip; crushBits 0 =
                                        bypass; mixes 0 = fully dry (the old
                                        straight-to-master wiring, bit-safe). */
      drive: 0.1,
      crushBits: 0, crushMix: 0.25,
      reverbMix: 0.16, reverbSize: 2.2,
      delayMix: 0, delayTime: 0.19
    }
  },
  bloom: {
    enabled: true,
    threshold: 0.82,               /* SPEC: keep it high, the scene must not haze */
    strength: 0.5,
    radius: 0.35,
    exposure: 1.05                 /* modest ACES push (tone mapping already on) */
  },
  input: { invertMousePitch: true }   /* STAGE-11 unified convention: UP = nose DOWN for BOTH mouse and keyboard; the knob flips the pitch axis for both devices together */
};
/* stage-10 wave-2 sub-tables pre-seeded by the orchestrator so parallel fix
   agents never edit this file (zoom: stage-10 A2; radar: stage-10 A1).
   Owners may adjust VALUES only via orchestrator; structure is theirs. */
__K.TUNE.zoom = { minFov: 34, maxFov: 84, distMin: 1.0, distMax: 2.0, ratio: 0.85, stiff: 6.0 };
__K.TUNE.radar = { range: 420, size: 150 };

/* stage-11 pre-seeds (same rule: agents own the CODE, never this file).
   aim: reticle lock assist (30-camera scan seam + 80-hud bracket). lockConeDeg
   = max angle off the nose ray a target may sit and still lock (much wider
   than the crosshair's 34px ring — it is an ASSIST cone, not a precision test);
   lead = lead-dot toggle. cloud: 50-asteroid small-kill particle burst
   (sprites only, longer + softer than 'small'); the 'small' preset stays for
   medium/large kill sparks. */
__K.TUNE.aim = { lockConeDeg: 6.0, lead: true };
__K.TUNE.particles.bursts.cloud = { n: 26, spd: 11, life: 1.1, s0: 2.2, peak: 0.75 };

/* Velocity-vector tuning (79-vectors.js owns the implementation; contract

/* ---- K.Hit (stage 3): collision math shared by the game AND tests/hit.test.js.

    const rs = r0 + r1;
    return dx * dx + dy * dy + dz * dz <= rs * rs;
  },

  /* Swept sphere A (radius rA) whose CENTER travels segment segA0 -> segA1
     against static sphere B (center pB, radius rB). Standard ray-vs-sphere on
     the EXPANDED radius (rA + rB): the answer is the earliest fractional time
     t in [0, 1] of first contact, or -1 for no contact inside the segment.
     t === 0 covers "already overlapping at the segment start"; a touch exactly
     at t === 1 counts (grazing the sphere at the frame's end is a hit).
     WHY swept: a 170 u/s bolt steps ~2.8 u per 60 Hz frame — a per-frame
     overlap test walks straight through a 5 u rock (tunneling); this does not. */
  sweptSphere: function (segA0, segA1, rA, pB, rB) {
    const dx = segA1.x - segA0.x, dy = segA1.y - segA0.y, dz = segA1.z - segA0.z;

    if (aa <= 1e-12) return -1;                      /* degenerate: static and outside */
    let disc = bb * bb - 4 * aa * cc;
    if (disc < 0) return -1;                         /* ray misses the sphere    */
    disc = Math.sqrt(disc);
    const t = (-bb - disc) / (2 * aa);
    return (t >= 0 && t <= 1) ? t : -1;

/* ---- Pool<T> (stage 3): the SPEC's mandated object pool ("Use object pooling
   for bullets, particles, and pickups"). Generic over items exposing:
     .alive  — boolean flag maintained by obtain()/release()
     .reset()— called on obtain so the item wipes last life's state
   Items are constructed ONCE up to `cap` (obtain never allocates past the cap;
   it returns null when saturated — callers must handle back-pressure). A free
   stack keeps obtain/release O(1)-amortised; forEachAlive iterates a swap-remove
   `live` index, so the per-frame loop is O(alive), not O(pool). Order within
   `live` is unspecified (swap-remove), which suits positional meshes. ------- */
class Pool {
  constructor(factory, cap) {
    this._factory = factory;
    this._cap = cap;
    this.items = [];   /* every item ever built (grows lazily to cap) */
    this.live = [];    /* subset with alive === true, order unspecified */
    this._free = [];   /* built-but-alive-free items, ready to recycle */
  }

  obtain() {
    let it = this._free.pop();
    if (!it) {
      if (this.items.length >= this._cap) return null; /* saturated: no allocation */
      it = this._factory();
      this.items.push(it);
    }
    /* lifetime generation stamp (velocity-vectors spec §5): release() →
       obtain() recycles the SAME object reference, so any observer that
       keys per-life state on object identity (the 79-vectors retention
       table) would alias a dead contact's state onto its reborn pool
       slot. A monotonic per-item counter makes (obj, _gen) a unique
       per-life key. Plain numeric increment — NO |0 coercion: signed
       32-bit wraps and is not monotonic. Additive; no existing consumer
       reads _gen, and clear() never rewinds generations. */
    it._gen = (it._gen ?? 0) + 1;
    it.alive = true;
    if (it.reset) it.reset();
    this.live.push(it);
    return it;
  }

  release(it) {
    if (!it || !it.alive) return;
    it.alive = false;
    const l = this.live, i = l.indexOf(it);
    if (i >= 0) { l[i] = l[l.length - 1]; l.pop(); }
    this._free.push(it);
  }

  forEachAlive(fn) {
    const l = this.live;
    for (let i = 0; i < l.length; i++) fn(l[i]);
  }

  /* Stage-5 seam (state machine): retire everything at once — title screen
     and run restart drain whole pools. Items hide their meshes in reset(),
     which is called here too, so visuals clear with the flags. O(live). */
  clear() {
    const l = this.live;
    for (let i = l.length - 1; i >= 0; i--) {
      const it = l[i];
      it.alive = false;
      if (it.reset) it.reset();
      this._free.push(it);
    }
    l.length = 0;
  }

  get aliveCount() { return this.live.length; }
}

/* Player preferences. Storage is optional; malformed values never reach input,
   audio or physics. Keep flight mode's existing storage key compatible. */
class PlayerSettings {
  constructor(game) {
    this.game = game;
    this.defaults = {
      invertPitch: __K.TUNE.input.invertMousePitch,
      sensitivity: 1, flightMode: __K.TUNE.flightMode,
      volume: __K.TUNE.audio.master, cameraShake: true
    };

    __K.settings = this.values;
  }

  static normalize(raw, defaults) {
    const v = Object.assign({}, defaults);
    if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return v;
    for (const k of ['invertPitch', 'cameraShake']) {
      if (typeof raw[k] === 'boolean') v[k] = raw[k];
    }
    if (raw.flightMode === 'space' || raw.flightMode === 'assist') v.flightMode = raw.flightMode;
    if (Number.isFinite(raw.sensitivity)) v.sensitivity = clampNum(raw.sensitivity, 0.25, 3);
    if (Number.isFinite(raw.volume)) v.volume = clampNum(raw.volume, 0, 1);
    return v;
  }

  load() {
    let raw = null;
    const store = this.game._store();
    try { if (store) raw = JSON.parse(store.getItem('kessler.settings')); } catch (e) { /* defaults */ }
    Object.assign(this.values, PlayerSettings.normalize(raw, this.defaults));
    // The established mode key remains authoritative for older saved choices.
    try {
      const mode = store && store.getItem('kessler.flightmode');
      if (mode === 'space' || mode === 'assist') this.values.flightMode = mode;
    } catch (e) { /* in-memory preferences */ }
    this.apply(false);
  }

  save() {
    const store = this.game._store();
    try {
      if (store) {
        store.setItem('kessler.settings', JSON.stringify(this.values));
        store.setItem('kessler.flightmode', this.values.flightMode);
      }
    } catch (e) { /* in-memory preferences still work */ }
  }

  set(patch) {
    Object.assign(this.values, PlayerSettings.normalize(patch, this.values));
    this.apply(true);
  }

  reset() {
    Object.assign(this.values, this.defaults);
    this.apply(true);
  }

  apply(persist) {
    const g = this.game, v = this.values;
    if (g.input) {
      g.input._releaseAll();
      g.input.invertMousePitch = v.invertPitch;
      g.input.mouseGain = 0.016 * v.sensitivity;

    if (__K.TUNE.flightMode !== v.flightMode) g._flipFlightMode();
    __K.TUNE.audio.master = v.volume;
    if (!v.cameraShake && g.cam) {
      g.cam._shakeClock = g.cam._shakeAmp = 0;
      g.cam._shakeOff.set(0, 0, 0);
      g.cam._shakeVel.set(0, 0, 0);
    }
    if (persist) this.save();
    if (g.hud) g.hud.syncSettings();
  }
}

/* ===== SECTION: Input — keyboard + pointer-locked mouse ===== */
/* Keyboard is the fallback that works WITHOUT pointer lock (automated probes
   dispatch KeyboardEvents on document — code is preferred, key is a fallback).
   Mouse look only produces yaw/pitch while document.pointerLockElement is set.

   LOCKED CONVENTION (stage-11 unification; do not "fix" this): ONE aim
   convention for mouse AND keyboard — UP = nose DOWN, DOWN = nose up,
   LEFT = nose left, RIGHT = nose right (classic flight-sim invert; user-
   ratified stage 11 after the stage-10 split made keys feel broken). The key
   pitch signs derive from the SAME TUNE.input.invertMousePitch knob the mouse
   uses, so flipping the knob keeps mouse and keys coherent — there is never a
   second, contradicting convention. Printed on the title screen (80-hud).

   HARNESS HOOK: input.onMouseMove(dx, dy) is PUBLIC and UNGATED — it consumes
   a raw mouse delta directly (movementX/movementY units). The gate lives in the
   document.onmousemove listener below, not inside onMouseMove, so a harness can
   call input.onMouseMove(0, -10) without faking pointer lock. */

   use the logical key; this does not remap a different keyboard layout. */

  if (e.code && e.code !== 'Unidentified') return e.code;
  const k = e.key;
  if (/^[a-z]$/i.test(k || '')) return 'Key' + k.toUpperCase();
  if (/^[0-9]$/.test(k || '')) return 'Digit' + k;
  if (k === 'Shift') return e.location === 2 ? 'ShiftRight' : 'ShiftLeft';
  if (k === 'Enter') return e.location === 3 ? 'NumpadEnter' : 'Enter';
  if (k === '=' || k === '+') return e.location === 3 ? 'NumpadAdd' : 'Equal';
  if (k === '-') return e.location === 3 ? 'NumpadSubtract' : 'Minus';
  if (k === '.') return 'Period';
  if (k === ' ' || k === 'Spacebar') return 'Space';
  if (k === 'Esc') return 'Escape';
  return /^(ArrowUp|ArrowDown|ArrowLeft|ArrowRight|Escape)$/.test(k || '') ? k : '';

  }

    this.brake = false;    /* S  brake / reverse thrust                    */
    this.boost = false;    /* Shift  raises the soft speed cap             */
    this.fire = false;     /* Space / left mouse — stored, unused until stage 3 */
    this.secondaryKey = false;   /* F held; combined with RMB by Game */
    this.secondaryMouse = false; /* RMB held; tracked separately from F */

     invert (this.invertMousePitch === true, stage-1 flight-sim) mouse UP

     a pause-button click) never shoots — Input has no state knowledge, the
     gate is passed in. `playing` arrives as __K.state === 'PLAYING'. */

    this.fire = held.has('Space') || this._mouseFire;
    this.secondaryKey = held.has('KeyF');

       the earlier still-held key; repeats never reorder that ownership. */
    for (const c of held) {
      if (c === 'ArrowLeft' || c === 'KeyA') this.yawKey = -1;
      if (c === 'ArrowRight' || c === 'KeyD') this.yawKey = 1;
      if (c === 'ArrowUp') this.pitchKey = this.invertMousePitch ? -1 : 1;
      if (c === 'ArrowDown') this.pitchKey = this.invertMousePitch ? 1 : -1;
      if (c === 'KeyQ') this.rollKey = -1;
      if (c === 'KeyE') this.rollKey = 1;

  _key(e, down) {
    const c = normalizeKeyCode(e);

       field/modal. No shortcuts or preventDefault run on this path. */
    if (!down) {
      if (this._heldKeys.delete(c)) {
        this._syncHeldKeys();
        if (c === 'KeyF' && this.onSecondary) this.onSecondary(false);

    if (c === 'Escape') { if (!e.repeat && this.onEscape) this.onEscape(); return; }
    if (c === 'KeyM') { if (!e.repeat && this.onMute) this.onMute(); return; }

      return;
    }
    if (!/^(Key[WSFADQE]|ShiftLeft|ShiftRight|Space|ArrowLeft|ArrowRight|ArrowUp|ArrowDown)$/.test(c)) return;
    this._heldKeys.add(c);
    this._syncHeldKeys();
    if (c === 'KeyF' && this.onSecondary) this.onSecondary(true);
    if (c === 'Space' || c.startsWith('Arrow')) e.preventDefault();
  }
}

/* ===== SECTION: Ship — wedge/needle fighter + limited-3D flight model ===== */
/* SPEC "Ship and limited-3D flight": position + yaw/pitch Euler (no player roll)

   - this.pitchDeg: + = nose up

    for (let s = 1; s >= -1; s -= 2) {
      const sh = new THREE.Shape();
      sh.moveTo(0.8 * s, -2.0);   /* root leading edge  (shape y -> -z: -2 => z +2) */
      sh.lineTo(5.4 * s, 1.4);    /* tip leading edge (swept back to z -1.4)        */
      sh.lineTo(5.8 * s, 3.6);    /* tip trailing edge (z -3.6)                     */
      sh.lineTo(1.0 * s, 3.6);    /* root trailing edge                             */
      const geo = new THREE.ExtrudeGeometry(sh, { depth: 0.55, bevelEnabled: false });
      geo.rotateX(-Math.PI / 2);  /* shape plane -> XZ, thickness along Y           */
      const wing = new THREE.Mesh(geo, hullMat);
      this.visual.add(wing);

      /* ceramic leading-edge strip along the wing's front line */
      const leGeo = new THREE.BoxGeometry(5.9, 0.16, 0.42);
      const le = new THREE.Mesh(leGeo, ceramicMat);
      le.position.set(3.1 * s, 0.04, 0.3);
      le.rotation.y = 0.636 * s; /* mirror per side: box axis must track root->tip line */
      this.visual.add(le);

      /* engine nacelle + emissive bell + exhaust cone at the tail */
      const nacGeo = new THREE.CylinderGeometry(0.45, 0.7, 2.6, 10);
      nacGeo.rotateX(Math.PI / 2);
      const nac = new THREE.Mesh(nacGeo, hullMat);
      nac.position.set(1.3 * s, 0, -6.3);
      this.visual.add(nac);

      const bellGeo = new THREE.CylinderGeometry(0.5, 0.5, 0.35, 10);
      bellGeo.rotateX(Math.PI / 2);
      const bell = new THREE.Mesh(bellGeo, this.engineMat);
      bell.position.set(1.3 * s, 0, -7.55);
      this.visual.add(bell);

      const exGeo = new THREE.ConeGeometry(0.42, 4.2, 10);
      exGeo.rotateX(-Math.PI / 2); /* tip -> -Z (points aft) */
      const ex = new THREE.Mesh(exGeo, this.exhaustMat);
      ex.position.set(1.3 * s, 0, -9.6); /* tip trails at z -11.7 when full */
      this.visual.add(ex);
      (this.exhausts = this.exhausts || []).push(ex);
    }

    /* small ceramic canopy bump so the hull reads from the chase side */
    const capGeo = new THREE.SphereGeometry(0.55, 10, 8);
    capGeo.scale(1.0, 0.6, 1.9);
    const cap = new THREE.Mesh(capGeo, ceramicMat);
    cap.position.set(0, 0.7, 1.2);
    this.visual.add(cap);

    /* --- flight state ------------------------------------------------------ */
    this.position = this.group.position; /* Vector3 alias */
    this.velocity = new THREE.Vector3(0, 0, 0);
    this.yawDeg = 0;   /* + nose right */
    this.pitchDeg = 0; /* + nose up    */
    this.yawRate = 0;  /* deg/s, player sign */
    this.pitchRate = 0;
    this.bankDeg = 0;  /* cosmetic mesh roll only */
    this.thrustLevel = 0; /* 0..1 smoothed, drives engine glow */

    /* STAGE-12 DUAL FLIGHT MODE. 'assist' = the stage-11b aircraft model
       (bit-identical regression bar); 'space' = full quaternion attitude —
       no pitch clamp (full sphere), RCS carry (angularDamping 0.6: release
       lets the nose CARRY then ease out), Q/E roll, vacuum linear feel.
       MODE LATCH: resetRun() is the only place TUNE.flightMode is read
       (production reaches space through Game._beginRun/title resetRun;
       bare-constructed stage-11b unit worlds stay on the assist path
       until someone resets them — cam/attack/inv harness physics stay
       stage-11b exactly as shipped). Constructor default = 'assist'.
       In SPACE the AUTHORITATIVE pose quaternion lives IN
       group.quaternion itself (integrated in place, scalar math — no
       per-frame allocation, no Quaternion methods beyond setFromEuler,
       so every harness stub survives), which makes direct pose writes
       (debugAimAt, wave-harness quaternion snaps) compose naturally
       instead of being overwritten. attitude() exposes it to camera/HUD.
       yawDeg/pitchDeg stay alive in BOTH modes as decomposed player-sign
       reads of the nose (yawDeg = azimuth, pitchDeg = elevation, wraps
       +-180 for free via atan2). yawRate/pitchRate carry their meaning in
       both modes (deg/s, player sign); rollRate is space-only. */
    this.fs = T.flightSpace;
    this.mode = 'assist';
    this.rollRate = 0; /* deg/s; +1 = KeyE = clockwise from behind the ship */

    /* scratch, allocated once — update() must not allocate (not even arrays) */
    this._euler = new THREE.Euler(0, 0, 0, 'YXZ');
    this._dq = new THREE.Quaternion(); /* space-mode small body increment (stage-12) */
    this._nose = new THREE.Vector3(0, 0, 1);
    this._half = new THREE.Vector3(this.sector.x / 2, this.sector.y / 2, this.sector.z / 2);
    this._lim2 = [this.sector.x / 2, this.sector.y / 2, this.sector.z / 2];
    this._cur = [0, 0, 0];
    this._vel = [0, 0, 0];
  }

  get speed() { return this.velocity.length(); }
  get nose() { return this._nose; } /* unit vector, valid after update() */

  /* STAGE 5 seam (Game._beginRun / respawn / title): snap every flight
     number back to a clean run state — zero velocity, neutral attitude,
     glow off. No allocation; the pose quaternion + nose are refreshed
     immediately so the chase camera and debugAimAt read a valid frame even
     if this lands between update() calls. Cosmetic bank wipes too.

     STAGE-12: this is ALSO the flight-mode latch — TUNE.flightMode is read
     exactly here ('space' default, 'assist' = aircraft model), so every run
     start (and every mid-run respawn, which is the same clean state) picks
     up the mode the game glue last wrote. Quaternion wipes to IDENTITY
     (space: the attitude starts neutral; assist: identity == the euler(0,0,0)
     stage-11b pose, so assist resetRun output is bit-identical). */
  resetRun(x, y, z) {
    this.mode = __K.TUNE.flightMode === 'assist' ? 'assist' : 'space';
    this.position.set(x, y, z);
    this.velocity.set(0, 0, 0);
    this.yawDeg = 0; this.pitchDeg = 0;
    this.yawRate = 0; this.pitchRate = 0;
    this.rollRate = 0;
    this.bankDeg = 0;
    this.visual.rotation.z = 0;
    this.thrustLevel = 0;
    this.engineMat.emissiveIntensity = 0.12;
    this.exhaustMat.emissiveIntensity = 0;
    for (let i = 0; i < this.exhausts.length; i++) this.exhausts[i].scale.set(0.5, 0.5, 0.25);
    this._euler.set(0, 0, 0, 'YXZ');
    this.group.quaternion.setFromEuler(this._euler); /* == identity (0,0,0,1):
      stage-12 attitude wipe for space, bit-identical stage-11b reset for
      assist; setFromEuler(0,0,0) every stub implements, Q.set some lack */
    this._nose.set(0, 0, 1);
    return this;
  }

  /* STAGE-12 seam: the AUTHORITATIVE pose quaternion. Assist: exactly the
     stage-11b euler pose (Euler(-pitchDeg,-yawDeg,0,'YXZ')) rebuilt every
     update. Space: the integrated attitude quaternion itself — it LIVES in
     group.quaternion (integrated in place), so direct pose writers
     (Game.debugAimAt, harness quaternion snaps) compose with the sim
     instead of fighting it. Consumers (camera/HUD) read attitude() or keep
     reading ship.group.quaternion — same object, same frame. */
  attitude() { return this.group.quaternion; }

  update(dt, input) {
    const f = this.f;
    const space = this.mode === 'space';
    /* ACTIVE-mode sub-table for linear + bank knobs (space = flightSpace,
       assist = flight — assist reads the identical object, bit-identical
       arithmetic). springMargin/springK/springMaxAccel/teleportMul stay
       SHARED and always read from f. */
    const M = space ? this.fs : f;

    /* --- angular: yaw + pitch rates (no player roll) ----------------------- */
    if (space) {
      /* STAGE-12 SPACE ANGULAR: rates fed by angularAccelDeg*input with
         exp(-angularDamping*dt) self-level carry (0.6: after release the
         nose keeps rotating audibly — ~74% of rate survives 0.5 s) and the
         maxAngularRateDeg ceiling. NO pitch clamp — full sphere; the ±80
         clamp + escape-rate logic below is an assist-mode rule only.
         Body-frame increments q *= quat(small Euler) with THE STAGE-11b
         SCREEN-SIDE YAW SIGN replicated exactly: assist pose uses
         euler.y = -yawDeg (world +X projects SCREEN-LEFT behind the chase
         cam; live ndcX=-6.86), so the body Y increment is -yawRate*dt —
         verified: +yawKey swings the nose to world -X (screen right).
         x = -pitchRate*dt (+pitch = nose up, pose euler.x = -pitch),
         z = +rollRate*dt (E = clockwise seen from behind: world up tips
         toward world -X). Integrated as THREE sequential single-axis
         right-multiplies: cross terms vanish exactly, so the integration
         is identical in three.js and in every harness Euler stub (whose
         setFromEuler ignores order) — order-independent per frame.
         Pure scalar component math: no per-frame allocation, no
         Quaternion methods beyond setFromEuler (stub-safe). */
      const aa = M.angularAccelDeg, capR = M.maxAngularRateDeg;
      this.yawRate += input.yawInput * aa * dt;
      this.pitchRate += input.pitchInput * aa * dt;
      this.rollRate += (input.rollKey || 0) * aa * dt;
      const ad = Math.exp(-M.angularDamping * dt);
      this.yawRate *= ad;
      this.pitchRate *= ad;
      this.rollRate *= ad;
      this.yawRate = clampNum(this.yawRate, -capR, capR);
      this.pitchRate = clampNum(this.pitchRate, -capR, capR);
      this.rollRate = clampNum(this.rollRate, -capR, capR);

      const q = this.group.quaternion, dq = this._dq, eu = this._euler;
      const D2R = THREE.MathUtils.DEG2RAD;
      eu.set(-this.pitchRate * dt * D2R, 0, 0, 'YXZ'); dq.setFromEuler(eu);
      let ax = q.x, ay = q.y, az = q.z, aw = q.w;
      q.x = ax * dq.w + dq.x * aw + ay * dq.z - az * dq.y;
      q.y = ay * dq.w + dq.y * aw + az * dq.x - ax * dq.z;
      q.z = az * dq.w + dq.z * aw + ax * dq.y - ay * dq.x;
      q.w = aw * dq.w - ax * dq.x - ay * dq.y - az * dq.z;
      eu.set(0, -this.yawRate * dt * D2R, 0, 'YXZ'); dq.setFromEuler(eu);
      ax = q.x; ay = q.y; az = q.z; aw = q.w;
      q.x = ax * dq.w + dq.x * aw + ay * dq.z - az * dq.y;
      q.y = ay * dq.w + dq.y * aw + az * dq.x - ax * dq.z;
      q.z = az * dq.w + dq.z * aw + ax * dq.y - ay * dq.x;
      q.w = aw * dq.w - ax * dq.x - ay * dq.y - az * dq.z;
      eu.set(0, 0, this.rollRate * dt * D2R, 'YXZ'); dq.setFromEuler(eu);
      ax = q.x; ay = q.y; az = q.z; aw = q.w;
      q.x = ax * dq.w + dq.x * aw + ay * dq.z - az * dq.y;
      q.y = ay * dq.w + dq.y * aw + az * dq.x - ax * dq.z;
      q.z = az * dq.w + dq.z * aw + ax * dq.y - ay * dq.x;
      q.w = aw * dq.w - ax * dq.x - ay * dq.y - az * dq.z;

      /* renormalize EVERY frame (cheap): |len-1| sits at fp epsilon */
      const ql = Math.sqrt(q.x * q.x + q.y * q.y + q.z * q.z + q.w * q.w);
      if (ql > 0) { const il = 1 / ql; q.x *= il; q.y *= il; q.z *= il; q.w *= il; }

      /* decompose cheap euler-follow reads (camera/HUD/debugAimAt read
         these in BOTH modes): closed-form z-axis of q = (0,0,1) applied —
         exactly ship.nose. yawDeg = azimuth, pitchDeg = elevation, both
         player-sign (yaw+ = nose screen-right per stage-11b, pitch+ =
         nose up); yaw wraps +-180 for free through atan2. */
      let nx = 2 * (q.x * q.z + q.y * q.w), ny = 2 * (q.y * q.z - q.x * q.w),
        nz = 1 - 2 * (q.x * q.x + q.y * q.y);
      const nl = Math.sqrt(nx * nx + ny * ny + nz * nz) || 1;
      nx /= nl; ny /= nl; nz /= nl;
      this._nose.set(nx, ny, nz);
      this.pitchDeg = Math.asin(clampNum(ny, -1, 1)) / D2R;
      this.yawDeg = -Math.atan2(nx, nz) / D2R;
    } else {
    this.yawRate += input.yawInput * f.angularAccelDeg * dt;
    this.pitchRate += input.pitchInput * f.angularAccelDeg * dt;
    const ad = Math.exp(-f.angularDamping * dt);
    this.yawRate *= ad;
    this.pitchRate *= ad;
    this.yawRate = clampNum(this.yawRate, -f.maxAngularRateDeg, f.maxAngularRateDeg);
    this.pitchRate = clampNum(this.pitchRate, -f.maxAngularRateDeg, f.maxAngularRateDeg);

    this.yawDeg += this.yawRate * dt;
    if (this.yawDeg > 180) this.yawDeg -= 360;
    else if (this.yawDeg < -180) this.yawDeg += 360;

    const lim = __K.TUNE.ship.pitchLimitDeg;
    this.pitchDeg += this.pitchRate * dt;
    /* ESCAPE-IMMEDIATE rate limiting (stage-10 fix, defect C). The old rule
       zeroed pitchRate on EVERY frame the position sat at the +-80 clamp,
       even when the residual rate was already pointed OUT of the clamp (a
       dt-spike could slam pitchDeg past +-lim while fleeing; the clamp then
       murdered the escape rate every frame and the nose had to rebuild
       angular authority from zero ~1 s — the player felt it as the ship
       resting near-inverted and refusing to right itself). Now the clamp
       kills only the rate pushing FURTHER INTO the clamp; a rate already
       escaping is preserved so reversal out of the clamp is instant. */
    if (this.pitchDeg > lim) {
      this.pitchDeg = lim;
      if (this.pitchRate > 0) this.pitchRate = 0;   /* pushing in: stop it */
    } else if (this.pitchDeg < -lim) {
      this.pitchDeg = -lim;
      if (this.pitchRate < 0) this.pitchRate = 0;   /* pushing in: stop it */
    }

    /* pose quaternion (nose +Z convention: x = -pitch so +pitch = nose up).
       STAGE-11b YAW-SIGN FIX: euler.y = -yawDeg. yawDeg's player contract is
       "+ = nose right", but the chase camera looks along +Z where world +X
       projects to the SCREEN-LEFT half; a positive THREE Y-rotation swings
       the nose toward +X = screen LEFT, so pressing Right visibly turned the
       ship LEFT (screen-projected ground truth, live: world +X ndcX=-6.86).
       Negating at the ONE pose-composition site makes every consumer of the
       "yaw + = nose right" contract (keys, mouse, radar, bank, debugAimAt)
       land on the screen side the contract promised: left goes left. */
    this._euler.set(-this.pitchDeg * THREE.MathUtils.DEG2RAD, -this.yawDeg * THREE.MathUtils.DEG2RAD, 0, 'YXZ');
    this.group.quaternion.setFromEuler(this._euler);
    this._nose.set(0, 0, 1).applyEuler(this._euler);
    }

    /* --- linear: thrust along nose, forward > reverse ----------------------
       STAGE-12: every knob reads the ACTIVE mode sub-table M (flightSpace
       in space, flight in assist — same object reference, so assist math
       is bit-identical to stage-11b). Speed caps stay split by mode:
       assist reads TUNE.ship (38/55, untouched), space reads flightSpace
       (70/90). */
    const cap = space
      ? (input.boost ? M.boostSpeed : M.maxSpeed)
      : (input.boost ? __K.TUNE.ship.boostSpeed : __K.TUNE.ship.maxSpeed);
    const speed = this.velocity.length();
    let glowTarget = 0;
    if (input.thrust) {
      const a = (input.boost ? M.accelBoost : M.accelFwd) * Math.max(0, 1 - (speed / cap) * (speed / cap));
      this.velocity.addScaledVector(this._nose, a * dt);
      glowTarget = 1;
    }
    if (input.brake) { /* weaker reverse; can back up slowly, never past cap */
      this.velocity.addScaledVector(this._nose, -M.accelRev * dt);
      glowTarget = Math.max(glowTarget, 0.7);
    }

    /* very light linear damping — coasting should feel like space (space
       mode is literally near-vacuum: linearDamping 0.015 vs assist 0.06) */
    this.velocity.multiplyScalar(Math.exp(-M.linearDamping * dt));

    /* soft max-speed asymptote: bleed any excess (e.g. after boost) back to
       the current cap without ever hard-clamping the vector */
    const s2 = this.velocity.length();
    if (s2 > cap) this.velocity.multiplyScalar(1 + ((cap - s2) / Math.max(s2, 1e-6)) * Math.min(1, M.softCapK * dt));

    /* integrate position from velocity (drift/coast is real: no damping stop) */
    this.position.addScaledVector(this.velocity, dt);

    /* --- soft sector bounds (800x200x800) ---------------------------------- */
    const p = this.position, lim2 = this._lim2, cur = this._cur, vel = this._vel;
    cur[0] = p.x; cur[1] = p.y; cur[2] = p.z;
    vel[0] = this.velocity.x; vel[1] = this.velocity.y; vel[2] = this.velocity.z;
    for (let i = 0; i < 3; i++) {
      const margin = lim2[i] * f.springMargin;
      const a = cur[i];
      const aa = a < 0 ? -a : a;
      if (aa > margin) {
        const sign = a < 0 ? -1 : 1;
        if (aa > lim2[i] * f.teleportMul) {
          /* far outside: teleport back toward center with a visual glitch
             (modern wrap; __K.glitchT is consumed by stage 2+ rendering) */
          cur[i] = sign * margin * 0.5;
          if (vel[i] * sign > 0) vel[i] = -vel[i] * 0.25;
          __K.glitchT = 0.5;
          __K.log('sector teleport on axis ' + i);
        } else {
          /* gentle inward spring, capped so it nudges, never slams */
          const acc = Math.min(f.springK * (aa - margin), f.springMaxAccel);
          vel[i] -= sign * acc * dt;
        }
      }
    }
    this.position.set(cur[0], cur[1], cur[2]);
    this.velocity.set(vel[0], vel[1], vel[2]);

    /* --- cosmetic bank: mesh roll into turns, auto-levels ------------------
       visual ONLY — never fed into yaw/pitch pose, collision, or aim math.
       STAGE-12: knobs come from the ACTIVE mode sub-table; in space mode
       bank still exists but near-flat (flightSpace bankFollow 0.06 /
       bankMaxDeg 12 — no horizon to bank against). */
    const bankTarget = clampNum(this.yawRate * M.bankFollow + this.pitchRate * (space ? M.bankFollow : 0.06), -M.bankMaxDeg, M.bankMaxDeg);
    this.bankDeg += (bankTarget - this.bankDeg) * Math.min(1, M.bankLevelRate * dt);
    this.visual.rotation.z = this.bankDeg * THREE.MathUtils.DEG2RAD;

    /* --- engine glow scales with thrust (simple cone exhaust for now;
       ribbon trail is stage 2+) --------------------------------------------- */
    this.thrustLevel += (glowTarget - this.thrustLevel) * Math.min(1, 9 * dt);
    this.engineMat.emissiveIntensity = 0.12 + this.thrustLevel * 2.1;
    this.exhaustMat.emissiveIntensity = this.thrustLevel * 1.6;
    const es = 0.25 + this.thrustLevel * 1.0;
    for (let i = 0; i < this.exhausts.length; i++) this.exhausts[i].scale.set(0.5 + 0.5 * this.thrustLevel, 0.5 + 0.5 * this.thrustLevel, es);
  }
}

/* ==== 30-camera.js ==== */
/* ===== SECTION: Camera Rig — cinematic chase camera + title orbit ===== */
/* SPEC "Cinematic chase camera": critically-damped spring toward a local
   offset (NEVER parented rigidly to the ship), separately-damped look-ahead
   along velocity + nose, boost that trails the camera back and punches the
   FOV (+8deg, eased back slowly), seeded positional shake (mulberry32 stream
   from 05-core.js via the shared `rng`, so __K.rngSeed reproduces every shake;
   no Math.random, no camera teleports), a cheap occlusion pull-in over
   setOccluders() (SPEC's sanctioned nearest-large-rock fallback — a plain
   distance/cone loop, no raycasts), a horizon-stable up (cosmetic ship bank
   is inherited at most rollMaxDeg), and a 'title' mode that slowly orbits a
   drifting placeholder rock cluster owned by the rig.
   All scratch vectors are allocated in the constructor; update() allocates
   nothing. All three springs use a critically-damped SmoothDamp (Unity-style
   closed form, damping ratio 1.0). */

const CAMERA_TUNE = {
  /* --- follow spring --- */
  offset:       [0, 3.5, -12],   /* chase offset; spring lag ran ~+6.5u at 33 u/s
                                    so cruise measured 21u — ship read tiny;
                                    now ~18u cruise, still inside R1 [8,26] band */
  boostOffset:  [0, 3.8, -13.5], /* trails farther back while boosting  */
  stiffness:    12,              /* follow spring omega — was 9.5: the lag it
                                    allowed inflated the offset (see above) and
                                    let the trail wallow after hard turns     */
  damping:      1.0,             /* damping ratio (1 = critical; dampV is 1.0)  */

  /* --- look-ahead (damped separately so turns sweep, not glue) ---
     Stage-10 reticle fix (D5): the camera aims at cam.position +
     dampedLookDir * D, where the look DIRECTION spring (same _dampV +
     lookStiffness pattern) converges on ship.nose — camera-forward ==
     the gun ray once settled, so the static screen-center CSS reticle
     (80-hud.js) is truth (bullets leave along ship.nose, 40-projectile
     _fireOne). Velocity only modulates the look-ahead DISTANCE D along
     the ray (its along-nose component), never drags the aim off it;
     damping D keeps the cinematic sweep. The old formula damped a POINT
     target p + velocity-lead — a spring chasing a moving target carries
     an unavoidable velocity-proportional lag, so camera-forward never
     landed on the nose ray while drifting or turning (the misaim). */
  lookStiffness: 3.2,
  lookAheadTime: 0.5,            /* D grows with along-nose speed   */
  lookAheadBase: 14,             /* D at zero velocity (u)          */
  lookAheadMin:  12,             /* D clamp band (u)                */
  lookAheadMax:  40,

  /* --- lookAt singularity guard (stage-10 fix, defect D4b) ---
     pitch clamps at +-80 but lagged springs + old velocity-lead let the
     cam->aim direction cross near-vertical; world-up lookAt there flips
     the frame 180deg and it stays inverted. Any look direction past this
     elevation is rotated back onto the cone (azimuth + distance kept). */
  lookConeDeg:   87,

  /* --- zoom (stage-10 A2) ---
     'free look/zoom mode': V toggles it; while ON the wheel drives zoom
     instead of weapon slots (+/- always zoom regardless of mode). The rig
     owns two EXTRA springs layered on top of everything else:
       _zoomFovExtra  deg added to the final fov (fov = baseFov + punch +
                      extra, so the boost punch still ADDS on top)
       _zoomDist      multiplier [distMin..distMax] on the chase offset
     Step mapping lives in __K.TUNE.zoom (minFov/maxFov/distMin/distMax/
     ratio/stiff). Both springs use stiff (asymmetric like fov punch). */

  /* --- boost punch --- */
  boostFov:     8,               /* +deg while Shift held (SPEC 6-12)  */
  fovStiffIn:   5.0,             /* punch reaches in well under 1 s    */
  fovStiffOut:  2.4,             /* release eases back over ~2 s       */

  /* --- shake (seeded; shakeStiff spring-filters retargets so it never pops) --- */
  shakeAmp:       0.9,           /* units at amount 1.0                */
  shakeSec:       0.9,           /* full-amplitude envelope seconds    */
  shakeRetargetHz: 18,           /* seeded noise retarget rate         */
  shakeStiff:     45,            /* spring on the shake offset itself  */

  /* --- occlusion (nearest-large-rock fallback) --- */
  occlPad:       2.5,            /* clearance kept off the rock radius        */
  occlFloor:     4,              /* never shove the camera into the ship      */
  occlStiffIn:   7,              /* pull in fast   */
  occlStiffOut:  1.8,            /* recover slowly */

  /* --- horizon stability --- */
  rollInherit:   0.12,           /* fraction of ship.bankDeg the cam takes */
  rollMaxDeg:    2.5,            /* hard cap on inherited roll             */

  /* --- STAGE-12 space-mode roll tracking ---
     In space mode the up vector is NOT world-locked: camera up chases
     (0,1,0) rotated by the ship pose quaternion, i.e. FULL ship roll is
     inherited (the horizon must visibly roll with the ship). This is a
     critically-damped _dampV spring (omega = upStiff): error ~ (1+wt)e^-wt,
     ~1% settled in ~0.9 s, ~5% in ~0.5 s at 7. The world-up singularity
     disappears because up tracks the ship and stays perpendicular to the
     damped look dir (both chase orthogonal ship-frame vectors). Assist
     mode never reads this knob. */
  upStiff:       7,              /* up-vector tracking spring omega (rad/s) */

  /* --- title orbit --- */
  titleRadius:   60,
  titleSpeed:    0.16,           /* rad/s orbit around the cluster */
  titleY:        10,             /* camera height above the pivot  */

    this.zoomStep = 0;          /* integer step count from baseFov        */

    this._zoomFovExtra = 0;     /* damped deg above baseFov (zoom only)   */

    this._ideal = new THREE.Vector3();
    this._posVel = new THREE.Vector3();
    this._lookIdeal = new THREE.Vector3();
    this._look = new THREE.Vector3();
    this._lookVel = new THREE.Vector3();

    this._shakeDes = new THREE.Vector3();
    this._shakeVel = new THREE.Vector3();

    this._shakeRng = mulberry32(0xc0ffee);
    this._shakeClock = 0;
    this._shakeAmp = 0;

    /* title cluster: 9 icosahedron placeholders, built once (the rig lives

    const group = new THREE.Group();
    const geo = new THREE.IcosahedronGeometry(1, 1);
    const mat = new THREE.MeshStandardMaterial({ color: 0x707680, roughness: 0.92, metalness: 0.08, flatShading: true });

      m.scale.setScalar(4 + tr() * 8);        /* surface max 42u < 60 - margin   */

  /* 'title' slow-orbits the cluster; anything else is the gameplay chase.

  setMode(m) {
    m = m === 'title' ? 'title' : 'chase';
    if (this.mode === m) return;
    this.mode = m;
    this.title.group.visible = m === 'title';
    this._needSnap = true;
    this._posVel.set(0, 0, 0);
  }

  /* Stage-4 wiring: occlusion list */
  setOccluders(list) {
    this._occluders = (list && list.length) ? list : null;
  }

  /* ---- Zoom API (stage-10 A2). All additive __K-surface; nothing here
     touches HUD files. zoomMode = free-look toggle (V): while ON the mouse
     wheel drives setZoom instead of cycling weapons. setZoom steps the FOV
     target by +-1 step: fov target moves by stepFov (deg) per step,
     saturating at TUNE.zoom.minFov/maxFov; the trail distance target moves
     in lockstep, saturating at distMin/distMax. Both targets are followed
     by critically-damped springs (TUNE.zoom.stiff) layered AFTER _applyFov

  /* deltaSteps: +N zooms OUT (wider fov, camera trails back), -N zooms IN. */
  setZoom(deltaSteps) {
    const want = clampNum(this.zoomStep + Math.round(deltaSteps || 0), this._zoomStepMin, this._zoomStepMax);
    if (want === this.zoomStep) return;
    this.zoomStep = want;
    this._fovTarget = this.baseFov + want * this._stepFov;
    /* distance: zoomed OUT (want > 0) trails back linearly toward distMax;

       always maps back to 1.0 so a zoom round-trip leaves no residue */
    const Z2 = __K.TUNE.zoom;
    if (want > 0) this._zoomDistT = 1 + (want / Math.max(1, this._zoomStepMax)) * (Z2.distMax - 1);

  /* Public impact hook (explosions/hits in stages 3-4 call this).

  update(dt, ship, input) {

    else this._updateChase(dt, ship, input);
    this.fov = this.camera.fov;

    const dz = this.camera.position.z - ship.position.z;

  _updateChase(dt, ship, input) {
    const T = this.T, cam = this.camera, p = ship.position;
    const boosting = !!(input && input.boost);
    this._applyFov(dt, boosting);
    /* zoom distance spring (velocity in _sv slot 3), same stiffness family */

       Stage-10 A2: the damped zoom multiplier scales the offset BEFORE the

    const zd = this._zoomDist;
    const o = boosting ? T.boostOffset : T.offset;
    /* STAGE-12 pose contract (sibling cluster A): attitude() is the
       authoritative ship pose — assist: the stage-11b euler pose (bit-equal
       to group.quaternion), space: the full quaternion incl. roll. Read it
       defensively so the rig is correct both pre-merge (no attitude -> the
       exact today's-path, group.quaternion) and post-merge. */

    const spaceMode = (__K.TUNE.flightMode === 'space' && hasAttitude);

    if (base < 1e-4) base = 1e-4;

    /* --- cheap occlusion fallback (SPEC-sanctioned): one plain loop over
       the registry, no raycasts; a rock whose sphere crosses the camera ray
       inside the offset cone pulls the ideal distance in --- */
    let want = base;
    const list = this._occluders;
    if (list && list.length) {
      const dxn = this._off.x / base, dyn = this._off.y / base, dzn = this._off.z / base;
      for (let i = 0; i < list.length; i++) {
        const rk = list[i];
        const rp = rk && rk.position;
        if (!rp) continue;
        const rx = rp.x - p.x, ry = rp.y - p.y, rz = rp.z - p.z;
        const along = rx * dxn + ry * dyn + rz * dzn;
        if (along <= 0) continue; /* rock is in front of the ship, not on the cam line */
        const re = (rk.radius || 0) + T.occlPad;
        if (along * along >= (base + re) * (base + re)) continue;
        const lat2 = rx * rx + ry * ry + rz * rz - along * along;
        if (lat2 < re * re) {

    const inOmega = targetScale < this._occlScale ? T.occlStiffIn : T.occlStiffOut;

       target carries an unavoidable velocity-proportional lag, so that

       occlusion/boost lag move the pivot too). If elevation leaves the
       +-lookConeDeg band, rotate the direction back ONTO the cone — same
       azimuth, same length — so lookAt never reaches the up-vector
       singularity and roll stays bounded. (The brief said "rotate about
       the camera's right axis"; at the singularity the camera's right axis
       is itself degenerate, so the clamp is done on world azimuth, which
       is the same rotation everywhere it matters.) */
    let lx = this._look.x, ly = this._look.y, lz = this._look.z;

    /* STAGE-12: the D4b cone clamp is an ASSIST-only world-up guard. In
       space mode up tracks the ship (below), so no singularity exists at
       vertical and the clamp is SKIPPED — the nose may point straight up
       with the frame continuous through it. */
    if (!spaceMode && Math.abs(ly) > sinCone * llen) {
      this._coneClamps++;
      const cosCone = Math.cos(T.lookConeDeg * THREE.MathUtils.DEG2RAD);
      const horizLen = Math.sqrt(lx * lx + lz * lz);
      const newHz = llen * cosCone;
      const sgn = ly > 0 ? 1 : -1;
      if (horizLen > 1e-6) {
        const k = newHz / horizLen;
        lx *= k; lz *= k;
      } else {
        /* dead vertical: azimuth undefined — borrow the nose's horizontal
           projection, falling back to world +Z (no allocation either way) */
        const nx = ship.nose.x, nz = ship.nose.z;
        const nlen = Math.sqrt(nx * nx + nz * nz);
        if (nlen > 1e-6) { lx = (nx / nlen) * newHz; lz = (nz / nlen) * newHz; }
        else { lx = 0; lz = newHz; }
      }
      ly = sgn * sinCone * llen;
      llen = Math.sqrt(lx * lx + ly * ly + lz * lz);
    }
    const dScale = this._lookD / llen;
    this._lookC.set(cam.position.x + lx * dScale, cam.position.y + ly * dScale, cam.position.z + lz * dScale);
    if (spaceMode) {
      /* STAGE-12 space orientation — FULL ship-roll tracking (the rollMaxDeg
         clamp was cosmetic-bank inheritance for an airplane horizon; in
         space the ship's real roll is not cosmetic, the horizon must roll
         with it). Camera up chases (0,1,0) rotated by the ship pose
         quaternion on its own critically-damped _dampV spring (omega
         upStiff), then Gram-Schmidt against the damped look direction so
         up stays exactly perpendicular to look: the lookAt cross product
         can never degenerate, so there is NO world-up singularity and no
         D4b-style 180deg flip when the nose passes straight up. lookAt is
         then a pure basis reconstruction from (dir, up) — the same
         Matrix4-lookAt math three.js performs, driven by cam.up. */
      this._upDes.set(0, 1, 0).applyQuaternion(q);
      if (!this._upSet || snapNow) { this._upSmooth.copy(this._upDes); this._upVel.set(0, 0, 0); this._upSet = true; }
      this._dampV(this._upSmooth, this._upDes, this._upVel, T.upStiff, dt);
      const s = this._upSmooth.dot(this._look) / (llen * llen);
      let ox = this._upSmooth.x - lx * s, oy = this._upSmooth.y - ly * s, oz = this._upSmooth.z - lz * s;
      const olen = Math.sqrt(ox * ox + oy * oy + oz * oz);
      if (olen > 1e-6) { /* normal: perpendicularised, continuous by construction */
        cam.up.set(ox / olen, oy / olen, oz / olen);
      } else {
        /* pathological (up exactly parallel to look — springs starting from
           snap cannot reach it; defensive only): ship-up unprojected minus
           nothing — still well-defined for lookAt's own degenerate fallback */
        cam.up.copy(this._upDes);
      }
      cam.lookAt(this._lookC);
    } else {
      /* assist path: unchanged stage-11b world-up lookAt + clamped cosmetic
         bank. Re-asserting world-up here is an idempotent no-op while the
         rig stays in assist; it restores the airplane frame when the
         player toggles flightMode space->assist mid-session (the T key). */
      cam.up.set(0, 1, 0);
      const roll = clampNum(ship.bankDeg * T.rollInherit, -T.rollMaxDeg, T.rollMaxDeg) * THREE.MathUtils.DEG2RAD;
      cam.lookAt(this._lookC);
      if (roll !== 0) cam.rotateZ(roll);
    }
    this._measureRoll();
  }

  _updateTitle(dt) {
    const T = this.T, cam = this.camera, c = this._center;
    this._applyFov(dt, false);
    this._updateShake(dt);

    const a = this._time * T.titleSpeed;
    this._ideal.set(
      c.x + Math.cos(a) * T.titleRadius,
      c.y + T.titleY + Math.sin(this._time * T.titleBobHz) * T.titleBobY,
      c.z + Math.sin(a) * T.titleRadius
    );
    if (this._needSnap) { cam.position.copy(this._ideal); this._posVel.set(0, 0, 0); this._needSnap = false; }
    this._dampV(cam.position, this._ideal, this._posVel, 2.4, dt);
    cam.position.add(this._shakeOff);

    /* the cluster drifts: bob + slow tumble, deterministic from the seed */
    const rocks = this.title.rocks;
    for (let i = 0; i < rocks.length; i++) {
      const m = rocks[i], u = m.userData;
      m.position.y = u.baseY + Math.sin(this._time * 0.5 + u.phase) * u.bob;
      m.rotation.y += u.spin * dt;
      m.rotation.x += u.spin * 0.6 * dt;
    }

    cam.up.set(0, 1, 0); /* STAGE-12: title frame is world-up in BOTH flight
                            modes — deterministic after a space-mode session */
    cam.lookAt(c);
    this._measureRoll();
  }

  _applyFov(dt, boosting) {
    const cam = this.camera, T = this.T, Z = __K.TUNE.zoom;
    const prev = this._fovPunch, prevZ = this._zoomFovExtra;
    if (!(prev >= 0 || prev <= 0)) this._fovPunch = prev = 0; /* NaN guard */
    this._fovPunch = this._dampS(this._fovPunch, boosting ? T.boostFov : 0, boosting ? T.fovStiffIn : T.fovStiffOut, dt, 0);
    /* zoom layer: a SEPARATE critically-damped extra so the boost punch
       above still ADDS on top (fov = base + punch + zoomExtra); the zoom
       spring carries its velocity in _sv slot 2 */
    const zTgt = clampNum(this._fovTarget, Z.minFov, Z.maxFov) - this.baseFov;
    if (!(this._zoomFovExtra >= 0 || this._zoomFovExtra <= 0)) this._zoomFovExtra = 0;
    this._zoomFovExtra = this._dampS(this._zoomFovExtra, zTgt, Z.stiff, dt, 2);
    if (Math.abs(this._zoomFovExtra - prevZ) > 1e-4 || Math.abs(this._fovPunch - prev) > 1e-4) {
      cam.fov = this.baseFov + this._fovPunch + this._zoomFovExtra;
      cam.updateProjectionMatrix();
    }
  }

  _updateShake(dt) {
    const T = this.T;
    if (__K.settings && !__K.settings.cameraShake) {
      this._shakeClock = this._shakeAmp = 0;
      this._shakeOff.set(0, 0, 0);
      this._shakeVel.set(0, 0, 0);
      return;
    }
    if (this._shakeClock > 0) {
      this._shakeClock = Math.max(0, this._shakeClock - dt);
      if (this._shakeClock <= 0) this._shakeAmp = 0;
      else {
        this._retarget -= dt;
        if (this._retarget <= 0) {
          this._retarget += 1 / T.shakeRetargetHz;
          const r = this._shakeRng, u = this._shakeUnit;
          u.set(r() * 2 - 1, r() * 2 - 1, r() * 2 - 1);
        }
      }
    }
    const env = clampNum(this._shakeClock / T.shakeSec, 0, 1);
    this._shakeDes.copy(this._shakeUnit).multiplyScalar(T.shakeAmp * this._shakeAmp * env * env);
    this._dampV(this._shakeOff, this._shakeDes, this._shakeVel, T.shakeStiff, dt);
  }

  _measureRoll() {
    this._right.set(1, 0, 0).applyQuaternion(this.camera.quaternion);
    this.rollDeg = Math.asin(clampNum(this._right.y, -1, 1)) * THREE.MathUtils.RAD2DEG;
    /* STAGE-12 additive __K debug scalars (scalar only, both modes): look
       pitch in degrees, and the signed angle of the camera up-vector about
       the look axis measured from the world-up reference frame (0 =
       horizon-level, +-90 = up pointing sideways, full ship roll tracked in
       space mode). Degenerate near-vertical look: keep the last values —
       the angle is undefined there and a jump would be noise, not signal
       (in space mode look never sits near vertical once settled anyway). */
    const cam = this.camera;
    /* camera-forward (local -Z by three.js convention) is exact in every
       mode — title never refreshes _lookC, and the look point rides with
       cam.position so shake never steers it */
    this._fwd.set(0, 0, -1).applyQuaternion(cam.quaternion);
    const fl = this._fwd.length();
    if (fl > 1e-6) {
      this._fwd.multiplyScalar(1 / fl);
      __K.camUpPitch = Math.asin(clampNum(this._fwd.y, -1, 1)) * THREE.MathUtils.RAD2DEG;
      /* _fR = normalize(worldUp x fwd); with worldUp=(0,1,0) the cross is
         exactly (fz, 0, -fx) — no allocation, degenerates only at vertical
         look (handled by the keep-last guard) */
      this._fR.set(this._fwd.z, 0, -this._fwd.x);
      const rl = this._fR.length();
      if (rl > 1e-6) {
        this._fR.multiplyScalar(1 / rl);
        this._fU.set(this._fwd.y * this._fR.z - this._fwd.z * this._fR.y,
                     this._fwd.z * this._fR.x - this._fwd.x * this._fR.z,
                     this._fwd.x * this._fR.y - this._fwd.y * this._fR.x);
        const up = cam.up;
        __K.camUpRollDeg = Math.atan2(up.dot(this._fR), up.dot(this._fU)) * THREE.MathUtils.RAD2DEG;
      }
    }
  }

  /* critically-damped scalar spring; velocity lives in this._sv[slot] */
  _dampS(cur, target, omega, dt, slot) {
    const x = omega * dt;
    const e = 1 / (1 + x + 0.48 * x * x + 0.235 * x * x * x);
    const ch = cur - target;
    const v = this._sv[slot];
    const tmp = (v + omega * ch) * dt;
    this._sv[slot] = (v - omega * tmp) * e;
    return target + (ch + tmp) * e;
  }

  /* same spring on a Vector3 `cur` toward `target`, velocity in `vel` */
  _dampV(cur, target, vel, omega, dt) {
    const x = omega * dt;
    const e = 1 / (1 + x + 0.48 * x * x + 0.235 * x * x * x);
    for (let i = 0; i < 3; i++) {
      const ch = cur.getComponent(i) - target.getComponent(i);
      const v = vel.getComponent(i);
      const tmp = (v + omega * ch) * dt;
      vel.setComponent(i, (v - omega * tmp) * e);
      cur.setComponent(i, target.getComponent(i) + (ch + tmp) * e);
    }
  }
}

/* ==== 30-world.js ==== */
/* ===== SECTION: World — sector atmosphere: fog, starfield, sun, gas giant ===== */
/* buildWorld(THREE, scene) mutates the scene and returns { sun, stars, planet }.
   Called only after boot() assigned THREE — never construct here at load time.
   Ambient per SPEC "World and space": dark blue-black FogExp2 so distant rocks
   silhouette, ~2500 star points on a shell (no twinkle — SPEC says stars should
   not twinkle "or not at all"; static is the safe read), one strong warm
   directional "sun", hemispheric cool-sky/warm-ground fill, and a huge faint
   unlit icosahedron gas giant on the horizon. */
function buildWorld(THREE_NS, scene) {
  /* dark blue-black exponential fog */
  scene.fog = new THREE_NS.FogExp2(0x05070d, 0.0016);
  scene.background = new THREE_NS.Color(0x04060b);

  /* starfield: ~2500 points on a 1500-2500 radius shell, tiny, static.
     fog:false because FogExp2 at that depth would erase every star; stars are
     backdrop, not sector contents. Color built from the seeded rng. */
  const N = 2500;
  const pos = new Float32Array(N * 3);
  const col = new Float32Array(N * 3);
  const c = new THREE_NS.Color();
  for (let i = 0; i < N; i++) {
    const u = rng() * 2 - 1;
    const th = rng() * Math.PI * 2;
    const r = Math.sqrt(1 - u * u);
    const rad = 1500 + rng() * 1000;
    pos[i * 3] = r * Math.cos(th) * rad;
    pos[i * 3 + 1] = u * rad;
    pos[i * 3 + 2] = r * Math.sin(th) * rad;
    const warm = rng();
    if (warm < 0.12) c.setHSL(0.07, 0.45, 0.55 + rng() * 0.25);       /* few warm */
    else if (warm < 0.3) c.setHSL(0.58, 0.35, 0.6 + rng() * 0.25);    /* some blue */
    else c.setHSL(0.62, 0.05, 0.5 + rng() * 0.45);                    /* mostly pale */
    col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
  }
  const starGeo = new THREE_NS.BufferGeometry();
  starGeo.setAttribute('position', new THREE_NS.BufferAttribute(pos, 3));
  starGeo.setAttribute('color', new THREE_NS.BufferAttribute(col, 3));
  const starMat = new THREE_NS.PointsMaterial({ size: 2.2, sizeAttenuation: false, vertexColors: true, fog: false });
  const stars = new THREE_NS.Points(starGeo, starMat);
  stars.frustumCulled = false; /* shell surrounds the play volume always */
  scene.add(stars);

  /* one strong warm directional sun, high; no shadows (perf + look) */
  const sun = new THREE_NS.DirectionalLight(0xffe3bd, 3.4);
  sun.position.set(350, 700, -450);
  scene.add(sun);

  /* hemispheric fill: cool shadows, warm bounce */
  const hemi = new THREE_NS.HemisphereLight(0x35476e, 0x2b1d10, 0.5);
  scene.add(hemi);

  /* faint unlit gas giant on the horizon (cheap: low-poly, no texture, no
     lights). fog:false so it survives the FogExp2 as a dim silhouette. */
  const planetGeo = new THREE_NS.IcosahedronGeometry(300, 2);
  const planetMat = new THREE_NS.MeshBasicMaterial({ color: 0x33283a, fog: false });
  const planet = new THREE_NS.Mesh(planetGeo, planetMat);
  planet.position.set(-1200, 200, -1800);
  scene.add(planet);

  return { sun: sun, stars: stars, planet: planet };
}

/* ==== 40-projectile.js ==== */
/* ===== SECTION: Projectile — pooled bolts, swept-sphere hits, guided seekers ===== */
/* SPEC "Weapons" (stage 3 pulse base; stage 6 adds flak pellets + seekers on
   the SAME pool and the SAME swept-hit path):
     - pulse: twin rapid bolts, hitscan-feel, modest damage, infinite ammo
     - flak: WeaponController obtains ~7 bolts per volley from THIS pool and
       hands them back as ordinary ship-owned pellets (shots jump ~7/flak)
     - seeker: a guided bolt — per-frame steering lives in WeaponController
       (guideBolt: prev/pos/ttl/fuse are THIS file's contract with it)
     - hostile bolts (stage 6 hunter drones): owner != ship && owner != null
       -> swept vs the ship and ROUTED INTO game.damageShip (the single
       damage funnel; shield-first, i-frames, death — all Defense's).

   POOLING: one shared stretched geometry + one additive MeshBasicMaterial
   (toneMapped:false, bloom bait), pooled Mesh stubs built lazily up to the
   cap by Pool — fire()/update() construct ZERO THREE objects and allocate no
   arrays (iteration is backward over Pool's swap-remove `live` index, which
   is release-safe). A recycled slot may carry a seeker/missile look, so
   _fireOne restores the pulse geometry+material explicitly per shot.

   TUNNELING: every bolt keeps its previous-frame position and is tested with
   K.Hit.sweptSphere (segment vs expanded sphere rA+rB) against the merged
   game.targets registry — [{position, radius, kind, hp}] — so hits register
   regardless of speed. Only SHIP-owned bolts test the registry; hostile bolts
   test the ship only (they can't clear rocks). Per-bolt fields kind/dmg/hitR
   let flak (0.5 dmg) and pulse (TUNE.damage) share one loop; the player's
   damage buff multiplier (game.dmgMul) lands here at impact time. */
class ProjectileSystem {
  constructor(game) {
    const T = __K.TUNE.weapons;
    this.T = T;
    this.game = game;

    /* one shared geometry + material, allocated exactly once here (the only
       legal allocation sites besides the Pool factories below) */
    this.geo = new THREE.CylinderGeometry(0.14, 0.14, 2.6, 6);
    this.geo.rotateX(Math.PI / 2);        /* cylinder axis Y -> Z (bolt streak) */
    this.mat = new THREE.MeshBasicMaterial({
      color: 0x8fd8ff, transparent: true, blending: THREE.AdditiveBlending,
      depthWrite: false, fog: false, toneMapped: false /* stage-7 bloom bait */
    });
    this.flashGeo = new THREE.IcosahedronGeometry(0.55, 0);
    this.flashMat = new THREE.MeshBasicMaterial({
      color: 0xcfeaff, transparent: true, blending: THREE.AdditiveBlending,
      depthWrite: false, fog: false, toneMapped: false, opacity: 0.9
    });

    /* --- pooled items: mesh + kinematics; reset() per Pool contract -------- */
    const self = this;
    this.bolts = new Pool(function () { return self._makeBolt(); }, T.maxBolts);
    this.flashes = new Pool(function () { return self._makeFlash(); }, T.flashPool);

    /* twin barrels: +-muzzleX local X, just aft of the 14u nose tip (TUNE) */
    this._barrel = [
      new THREE.Vector3(-T.muzzleX, 0, T.muzzleZ),
      new THREE.Vector3(+T.muzzleX, 0, T.muzzleZ)
    ];
    this._barrelW = [new THREE.Vector3(), new THREE.Vector3()];
    this._barrelSide = 0;      /* alternates 0/1 per shot */
    this._cool = 0;            /* seconds until next shot allowed */

    /* scratch, allocated once — nothing below is constructed per frame */
    this._nose = new THREE.Vector3();
    this._dir = new THREE.Vector3();
    this._hitPt = new THREE.Vector3();

    /* counters surfaced through __K.stats every frame (90-game.js) */
    this.shots = 0;
    this.hits = 0;
  }

  _makeBolt() {
    const mesh = new THREE.Mesh(this.geo, this.mat);
    mesh.matrixAutoUpdate = false;   /* cheap: matrix dirtied only when it moves */
    mesh.visible = false;
    mesh.frustumCulled = false;
    this.game.scene.add(mesh);
    return {
      alive: false,
      mesh: mesh,
      pos: new THREE.Vector3(),
      prev: new THREE.Vector3(),
      vel: new THREE.Vector3(),
      ttl: 0,
      owner: null,
      /* stage-6 per-bolt weapons fields (pulse defaults set in _fireOne) */
      kind: 'pulse',
      dmg: 0,
      hitR: 0,
